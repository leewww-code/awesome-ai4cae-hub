      what_remains_open: Reproducibility signals are weak, limitation statements are
        missing, and integration with industrial solver pipelines remains unverified.
    consensus:
    - Learned surrogates can substantially accelerate aerodynamic prediction and optimization
      relative to conventional CFD, with speedups reported across multiple settings.
    - Benchmark datasets and distribution-shift evaluations reveal that strong in-distribution
      surrogate accuracy does not imply robustness under operating-condition, tessellation,
      or cross-vehicle changes.
    - Solver coupling or physics feedback is treated as a way to improve reliability,
      whether through uncertainty-triggered feedback, Newton-Krylov correction, or
      CFD validation.
    - Agentic and automated workflows can produce physics-relevant recommendations,
      but visible evidence does not yet establish independent reproducibility or broad
      industrial deployment.
    disagreements:
    - 'Representation choices differ: point-cloud flow-state attention, spectral geometry
      encoding, mixture-of-experts neural operators, and solver-coupled Newton correction
      use different geometric and flow encodings.'
    - 'Evaluation targets differ: two-dimensional NACA airfoils, industrial three-dimensional
      aircraft, pickup trucks, transonic wing optimization, and periodic-hill turbulence
      each stress different phenomena such as shocks, separation, or bluff-body wake
      flow.'
    - 'Interaction mode differs: some systems are offline predictors, others use uncertainty-triggered
      solver feedback, solver-coupled correction, or autonomous LLM-based reasoning
      loops.'
    - 'Deployment assumptions differ: some studies rely on in-house vehicle datasets
      while others provide public benchmarks, making claims of external validity and
      robustness difficult to compare.'
    open_questions:
