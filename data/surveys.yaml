  - 开放问题：超越NACA/汽车工况的泛化、三维工业规模验证、控制与减振方法的物理验证，以及工件和局限性的可验证性。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogate learning
      what_it_solves: Predicts continuous pressure and velocity fields around airfoils
        from spectral geometry encodings, reducing expensive CFD evaluations.
      what_remains_open: Evidence is limited to steady, incompressible, 2D subsonic
        NACA-like downforce airfoils; generalization to non-NACA, unsteady, compressible
        and 3D realistic geometries remains unverified.
    - line: Operator learning architecture benchmarking for aerodynamic surface pressure
      what_it_solves: Compares state-of-the-art operator learning models on 2D and
        industrial 3D surface pressure prediction, shock capture, scalability, and
        data scarcity.
      what_remains_open: No explicit limitations are stated in the abstract; reproduction
        signals and testing beyond the reported aircraft configuration remain verification
        gaps.
    - line: Multi-fidelity dimension-bridging regression for RANS aerodynamic coefficients
      what_it_solves: Learns a correction from lower-dimensional RANS data to predict
        higher-dimensional RANS aerodynamic coefficients with uncertainty-driven adaptive
        sampling and accelerated kernel evaluation.
      what_remains_open: Performance depends on choosing a suitable low-dimensional
        model; approximate neural kernel agreement and behavior on other geometries
        or flow regimes are not evidenced.
    - line: Data-free physics-informed Navier-Stokes solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems across low and
        high Reynolds numbers without external flow data.
      what_remains_open: The evidence packet lacks methodology, results, and limitation
        analysis; applicability to complex engineering configs, unsteady flows, and
        real geometries remains unverified.
    - line: Procedural design-space exploration for engineering layouts
      what_it_solves: Generates and evaluates conceptual 3D ship internal arrangements
        across vessel families for design-space exploration.
      what_remains_open: The available abstract gives no metrics, validation, or limitation
        details; connection to downstream physical performance is not established.
    - line: Vibration mitigation for wind turbine airfoils
      what_it_solves: Uses CFD fluid-structure interaction to evaluate a locally resonant
        metamaterial resonator for reducing vortex-induced vibrations.
      what_remains_open: Realistic mass ratios yield only small amplitude reductions;
        evidence is limited to this configuration and the effect in physical turbines
        is not validated.
    - line: Offline reinforcement learning for fluid control
      what_it_solves: Extracts control policies from offline data for fluid systems,
        potentially avoiding costly online simulation.
      what_remains_open: The evidence packet provides no abstract, results, or limitation
        details, so the problem scope, evaluation targets, and robustness are unverified.
    - line: General-purpose operator learning foundations
      what_it_solves: Provides a general transformer architecture for learning mappings
        between function spaces, relevant as a foundation for aerodynamic operator
        learning.
      what_remains_open: The evidence packet lacks analysis or domain-specific evaluations,
        so its engineering application benefits are unverified.
    consensus:
    - Learned surrogates are positioned to reduce computational expense of high-fidelity
      CFD/RANS for engineering geometry and flow analysis.
    - 'The works share a generalization-oriented evaluation interest: unseen geometries,
      attack angles, mesh scales, and sampling efficiency are used to test surrogate
      quality.'
    - Several works compare architectures or kernels rather than assuming a single
      model, showing concern for selecting appropriate inductive biases.
    - Many top papers show strong abstract-level evidence, but reproducibility signals
      such as code, datasets, baselines, and limitations are incomplete or not stated.
    disagreements:
    - 'Prediction target varies: velocity/pressure fields, scalar aerodynamic coefficients,
      design layouts, vibration response, or control actions.'
    - 'Supervision differs: large RANS datasets, data-free physics residuals, multi-fidelity
      2D-to-3D correction, offline policy data, or CFD-defined physical interactions.'
    - Representation differs across neural fields, graph/transformer operators, Gaussian
      functional regression kernels, voxel-graph generative frameworks, and physics-informed
      networks.
    - Evaluation settings differ in dimensionality, flow regime, and scale, from 2D
      NACA airfoils to a 3D aircraft, ship layouts, and wind turbine fluid-structure
      interaction.
    - 'Deployment aims differ: surrogate speed and accuracy, architecture benchmarking,
      design-space exploration, or active/passive control intervention.'
    open_questions:
    - Can field and coefficient surrogates transfer to non-NACA, compressible, unsteady,
      high-Reynolds, or full-vehicle configurations beyond the reported test cases?
    - What evaluation criteria connect surrogate accuracy to engineering load, downforce,
      or safety margins under industrial mesh sizes and data scarcity?
    - Do data-free physics-informed solvers remain competitive on engineering quantities
      when data-driven surrogates are trained on targeted RANS data?
    - What physical or wind-tunnel evidence is needed to validate metamaterial vibration
      mitigation and offline RL fluid control policies outside the tested simulation
      settings?
    - Which missing artifacts, datasets, baselines, and limitation statements most
      limit independent replication across this application topic?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件化的气动场代理学习
      解决的问题: 从谱几何编码预测翼型周围的连续压力和速度场，以替代昂贵的CFD评估。
      尚未覆盖: 证据限于稳态、不可压缩、二维亚音速的类NACA下压力翼型；向非NACA、非稳态、可压缩和三维真实几何的泛化未被验证。
    - 路线: 面向气动表面压力的算子学习架构基准评测
      解决的问题: 在二维和工业级三维表面压力预测、激波捕捉、可扩展性和数据稀缺下比较先进算子学习模型。
      尚未覆盖: 摘要未明确给出局限性；复现信号及在报告飞机配置之外的测试仍是验证缺口。
    - 路线: 面向RANS气动系数的多保真维度桥接回归
      解决的问题: 学习从低维RANS到高维RANS气动系数的修正，结合不确定性自适应采样和加速核估计。
      尚未覆盖: 性能依赖合适的低维模型选择；神经核近似一致性和其他几何或流态下的表现缺少证据。
    - 路线: 无数据物理信息 Navier-Stokes 求解
      解决的问题: 在无外部流场数据的情况下，求解低雷诺数与高雷诺数的稳态 Navier-Stokes 基准问题。
      尚未覆盖: 证据包缺少方法、结果和局限性分析；在复杂工程配置、非稳态和真实几何上的适用性尚未验证。
    - 路线: 工程布局的程序化设计空间探索
      解决的问题: 跨船舶族生成和评估概念性三维舱室布置，以支持设计空间探索。
      尚未覆盖: 摘要未给出指标、验证或局限性；与下游物理性能的关系未建立。
    - 路线: 风力机翼型涡激振动抑制
      解决的问题: 通过CFD流固耦合评估局部共振超材料共振器对翼型涡激振动的抑制。
      尚未覆盖: 现实质量比下减幅很小；仅此配置的证据，物理风力机环境中的效果未被验证。
    - 路线: 流体控制的离线强化学习
      解决的问题: 从离线流体数据提取控制策略，或许可避免高成本在线模拟。
      尚未覆盖: 证据包缺少摘要、结果和局限性，问题范围、评测目标和鲁棒性均未验证。
    - 路线: 通用算子学习基础
      解决的问题: 提供学习函数空间之间映射的通用Transformer架构，可作为气动算子学习的基础。
      尚未覆盖: 证据包缺少分析和领域内评测，其工程应用收益未被验证。
    共识:
    - 学习型代理模型被用于降低高保真CFD/RANS在工程几何与流场分析中的计算成本。
    - 研究普遍关注泛化性评测：使用未见几何、攻角、网格规模或采样效率来检验代理质量。
    - 若干工作比较不同架构或核函数而非假设单一模型，体现对归纳偏置选择的重视。
    - 许多高排名论文在摘要层面证据较强，但代码、数据集、基线和局限性等复现信号不完整或未说明。
    分歧:
    - 预测目标不同：包括速度/压力场、标量气动系数、设计布局、振动响应或控制动作。
    - 监督信号不同：包括大规模RANS数据、无数据物理残差、多保真2D到3D修正、离线策略数据或CFD定义的物理交互。
    - 表示方式不同：包括神经场、图/Transformer算子、高斯泛函回归核、体素-图生成框架和物理信息网络。
    - 评测设置不同：从二维NACA翼型到三维飞机、船舶布置和风力机流固耦合，维度、流态和尺度各异。
    - 部署目标不同：包括代理加速与精度、架构基准评测、设计空间探索或主动/被动控制干预。
    开放问题:
    - 场和系数代理能否迁移到非NACA、可压缩、非稳态、高雷诺数或整车配置，而不仅限于已报告测试用例？
    - 哪些评测准则能在工业网格规模和数据稀缺下把代理误差与工程载荷、下压力或安全裕度联系起来？
    - 在目标RANS数据训练的数据驱动代理面前，无数据物理信息求解器在工程量上是否仍具竞争力？
    - 需要哪些物理或风洞证据来验证超材料减振和离线RL流体控制策略在仿真设定之外的效果？
    - 哪些缺失的工件、数据集、基线和局限性说明最限制本应用主题的独立复现？
