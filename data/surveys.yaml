  - 主流方向：工程气动代理建模最突出，包括几何条件场预测、算子架构基准和多保真气动系数代理，目标是加速翼型与飞机CFD/RANS。
  - 研究共性：多数论文用学习到的代理、修正或加速模型替代传统CFD、经验公式或基线模型；以精度和加速为评测目标，并引入不确定性、自适应采样或基准比较。
  - 关键差异：监督方式不同，包括CFD数据集、无数据物理约束、对低维或基线模型的残差修正；输出目标不同，涵盖压力/速度场、气动系数、非定常载荷和振动幅值；评测范围从二维NACA翼型到三维飞机、NLR
    7301运动、FSI和穿孔板。
  - 趋势演进：证据仅覆盖2026年窄窗口，不能推断长期趋势；当前窗口内表现为向工业级几何、多保真桥接、不确定性量化和下游FSI/控制问题延伸。
  - 开放问题：稳态二维类NACA翼型之外的迁移、2D到3D修正可靠性、高雷诺数无数据求解、实际振动抑制、工件可复现性，以及叶轮/整车等场景证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned neural field surrogates
      what_it_solves: Predicts pressure and velocity fields around aerodynamic shapes
        from geometry, reducing CFD runtime for airfoil and aircraft scenarios.
      what_remains_open: Generalization beyond steady, incompressible, two-dimensional
        NACA-like airfoils and automotive/motorsport regimes; industrial 3D and off-design
        coverage remains uncertain.
    - line: Operator learning architecture benchmarking
      what_it_solves: Identifies promising deep operator architectures for aerodynamic
        surface-pressure prediction under shocks, many grid points, and data scarcity.
      what_remains_open: Real-world deployment validity, clearer limitation reporting,
        and broader artifact availability are not established in the packet.
    - line: Multi-fidelity and dimension-bridging coefficient surrogates
      what_it_solves: Uses low-dimensional corrections and uncertainty quantification
        to predict aerodynamic coefficients with fewer high-fidelity evaluations and
        fast kernel evaluation.
      what_remains_open: Performance depends on choosing a suitable low-dimensional
        model; the neural-network-accelerated kernel is approximate and artifact availability
        is limited.
    - line: Physics-informed and data-free PDE solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems using physics
        constraints without external flow data.
      what_remains_open: High-Reynolds-number and realistic engineering geometry boundaries
        remain unresolved, and method/limitation evidence in the packet is sparse.
    - line: Unsteady aerodynamic load residual modeling
      what_it_solves: Learns residual corrections to baseline aerodynamic load models
        for pitch/plunge motions on NLR 7301 CFD benchmark.
      what_remains_open: Generalization beyond NLR 7301 and the chosen baseline is
        not shown; method details and reproducibility signals are limited.
    - line: Fluid-structure interaction and vibration mitigation
      what_it_solves: Evaluates resonator-based vortex-induced vibration mitigation
        for a wind turbine airfoil using CFD-based fluid-structure interaction.
      what_remains_open: Realistic mass ratios produce only small amplitude reductions;
        generalization across airfoils and vibration regimes is unresolved.
    - line: Component loss and fluid control surrogates
      what_it_solves: Predicts pressure losses across perforated plates and extracts
        offline fluid control policies from observational data.
      what_remains_open: Evidence is thin for offline reinforcement learning; broader
        component classes and controlled deployment settings are not covered.
    consensus:
    - Most work targets aerodynamic or fluid-system engineering by learning fast surrogates
      or corrections to conventional CFD, RANS, or empirical models.
    - Accuracy and speedup relative to conventional methods are the shared evaluation
      objectives.
    - Geometry conditioning, low-fidelity/dimension bridging, uncertainty, and architecture
      benchmarking are recurring strategies to address data cost and scalability.
    - The evidence emphasizes engineering-specific configurations rather than only
      abstract fluid benchmarks.
    disagreements:
    - 'Supervision differs: large CFD datasets, data-free physics constraints, and
      residual corrections to low-dimensional or baseline models are used.'
    - 'Output targets differ: full pressure/velocity fields, aerodynamic coefficients,
      unsteady loads, vibration amplitude, and component pressure losses.'
    - 'Evaluation scopes differ: steady 2D NACA airfoils, industrial 3D aircraft,
      NLR 7301 pitch/plunge, wind turbine airfoil FSI, and perforated plates.'
    - 'Artifact availability differs: only some papers provide public datasets or
      clear reproducibility signals; the rest remain verification gaps.'
    - Some methods prioritize fast scalar evaluation for design loops, while others
      prioritize field accuracy or physical effect mitigation.
    open_questions:
    - Do geometry-conditioned field surrogates trained on steady 2D NACA airfoils
      transfer to unsteady, compressible, or 3D impeller and full-vehicle flows?
    - How much configuration-specific low-dimensional or low-fidelity modeling is
      needed for 2D-to-3D aerodynamic corrections to remain reliable?
    - Can physics-informed and data-free Navier-Stokes solvers move beyond steady
      benchmarks to high-Reynolds-number engineering geometries?
    - Can vortex-induced vibration mitigation achieve meaningful amplitude reduction
      at realistic mass ratios, and how should it connect to learned aerodynamic load
      surrogates?
    - How reproducible are these methods in operational or industrial settings given
      limited code, dataset, and artifact evidence in the packet?
    - Where are impeller, full-vehicle, and other non-airfoil engineering scenarios
      in the current evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件神经场代理
      解决的问题: 从翼型或飞机几何形状预测压力与速度场，减少翼型/飞机气动场景中的CFD耗时。
      尚未覆盖: 超出稳态、不可压缩、二维类NACA翼型及汽车/赛车运动工况后的泛化；工业三维和偏离设计工况覆盖尚不确定。
    - 路线: 算子学习架构基准
      解决的问题: 在激波、大量网格点和数据稀缺条件下，识别适合气动表面压力预测的深度算子架构。
      尚未覆盖: 真实部署有效性、更明确局限报告和更完整工件可用性均未在证据中确立。
    - 路线: 多保真与维度桥接系数代理
      解决的问题: 利用低维修正与不确定性量化，以更少高保真评估预测气动系数，并实现快速核评估。
      尚未覆盖: 性能依赖合适的低维模型选择；神经网络加速核为近似一致；工件可用性有限。
    - 路线: 物理信息与无数据PDE求解
      解决的问题: 在不使用外部流场数据的情况下，以物理约束求解稳态Navier-Stokes基准问题。
      尚未覆盖: 高雷诺数和真实工程几何边界仍未解决；证据中方法与局限信息较稀疏。
    - 路线: 非定常气动载荷残差建模
      解决的问题: 在NLR 7301 CFD基准上，学习对基线气动载荷模型的残差修正，处理俯仰/沉浮运动。
      尚未覆盖: 超出NLR 7301及所选基线后的泛化未展示；方法细节与复现信号有限。
    - 路线: 流固耦合与振动抑制
      解决的问题: 用CFD流固耦合评估谐振器对风力机翼型涡激振动的抑制效果。
      尚未覆盖: 实际质量比下振幅减小幅度较小；跨翼型和振动工况推广未解决。
    - 路线: 部件损失与流体控制代理
      解决的问题: 预测穿孔板压力损失，并从观测数据中提取离线流体控制策略。
      尚未覆盖: 离线强化学习证据较薄；更广泛部件类型和受控部署设置未被覆盖。
    共识:
    - 多数工作面向气动或流体系统工程，学习对CFD、RANS或经验模型的快速代理或修正。
    - 精度和相对传统方法的加速是共同评测目标。
    - 几何条件、低维/维度桥接、不确定性和架构基准被反复用于缓解数据成本与扩展性问题。
    - 证据强调面向工程特定配置，而非仅解决抽象流体基准。
    分歧:
    - 监督信号不同：大型CFD数据集、无数据物理约束、对低维或基线模型的残差修正并存。
    - 输出目标不同：压力/速度场、气动系数、非定常载荷、振动幅值和部件压力损失。
    - 评测范围不同：稳态二维NACA翼型、工业三维飞机、NLR 7301俯仰/沉浮、风力机翼型FSI和穿孔板。
    - 工件可用性不同：仅部分工作提供公开数据集或清晰复现信号，其余仍是验证缺口。
    - 部分方法侧重设计循环中的快速标量评估，另一些侧重场精度或物理效应抑制。
    开放问题:
    - 在稳态二维NACA翼型上训练的几何条件场代理，能否迁移到非定常、可压缩或三维叶轮/整车流动？
    - 二维到三维气动修正需要多少配置特定的低维或低保真建模才能保持可靠？
    - 物理信息与无数据Navier-Stokes求解能否从稳态基准扩展到高雷诺数工程几何？
    - 实际质量比下涡激振动抑制能否达到显著减幅，并如何与学习到的气动载荷代理结合？
    - 在代码、数据集和工件证据有限时，这些方法在运营或工业环境中的可复现性如何？
    - 叶轮、整车等非翼型工程场景在当前证据中位于何处？
