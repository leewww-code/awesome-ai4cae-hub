  related_work_outline_zh:
  - 主流方向：面向气动/流体工程场景的神经代理与基准，尤其是翼型、飞机和风电机组等具体对象。
  - 研究共性：从CFD/RANS或PDE残差学习映射或修正，并以加速、精度、泛化和成本降低作为验证目标。
  - 关键差异：表示、监督信号与评测目标各异，包括谱几何神经场、图/Transformer算子、高斯过程、PINN、体素图和流固耦合/RL控制。
  - 趋势演进：可见范围内从2023年通用算子Transformer走向2026年更专用的数据集、3D基准、多保真修正、设计生成与控制。
  - 开放问题：非定常/可压缩/湍流3D迁移、数据稀缺、不确定度校准、下游部署验证，以及代码/数据集与局限性证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates
      what_it_solves: Learns fast neural approximations of pressure/velocity or surface-pressure
        fields from airfoil/aircraft geometry and flow conditions, reducing CFD cost
        and benchmarking generalization, shock capture, and scalability.
      what_remains_open: Evidence centers on 2D steady subsonic NACA 4-digit airfoils
        and 3D aircraft surface pressure; transfer to non-NACA, unsteady, compressible,
        turbulent, or industrial field conditions is not fully shown.
    - line: Multi-fidelity and dimension-bridging scalar surrogates
      what_it_solves: Corrects 2D RANS predictions toward 3D RANS aerodynamic coefficients
        using Gaussian Functional Regression and a neural-accelerated kernel, providing
        uncertainty for adaptive sampling and real-time evaluation.
      what_remains_open: Performance depends on selecting an appropriate low-dimensional
        model; broader geometry families, transient/separated flows, and high-dimensional
        response surfaces remain unverified.
    - line: Physics-informed data-free flow solvers
      what_it_solves: Solves steady Navier-Stokes benchmark problems across low-to-high
        Reynolds numbers without external flow data, reducing dependence on CFD datasets.
      what_remains_open: Visible evidence is benchmark-level; robustness for engineering
        geometries, high-Reynolds turbulent 3D flow, and comparison against supervised
        surrogates is not established.
    - line: Engineering design-space exploration and procedural layout generation
      what_it_solves: Generates and evaluates conceptual 3D ship internal arrangements
        across vessel families using a voxel-graph framework, supporting early design-space
        exploration.
      what_remains_open: Abstract-level methods, metrics, constraints, and limitations
        are not visible; transfer from conceptual layout to detailed engineering design
        and validation across more ship types is unknown.
    - line: Fluid control and fluid-structure interaction for operating systems
      what_it_solves: Addresses fluid control policy extraction from offline multi-observational
        data and passive vibration mitigation for wind-turbine airfoil vortex-induced
        vibrations.
      what_remains_open: Offline RL evidence lacks method/result detail; resonator
        results show only small amplitude reductions under realistic mass ratios,
        with no deployment-level evidence.
    - line: General neural operator transformer backbones
      what_it_solves: Provides a general operator-learning architecture for mapping
        between function spaces, potentially reusable across engineering surrogate
        tasks.
      what_remains_open: The packet does not connect this backbone to the aerodynamic/design
        benchmarks; application-specific adaptation, geometry conditioning, and engineering
        scalability remain open.
    consensus:
    - Multiple papers converge on replacing or accelerating CFD/RANS loops with learned
      surrogates for aerodynamic or fluid engineering tasks.
    - Geometry or layout conditioning is a shared mechanism for adapting learned models
      to concrete design objects.
    - Benchmarking, public datasets, uncertainty quantification, and speed-accuracy
      trade-offs are treated as central evaluation concerns.
    - Reported limitations are mostly confined to simplified flow regimes and narrow
      geometry families, leaving industrial deployment unresolved.
    disagreements:
    - 'Representation choices differ: spectral geometry encoders and neural fields,
      graph/transformer operators, Gaussian processes, physics-informed networks,
      and voxel-graph generation.'
    - 'Supervision differs: supervised RANS/CFD data, data-free PDE residuals, low-to-high-fidelity
      corrections, and offline observations for control.'
    - 'Evaluation targets differ: full velocity/pressure fields, scalar aerodynamic
      coefficients, layout quality, vibration amplitude, or control policy behavior.'
    - 'Scale and deployment setting differ: 2D airfoil benchmarks, 3D industrial aircraft
      surface pressure, conceptual ship layouts, and wind-turbine FSI.'
    open_questions:
    - How well do current geometry-conditioned surrogates generalize beyond NACA 4-digit,
      steady subsonic 2D/3D cases to unsteady, compressible, or turbulent engineering
      flows?
    - What low-dimensional model selection criteria make multi-fidelity corrections
      robust outside the reported aerodynamic-coefficient setting?
    - Do data-free physics-informed solvers remain accurate and cost-effective on
      engineering geometries at high Reynolds numbers?
    - Are procedural design-generation and offline RL fluid policies validated against
      downstream engineering objectives or physical experiments?
    - Where are code, datasets, and explicit limitation statements missing, and how
      much does that affect reproducibility and cross-paper comparison?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件气动场代理
      解决的问题: 学习翼型/飞机表面压力或速度场的快速神经近似，降低CFD成本，并评测几何泛化、激波捕捉和可扩展性
      尚未覆盖: 证据集中在稳态二维亚音速NACA 4-digit翼型和三维飞机表面压力；非NACA、非定常、可压缩、湍流和工业现场应用尚未充分验证
    - 路线: 多保真与维度桥接标量代理
      解决的问题: 用高斯函数回归和神经网络加速核把2D RANS修正到3D RANS气动系数，提供不确定性并支持自适应采样和实时评估
      尚未覆盖: 依赖合适的低维模型选择；更广几何族、非定常/分离流和高维响应面尚未验证
    - 路线: 物理信息无数据流动求解
      解决的问题: 无需外部流场数据，在低到高雷诺数稳态Navier-Stokes基准问题上求解
      尚未覆盖: 仅见基准级证据；工程几何、高雷诺湍流3D流动及与监督代理的可比性未建立
    - 路线: 工程设计空间探索与程序化布局生成
      解决的问题: 用体素-图框架生成并评估概念性三维船舶内部布置，支持早期设计空间探索
      尚未覆盖: 摘要级方法、度量、约束和局限性不可见；从概念布局到详细工程设计和更多船型验证未知
    - 路线: 流体控制与运行系统流固耦合
      解决的问题: 处理来自离线多观测数据的流体控制策略提取，以及风力机翼型涡激振动的被动抑制
      尚未覆盖: 离线RL方法/结果细节缺失；共振器在实际质量比下振幅减小有限，尚无部署级证据
    - 路线: 通用神经算子Transformer骨干
      解决的问题: 提供跨函数空间映射的通用算子学习架构，可能复用于工程代理任务
      尚未覆盖: 证据包未连接该骨干与气动/设计基准；应用特定适配、几何条件化和工程扩展性仍开放
    共识:
    - 多篇论文都趋向于用学习式代理替代或加速CFD/RANS计算环，面向气动或流体工程任务。
    - 几何或布局条件化是让学习模型适配具体设计对象的共同机制。
    - 基准评测、公开数据集、不确定性量化和速度-精度权衡被作为核心评估关注点。
    - 报告的限制多集中在简化流态和狭窄几何族，工业部署仍未解决。
    分歧:
    - 表示选择不同：谱几何编码器与神经场、图/Transformer算子、高斯过程、物理信息网络和体素-图生成。
    - 监督信号不同：监督RANS/CFD数据、无数据PDE残差、低到高保真修正以及用于控制的离线观测。
    - 评测目标不同：完整速度/压力场、气动系数标量、布局质量、振动幅度或控制策略行为。
    - 规模与部署场景不同：二维翼型基准、三维工业飞机表面压力、概念船舶布局和风力机流固耦合。
    开放问题:
    - 当前几何条件化代理在非NACA、非定常、可压缩或湍流工程流动中的泛化能力如何？
    - 多保真修正依赖的低维模型选择标准能否在气动系数场景之外保持稳健？
    - 无数据物理信息求解器在工程几何和高雷诺数下是否仍准确且具有成本优势？
    - 程序化设计生成和离线RL流体策略是否经过下游工程目标或物理实验验证？
    - 代码、数据集和显式局限性声明在哪些工作中缺失，这对可复现性和跨论文比较影响多大？
