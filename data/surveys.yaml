  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogate modeling
      what_it_solves: Fast prediction of continuous pressure and velocity fields around
        airfoils from geometric inputs, replacing or accelerating CFD/RANS evaluation.
      what_remains_open: Current evidence is limited mainly to steady, incompressible,
        two-dimensional subsonic NACA 4-digit airfoils; transfer to non-NACA, unsteady,
        compressible, or 3D regimes is not established.
    - line: Operator-learning architecture benchmarking for aerodynamic surfaces
      what_it_solves: Identifies scalable deep operator architectures for surface
        pressure prediction on 2D airfoils and an industrial-scale 3D aircraft configuration,
        including shock capture and data-scarcity settings.
      what_remains_open: No explicit limitations are reported in the abstract; reproducibility
        signals are weak, and the best architecture is only supported for the evaluated
        geometries and conditions.
    - line: Multi-fidelity dimension-bridging regression
      what_it_solves: Learns a correction from a 2D RANS model to 3D aerodynamic coefficients,
        with uncertainty quantification and neural-network-accelerated kernel evaluation.
      what_remains_open: Effectiveness depends on choosing an appropriate low-dimensional
        model, and evidence is mainly coefficient-level rather than full flow-field
        prediction.
    - line: Physics-informed neural PDE solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems across low and
        high Reynolds numbers without external flow data.
      what_remains_open: The packet lacks detailed methodology and limitation evidence;
        scaling to complex engineering geometries and unsteady flows is not demonstrated.
    - line: Engineering design-space exploration via generative layout
      what_it_solves: Procedurally generates and evaluates conceptual 3D ship internal
        arrangements to support early design-space exploration.
      what_remains_open: The provided evidence does not yet connect generated layouts
        to detailed engineering performance constraints or generalization beyond six
        vessel families.
    - line: Fluid-structure interaction and fluid-control policy learning
      what_it_solves: Addresses wind turbine airfoil vortex-induced vibration mitigation
        and offline reinforcement-learning-based fluid control policy extraction.
      what_remains_open: Realistic mass ratios yield small vibration reductions, and
        control results lack closed-loop or real-world deployment evidence.
    - line: General operator learning backbones
      what_it_solves: Provides attention-based operator learning architectures intended
        for heterogeneous input and operator mapping tasks.
      what_remains_open: In this packet, the general backbone is not directly evaluated
        on the same engineering aerodynamic geometries or field-prediction benchmarks
        as the application-specific surrogates.
    consensus:
    - The sampled works treat engineering simulation as a learned mapping problem,
      with geometry or boundary conditions as inputs and aerodynamic quantities, fields,
      layouts, or control policies as outputs.
    - Accuracy, inference speed relative to CFD/RANS, and some generalization or uncertainty
      evidence are common evaluation objectives.
    - Learned surrogates can achieve useful aerodynamic predictions and substantial
      speedups in the studied regimes, but most do not yet close the gap to broad
      industrial or physical deployment conditions.
    disagreements:
    - 'Learning signal differs: some rely on supervised CFD/RANS data, others use
      physics residuals without flow data, and others use multi-fidelity corrections
      from lower-dimensional models.'
    - 'Representation differs: spectral geometry encodings, neural fields/neural ODEs,
      graph/Transformer operators, Gaussian process kernels, and voxel-graph layouts
      are used for different outputs.'
    - 'Evaluation target differs: 2D airfoil fields, 3D aircraft surface pressure,
      aerodynamic coefficients, ship internal arrangements, vibration amplitude, and
      offline control policies.'
    - 'Deployment assumptions differ: data-rich surrogate use, data-free PDE solving,
      low-to-high-fidelity bridging, generative design exploration, and offline policy
      extraction each assume different data availability and transfer conditions.'
    open_questions:
    - Can geometry-conditioned aerodynamic surrogates retain accuracy outside steady,
      incompressible, 2D subsonic NACA 4-digit conditions?
    - Which operator-learning architectures remain robust on industrial-scale 3D configurations
      with shocks and scarce data without case-specific tuning?
    - Does dimension-bridging regression transfer to other low-dimensional/high-dimensional
      model pairs and from coefficient prediction to full flow-field prediction?
    - Can data-free physics-informed solvers scale beyond Navier-Stokes benchmark
      cases to complex engineering geometries and high Reynolds numbers?
    - Do vibration-mitigation and offline fluid-control methods remain effective under
      realistic mass ratios, physical constraints, and closed-loop deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件气动流场代理建模
      解决的问题: 从翼型几何输入快速预测连续压力与速度场，以替代或加速CFD/RANS评估。
      尚未覆盖: 当前证据主要限于稳态、不可压缩、二维亚音速NACA 4-digit翼型；非NACA、非定常、可压缩或三维工况的迁移未充分验证。
    - 路线: 气动表面算子学习架构基准评测
      解决的问题: 在二维翼型和工业级三维飞机配置上评测可扩展深度算子架构，包括激波捕捉和数据稀缺场景。
      尚未覆盖: 摘要未明确给出局限性，复现信号较弱，最优架构仅在当前几何和条件下得到支撑。
    - 路线: 多保真维度桥接回归
      解决的问题: 学习从2D RANS模型到3D气动系数的修正，并提供不确定性量化和神经网络加速核评估。
      尚未覆盖: 性能依赖低维模型选择，证据主要停留在气动系数而非完整流场预测。
    - 路线: 物理信息神经网络PDE求解
      解决的问题: 在低雷诺数与高雷诺数下求解稳态Navier-Stokes基准问题，无需外部流场数据。
      尚未覆盖: 证据包中缺少详细方法与局限性证据；向复杂工程几何和非定常流动扩展未得到展示。
    - 路线: 面向设计空间探索的生成式布局
      解决的问题: 程序化生成并评估概念性三维船舶内部布置，以支持早期设计空间探索。
      尚未覆盖: 尚未连接详细工程性能约束，也未见在六类船舶家族之外的泛化证据。
    - 路线: 流固耦合与流体控制策略学习
      解决的问题: 研究风力机翼型涡激振动抑制，以及基于离线强化学习的流体控制策略提取。
      尚未覆盖: 现实质量比下振动减小幅度较小，控制结果缺少闭环或真实部署证据。
    - 路线: 通用算子学习骨干
      解决的问题: 面向异构输入与算子映射任务提供基于注意力的算子学习架构。
      尚未覆盖: 在本证据包中未与领域专用气动代理模型在同一工程几何或流场预测基准上直接比较。
    共识:
    - 这些工作把工程仿真视为学习式映射问题，输入为几何或边界条件，输出为气动量、流场、布局或控制策略。
    - 精度、相对CFD/RANS的推理速度以及一定程度的泛化或不确定性证据是共同评估目标。
    - 学习型代理模型在研究工况下能获得有用气动预测和显著加速，但多数尚未覆盖更广泛的工业或物理部署条件。
    分歧:
    - 监督信号不同：有的使用监督式CFD/RANS数据，有的使用无流场数据的物理残差，有的使用低维到高维的多保真修正。
    - 表示方式不同：谱几何编码、神经场/Neural ODE、图/Transformer算子、高斯过程核和体素图表示分别用于不同输出。
    - 评测目标不同：包括二维翼型流场、三维飞机表面压力、气动系数、船舶内部布置、振动幅值和离线控制策略。
    - 部署假设不同：数据充足代理、无数据PDE求解、低到高保真桥接、生成式设计探索和离线策略提取对数据可用性与迁移条件假设不同。
    开放问题:
    - 几何条件气动代理能否在稳态、不可压缩、二维亚音速NACA 4-digit工况之外保持精度？
    - 哪些算子学习架构在工业级三维构型、激波和数据稀缺条件下仍能鲁棒，而无需依赖具体案例调参？
    - 维度桥接回归能否迁移到其他低维/高维模型对，并从气动系数预测扩展到完整流场预测？
    - 无数据物理信息求解能否从Navier-Stokes基准扩展到复杂工程几何与高雷诺数工况？
    - 振动抑制与离线流体控制方法在现实质量比、物理约束和闭环部署下是否仍然有效？
