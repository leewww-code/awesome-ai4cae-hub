  related_work_outline:
  - 'Mainstream direction: The visible 2026 frontier centres on neural aerodynamic
    surrogates benchmarked on established CFD datasets such as AirfRANS, DrivAerNet++,
    and Emmi-Wing. Evaluation increasingly adds generalization stress tests, solver-coupled
    correction, and high-fidelity dataset releases rather than reporting only aggregate
    field error.'
  - 'Shared research pattern: Papers propose an architecture or workflow and evaluate
    it on aerodynamics benchmarks. Most compare against strong baselines using relative
    L2 or MSE; OOD geometries, operating-point shifts, tessellation shifts, or solver
    residuals are used in a subset to probe robustness.'
  - 'Key differences: Some works create datasets and distribution-shift benchmarks,
    while others improve geometry-flow interaction, solver initialization, or agentic
    physics discovery. Evaluation targets are not unified: surface pressure, velocity
    fields, force rank correlation, residual ratio, Reynolds stress prediction, and
    speedups all appear.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2026, so the
    trend is best understood as within the current frontier. The pattern points from
    single-metric accuracy toward stress-testing under distribution shift, solver
    consistency, and benchmark coverage as complementary evaluation requirements.'
  - 'Open questions: It remains unclear whether benchmark distributions cover real
    aerodynamic settings, which proxy metrics align with downstream design utility,
    and whether rankings are stable across implementations and compute budgets when
    code, datasets, and limitation reports are inconsistently available.'
  related_work_outline_zh:
  - 主流方向：可见的2026年前沿集中在神经气动代理模型，并在AirfRANS、DrivAerNet++、Emmi-Wing等已有CFD基准上评测。评估逐渐增加泛化压力测试、求解器耦合校正和高保真数据集发布，而不再只报告聚合场误差。
  - 研究共性：论文提出架构或工作流，并在气动基准上评测。多数用Relative L2或MSE与强基线比较；部分工作进一步用OOD几何、运行点偏移、网格划分偏移或求解器残差探测鲁棒性。
  - 关键差异：有的工作创建数据集与分布偏移基准，有的改进几何-流动交互、求解器初值或智能体物理发现。评测目标不统一：表面压力、速度场、力秩相关、残差比、雷诺应力预测和加速比都有出现。
  - 趋势演进：可见的顶级论文证据集中在2026年，因此趋势只能理解为当前前沿内部。模式显示从单一精度指标转向分布偏移鲁棒性、求解器一致性和基准覆盖度的联合评估。
  - 开放问题：现有基准分布是否覆盖真实气动设计场景；哪些代理指标与下游设计效用一致；在代码、数据集和局限性报告不一致的情况下，排名是否跨实现和算力预算稳定。
  literature_review:
    line_of_work_matrix:
    - line: Aerodynamic benchmark task and dataset design
      what_it_solves: Creating shared CFD tasks and reference datasets for comparable
        neural surrogate evaluation across airfoil, wing, truck, and aircraft configurations.
      what_remains_open: Coverage of real operating settings and distribution shifts;
        strong in-distribution results do not guarantee generalization.
    - line: Metric and stress-test design for aerodynamic surrogates
      what_it_solves: Probing prediction accuracy, force rank correlation, solver
        residuals, speedup, and robustness under OOD geometries, operating conditions,
        tessellation, and cross-vehicle shifts.
      what_remains_open: Alignment between proxy metrics and downstream design decisions,
        plus explicit limitation evidence.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Comparing architectures against strong baselines with reported
        field-error metrics and, in some cases, dataset or solver artifacts.
      what_remains_open: Stability of benchmark conclusions across implementations
        and compute budgets; code, dataset, and limitation reporting is inconsistent.
    consensus:
    - Neural aerodynamic surrogates are evaluated on shared CFD benchmarks and compared
      against strong baselines using relative L2 or MSE as core error metrics.
    - Generalization is treated as a first-class evaluation dimension, often through
      out-of-distribution geometries, operating conditions, or solver coupling.
    - High in-distribution accuracy alone is insufficient; distribution-shift probes
      reveal failures in speed dependence, tessellation, and cross-vehicle transfer.
    - 'Reproducibility evidence is uneven: baselines and metrics are often reported,
      but code, dataset, and explicit limitation evidence are frequently absent or
      incomplete; this is a verification gap, not proof that artifacts do not exist.'
    disagreements:
    - 'Representation strategy differs: some models encode point-cloud geometry with
      flow-state attention, others use spectral encoders with domain routing, and
      others operate as LLM-agent or solver-coupled workflows.'
    - 'Evaluation target differs: surface pressure, velocity-field MSE, aerodynamic
      force rank correlation, residual ratio, Reynolds-stress prediction, and speedup
      are used across papers without a single primary metric.'
    - 'Generalization testing intensity differs: dedicated benchmark work introduces
      controlled operating-point, tessellation, and cross-vehicle shifts, while architecture-focused
      evaluations often rely on existing datasets and do not report comparable stress
      tests.'
    - 'Deployment setting differs: pure surrogate inference, solver-coupled correction,
      agentic physics discovery, and dataset release imply different success criteria
      and reproducibility expectations.'
    open_questions:
    - Can benchmark distributions be expanded to cover the real aerodynamic settings,
      vehicle classes, and physical regimes where surrogate models are expected to
      help?
    - Which proxy metrics, such as field error, force rank correlation, residual reduction,
      or speedup, best predict downstream design utility?
    - Are benchmark rankings stable across implementation choices and compute budgets
      when code, dataset artifacts, and limitation reports are not consistently available?
    - How can distribution-shift robustness be improved without losing the in-distribution
      accuracy gains reported on current benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 气动基准任务与数据集设计
      解决的问题: 构建共享CFD任务和参考数据集，使翼型、机翼、车辆和飞行器配置上的神经代理模型评测可比。
      尚未覆盖: 真实运行设置与分布偏移覆盖不足；强分布内结果不保证泛化。
    - 路线: 气动代理模型的指标与压力测试设计
      解决的问题: 检验精度、力秩相关、求解器残差、加速比，以及在OOD几何、运行点、网格化和跨车型偏移下的鲁棒性。
      尚未覆盖: 代理指标与下游设计决策之间的对应关系，以及显式局限性证据。
    - 路线: 可比基线与报告规范
      解决的问题: 用报告场误差指标、秩相关和加速比，将各架构与强基线比较，并部分提供数据集或求解器工件。
      尚未覆盖: 基准结论在不同实现和算力预算下的稳定性；代码、数据集和局限性报告不一致。
    共识:
    - 神经气动代理模型通常以共享CFD数据集上的Relative L2或MSE误差作为核心，并与强基线比较。
    - 泛化被视作重要评测维度，常用分布外几何、运行条件或求解器耦合进行检验。
    - 仅有高分布内精度不足以保证泛化；分布偏移测试会暴露速度依赖、网格划分和跨车型迁移问题。
    - 可复现性证据不均衡：基线和指标常被报告，但代码、数据集和显式局限性说明经常缺失或不完整；这属于核验缺口，而非证明工件不存在。
    分歧:
    - 表示方式不同：有的模型用流态注意力编码点云几何，有的用谱编码器和域路由，有的采用LLM智能体或求解器耦合工作流。
    - 评测目标不同：表面压力、速度场MSE、气动力秩相关、残差比、雷诺应力预测和加速比被不同论文使用，缺少统一主要指标。
    - 泛化测试强度不同：专门的基准工作引入受控运行点、网格化和跨车型偏移，而架构导向评测常依赖已有数据集，未报告可比压力测试。
    - 部署场景不同：纯代理推理、求解器耦合校正、智能体物理发现和数据集发布对应不同的成功标准和可复现性预期。
    开放问题:
    - 基准分布能否扩展以覆盖真实气动设计中的几何、运行点和物理区域多样性？
    - 场误差、力秩相关、残差下降和加速比等代理指标中，哪些最能代表下游设计收益？
    - 在代码、数据集工件和局限性报告不一致的情况下，基准排名是否跨实现和算力预算稳定？
    - 如何在不牺牲当前基准分布内精度提升的同时，提高分布偏移鲁棒性？
