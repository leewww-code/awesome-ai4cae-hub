  related_work_outline:
  - 'Mainstream direction: Aerodynamic and CFD surrogate evaluation dominates the
    evidence, with high-fidelity datasets and neural operator baselines compared through
    field error, force accuracy, and robustness stress tests.'
  - 'Shared research pattern: Work shares simulation benchmarks and reports relative
    L2/MSE or aerodynamic force ordering; strong in-distribution accuracy is treated
    as insufficient without distribution-shift or solver-facing checks.'
  - 'Key differences: Contributions split between proposing new neural architectures,
    releasing datasets with controlled shifts, coupling surrogates to Newton-Krylov
    solvers, and using LLM agents for flow-component discovery; evaluation targets
    and deployment modes differ.'
  - 'Trend evolution: Visible top-paper evidence is concentrated in 2026, so the trend
    is within the current frontier: moving from single-number accuracy toward controlled
    distribution shifts, solver reliability, and auditability. Older years 2022-2023
    lack top-paper evidence in this packet.'
  - 'Open questions: Whether benchmark task distributions cover real design settings,
    whether proxy metrics align with decisions, and whether conclusions remain stable
    under available code, data, compute, and missing limitation reports.'
  related_work_outline_zh:
  - 主流方向：气动与CFD代理模型评估是主要证据，围绕高保真数据集、神经算子基线和场误差、气动力精度、鲁棒性压力测试展开。
  - 研究共性：工作共享仿真基准，以相对L2/MSE、气动力排序等指标为主，并认为仅有分布内精度不足，需要分布偏移或求解器侧校验。
  - 关键差异：一些提出新模型，一些发布带受控偏移的数据集，一些把代理与Newton-Krylov求解器耦合，一些用LLM智能体做流场分析；评测目标与部署方式不同。
  - 趋势演进：可见top论文证据集中在2026年，趋势仅能视为当前前沿：从单一精度比较转向受控分布偏移、求解器可靠性与可审计性；本包内2022-2023缺少top论文证据。
  - 开放问题：任务分布是否覆盖真实设计、代理指标是否对齐下游决策、结论在代码/数据/算力和局限性缺失下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared high-fidelity simulation datasets and task definitions
        so aerodynamic surrogate claims can be compared across architectures.
      what_remains_open: Whether controlled distribution shifts cover operating-point,
        tessellation, cross-vehicle, and out-of-distribution settings where surrogates
        are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes field error, force rank correlation, shock capture, residual
        reduction, and robustness beyond aggregate accuracy; separates in-distribution
        performance from generalization stress tests.
      what_remains_open: Alignment between these proxy metrics and downstream aerodynamic
        design or control decisions is not systematically demonstrated.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable by comparing against common baselines
        and reporting field/force metrics, runtime, and reproducibility signals.
      what_remains_open: Code, dataset, artifact, compute budget, and limitation details
        are often missing or blank; duplicate records and unverified implementation
        stability leave conclusions fragile.
    consensus:
    - Neural aerodynamic surrogates are evaluated on shared high-fidelity simulation
      benchmarks, with field errors and aerodynamic force or rank metrics as common
      evidence.
    - Strong in-distribution accuracy is widely treated as insufficient; operating-point,
      geometric/tessellation, cross-vehicle, or Reynolds out-of-distribution stress
      tests are considered necessary.
    - 'Reproducibility evidence is uneven: visible claims often lack code, dataset,
      artifact, or limitation details, making verification a recurring gap rather
      than proof of absence.'
    disagreements:
    - 'Representation choices differ: one line uses geometry-flow soft state assignments,
      another uses domain-decomposed routed operators, and another uses stochastic
      separable physics-informed components.'
    - 'Evaluation targets differ: some work emphasizes surface pressure, some full
      velocity fields and force rank correlation, some residual convergence after
      solver coupling, and some turbulence flow-component analysis.'
    - 'Deployment and interaction modes differ: standalone learned surrogates versus
      solver-coupled Newton-Krylov correction versus LLM-agent pipelines for physics
      discovery.'
    - 'Benchmark focus differs: dataset contributions stress controlled distribution
      shifts, while architecture evaluations stress shock capture, scalability, and
      data scarcity.'
    open_questions:
    - Which distribution-shift and stress-test combinations are sufficient for aero/CFD
      surrogates to be trustworthy in design rather than only rank-accurate?
    - Do relative L2/MSE, force MSE, and rank correlation align with the downstream
      engineering decisions users actually care about?
    - Are reported architecture advantages stable across implementations, compute
      budgets, and unreleased code or data?
    - Can solver-coupled and LLM-agent validation be extended beyond a few benchmarks
      when limitation and artifact evidence is missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享高保真仿真数据集和任务，使气动代理模型在不同模型之间可比较。
      尚未覆盖: 受控分布偏移是否覆盖运行工况、网格离散化、跨车型以及外推等真实使用场景仍不清楚。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体精度之外检验场误差、气动力秩相关、激波捕捉、残差收敛和鲁棒性。
      尚未覆盖: 这些代理指标与下游气动设计或控制决策之间的对齐还缺少系统证据。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、数据集和指标报告口径让结果可审计。
      尚未覆盖: 代码、数据、工件、算力和局限性信息常缺失或空白；重复记录和未验证的实现稳定性使结论不牢靠。
    共识:
    - 神经气动代理大多在共享高保真仿真基准上评测，常用场误差、气动力MSE和秩相关作为证据。
    - 分布内精度高被普遍认为不够；运行工况、几何/网格离散化、跨车型或Reynolds外推等压力测试被视为必要。
    - 复现证据不均衡：可见论文常缺少代码、数据集、工件或局限性细节，这属于验证缺口而非证明其不存在。
    分歧:
    - 表示方式不同：有的采用几何-流动软分配，有的采用域分解神经算子，有的采用随机可分离物理信息结构。
    - 评测目标不同：分别侧重表面压力、全流场速度与气动力排序、求解器耦合后的残差收敛，或湍流流场分量分析。
    - 部署交互模式不同：自包含代理、与Newton-Krylov耦合的代理、以及基于LLM智能体的物理发现流水线并存。
    - 基准侧重不同：数据集工作强调受控分布偏移，模型评测工作强调激波、扩展性和数据稀缺。
    开放问题:
    - 哪些分布偏移与压力测试组合足以让气动/CFD代理在设计任务中从排序准确走向可信？
    - 相对L2/MSE、气动力MSE和秩相关是否真正对齐下游工程决策？
    - 在代码、数据、算力和实现细节缺失的情况下，报告的优势是否稳定可复现？
    - 求解器耦合和LLM智能体验证能否从少数评估扩展到可审计的基准？
