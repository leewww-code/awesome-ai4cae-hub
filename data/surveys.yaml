  literature_review:
    line_of_work_matrix:
    - line: High-fidelity aerodynamic dataset and benchmark construction
      what_it_solves: Provides shared geometry-flow datasets with controlled splits
        and distribution-shift settings for comparing surrogate generalization.
      what_remains_open: Whether single-vehicle or single-fidelity datasets cover
        realistic operating variability and experimental uncertainty; strong in-distribution
        performance remains fragile.
    - line: Cross-architecture surrogate benchmarking on shared CFD tasks
      what_it_solves: Makes neural operator and graph/transformer-style surrogates
        comparable on surface-field prediction, shock capture, scalability, and data
        scarcity.
      what_remains_open: Rankings are not yet shown to be stable across tessellation,
        Reynolds extrapolation, or cross-vehicle transfer.
    - line: Physics-grounded metric and stress-test design
      what_it_solves: Probes whether aggregate field-error metrics track physically
        meaningful flow statistics and where models are sensitive to energetic input
        regions.
      what_remains_open: Evidence is based on a single case, and intervention masks
        are not energy-matched, so the causal link between scores and physical correctness
        remains open.
    - line: Solver-coupled correction and reliability evaluation
      what_it_solves: Uses surrogate predictions as initial guesses for Newton-Krylov
        iteration to improve CFD reliability and speed.
      what_remains_open: Evidence covers transonic airfoil optimization and one 3D
        flying-wing case; broader geometry and flow regimes need verification.
    - line: Automated CFD workflow and physics-discovery benchmarks
      what_it_solves: Evaluates retrieval, generation, and multi-agent systems for
        OpenFOAM case setup and turbulence component analysis.
      what_remains_open: Benchmarks are relatively small or specialized, and the physical
        validity of automated recommendations is not yet fully bounded.
    consensus:
    - Aerodynamic surrogate evaluation is converging on shared field-prediction and
      force-coefficient tasks, with explicit baselines and numeric error metrics.
    - Strong in-distribution accuracy does not imply robustness; controlled distribution-shift
      and physics-grounded checks are recognized as necessary additions.
    - Architectural choices matter for representing shocks, boundary layers, and wakes,
      but no single architecture is universally superior.
    - 'Reproducibility evidence is mixed: datasets, baselines, and metrics are often
      reported, while code artifacts and limitation statements are frequently incomplete.'
    disagreements:
    - Some works treat aggregate field error as the primary target, while others show
      it can misalign with physically relevant fluctuation-energy statistics.
    - Pure neural prediction is contrasted with solver-coupled correction, which adds
      terminal numerical convergence instead of relying on surrogate output alone.
    - 'Evaluation targets differ: surface pressure, velocity fields, aerodynamic forces,
      retrieval coverage, and workflow completion are all used as primary measures.'
    - Some benchmarks introduce controlled distribution shifts, while others evaluate
      only in-distribution or fixed datasets, making generalization claims uneven.
    open_questions:
    - Which metrics beyond relative L2/MSE best reflect aerodynamic decision utility
      and physical correctness?
    - How stable are benchmark rankings under operating-condition change, tessellation,
      cross-vehicle transfer, and Reynolds extrapolation?
    - Can solver-coupled correction and agentic CFD automation scale to broader physical
      regimes without hiding model failures?
    - What artifact and limitation details are missing, and how would their release
      change reproducibility or ranking conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 高保真气动数据集与基准构建
      解决的问题: 提供共享几何-流动数据集、受控划分和分布偏移设置，使代理模型泛化能力可比较。
      尚未覆盖: 单一车型或单一保真度数据是否覆盖实际运行变异与实验不确定性；分布内强性能仍显脆弱。
    - 路线: 共享CFD任务上的跨架构代理基准
      解决的问题: 让神经算子、图网络/transformer型代理在表面场预测、激波捕捉、可扩展性与数据稀缺下可比较。
      尚未覆盖: 排名尚未被证明在网格离散、Reynolds外推或跨车型迁移下稳定。
    - 路线: 物理一致性指标与压力测试设计
      解决的问题: 检验聚合场误差指标是否跟踪有物理意义的流动统计，以及模型对高能输入区域的敏感性。
      尚未覆盖: 证据基于单一案例，干预掩码未做能量匹配，分数与物理正确性的因果联系仍开放。
    - 路线: 求解器耦合校正与可靠性评估
      解决的问题: 将代理预测作为Newton-Krylov迭代初值，提高CFD可靠性与速度。
      尚未覆盖: 证据集中在跨音速翼型优化和flying-wing三维案例，更广几何与流动工况需验证。
    - 路线: 自动化CFD工作流与物理发现基准
      解决的问题: 评测OpenFOAM算例自动生成/检索和湍流分量分析中的检索、生成与多智能体系统。
      尚未覆盖: 基准较小或专门化；自动化建议的物理有效性与边界尚未完全闭合。
    共识:
    - 气动代理评测正在向共享的流场预测与力系数任务汇聚，并普遍使用明确基线与数值误差指标。
    - 分布内强精度不等于鲁棒性；受控分布偏移和物理一致性检查被认为是必要补充。
    - 架构选择对激波、边界层和尾迹表示有影响，但没有一个架构在所有设置下占优。
    - 可复现性证据不一：数据集、基线与指标常被报告，但代码工件与局限性陈述常不完整。
    分歧:
    - 部分工作将聚合场误差作为主要目标，另有工作显示其可能与物理相关的脉动能量统计不一致。
    - 纯神经预测与求解器耦合校正形成对比：后者加入终端数值收敛，而非仅依赖代理输出。
    - 评测目标不同：表面压力、速度场、气动力、检索覆盖率与工作流完成度均有使用。
    - 一些基准引入受控分布偏移，另一些仅在分布内或固定数据集上评测，泛化结论不均衡。
