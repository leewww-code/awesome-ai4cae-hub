      解决的问题: 将代理预测作为初值或设计更新，并通过 CFD/物理反馈保证终端精度和可靠性。
      尚未覆盖: 外部验证多限于内部车辆/翼型数据集或特定流动状态；跨部署环境和用户设置证据不足。
    - 路线: 智能体式自动化物理分析框架
      解决的问题: 通过 LLM 驱动多智能体推理，自动化流动分解、湍流分析和建模建议。
      尚未覆盖: 独立复现与跨团队验证有限；代码、数据和工件可获得性证据不足。
    - 路线: 高保真数据集与评估工件栈
      解决的问题: 提供标准化仿真数据、几何变形、分布偏移协议和模型比较，以测试代理鲁棒性。
      尚未覆盖: 覆盖特定车辆/翼型类别和流动工况；分布内强分不保证跨分布鲁棒。
    - 路线: 物理约束诊断与可解释性工具
      解决的问题: 审计聚合误差是否与物理上有意义的流场统计和模型敏感性一致。
      尚未覆盖: 目前证据基于单一案例；干预掩码未能完全区分敏感性与物理因果重要性。
    共识:
    - 研究围绕神经代理作为气动分析核心计算引擎，但越来越多工作将数据集、求解器反馈、不确定性触发、智能体工具和评测协议纳入系统贡献。
    - 常见评测使用仿真气动数据，并报告相对误差、流场误差或系数/趋势精度；近期工作开始加入分布偏移和物理诊断。
    - 论文普遍认同仅快速推理不够，可靠性、泛化能力和物理一致性是共同关注点。
    分歧:
    - 预测表示不同：有的预测标量阻力、系数趋势或优化目标；有的预测连续压力/速度场，或分解后的流动分量。
