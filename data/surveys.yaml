  - 关键差异：目标输出不同，如表面压力、全速度场、气动力、CFD残差和湍流分量发现；机制不同，包括注意力/路由/域分解、求解器耦合和 LLM 智能体推理；侧重点不同，有的偏基准构建，有的偏代理模型开发。
