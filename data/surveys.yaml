    研究路线矩阵:
    - 路线: 求解器耦合的代理校正与约束优化流水线（如 Newton-Krylov correction、不确定性触发 CFD 反馈）
      解决的问题: 把神经代理预测转化为可靠稳态 CFD 或形状优化工作流，通过求解器耦合或选择性物理反馈提升可靠性。
