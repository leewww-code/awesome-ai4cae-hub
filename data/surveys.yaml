      尚未覆盖: 现有证据限于稳态、不可压缩、二维亚音速NACA 4-digit翼型；对非NACA、非定常、可压缩和三维流场仍未验证。
    - 路线: 气动表面压力算子学习架构评测
      解决的问题: 在二维翼型和工业级三维飞机上评测不同神经算子架构的激波捕捉、扩展性和数据稀缺能力。
      尚未覆盖: 摘要未给出明确限制，代码与工件信号较弱；真实部署与可复现性证据仍缺失。
    - 路线: 多保真与维度桥接高斯泛函回归
      解决的问题: 学习2D到3D RANS修正，实现气动系数预测、不确定性量化和神经网络加速实时评估。
      尚未覆盖: 方法效果依赖低维模型选择，神经网络加速核与精确回归仅近似一致。
    - 路线: 无数据物理信息Navier-Stokes求解
      解决的问题: 在无外部流场数据条件下求解低至高雷诺数稳态Navier-Stokes基准问题。
      尚未覆盖: 证据包缺少方法、结果与限制细节；复杂工程外形、非定常或分离流配置未验证。
    - 路线: 湍流与尾流数据集流水线
      解决的问题: 构建经校验的LBM与高雷诺数数据集，用于三维含障碍通道湍流和尾流动力学代理建模。
      尚未覆盖: 可见证据缺失完整分析，下游模型在新几何或新流态上的泛化未证实。
    - 路线: 大气边界层LES条件扩散超分辨率
