  literature_review:
    line_of_work_matrix:
    - line: End-to-end neural aerodynamic surrogate and design optimization pipelines
      what_it_solves: Learns geometry and flow-condition mappings to surface or volume
        fields and aerodynamic quantities for rapid prediction and constrained shape
        optimization.
      what_remains_open: External deployment, hardware changes, and integration with
        industrial CAD/solver/toolchain settings remain unevidenced.
    - line: Physics-coupled and solver-in-the-loop correction frameworks
      what_it_solves: Combines neural surrogate initialization or uncertainty-triggered
        physics feedback with numerical solvers to improve convergence reliability
        and optimization trust.
      what_remains_open: Trade-offs among speed, fidelity, controllability, and system
        complexity; generalization beyond tested geometries and three-dimensional
        configurations.
    - line: Agent-driven automated flow analysis toolchains
      what_it_solves: Uses LLM agents and decomposition modules to automate flow field
        analysis, physical discovery, consistency review, and model recommendation.
      what_remains_open: Independent reproduction, auditability, guardrails, and external
        deployment evidence are not established.
    - line: High-fidelity benchmark and dataset suites for distribution-shift evaluation
      what_it_solves: Standardizes surrogate evaluation with controlled datasets,
        baselines, and distribution shifts to expose generalization failures.
      what_remains_open: Coverage across vehicle classes and tasks is limited; no
        unified robustness across architectures; artifact-based reproduction is a
        verification gap.
    - line: Physics-grounded diagnostic evaluation for surrogate operators
      what_it_solves: Tests whether benchmark error improvements correspond to physically
        important flow statistics using interventions and stress tests.
      what_remains_open: Results are tied to a single benchmark; intervention masks
        are not energy-matched; causal physical correctness is not established.
    consensus:
    - Learned aerodynamic surrogates can deliver orders-of-magnitude speedups over
      conventional CFD while capturing important aerodynamic trends or flow features.
    - Current evaluation relies heavily on datasets, baselines, and error metrics;
      strong in-distribution performance does not guarantee generalization.
    - Distribution shifts from operating points, mesh or tessellation changes, and
      cross-vehicle geometry expose substantial robustness weaknesses.
    - Combining surrogates with physics constraints, uncertainty triggers, or solver
      feedback improves online reliability and optimization trustworthiness.
    - Several top papers contain only partial or indirect code, data, and artifact
      signals, so independent reproduction remains a verification gap rather than
      assumed absence.
    disagreements:
    - 'Pure surrogate prediction, solver-coupled correction, and agent-driven analysis
