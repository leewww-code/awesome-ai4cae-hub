    研究路线矩阵:
    - 路线: 几何条件气动场代理模型
      解决的问题: 从翼型或飞机几何映射到连续压力/速度场和气动量，以相对 CFD 的大幅加速支持快速设计评估。
      尚未覆盖: 证据集中在稳态、不可压缩、二维亚音速 NACA 4-digit 翼型；向非 NACA、跨声速、非定常和三维工业构型的迁移仍未充分验证。
    - 路线: 气动预测的算子学习基准评测
      解决的问题: 对比可扩展算子架构在二维翼型和三维飞机表面压力预测上的表现，重点评估激波/间断捕捉、大规模网格扩展性和数据稀缺性。
      尚未覆盖: 目前限于已报告的基准设置；缺少局限性明确说明，缺少不同工业几何和飞行条件下的架构迁移证据。
    - 路线: 物理信息与无数据 Navier-Stokes 求解
      解决的问题: 在低到高 Reynolds 数稳态 Navier-Stokes 基准问题上，通过嵌入物理约束实现无需外部流场数据的求解。
      尚未覆盖: 尚不能证明在复杂工程几何、湍流或非定常气动场景中能达到同等工程精度。
    - 路线: 低保真基线与维度桥接修正
      解决的问题: 学习从二维 RANS 或解析非定常基线到高保真三维或 CFD 载荷的修正，提高系数/载荷精度，并支持自适应采样和快速评估。
      尚未覆盖: 效果依赖低维模型选择；证据仅限于特定翼型/基准运动，尚未覆盖宽广飞行包线。
    - 路线: 流体控制与流固耦合应用
      解决的问题: 利用 CFD/FSI 或离线强化学习抑制涡激振动或从历史数据中提取流体控制策略。
      尚未覆盖: 共振器在真实质量比下减振幅度小；策略提取缺乏闭环真实流场验证或跨任务泛化证据。
    共识:
    - 神经代理模型被定位为 CFD/RANS 的快速补充，用于重复设计或控制评估，而非完全替代物理求解器。
    - 融入物理结构，如几何条件化、基线修正、物理残差或维度桥接，可提高数据效率和精度。
    - 精度、加速和泛化主要在 CFD 基准上评估，三维飞机、非定常运动、激波和数据稀缺被用作更难的测试。
    - 泛化通常只在窄族内通过插值/外推验证，开放域迁移尚未建立。
    分歧:
    - 表示方式：谱几何编码器、图/Transformer算子、神经场或 neural ODE、LSTM 残差、高斯过程/核模型用于相近气动预测任务。
    - 监督信号：有的依赖大规模 CFD/RANS 数据，有的使用无外部数据的物理残差，有的学习低保真基线修正，或从离线数据提取策略。
    - 输出粒度：目标覆盖连续速度/压力场、表面压力、气动系数、非定常载荷序列和流体控制动作。
    - 部署场景：证据包括二维稳态不可压缩翼型、三维工业飞机、低/高 Reynolds 基准、非定常俯仰/沉浮运动、风力机涡激振动。
    - 评测重点：论文各自强调精度、激波捕捉、实时速度、不确定性驱动的自适应采样、减振幅度或策略提取，难以直接比较。
    开放问题:
    - 当前在 NACA 4-digit 稳态翼型上训练的代理模型能否迁移到非 NACA、跨声速、非定常或三维工业构型？
    - 在稀缺高保真数据和工业尺度网格及激波/间断条件下，哪种表示和监督策略更有效？
    - 学习得到的 CFD 代理能否用风洞或现场实验数据验证，而不仅是对仿真数据验证？
    - 对于流体控制与 FSI 应用，应建立怎样的评测才能证明闭环真实世界可靠性，而不只是仿真减幅或离线策略提取？
    - 多篇论文缺少可见代码、数据集、基线、指标或局限性细节，复现和横向比较仍不完整。
