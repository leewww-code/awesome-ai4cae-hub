  related_work_outline:
  - 'Mainstream direction: neural-surrogate benchmarking for aerodynamic flow prediction,
    using high-fidelity CFD/simulation datasets and paired experimental data to compare
    field and force errors.'
  - 'Shared research pattern: evaluate architectures against strong operator baselines
    on shared tasks, then add stress conditions such as distribution shift, solver
    coupling, or physical diagnostics to test generalization beyond aggregate accuracy.'
  - 'Key differences: works differ in interaction mode, evaluation target, and robustness
    claim—standalone surrogate accuracy, force/rank correlation, residual correction
    reliability, and physical-statistics alignment are not interchangeable.'
  - 'Trend evolution: available evidence concentrates around 2026, so the trend is
    within the current frontier; evaluation is moving from single-score leaderboards
    toward controlled distribution shifts, solver-coupled correction, and physics-grounded
    stress tests.'
  - 'Open questions: whether better benchmark scores imply better physics/downstream
    utility, whether task distributions cover deployment shifts, and whether conclusions
    are stable given missing artifacts and implementation details.'
  related_work_outline_zh:
  - 主流方向：面向空气动力学流场预测的神经代理基准评测，使用高保真CFD/仿真数据或CFD与实验配对数据，比较流场误差和气动误差。
  - 研究共性：在共享任务上以强基线为参照评估架构，并在聚合精度之外加入分布偏移、求解器耦合或物理诊断等压力条件。
  - 关键差异：交互模式、评测目标和鲁棒性结论不同；纯代理精度、力预测与秩相关、残差校正可靠性、物理统计一致性不能互相替代。
  - 趋势演进：现有证据集中在2026年，趋势属于当前前沿；评测正从单一分数榜单转向受控分布偏移、求解器耦合校验和基于物理的压力测试。
  - 开放问题：更好的基准分数是否意味着更好的物理与下游效用，任务分布是否覆盖部署偏移，以及在缺失工件和实现细节时结论是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared high-fidelity aerodynamic datasets and controlled
        distribution shifts so neural surrogates can be compared on surface and volume
        predictions across geometry, operating condition, and discretization changes.
      what_remains_open: Whether the task distribution covers real deployment settings
        such as cross-vehicle generalization, speed dependence, and large OOD Reynolds
        extrapolation; current evidence shows strong in-distribution surrogates can
        still degrade under these shifts.
    - line: Metric and stress-test design
      what_it_solves: Probes whether low field or force error corresponds to physically
        relevant forecasts by using input interventions, output attenuation tests,
        and component-level diagnostics beyond aggregate scores.
      what_remains_open: Alignment between proxy metrics and downstream aerodynamic
        decisions remains unresolved; one intervention mask design measures sensitivity
        rather than physical importance because removed fluctuation energy is not
        matched.
    - line: Comparable baselines and reporting
      what_it_solves: Makes architecture comparisons auditable by evaluating against
        strong operator baselines on shared benchmarks and reporting relative error
        reductions, robustness, and computational cost.
      what_remains_open: Whether benchmark conclusions stay stable across implementations
        and compute budgets; several papers lack code or artifact signals, so reproducibility
        and hidden implementation effects remain verification gaps.
    consensus:
    - Aerodynamic neural surrogates are evaluated on shared CFD datasets or paired
      CFD/experimental observations, with velocity-field error and aerodynamic force
      error as core evidence.
    - Aggregate in-distribution accuracy is treated as necessary but not sufficient;
      recent work adds distribution shifts, solver coupling, or physical diagnostics
      to test generalization and utility.
    - Strong operator baselines are used as common references, and relative error
      reduction is reported as the main signal for method quality, often with computational
      cost as a secondary constraint.
    disagreements:
    - 'Evaluation target differs: some works optimize velocity or surface-pressure
      field error, others target force prediction and rank correlation, solver residual
      reduction, or physical fluctuation-energy statistics.'
    - 'Interaction mode differs: some evaluate standalone surrogate predictions, some
      use surrogate predictions as initial guesses inside a Newton-Krylov solver,
      and some stress-test standalone generalization under controlled distribution
      shifts.'
    - 'Robustness conclusions differ: high in-distribution performance is not consistently
      linked to physical consistency or generalization, and different representations
      show markedly different robustness across discretization and cross-vehicle shifts.'
    open_questions:
    - Do better benchmark scores indicate better physical forecasts, given evidence
      that lower velocity-field error can coexist with higher fluctuation-energy error?
    - Can a single high-fidelity task distribution cover operating-condition, tessellation,
      cross-vehicle, and out-of-distribution Reynolds shifts simultaneously?
    - Are ranking conclusions stable across implementations and compute budgets when
      code, dataset, and limitation details are missing from the evidence packet?
    - Which proxy metric aligns most closely with downstream aerodynamic optimization
      and design decisions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享高保真空气动力学数据集和受控分布偏移，使神经代理在不同几何、运行条件和离散化下可比较表面与体流场预测。
      尚未覆盖: 任务分布是否覆盖跨车型泛化、速度依赖和大范围OOD Reynolds外推等真实部署设置；现有证据显示分布内强的代理在这些偏移下仍可能退化。
    - 路线: 指标与压力测试设计
      解决的问题: 通过输入干预、输出衰减测试和分量级诊断，检验低流场或气动误差是否对应物理相关预测，超越聚合分数。
      尚未覆盖: 代理指标与下游气动决策是否一致尚未解决；某干预掩码设计衡量敏感性而非物理重要性，因为移除的脉动能量未被匹配。
    - 路线: 可比基线与报告规范
      解决的问题: 通过在共享基准上对照强基线，并报告相对误差降低、鲁棒性和计算成本，使架构比较可审计。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；多篇论文缺少代码或工件信号，因此可复现性和隐藏实现效应仍是验证缺口。
    共识:
    - 气动神经代理在共享CFD数据集或CFD/实验配对观测上评测，流场误差和气动力误差是核心证据。
    - 聚合分布内精度被视为必要但不充分；近期工作加入分布偏移、求解器耦合或物理诊断以检验泛化和效用。
    - 使用强算子基线作为共同参照，并把相对误差降低作为方法质量的主要信号，计算成本常作为次要约束。
    分歧:
    - 评测目标不同：有的优化速度场或表面压力场误差，有的关注力预测与秩相关、求解器残差降低或物理脉动能量统计。
    - 交互模式不同：有的评估独立代理预测，有的把代理预测作为Newton-Krylov求解器初值，有的在受控分布偏移下压力测试独立泛化。
    - 鲁棒性结论不同：高分布内性能并不一致地关联物理一致性或泛化，不同表示在离散化和跨车型偏移下鲁棒性差异明显。
    开放问题:
    - 当更低的速度场误差可与更高的脉动能量误差同时出现时，更好的基准分数是否代表更好的物理预测？
    - 单一高保真任务分布能否同时覆盖运行条件、网格划分、跨车型和OOD Reynolds外推？
    - 当证据包中缺少代码、数据集和局限性细节时，排名结论在不同实现和算力预算下是否稳定？
    - 何种代理指标与下游气动优化和设计决策最一致？
