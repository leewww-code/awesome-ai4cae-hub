  related_work_outline:
  - 'Mainstream direction: High-fidelity aerodynamics benchmarks and neural-surrogate
    evaluation dominate the evidence, using datasets such as SHIFT-Truck, AirfRANS,
    Emmi-Wing, and DrivAerNet++ to compare operator-learning architectures for flow
    and force prediction.'
  - 'Shared research pattern: Models predict surface or volume flow fields with deep
    operator, attention, or decomposition-based architectures, then report relative
    L2/MSE, drag rank correlation, residual reduction, or optimization speed against
    strong baselines.'
  - 'Key differences: Some works introduce new datasets with controlled distribution
    shifts; others improve inductive bias through flow-state attention or domain routing;
    others couple surrogates with numerical solvers or use agentic triple decomposition
    for physics discovery.'
  - 'Trend evolution: The 2026-heavy evidence shows a current-frontier shift from
    task/dataset creation toward stress-tested generalization, downstream force/optimization
    utility, and solver-agent correction; the narrow year span prevents long-term
    trend claims.'
  - 'Open questions: Proxy metrics are weakly linked to downstream design decisions;
    missing code, data, and reporting details limit reproduction; robustness across
    operating point, tessellation, and vehicle class remains unresolved; cost-accuracy
    tradeoffs need clearer baselines.'
  related_work_outline_zh:
  - 主流方向：高保真气动基准与神经代理评测占主导，使用 SHIFT-Truck、AirfRANS、Emmi-Wing、DrivAerNet++ 等数据集比较算子学习架构的流场与力预测。
  - 研究共性：模型用深度算子、注意力或分解式架构预测表面/体积流场，报告相对 L2/MSE、阻力秩相关、残差下降或优化加速，并与强基线比较。
  - 关键差异：有的工作新建数据集并引入受控分布偏移；有的通过流态注意力或域路由增强表示；有的把代理与数值求解器耦合，或用智能体三分解进行物理发现。
  - 趋势演进：2026 年证据显示前沿从数据集/任务构建转向压力测试泛化、下游力/优化效用和求解器/智能体修正；年份过窄难以判断长期趋势。
  - 开放问题：代理指标与真实气动设计/优化效用仍缺少验证；代码、数据和基线细节不完整影响复现；跨运行点、网格和车型的鲁棒性未统一解决；算力-精度边界需更可审计。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared high-fidelity tasks and datasets that make aerodynamic
        surrogate claims comparable across geometries, vehicle classes, and flow conditions.
      what_remains_open: Whether the task distribution covers operating points, tessellation,
        and vehicle variants where surrogates are expected to help; dataset evidence
        shows strong in-distribution models can still degrade under these shifts.
    - line: Metric and stress-test design
      what_it_solves: Probes beyond aggregate field loss using drag rank correlation,
        residual L2 ratio, shock capture, scalability, data scarcity, and distribution-shift
        robustness to test decision utility.
      what_remains_open: Alignment between proxy metrics and downstream optimization
        or design choices remains inferred rather than demonstrated; no unified stress-test
        standard appears across the evidence.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable by comparing against strong baselines
        such as Transolver, AdaField, or RANS solvers and by reporting benchmark results,
        though several top papers lack explicit limitations or reproducible artifacts.
      what_remains_open: Conclusion stability across implementations, compute budgets,
        and dataset splits is not established; missing code, datasets, and citation
        metadata are verification gaps rather than proof of absence.
    consensus:
    - High-fidelity aerodynamic surrogate benchmarking centers on flow-field prediction
      and force/error metrics across recognized datasets such as AirfRANS, Emmi-Wing,
      DrivAerNet++, and SHIFT-Truck.
    - 'Strong in-distribution accuracy does not guarantee generalization: operating-point,
      surface-discretization, and cross-vehicle shifts reveal substantial performance
      degradation.'
    - Methods are judged against the strongest available baselines, with relative
      L2/MSE and rank-correlation metrics used to separate aggregate field error from
      downstream force utility.
    - Aerodynamic surrogate research increasingly treats solver-coupled correction
      or terminal numerical convergence as a reliability mechanism instead of relying
      only on standalone neural outputs.
    disagreements:
    - 'Inductive bias differs: flow-state attention partitions geometry-flow interactions;
      domain-decomposed routing dispatches regions to specialized decoders; agentic
      triple decomposition separates rotation, shear, and strain; solver-coupled surrogates
      delegate final accuracy to Newton-Krylov correction.'
    - 'Evaluation focus differs: some emphasize velocity or surface-pressure field
      error, some emphasize drag rank correlation and force prediction, some emphasize
      shock capture and scalability, and some emphasize optimization speed and reliability.'
    - 'Dataset strategy differs: one line introduces a new high-fidelity truck dataset
      with controlled shifts; another reuses established benchmarks such as AirfRANS
      and Emmi-Wing; another extends to industrial 3D aircraft or flying-wing configurations
      without a new public benchmark.'
    - 'Cost and reproducibility treatment is inconsistent: some work reports computational
      cost but not code, while others provide no explicit limitations or reproducibility
      signals, making architecture conclusions difficult to compare.'
    open_questions:
    - Which reported error reductions translate to better aerodynamic design, optimization,
      or certification decisions beyond aggregate field metrics?
    - Can a common stress-test suite cover operating point, tessellation, vehicle
      class, and solver-coupled settings without favoring a single architecture family?
    - Do conclusions about Transolver-class or domain-routed surrogates remain stable
      across implementation details, compute budgets, and random seeds when code and
      data are unavailable?
    - Does agentic physics discovery from canonical and periodic-hill turbulence transfer
      to full airframe or high-Reynolds-number engineering flows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建高保真的共享任务与数据集，使气动代理模型在不同几何、车型和流况下可比较。
      尚未覆盖: 任务分布是否覆盖代理模型预期发挥作用的运行点、网格离散和车型变体；新建数据表明分布内强模型仍可能在偏移下退化。
    - 路线: 指标与压力测试设计
      解决的问题: 在总场误差之外，通过阻力秩相关、残差 L2 比值、激波捕捉、可扩展性、数据稀缺和分布偏移鲁棒性来检验决策效用。
      尚未覆盖: 代理指标与下游气动设计或优化选择的一致性仍多为推断，缺少统一的压力测试标准与真实决策验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过与 Transolver、AdaField、RANS 求解器等强基线比较并给出基准结果，使结论更可审计；但部分高排名论文缺少明确局限性或可复现工件。
      尚未覆盖: 结论在不同实现、算力预算和数据划分下是否稳定仍未知；代码、数据集与引用元数据缺失属于证据缺口。
    共识:
    - 高保真气动代理基准评测集中在流场预测和力/误差指标上，常用 AirfRANS、Emmi-Wing、DrivAerNet++、SHIFT-Truck 等数据集。
    - 分布内高精度不保证泛化：运行点、表面离散化和跨车型偏移会带来显著性能退化。
    - 研究通常与最强可用基线比较，并用相对 L2/MSE 与秩相关指标区分总场误差和下游力预测效用。
    - 气动代理工作越来越多将求解器耦合或终端数值收敛作为可靠性手段，而不是仅依赖独立神经输出。
    分歧:
    - 归纳偏好不同：流态注意力划分几何-流动交互；域分解路由把区域分派给专用解码器；智能体三分解分离旋转、剪切和应变；求解器耦合代理把最终精度交给 Newton-Krylov
      校正。
    - 评测目标不同：有的侧重速度或表面压力场误差，有的侧重阻力秩相关和力预测，有的侧重激波捕捉与扩展性，有的侧重优化速度与可靠性。
    - 数据集策略不同：一条路线新建带受控偏移的皮卡数据集；另一条复用 AirfRANS、Emmi-Wing 等既有基准；还有的扩展到工业 3D 飞机或 flying-wing
      配置而没有新建公开基准。
    - 成本与可复现处理不一致：部分报告了计算成本但未提供代码，部分没有明确局限性或复现信号，使架构结论难以相互比较。
    开放问题:
    - 报告中的误差下降多大程度能转化为更好的气动设计、优化或认证决策，而不仅是聚合场指标提升？
    - 能否建立统一压力测试套件，覆盖运行点、网格离散、车型和求解器耦合场景，同时不偏向单一架构家族？
    - 在代码和数据不可得时，关于 Transolver 类或域路由代理的结论是否在不同实现、算力预算和随机种子上保持稳定？
    - 智能体物理发现从典型构型和 periodic hill 湍流迁移到整机或高雷诺数工程流的能力是否成立？
