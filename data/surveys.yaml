  - 主流方向：2026年可见证据以CFD/气动预测的神经代理与自动化层为主，包括几何条件场预测、流态注意力架构、物理残差审计以及LLM/智能体科学工作流编排。
  - 研究共性：多数工作构建结构化映射或工作流——几何/流动条件、物理残差、本体约束或校准数字孪生——并在仿真或实测数据上以精度、覆盖率或工作流指标配合消融评估。
