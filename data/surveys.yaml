  related_work_outline_zh:
  - 主流方向：高保真气动与CFD代理基准占主导，依托共享数据集和通用基线比较精度、鲁棒性与速度。
  - 研究共性：用标准化任务和误差指标（Relative L2、速度场MSE、力MSE、秩相关、残差下降）配合受控分布偏移压力测试。
  - 关键差异：工作分为数据集构建、架构评测、物理指标诊断、求解器耦合校正和LLM智能体流场分析；评测目标与泛化设定不同。
  - 趋势演进：证据年份集中于2026前沿，趋势从精度排行转向分布偏移鲁棒性、求解器收敛校正和物理一致性。
