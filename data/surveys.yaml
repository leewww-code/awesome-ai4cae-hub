    - line: High-fidelity benchmark and dataset engineering
      what_it_solves: Standardized evaluation of surrogate architectures under controlled
        distribution shifts such as operating point, tessellation, and cross-vehicle
        transfer.
      what_remains_open: Robustness varies by architecture and no uniform surrogate
