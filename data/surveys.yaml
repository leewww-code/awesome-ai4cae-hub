      or automated physical discovery.'
    - Representation choices differ, including point-cloud flow-state attention, spectral
      geometry encoding, Mixture-of-Experts Neural Operator, and graph or operator
      architectures.
    - 'Supervision and interaction modes differ: static supervised learning, closed-loop
      CFD feedback during optimization, and LLM multi-agent reasoning.'
    - Benchmark priorities differ, including dataset scale, controlled distribution
      shift, physics-grounded interventions, and cross-vehicle prototype coverage.
    - Accuracy-versus-computational-cost trade-offs are not consistent; some higher-accuracy
      methods incur higher computational cost.
    open_questions:
    - How can surrogate systems remain reliable under unseen vehicle, mesh, and operating-condition
      shifts without retraining or solver correction?
    - What physical diagnostics and intervention tests can close the gap between benchmark
      scores and physically important flow statistics?
    - What is the minimal solver or CFD feedback needed to certify aerodynamic optimization
      results while retaining speed gains?
    - How can agent-driven analysis frameworks be independently reproduced and audited
      across teams, datasets, and infrastructure environments?
    - Do existing dataset and artifact claims provide enough evidence for independent
      reproduction, and which verification steps are missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 神经气动代理与设计优化流水线
      解决的问题: 学习几何和工况到流场或气动量的映射，降低 CFD 成本并支撑参数化形状设计与优化。
      尚未覆盖: 在外部部署、硬件变化和工业 CAD/求解器工具链中的可靠性仍然缺乏证据。
    - 路线: 物理耦合与求解器在环校正框架
      解决的问题: 用神经代理初始化或不确定性触发的物理反馈结合数值求解器，提升收敛可靠性和优化可信度。
      尚未覆盖: 速度、保真度、可控性和系统复杂度之间的权衡，以及跨几何和三维配置的泛化仍不明确。
    - 路线: 智能体驱动的自动化流动分析工具链
      解决的问题: 结合 LLM 智能体与分解模块，自动完成流场分析、物理发现、一致性审查和模型建议。
      尚未覆盖: 独立复现、审计性、守卫机制和外部部署证据尚未建立。
    - 路线: 高保真基准与数据集评测套件
      解决的问题: 用受控数据集、基线和分布偏移标准化代理模型评测，暴露泛化失败。
      尚未覆盖: 车辆类别和任务覆盖有限；不同架构的鲁棒性未统一；工件复现仍是验证缺口。
    - 路线: 面向代理模型的物理基础诊断
      解决的问题: 用输入干预和压力测试检验基准误差提升是否对应物理上重要的流动统计量。
      尚未覆盖: 结果依赖单一基准；干预掩码未按能量匹配；因果物理正确性尚未确定。
    共识:
    - 学习式气动代理能提供相对传统 CFD 的数量级加速，并可捕捉重要气动趋势或流场特征。
    - 当前评测普遍依赖数据集、基线和误差指标，分布内性能强但不足以证明泛化。
    - 运行工况、网格离散化和跨车型几何等分布偏移会显著暴露模型脆弱性。
    - 将代理模型与物理约束、不确定性触发或求解器反馈结合，可提高在线可靠性和优化可信度。
    - 若干论文的代码、数据和工件信号不完整或仅间接可见，独立复现应视为验证缺口。
    分歧:
    - 纯代理预测、求解器耦合校正和智能体分析解决不同问题，评测目标分别为流场误差、数值收敛或自动化物理发现。
    - 表示方式存在差异，如点云流状态注意力、谱几何编码、Mixture-of-Experts Neural Operator 和图或算子架构。
    - 监督和交互模式不同：静态监督学习、优化闭环中的 CFD 反馈、LLM 多智能体推理。
    - 基准重点不同：数据集规模、受控分布偏移、物理干预诊断和跨车辆原型覆盖各有侧重。
    - 计算成本与精度之间的取舍不一致，部分高精度方法计算成本更高。
    开放问题:
    - 在未见车型、网格和运行工况偏移下，代理系统不依赖重新训练或求解器校正还能保持可靠吗？
    - 哪些物理诊断和干预测试能够缩小基准分数与物理上重要流动统计量之间的差距？
    - 维持气动优化结果可信所需的最少求解器或 CFD 反馈边界是什么？
    - 智能体分析框架如何在不同团队、数据集和基础设施环境中被独立复现与审计？
    - 现有数据集和工件声明是否足以支撑独立复现，还缺少哪些验证步骤？
