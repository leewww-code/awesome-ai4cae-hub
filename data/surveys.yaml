  related_work_outline_zh:
  - 主流方向：当前证据集中在面向气动/CFD 预测的神经代理模型，以及面向科学分析的 LLM 智能体与工具编排，强调几何/流动条件化、物理约束和信任校准。
  - 研究共性：方法通常把表示、执行/预测和验证分离；以几何或流动状态为条件，并用基准、物理残差或消融来隔离方法贡献。
  - 关键差异：光谱/注意力/图算子直接预测物理场；LLM 智能体与确定性工具协同完成分析；自审计方法评估模型信任。评测目标涵盖 REL-L2、加速比、校准和 COST
    732 验收。
  - 趋势演进：证据高度集中在 2026 年，处于当前前沿内部，趋势是从单一精度代理走向智能体编排和自审计可靠性层。
  - 开放问题：跨出二维亚音速 NACA 类几何、工业/城市设置的泛化，物理残差能否用于纠错，以及代码、数据集和工件等可复现性缺口仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Neural surrogate and operator learning for aerodynamic/CFD prediction
      what_it_solves: Encodes geometry/flow conditions into learned mappings from
        shape or point clouds to pressure/velocity fields, aiming for CFD speedups
        and benchmark accuracy.
      what_remains_open: Generalization beyond steady, incompressible, 2D NACA-like
        or specific 3D configurations; computational cost and correction mechanisms
        remain open.
    - line: LLM-agent and tool-orchestration methods for scientific analysis
      what_it_solves: Separates intent interpretation, deterministic domain tools,
        and explanation or physical decomposition to automate analysis workflows and
        reduce tool-call or pipeline errors.
      what_remains_open: Strategic reasoning errors persist; ontology benefits depend
        on scoped retrieval, and demonstrated domains are narrow, leaving cross-domain
        evidence incomplete.
    - line: Self-auditing and method-evidence protocols
      what_it_solves: Builds trust layers or benchmark protocols that isolate architecture
        contributions, flag worst cases, and test physics residuals as reliability
        signals.
      what_remains_open: Physics residuals flag errors but do not yet correct them;
        missing code/limitation details and dataset-specific evaluations leave evidence
        gaps.
    consensus:
    - Flow-field surrogates share a common goal of replacing expensive CFD with learned
      geometry-to-field mappings, using conditioning to encode shape and operating
      conditions.
    - Physics knowledge appears as constraints, residuals, or deterministic decomposition
      modules rather than only as loss terms.
    - Evaluation is benchmark-centric; relative field error and speedup are common,
      with newer work adding trust, coverage, or acceptance criteria.
    disagreements:
    - 'Representation: point-cloud flow-state attention partitions geometry into states,
      spectral encoders use contour/camber/thickness spectra, and operator benchmarks
      compare graph/attention architectures.'
    - 'Supervision/objective: direct field-error supervision dominates some surrogates,
      while self-auditing work treats physics residuals as trust signals and shows
      they do not serve as correction objectives.'
    - 'Interaction mode: methods differ between end-to-end neural inference and LLM-mediated
      multi-agent/tool workflows, with different failure modes and deployment assumptions.'
    - 'Evaluation target: REL-L2 on benchmarks such as Emmi-Wing and DrivAerNet++
      contrasts with AUROC/coverage calibration and COST 732 criteria for urban CFD
      validation.'
    - 'Deployment scope: evidence spans 2D airfoil, 3D aircraft, urban buildings,
      and periodic-hill flows, so conclusions are tied to specific flow regimes and
      geometries.'
    open_questions:
    - Can surrogate accuracy demonstrated on NACA 4-digit and 2D subsonic airfoils
      transfer to unseen non-NACA, transonic, or industrial 3D configurations?
    - What evidence would show LLM-agent orchestration generalizes across more than
      two domains and without scoped retrieval of ontology facts?
    - How can physics residuals or learned correctors be turned into actionable correction
      mechanisms when residual reduction alone does not reduce field error?
    - Are the accuracy gains of flow-state attention or multi-agent decomposition
      worth the higher computational or orchestration cost in deployment?
    - Which missing artifacts—code, datasets, baseline configurations, or limitation
      reports—limit independent replication of the 2026 method claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向气动/CFD 预测的神经代理与算子学习
      解决的问题: 将几何或流动条件编码为从外形/点云到压力/速度场的学习映射，以换取 CFD 加速和基准精度。
      尚未覆盖: 超出稳态、不可压缩、二维 NACA 类或特定三维构型的泛化、计算成本和误差修正机制仍开放。
    - 路线: 面向科学分析的 LLM 智能体与工具编排方法
      解决的问题: 分离意图解释、确定性领域工具执行和解释或物理分解，自动化分析流程并减少工具调用/流水线错误。
      尚未覆盖: 策略性推理错误仍存在；本体收益依赖限定范围检索；已展示领域较窄，跨域证据不完整。
    - 路线: 自审计与方法证据协议
      解决的问题: 建立信任层或基准协议，隔离架构贡献、标记最差案例，并检验物理残差作为可靠性信号。
      尚未覆盖: 物理残差能标记错误但尚不能修正错误；缺少代码/局限细节和数据集特异性评估，证据存在缺口。
    共识:
    - 流场代理方法共享用学习几何到场的映射替代昂贵 CFD 的目标，并通过条件化编码外形和运行条件。
    - 物理知识以约束、残差或确定性分解模块出现，而不仅作为损失项。
    - 评测以基准为中心，相对场误差和加速比常见，较新工作加入信任、覆盖率或验收准则。
    分歧:
    - 表示方式：点云流态注意力将几何划分为多个状态，谱编码器使用轮廓/弯度/厚度谱，算子基准比较图/注意力架构。
    - 监督信号：一些方法直接监督场误差，自审计工作则把物理残差作为信任信号，并显示其不能作为修正目标。
    - 交互模式：端到端神经推理与 LLM 中介的多智能体/工具工作流存在差异，带来不同失败模式和部署假设。
    - 评测目标：Emmi-Wing 和 DrivAerNet++ 等基准上的 REL-L2 与 AUROC/覆盖校准、COST 732 验收标准形成对比。
    - 部署范围：证据涉及二维翼型、三维飞机、城市建筑和周期山流，结论绑定于特定流态与几何。
    开放问题:
    - 在 NACA 4-digit 和二维亚音速翼型上展示的代理精度能否迁移到未见非 NACA、跨音速或工业三维构型？
    - 哪些证据能证明 LLM 智能体编排能在超过两个领域且无需限定范围本体检索时泛化？
    - 当降低物理残差并不能减少场误差时，物理残差或学习校正器如何转化为可操作的纠错机制？
    - 流态注意力或多智能体分解带来的精度提升是否值得其更高的计算或编排成本？
    - 哪些缺失工件——代码、数据集、基线配置或局限报告——限制了对 2026 年方法主张的独立复现？
