      shifts in operating point, surface discretization, and vehicle class?
    - Can point-cloud or flow-state attention methods reduce computational cost while
      retaining the reported accuracy gains?
    - Are agentic physics-analysis frameworks reproducible across institutions and
      compatible with existing industrial solver and data pipelines?
    - What is the external validity of shape-optimization results beyond in-house
      MPV, SUV, and Sedan datasets?
    - Which verification gaps remain from missing code, dataset, baseline, and limitation
      details in the evidence packet?
