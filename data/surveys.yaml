      what_remains_open: Validation is limited to five benchmarks and one periodic
        hill end-to-end case; broader flow regimes and independent artifact verification
        remain open.
    - line: Geometry-conditioned surrogate serving for fast field prediction (e.g.,
        Airfoil2Vec, FSAN)
      what_it_solves: Provides rapid pressure and velocity inference from geometry
