      of engineering analysis or design systems.
    - CFD or simulation data is the dominant supervision source, with growing attention
      to generalization beyond training geometries and operating conditions.
    - Evaluation is broadening from aggregate prediction error toward robustness,
      solver coupling, distribution shifts, and physical diagnostics.
    - The available evidence lacks consistent cross-team reproduction and code/artifact
      availability, so deployment readiness is a verification gap.
