    - 路线: 几何条件化的气动场代理建模
      解决的问题: 编码翼型或机翼几何，预测连续压力/速度或表面压力场及气动量，以降低CFD/RANS评估时间。
      尚未覆盖: 现有证据限于稳态、不可压缩、二维或NACA类几何；向非稳态、可压缩、三维工业外形的迁移仍未验证。
    - 路线: 算子学习架构评测与扩展性
      解决的问题: 在气动表面压力任务上评测神经算子/Transformer架构，衡量激波/间断捕捉、大规模网格点扩展性与数据稀缺表现。
      尚未覆盖: 架构结论来自特定二维翼型和单一三维飞机构型；更多构型与数据预算下的稳健性未建立。
    - 路线: 无数据物理信息流场求解
      解决的问题: 利用物理信息神经网络在无外部流场数据情况下求解稳态Navier-Stokes基准问题，覆盖低至高雷诺数。
      尚未覆盖: 数据包中缺少方法、基线与局限性细节，工程几何、湍流和可复现性仍是验证缺口。
    - 路线: 领域专用流场数据集与基准
      解决的问题: 构建大规模气动或湍流尾流数据集，支持监督式学习与流场代理模型的标准化评测。
      尚未覆盖: 可获取性、代码/工件信号及与真实工程结果的联系不完整；数据集覆盖范围仍未知。
    - 路线: 工程设计空间与流固振动应用
      解决的问题: 生成概念性船舶内部布置以探索设计空间，或通过CFD/FSI评估共振器对风力机翼型涡激振动的影响。
      尚未覆盖: 船舶生成在六类船族中展示；现实质量比下共振器仅带来小幅减振，工程可行性仍未解决。
    共识:
    - 学习代理模型被视为CFD/RANS加速器，并以精度与速度权衡为核心评价，而不是单独验证物理机制。
    - 几何和流动条件编码是气动预测的共有机制，泛化测试通常覆盖未见几何或气动系数。
    - 基准类研究普遍把激波/间断捕捉、海量网格点可扩展性与数据稀缺作为关键评测维度。
    - 领域专用数据集被视为重要支撑，但代码、数据与局限性报告的证据不均衡。
    分歧:
