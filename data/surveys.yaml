  - 趋势演进：可见高分论文集中于 2026 年，趋势仅在当前前沿内可辨：更强领域锚定、智能体自动化与基准驱动架构比较；更早年份未被本批证据展示。
  - 开放问题：稳态亚音速气动之外的泛化、方法贡献与基准/工具效应的隔离、注意力模型计算权衡，以及稀疏证据方法的复现缺口。
  literature_review:
    line_of_work_matrix:
    - line: Geometry- and flow-conditioned neural surrogates
      what_it_solves: Learning fast mappings from geometry or flow conditions to continuous
        aerodynamic fields; examples include Airfoil2Vec spectral geometry conditioning,
        FSAN flow-state attention, and an operator-learning architecture evaluation.
      what_remains_open: Visible successes are mainly for steady subsonic or incompressible
        airfoil/aircraft cases; generalization to compressible, unsteady, or non-aerodynamic
        regimes and accuracy-cost tradeoffs remain open.
    - line: Physics-informed and structured parameterization methods
      what_it_solves: Injects stochastic, separable, or physics-specific structure
        into neural PDE solvers; the only visible example is S$^{2}$-PINN, whose evidence
        is title-level in this packet.
      what_remains_open: No visible abstract, experiments, baselines, metrics, or
        limitations are provided, so its contribution and transferability cannot be
        assessed from this evidence.
    - line: LLM-agent and domain-grounded orchestration
      what_it_solves: Automates scientific analysis by decomposing intent, deterministic
        tool execution, explanation, or physics discovery; examples include domain-grounded
        tool orchestration and PhysMiner triple-decomposition agents.
      what_remains_open: Strategic errors remain, ontology benefit is conditional
        on scoped retrieval, and visible validation is limited to two domains or five
        benchmarks; PhysMiner limitations and broader generality are not established.
    - line: Method evaluation and adaptation benchmarks
      what_it_solves: Compares operator-learning architectures for aerodynamic prediction
        and assesses physics adaptation under code-evolution or dynamic settings;
        examples include PACE-Bench and an architecture evaluation.
      what_remains_open: Visible evidence is sparse for PACE-Bench and explicit limitations
        are absent for the architecture evaluation; metric isolation, reproducibility
        artifacts, and transferability are unverified.
    consensus:
    - Where method details are visible, contributions combine domain-specific structure
      with learned components rather than relying only on generic end-to-end predictors.
    - The evidence pattern favors ablation or controlled benchmark comparison to demonstrate
      method effect.
    - Aerodynamic surrogate modeling and scientific analysis workflows are the main
      current application areas, with speedup or automation as goals.
    - Multiple works treat domain priors as constraints or corrective mechanisms rather
      than as post-hoc labels.
    disagreements:
    - 'Representation differs: continuous spectral or flow-state neural representations
      versus ontology/tool graphs versus decomposition-based LLM-agent pipelines.'
    - 'Evaluation target differs: field-level aerodynamic error versus LLM interpretation/tool-selection
      accuracy versus turbulence modeling recommendation versus cross-architecture
      benchmark ranking.'
    - 'Deployment interaction differs: neural surrogates for high-speed inference
      versus agent/tool systems requiring deterministic tools and LLM reasoning.'
    - 'Cost/accuracy tradeoff differs: some methods report accuracy gains with higher
      compute, while others emphasize orders-of-magnitude CFD acceleration.'
    open_questions:
    - Can aerodynamic surrogate conclusions transfer beyond steady, subsonic, mostly
      NACA 4-digit or automotive airfoil regimes?
    - Does ontology/tool grounding generalize beyond the two reported domains and
      does scoped retrieval remain necessary outside CFD/topology workflows?
    - How much of the reported gain is attributable to the proposed architecture rather
      than dataset size, base model, training protocol, or tool wrapper quality?
    - Can flow-state attention or agentic reasoning maintain accuracy under compute
      constraints or production-scale deployments?
    - What would be learned by filling missing limitation and reproducibility information
      for S$^{2}$-PINN, PACE-Bench, PhysMiner, and other sparse-evidence entries?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何与流动条件驱动的神经代理方法
      解决的问题: 学习从几何/流动条件到连续气动场的快速映射；如 Airfoil2Vec 的谱几何条件、FSAN 的流状态注意力，以及算子学习架构比较。
      尚未覆盖: 可见成功主要限于稳态亚音速或不可压缩翼型/飞行器案例；可压缩、非定常或非气动场景的泛化与精度-成本权衡仍未解决。
    - 路线: 物理信息与结构化参数化方法
      解决的问题: 将随机、可分离或物理特定结构注入神经 PDE 求解器；唯一可见示例是 S$^{2}$-PINN，本数据包中仅为标题级证据。
      尚未覆盖: 缺少可见的摘要、实验、基线、指标与局限，因此无法从本证据评估其贡献和可迁移性。
    - 路线: LLM 智能体与领域锚定的编排方法
      解决的问题: 将意图理解、确定性工具执行、解释或物理发现分离并自动化；示例包括领域锚定工具编排和 PhysMiner 三重分解智能体。
      尚未覆盖: 策略性错误仍存在；本体收益依赖 scoped retrieval；可见验证限于两个领域或五个基准；PhysMiner 局限与更广泛通用性未确立。
    - 路线: 方法评估与适应性基准
      解决的问题: 比较面向气动预测的算子学习架构，并评估动态环境下通过代码演化进行物理适应；示例包括 PACE-Bench 与架构评估。
      尚未覆盖: PACE-Bench 可见证据稀疏，架构评估未给出明确局限；指标隔离、复现工件与迁移性仍待验证。
    共识:
    - 在方法细节可见的工作中，方法将领域特定结构与学习组件结合，而非仅依赖通用端到端预测器。
    - 证据模式倾向于通过消融或受控基准比较来证明方法效果。
    - 当前主流应用集中在气动代理建模与科学分析工作流，目标多为传统 CFD 加速或分析自动化。
    - 多个工作将领域先验作为约束或纠正机制，而不是事后标签。
    分歧:
    - 表示方式不同：连续谱或流状态神经表示、本体/工具图、基于分解与推理的 LLM 智能体流水线。
    - 评测目标不同：场级气动误差、LLM 解释/工具选择准确率、湍流建模建议、跨架构基准排名。
    - 部署交互不同：面向快速推理的神经代理，对比需要确定性工具和 LLM 推理的智能体系统。
    - 成本/精度权衡不同：部分方法报告精度提升但计算成本更高，部分工作强调相对于传统 CFD 的数量级加速。
    开放问题:
    - 气动代理结论能否从稳态、亚音速、以 NACA 4-digit/汽车翼型为主的场景迁移到更广泛物理场景？
    - 本体/工具 grounding 能否在两个报告领域之外泛化，scoped retrieval 是否始终必要？
    - 报告提升中有多少来自所提出的架构，而非数据集规模、基础模型、训练协议或工具封装质量？
    - 流状态注意力或智能体推理能否在计算受限或生产规模部署下保持精度？
    - 填补 S$^{2}$-PINN、PACE-Bench、PhysMiner 等条目的局限与复现信息会如何改变结论？
