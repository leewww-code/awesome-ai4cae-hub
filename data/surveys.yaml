  related_work_outline_zh:
  - 主流方向：以气动与流体问题为核心，构建几何/流动条件化的神经代理模型，并将LLM智能体或领域知识集成到分析工作流。
  - 研究共性：用结构化表示，如谱几何、流态分配、三重分解、本体或RANS变量，约束学习过程，并与确定性工具或物理结构结合以提升精度、稳定性或可解释性。
  - 关键差异：表示层级与交互模式不同；评测目标覆盖场误差、工具解释准确率、湍流建模建议、测量验证和架构对比；部署场景从二维稳态翼型到三维、非定常及城市环境。
  - 趋势演进：证据集中于2026年，属于当前前沿，难以观察年度跨度；可见从单一代理精度转向物理、工具或智能体协同的混合架构设计。
  - 开放问题：跨几何与流态泛化、模型与规划器或工具先验的收益归因、本体编排规模化、缺失的量化与复现证据边界仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Aerodynamic surrogate model architectures
      what_it_solves: Fast prediction of pressure, velocity, or surface force fields
        from geometry and flow conditions, replacing or accelerating CFD in aerodynamic
        evaluation.
      what_remains_open: Reported evidence mostly covers steady, incompressible, two-dimensional
        or specific airfoil/aircraft configurations; wider geometric and flow-regime
        generalization remains only partially tested.
    - line: Graph and continuous-time latent dynamics methods
      what_it_solves: Temporal stability and spatial smoothness for unsteady surface
        force prediction with exogenous controls by combining graph operators and
        neural ODE-style latent evolution.
      what_remains_open: Comparison is mainly against limited autoregressive baselines;
        the contribution of augmented latent dimensions, history effects, and surrounding
        system choices is not fully isolated.
    - line: LLM-agent and ontology-grounded orchestration methods
      what_it_solves: Separating intent interpretation, deterministic tool execution,
        and explanation to reduce invalid tool calls, API hallucination, and missing
        pipeline stages in scientific analysis.
      what_remains_open: Strategic errors remain; the ontology benefit is conditional
        on scoped retrieval and is demonstrated in only two domains.
    - line: Physics-grounded modeling and measurement-validated CFD design frameworks
      what_it_solves: Urban wind-energy siting and transition prediction through measurement-calibrated
        RANS or by repurposing an existing RANS working variable as a transition indicator.
      what_remains_open: Spatial error detail, transition-specific quantitative metrics,
        and generalization beyond the reported urban blocks or validation cases are
        not established.
    - line: Benchmarking and ablation evidence protocols for surrogate methods
      what_it_solves: Comparing architecture behavior on shock capture, scalability,
        and data scarcity, and using ablations to separate method contribution from
        tool or retrieval choices.
      what_remains_open: Several works omit explicit limitations or quantitative metrics,
        and code/data/artifact reproducibility signals are inconsistent across the
        packet.
    consensus:
    - Learned models are increasingly combined with structured domain information
      such as spectral geometry, flow-state assignment, triple decomposition, ontology
      constraints, or RANS closure structure.
    - Aerodynamic and fluid prediction is the dominant evaluation arena, with success
      measured through field error, speedup, physical plausibility, or validation
      acceptance.
    - Most works report improvement over one or more baselines on specific cases,
      but not all provide quantitative metrics, explicit limitations, or reproducible
      artifacts.
    - Hybrid execution, whether neural surrogate plus physical variable or LLM plus
      deterministic tools, is used to reduce failure modes and improve stability.
    disagreements:
    - 'Representation choice differs: spectral geometry encoding versus learnable
      point-cloud flow states versus graph neural ODE versus LLM/tool ontology versus
      modified RANS transition closure.'
    - 'Evaluation targets differ: aerodynamic field error, tool interpretation accuracy,
      turbulence model recommendation, measurement validation, or architecture comparison.'
    - 'Deployment regimes differ: steady two-dimensional airfoils, three-dimensional
      industrial aircraft, unsteady pitching transonic airfoils, dense urban buildings,
      and transition validation cases.'
    - The accuracy-cost tradeoff is unresolved, with some methods reporting orders-of-magnitude
      speedups while another reports higher computational cost for improved accuracy.
    open_questions:
    - Do the reported surrogates transfer beyond evaluated geometries and flow regimes,
      such as unseen non-NACA shapes, compressible flows, or non-aerodynamic configurations?
    - How much of each gain is attributable to the proposed representation or decomposition
      versus the surrounding model, planner, baseline, retrieval, or training setup?
    - Can LLM-agent design reduce strategic errors without scoped ontology retrieval,
      and does it scale beyond two scientific domains?
    - Which missing quantitative transition metrics, absent limitation statements,
      and absent code/data artifacts are most material to reproducibility and comparison?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 气动代理模型架构
      解决的问题: 从几何与流动条件快速预测压力、速度或表面力，替代或加速CFD。
      尚未覆盖: 证据主要覆盖稳态、不可压缩、二维或特定翼型与飞机构型；更广泛几何与流态的泛化未充分验证。
    - 路线: 图与连续时间潜变量动力学方法
      解决的问题: 在图算子与神经ODE式潜变量演化中提升非定常表面力预测的时间稳定性与空间平滑性，并处理外生控制。
      尚未覆盖: 主要与有限的自回归基线比较；增广潜维度、历史效应与周边系统选择的贡献未完全隔离。
    - 路线: LLM智能体与本体约束的工作流编排
      解决的问题: 分离意图解释、确定性工具执行与解释，减少无效工具调用、API幻觉和流水线缺失阶段。
      尚未覆盖: 策略性错误仍然存在；本体收益依赖限定范围检索，且仅在两个领域得到验证。
    - 路线: 物理接地建模与测量验证的CFD设计框架
      解决的问题: 通过测量校准的RANS或改写现有RANS工作变量作为转捩指示，改进城市风能选址与转捩预测。
      尚未覆盖: 空间误差细节、转捩量化指标以及报告街区或验证案例之外的迁移证据尚未建立。
    - 路线: 代理方法的基准与消融证据协议
      解决的问题: 比较架构在激波捕捉、可扩展性和数据稀缺下的表现，并通过消融区分方法贡献与工具或检索选择。
      尚未覆盖: 若干工作未给出显式局限或量化结果，代码、数据与工件的复现信号在整个证据包中不一致。
    共识:
    - 学习模型普遍与结构化领域信息结合，如谱几何、流态分配、三重分解、本体约束或RANS闭包结构。
    - 气动与流体预测是主要评测场景，成功标准包括场误差、加速比、物理合理性或验证接受度。
    - 多数工作报告相对特定基线的提升，但并非都给出量化指标、显式局限或可复现工件。
    - 混合执行，无论是神经代理与物理变量，还是LLM与确定性工具，都被用于降低失败模式或提升稳定性。
    分歧:
    - 表示选择不同：谱几何编码、可学习点云流态、图神经ODE、LLM/工具本体、修改后的RANS转捩闭包。
    - 评测目标不同：气动场误差、工具解释准确率、湍流建模建议、测量验证或架构对比。
    - 部署流态不同：二维稳态翼型、三维工业飞机、非定常俯仰跨声速翼型、密集城市建筑与转捩验证案例。
    - 精度与代价关系未决：有的方法报告数量级加速，另有方法指出更高精度需要更高计算成本。
    开放问题:
    - 报告中的代理模型能否跨出已评估的几何与流态，如未见非NACA翼型、可压缩流动或非气动构型？
    - 所提表示或分解的收益有多少来自模型本身，多少来自检索、规划器、基线或训练系统选择？
    - LLM智能体方法能否在不依赖限定范围本体检索时减少策略性错误，并扩展到两个以上科学领域？
    - 缺失的转捩量化指标、局限声明与代码/数据工件，哪些最影响复现与比较结论？
