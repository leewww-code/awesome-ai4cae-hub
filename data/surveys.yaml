  - 研究共性：多数工作用学习模型替代或加速昂贵的CFD/RANS评估，学习从几何或边界条件到流场/气动量的映射，并在工程几何上评估精度、速度以及一定程度的泛化或不确定性。
  - 关键差异：监督信号包括CFD/RANS数据、物理残差和低维到高维修正；表示包括谱几何编码、神经场、图/Transformer、高斯过程核和体素图；评测目标覆盖二维翼型、三维飞机、船舶布局、振动和控制。
  - 趋势演进：可用证据集中在2023年和2026年。可观察变化是从2023年的通用算子学习架构，转向2026年的领域专用气动数据集、基准、维度桥接、物理信息求解和工程设计/控制。
