  related_work_outline_zh:
  - 主流方向：可见证据集中于高保真空气动力学代理基准，使用 AirfRANS、DrivAerNet++、Emmi-Wing、SHIFT-Truck 等共享数据集和场/力误差指标。
  - 研究共性：论文引入或复用流场基准，比较多个神经代理模型，再通过分布偏移、物理干预或求解器耦合进行压力测试。
  - 关键差异：差异体现在几何/流场表示、评测目标、交互模式和部署设置，而不是单一方法家族。
  - 趋势演进：可见论文集中于2026年，因此趋势属于当前前沿：从单纯聚合分数基准转向鲁棒性、物理诊断和求解器耦合可靠性证据。
  - 开放问题：基准分数是否与下游气动决策一致，架构排名在分布和离散化偏移下是否稳定，工件是否足以审计仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: High-fidelity aerodynamic dataset and benchmark construction
      what_it_solves: Creates shared geometry-flow pairs from simulation or experiment
        so surrogate predictions can be compared on surface and volume fields.
      what_remains_open: Coverage of operating conditions, vehicle classes, and discretization
        shifts remains limited; artifact availability is uneven.
    - line: Neural surrogate architecture evaluation and comparable baselines
      what_it_solves: Benchmarks operator, graph, point-cloud, and attention models
        on shared aerodynamic tasks, including shock capture, scalability, and data
        scarcity.
      what_remains_open: Rankings may not be stable across implementations, meshes,
        and compute budgets; some comparisons lack explicit limitation or reproducibility
        evidence.
    - line: Metric and physical stress-test design
      what_it_solves: Probes whether aggregate error scores align with force ranking,
        fluctuation energy, and sensitivity to key flow regions.
      what_remains_open: Masks and interventions are not matched for physical quantity,
        so counterfactual physical correctness and downstream alignment remain open.
    - line: Solver-coupled and agentic evaluation workflows
      what_it_solves: Uses surrogate predictions as Newton-Krylov initial guesses
        or automated physical decomposition to assess reliability beyond standalone
        error.
      what_remains_open: Generalization across solvers and turbulence regimes, and
        standardization of agentic decisions, are unresolved.
    consensus:
    - Shared aerodynamic benchmarks dominate as evaluation substrates for neural surrogates
      across field and force targets.
    - Aggregate error metrics such as relative L2/MSE are central, but several studies
      treat them as insufficient without distribution-shift or physical diagnostics.
    - Physical consistency, operating-point generalization, and solver-coupled correction
      are recognized as important evaluation dimensions.
    - 'Reproducibility signals are uneven: some works lack visible code, dataset,
      or artifact links, leaving verification gaps rather than proof of absence.'
    disagreements:
    - 'Geometry-flow representation choices differ: point-cloud/flow-state attention,
      graph and operator models, domain-decomposed routing, and solver-coupled initialization.'
    - Evaluation targets differ across surface pressure, velocity-field MSE, drag/lift
      force and rank correlation, and turbulence component decompositions.
    - Interaction modes differ among standalone surrogate scoring, solver-coupled
      correction, and LLM-agent-driven physical analysis.
    - Deployment settings differ across 2D airfoils, 3D industrial aircraft, pickup
      trucks with open cargo beds, and out-of-distribution operating points.
    - 'Metric-level evidence conflicts: lower velocity-field error can coexist with
      higher fluctuation-energy error or misaligned physical sensitivity.'
    open_questions:
    - Which benchmark composition and metrics best predict downstream aerodynamic
      decision quality under distribution shifts?
    - Are architecture rankings stable across mesh resolution, operating conditions,
      and compute budgets given current reproducibility limitations?
    - How can physical diagnostics and solver-coupled reliability be standardized
      without overfitting to a single flow regime?
    - What artifacts and reporting conventions are needed to audit benchmark conclusions
      across implementations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 高保真空气动力学数据集与基准构建
      解决的问题: 基于仿真或实验创建共享几何-流动配对，使代理模型可在表面和体场上进行比较。
      尚未覆盖: 运行条件、车辆类别和离散化偏移覆盖有限；工件可得性不一致。
    - 路线: 神经代理架构评测与可比基线
      解决的问题: 在共享气动任务上基准评测算子、图、点云和注意力模型，包括激波捕捉、可扩展性和数据稀缺。
      尚未覆盖: 不同实现、网格和算力预算下排名可能不稳定；部分比较缺少明确局限或再生产证据。
    - 路线: 指标与物理压力测试设计
      解决的问题: 检验聚合误差分数是否与力排序、脉动能量和关键流动区域敏感性一致。
      尚未覆盖: 掩码与干预未按物理量匹配，因此反事实物理正确性和下游一致性仍然开放。
    - 路线: 求解器耦合与智能体评估工作流
      解决的问题: 将代理预测作为 Newton-Krylov 初值或自动物理分解，以评估独立误差之外的可靠性。
      尚未覆盖: 跨求解器与湍流状态泛化，以及智能体决策标准化尚未解决。
    共识:
    - 共享空气动力学基准是神经代理模型在场和力预测目标上的主要评估基础。
    - 相对 L2/MSE 等聚合误差指标占主导，但多项研究认为没有分布偏移或物理诊断则不够充分。
    - 物理一致性、运行点泛化和求解器耦合校正被视为重要评估维度。
    - 再生产信号不一致：部分工作缺少可见代码、数据集或工件链接，构成验证缺口而非证据缺失。
    分歧:
    - 几何-流动表示选择不同：点云或流态注意力、图和算子模型、域分解路由、求解器耦合初始化。
    - 评测目标不同：表面压力、速度场 MSE、升阻力与秩相关、湍流分量分解。
    - 交互模式不同：独立代理评分、求解器耦合校正和 LLM 智能体驱动物理分析。
    - 部署设置不同：二维翼型、三维工业飞机、开放式货厢皮卡和分布外运行点。
    - 指标级证据存在冲突：较低速度场误差可能与较高脉动能量误差或物理敏感性不一致同时出现。
    开放问题:
    - 在分布偏移下，哪些基准组成和指标最能预测下游气动决策质量？
    - 在当前再生产限制下，架构排名能否在网格分辨率、运行条件和算力预算变化中保持稳定？
    - 如何在不局限于单一流场状态下标准化物理诊断和求解器耦合可靠性评估？
    - 需要哪些工件与报告规范来跨实现审计基准结论？
