      解决的问题: 将代理预测嵌入CFD或优化回路，以提升可靠性、一致性和设计效率
      尚未覆盖: 内部数据集之外的外部验证、更广泛几何与流动条件以及耦合开销
    - 路线: 基准、数据集与可复现工件
      解决的问题: 提供公开高保真仿真数据和统一评测协议，用于比较代理架构并暴露分布偏移
      尚未覆盖: 跨团队独立复用，以及超出稳态、车辆或翼型流动工况的覆盖
    - 路线: 智能体自动化分析框架
      解决的问题: 自动完成流动分解、物理发现和围绕仿真数据的知识积累
      尚未覆盖: 在所选流动基准之外更广泛工程任务上的可复现性与验证
    - 路线: 基于物理的评测诊断
      解决的问题: 检查学习算子误差是否与具有物理意义的流动统计一致
      尚未覆盖: 基准分数到物理正确性的因果联系；现有证据仅来自单一基准
    共识:
    - 神经代理模型相比CFD能实现显著加速，并能近似气动量。
    - 公开数据集和基准对训练模型、暴露分布偏移下的泛化失败至关重要。
    - 将学习代理与物理或求解器反馈结合可以改善可靠性和设计结果。
    - 评测不应只看聚合误差，还需关注泛化与物理诊断。
    - 强分布内表现被视为不足以支持部署。
