  related_work_outline_zh:
  - 主流方向：以空气动力学与 CFD 工作流为核心，发展几何/流态条件化的神经代理模型，以及面向 LLM 引导分析的 ontology/tool 编排系统。
  - 研究共性：将谱几何、点云流态注意力、物理残差或领域本体等结构信息嵌入模型与流程，并通过基准、消融和对比指标验证方法效果。
  - 关键差异：表示方式分为谱/注意力/算子/agent；监督信号包括数据回归、物理残差、确定性工具和湍流分解；评测目标覆盖表面压力、全流场、风能与解释准确率。
  - 趋势演进：高相关证据集中在 2026 年，趋势处于当前前沿；更强的评测协议、自审计机制、基准驱动选型与 LLM-tool 集成正在形成。
  - 开放问题：能否泛化到跨几何、可压缩/非稳态/三维工业场景；物理残差能否从信任信号变为修正目标；方法贡献与数据/工具封装如何分离；代码、数据集与局限性报告仍不充分。
  literature_review:
    line_of_work_matrix:
    - line: Geometry- and flow-conditioned neural surrogate architectures
      what_it_solves: Learns fast mappings from airfoil or vehicle geometry and flow
        conditions to aerodynamic fields using spectral geometry embeddings, point-cloud
        flow-state attention, neural operators, or neural ODEs, reducing conventional
        CFD cost.
      what_remains_open: Evidence is often limited to steady, incompressible, 2D or
        benchmark-specific configurations; generalization to compressible, unsteady,
        arbitrary geometry, and full production workflows is not established.
    - line: LLM-agent and tool-orchestration methods for scientific analysis
      what_it_solves: Grounds LLM planning in domain ontologies, deterministic domain
        tools, MCP, triple decomposition, and multi-agent review to create valid CFD
        and turbulence analysis chains.
      what_remains_open: Strategic errors still remain after design constraints; benefits
        depend on scoped ontology retrieval and domain-specific wrappers, and only
        a few domains are demonstrated.
    - line: Method evidence, benchmarking, and trust/auditing protocols
      what_it_solves: Separates method contribution through common benchmarks, relative
        error metrics, physics residuals, conformal trust layers, and controlled ablation
        of mechanisms.
      what_remains_open: Missing code, datasets, and limitations are common verification
        gaps; the physics residual is a poor correction objective, and learned-corrector
        gains are not yet attributed to residual conditioning.
    consensus:
    - Recent methods consistently aim to replace or augment expensive CFD loops with
      learned surrogates or agentic workflows that inject geometry, flow-state, or
      domain constraints.
    - Evaluation is becoming more explicit, with benchmark datasets, relative error
      metrics, physics residuals, coverage, and ablation experiments used to compare
      method differences.
    - Structured inductive bias such as geometry conditioning, flow-state attention,
      or ontology constraints tends to improve accuracy or reliability over unstructured
      or global feature injection.
    disagreements:
    - 'Representation differs: spectral geometry embeddings, point-cloud flow-state
      attention, neural operators or Neural ODEs, and ontology-constrained LLM planners.'
    - 'Supervision and objective differ: pure data-driven field regression, physics-residual
      auditing, deterministic tool execution, and turbulence decomposition with LLM
      reasoning.'
    - 'Evaluation target differs: aerodynamic surface pressure, continuous full fields,
      turbulence components, urban wind yield, or tool-orchestration interpretation
      accuracy.'
    - 'Deployment setting differs: benchmark comparisons, production-scale ParaView
      data, and dense urban wind measurement cases.'
    open_questions:
    - Can current surrogate models generalize beyond NACA or downforce-focused airfoils
      and steady/incompressible settings to shock-bearing, unsteady, industrial 3D
      flows?
    - Can physics residuals be turned into effective correction objectives, and can
      the gain from learned correctors be attributed to residual conditioning rather
      than to added model capacity?
    - What shared benchmarks, metrics, artifacts, and limitation-reporting standards
      are needed to fairly compare agentic, operator, and PINN-style methods?
    - How should accuracy improvements be traded against higher computational cost,
      orchestration risk, and reliability requirements in production CFD workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何/流态条件化的神经代理架构
      解决的问题: 利用谱几何嵌入、点云流态注意力、神经算子或 Neural ODE，从翼型或整机几何与流动条件快速预测压力/速度场，降低传统 CFD 计算成本。
      尚未覆盖: 证据多限于稳态、不可压缩、二维或特定基准；对可压缩、非稳态、任意几何和完整生产工作流的泛化尚未建立。
    - 路线: LLM-agent 与工具编排方法
      解决的问题: 通过领域本体、MCP、三重分解和多 agent 推理，把 LLM 规划约束到有效的 CFD 与湍流分析链，并连接确定性领域工具。
      尚未覆盖: 设计约束后仍残留战略性错误；收益依赖限定范围的本体检索和领域封装，且仅在少数领域得到展示。
    - 路线: 方法证据、基准与可信/自审计协议
      解决的问题: 通过统一基准、相对误差、物理残差、共形信任层和受控消融，分离方法贡献并比较架构。
      尚未覆盖: 常见缺失代码、数据集与局限性报告；物理残差不适合作为修正目标，学习修正器的增益尚未归因于残差条件化。
    共识:
    - 近期方法一致趋向于用学习或 agent 化系统替代或加速昂贵 CFD 环节，并注入几何、流态或领域约束。
    - 评测愈发强调基准数据集、相对误差、物理残差、覆盖率和消融实验，显式比较方法差异。
    - 结构化归纳偏置，如几何条件化、流态注意力、本体约束，通常比不注入结构或全局特征更有效。
    分歧:
    - 表示方式不同：谱几何嵌入、点云流态注意力、神经算子/Neural ODE、本体约束 LLM 规划器。
    - 监督信号与目标不同：纯数据回归、物理残差审计、确定性工具执行、湍流分解与 LLM 推理。
    - 评测目标不同：气动表面压力、连续全流场、湍流组分、城市风能潜力或工具编排解释准确率。
    - 部署场景不同：基准评测、生产级 ParaView 数据规模、真实密集城区风场测量。
    开放问题:
    - 现有代理模型能否从 NACA 或下压力翼型与稳态/不可压缩设置泛化到带激波、非稳态、工业 3D 流动？
    - 物理残差能否被改造为有效修正目标，并澄清学习修正器的增益是否真正来自残差条件化？
    - 在 agent、算子与 PINN 等不同路线之间，需要哪些统一基准、指标、artifacts 和局限性报告标准才能公平比较？
    - 如何量化精度提升与更高计算成本、编排风险和可靠性要求之间的权衡？
