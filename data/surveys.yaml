  related_work_outline_zh:
  - 主流方向：物理信息神经代理与 LLM/智能体驱动的科学工作流占据主导，尤其集中于气动流场预测与自动化分析。
  - 研究共性：神经代理与智能体方法都注入领域先验，如几何条件、流态结构、本体约束或物理分解，并通过消融或基准验证。
