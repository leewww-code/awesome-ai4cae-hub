  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates
      what_it_solves: Encode airfoil or wing geometry to predict continuous pressure,
        velocity, or surface pressure fields and aerodynamic quantities, reducing
        CFD/RANS evaluation time.
      what_remains_open: Current evidence is bounded by steady, incompressible, subsonic,
        or 2D regimes and NACA-like geometries; transfer to unsteady, compressible,
        viscous 3D industrial shapes remains unverified.
    - line: Operator learning architecture evaluation and scaling
      what_it_solves: Benchmark neural operator/transformer architectures on aerodynamic
        surface pressure tasks, measuring shock/discontinuity capture, scalability
        to large grid point counts, and data-scarce performance.
      what_remains_open: Architecture conclusions are based on particular 2D airfoil
        and one 3D aircraft setting; robustness across more configurations and deployment
        data budgets is not established.
    - line: Data-free physics-informed flow solvers
      what_it_solves: Use physics-informed neural networks to solve steady Navier-Stokes
        benchmark problems without external flow data, across low to high Reynolds
        numbers.
      what_remains_open: Methodology, baselines, and limitations are not visible in
        the packet, so engineering geometry, turbulence, and reproducibility remain
        verification gaps.
    - line: Domain-specific flow datasets and benchmarks
      what_it_solves: Create large-scale aerodynamic or turbulent wake datasets to
        support supervised learning and standardized evaluation of flow surrogates.
      what_remains_open: Accessibility, code/artifact signals, and linkage to real
        engineering outcomes are incomplete; dataset coverage beyond the reported
        regimes is unknown.
    - line: Engineering design-space and fluid-structure vibration applications
      what_it_solves: Generate conceptual ship internal arrangements for design exploration
        or assess resonator effects on wind turbine airfoil vortex-induced vibrations
        via CFD/FSI.
      what_remains_open: Ship generation is demonstrated across six vessel families;
        realistic resonator mass ratios yield only small vibration reductions, leaving
        practical viability unresolved.
    consensus:
    - Learned surrogates are framed as CFD/RANS accelerators, evaluated through accuracy-speed
      trade-offs rather than standalone physics claims.
    - Geometry and flow-condition encoding is the common mechanism for aerodynamic
      prediction, with generalization tests covering unseen shapes or coefficients.
    - Benchmark-style studies emphasize shock/discontinuity capture, scalability to
      many grid points, and data scarcity as central evaluation criteria.
    - Domain-specific datasets are treated as enablers, but evidence of public code/data
      and limitation reporting is uneven.
    disagreements:
    - 'Supervision differs: most work uses CFD/RANS-generated data, while one line
      is data-free physics-informed Navier-Stokes solving and another uses Gaussian-process
      corrections across 2D-to-3D fidelity.'
    - 'Representations differ: spectral geometry conditioning, graph/transformer operator
      architectures, neural fields/ODEs, and probabilistic kernel regression are used
      in different papers.'
    - 'Evaluation targets differ: some target detailed pressure/velocity fields, others
      aerodynamic coefficients, turbulent wake datasets, wind turbine vibration, or
      ship internal arrangements.'
    - 'Generalization scope differs: some restrict claims to NACA 4-digit or 2D airfoils,
      while others test unseen non-NACA geometries or 3D aircraft configurations.'
    - Deployment orientation differs between fast surrogate predictions for CFD replacement,
      uncertainty-aware adaptive sampling, and design-space exploration or vibration
      mitigation.
    open_questions:
    - Do gains in 2D or NACA-specific airfoil surrogates transfer to unsteady, compressible,
      3D industrial wing/vehicle configurations?
    - What is the minimum evidence needed for code, dataset, baseline, and limitation
      reporting to verify claimed CFD speedups and generalization?
    - Can data-free physics-informed solvers match RANS/CFD-quality predictions at
      engineering-relevant high Reynolds turbulent conditions without external flow
      data?
    - Does the promising architecture ranking persist when benchmark tasks vary beyond
      current 2D airfoils and a single 3D aircraft configuration?
    - Can vibration mitigation approaches achieve meaningful wind turbine airfoil
      response reductions under realistic mass ratios and FSI constraints?
