  related_work_outline_zh:
  - 主流方向：构建高保真气动代理基准，用共享几何-流场/气动力任务和压力测试评估神经算子。
  - 研究共性：在统一数据集与聚合误差之外，逐步加入分布偏移、力相关、残差或物理统计诊断。
  - 关键差异：评测目标分别聚焦端到端预测、求解器耦合校正或智能体驱动物理发现，鲁棒性定义与指标不同。
  - 趋势演进：从分布内精度转向受控分布偏移、物理诊断和求解器耦合可靠性；可观察年份较窄，趋势处于当前前沿。
  - 开放问题：更好基准分数是否意味着更好物理、运行工况覆盖、代码/数据/基准稳定性与实现一致性仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared geometry-to-flow tasks and high-fidelity aerodynamics
        datasets, making neural surrogate claims comparable across architectures and
        operating settings.
      what_remains_open: 'Task coverage remains narrow: many datasets target a small
        number of vehicle/airfoil classes and operating points, while sim-to-real
        and turbulence-regime boundaries are not systematically covered.'
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality beyond aggregate scores through force
        rank correlation, residual reduction, distribution shifts, and physical input
        interventions.
      what_remains_open: Alignment between these proxy diagnostics and downstream
        decisions remains unproven; physical-statistics metrics can disagree with
        field-error rankings.
    - line: Comparable baselines and reporting
      what_it_solves: Supports auditability by comparing multiple neural operators
        on shared baselines and by coupling learned surrogates to solver correction.
      what_remains_open: Visible code, dataset, and artifact signals are sparse; no
        common protocol establishes stability across implementations, compute budgets,
        and repeated runs.
    consensus:
    - The field evaluates aerodynamics surrogates mainly on shared geometry-to-flow
      prediction tasks using aggregate field and force errors.
    - Recent work agrees that in-distribution accuracy is insufficient; stress tests
      such as distribution shifts, solver residual reduction, or physical diagnostics
      are needed.
    - Several studies treat learned surrogates as one component of a larger scientific
      workflow, comparing with solver-coupled or physics-analysis steps rather than
      standalone accuracy alone.
    - Public artifacts and limitation details are often partially described, but visible
      code/artifact reporting remains inconsistent, leaving reproducibility as a verification
      gap.
    disagreements:
    - 'Evaluation priority differs: some works center downstream aerodynamic force
      or residual performance, while others prioritize physical-statistics consistency
      or solver speed-up.'
    - 'Robustness constructs differ: controlled operating/tessellation/prototype shifts,
      physical input interventions, and out-of-distribution Reynolds numbers are not
      interchangeable and can rank models differently.'
    - 'Interaction mode differs: standalone end-to-end prediction, surrogate-initialized
      Newton-Krylov correction, and LLM-agent-driven physical decomposition imply
      different success criteria and failure modes.'
    - Supervision and representation choices differ, including point-cloud geometry
      encoders, flow-state routing, learned quadrature forces, and paired CFD/PIV
      data, making direct comparison difficult.
    open_questions:
    - Do better aggregate benchmark scores guarantee better physical statistics for
      downstream aerodynamics decisions? The available evidence shows at least one
      case where lower field error accompanies worse fluctuation-energy error.
    - What operating regimes and geometry classes must benchmarks cover before learned
      surrogates can be trusted across speed changes, surface tessellation, and cross-vehicle
      transfer?
    - How can evaluation protocols separate model capability from implementation,
      compute budget, and unavailable code or artifacts?
    - Can solver-coupled, end-to-end, and physics-discovery evaluations be aligned
      under a common metric without hiding different reliability targets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享几何-流场任务和高保真数据集，使不同神经代理在统一设置下可比较。
      尚未覆盖: 覆盖的几何类别、运行工况和湍流/实验边界仍不系统，sim-to-real 覆盖有限。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合误差之外通过力相关、残差、分布偏移和物理干预检验预测质量与可靠性。
      尚未覆盖: 代理指标与下游优化/控制决策的一致性尚未建立，物理统计与场误差排名可能不一致。
    - 路线: 可比基线与报告规范
      解决的问题: 通过多架构对比和求解器耦合基线使结果更可审计，并暴露鲁棒性差异。
      尚未覆盖: 代码、数据集和工件可见性稀疏，结论在实现、算力预算和重复运行下是否稳定仍未知。
    共识:
    - 领域主要用共享几何-流场预测任务和聚合场误差/气动力误差评估气动代理模型。
    - 多篇证据认为分布内精度不足，需要分布偏移、求解器残差或物理统计等压力测试。
    - 越来越多工作将学习代理放入更大科学流程中，与求解器耦合或物理分析联合评估，而非只看端到端精度。
    - 数据集和基线常被描述，但可见代码与工件报告不一致，复现性仍是验证缺口。
    分歧:
    - 评测优先级不同：有的关注气动力与残差表现，有的关注物理统计一致性或求解器加速。
    - 鲁棒性构造不同：运行工况/离散化/车型偏移、物理输入干预和分布外雷诺数不可互换，可能导致不同模型排名。
    - 交互模式不同：端到端预测、代理初始化 Newton-Krylov 校正、智能体物理分析对应不同成功标准和失效模式。
