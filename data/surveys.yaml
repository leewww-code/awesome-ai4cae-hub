  related_work_outline:
  - 'Mainstream direction: data-driven surrogate modeling and accelerated simulation
    for aerodynamic and fluid-engineering applications, with CFD/RANS outputs as the
    dominant reference or training source.'
  - 'Shared research pattern: replacing or correcting expensive physics-based evaluation
    with learned geometry-, flow-, or dynamics-conditioned models, then benchmarking
    on application-specific configurations such as airfoils, aircraft, wind-turbine
    blades, and perforated plates.'
  - 'Key differences: supervision ranges from paired CFD/RANS data to data-free physics-informed
    losses; targets range from full flow fields and surface pressure to scalar coefficients,
    unsteady loads, vibration amplitude, and component pressure loss; representations
    include neural fields, operator networks, Gaussian functional regression, LSTM
    residual correction, Kriging, and offline RL policy extraction.'
  - 'Trend evolution: evidence is concentrated in the 2026 frontier, with movement
    toward public datasets, geometry encoders, operator benchmarks, uncertainty-guided
    sampling, and low-dimensional corrections; evaluation is expanding from 2D steady
    airfoils toward 3D aircraft and component-level fluid systems.'
  - 'Open questions: generalization beyond limited airfoil families and steady/incompressible
    assumptions; transfer from simulation gains to real operational outcomes; robustness
    of 2D-to-3D corrections; meaningful vibration suppression at realistic mass ratios;
    and independent reproducibility where code/datasets/limitations are missing.'
  related_work_outline_zh:
  - 主流方向：面向气动与流体工程应用的数据驱动代理建模和加速仿真，CFD/RANS输出是主要参考或训练来源。
  - 研究共性：用几何、流场或动力学条件化的学习模型替代或修正昂贵物理评估，并在翼型、飞机、风力机叶片、穿孔板等场景中验证。
  - 关键差异：监督信号从CFD/RANS配对数据到无数据物理信息损失；目标从全流场、表面压力到气动系数、非定常载荷、振动幅值和部件压损；表示包括神经场、算子网络、高斯泛函回归、LSTM残差、Kriging和离线RL策略。
  - 趋势演进：证据集中在2026年，显现公开数据集、几何编码器、算子评测、不确定性引导采样和低维修正的趋势；场景从二维定常翼型向三维飞机与部件级系统扩展。
  - 开放问题：有限翼型族和定常不可压假设之外的泛化；仿真收益到真实运行结果的迁移；二维到三维修正的鲁棒性；真实质量比下的振动抑制；以及缺代码/数据/局限性时的可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates
      what_it_solves: Predicts pressure and velocity fields from airfoil geometry,
        replacing costly CFD evaluation with fast neural surrogates for downforce-generating
        airfoils.
      what_remains_open: Current evidence is confined to steady, incompressible, 2D
        subsonic flow and NACA 4-digit airfoils; extension to non-NACA, unsteady,
        and 3D shapes remains unverified.
    - line: Operator-learning architecture benchmarking
      what_it_solves: Compares deep operator networks for surface pressure prediction
        on 2D and 3D aerodynamic configurations under shock, scalability, and data-scarcity
        requirements.
      what_remains_open: Findings are tied to tested benchmark settings; no explicit
        limitations or real-world operational validation are provided.
    - line: Low-dimensional Gaussian process correction for RANS
      what_it_solves: Learns a 2D-to-3D RANS correction for aerodynamic coefficients
        with uncertainty-guided adaptive sampling and fast neural-accelerated kernel
        evaluation.
      what_remains_open: Accuracy depends on choosing a suitable low-dimensional model,
        and the accelerated kernel remains approximate outside evaluated cases.
    - line: Data-free physics-informed PDE solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems across low-to-high
        Reynolds numbers without external flow data.
      what_remains_open: Only abstract-level information is available; solution accuracy,
        engineering configuration coverage, and generalization limits are not shown.
    - line: Control-oriented aeroelastic and fluid policy learning
      what_it_solves: Studies resonator-based vortex-induced vibration suppression
        on a wind turbine airfoil and offline reinforcement-learning policy extraction
        for fluid control.
      what_remains_open: Realistic mass ratios yield only small vibration reductions;
        RL evidence lacks detailed methodology and limitation reporting.
    - line: Unsteady and component-level empirical surrogates
      what_it_solves: Corrects analytical baselines for unsteady aerodynamic load
        prediction and predicts perforated-plate pressure losses with Kriging/neural
        models.
      what_remains_open: Unsteady evidence is narrow, limited to NLR 7301 pitch/plunge
        cases; pressure-loss validation relies on RANS CFD rather than physical experiments.
    consensus:
    - Learned surrogates and correctors are used to reduce the cost of CFD/RANS or
      to improve empirical/analytical baselines for application-specific aerodynamic
      quantities.
    - 'Evaluation settings are engineering-oriented: airfoils, aircraft, wind-turbine
      airfoils, and perforated plates, with accuracy, speedup, shock capture, or vibration
      amplitude as key targets.'
    - 'Many approaches combine data-driven learning with a prior: geometry encoding,
      operator structure, low-dimensional RANS correction, analytic baseline residuals,
      or empirical formula baselines.'
    - Uncertainty and generalization receive repeated attention through geometry extrapolation,
      data-scarcity settings, adaptive sampling, and uncertainty quantification.
    disagreements:
    - 'Supervision and prior knowledge differ: paired CFD/RANS supervision, physics-informed
      losses without data, analytic or empirical baseline residuals, and interactive
      control objectives.'
    - 'Target outputs differ: full flow fields, surface pressure, scalar aerodynamic
      coefficients, unsteady load histories, vibration amplitude, and component pressure
      loss.'
    - 'Spatial/temporal coverage differs: steady 2D subsonic airfoils, industrial
      3D aircraft, low-to-high Reynolds Navier-Stokes benchmark PDEs, and turbulent
      component flow.'
    - 'Model families differ: geometry-conditioned neural fields and operator networks,
      Gaussian process functional regression, LSTM residual models, Kriging, and offline
      reinforcement learning.'
    - 'Reproducibility evidence is uneven: some papers report datasets or artifacts,
      while others give only abstract/method signals; missing code and limitations
      limit independent verification.'
    open_questions:
    - Can field surrogates and operator rankings transfer beyond NACA 4-digit steady
      incompressible 2D flows to non-NACA, unsteady, and industrial 3D configurations?
    - Under what low-dimensional model choices do 2D-to-3D RANS corrections remain
      calibrated, and can accelerated kernels preserve uncertainty quantification
      outside tested cases?
    - What resonator or control designs can achieve practically meaningful vortex-induced-vibration
      suppression under realistic mass ratios?
    - Do data-free PINN solvers and offline RL fluid policies remain effective beyond
      the stated benchmark regimes and without external data or online interaction?
    - How much of the reported speedup and accuracy can be independently replicated
      when code, datasets, baselines, and limitation details are released or verified?
