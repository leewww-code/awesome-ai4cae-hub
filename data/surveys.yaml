  literature_review_zh:
    研究路线矩阵:
    - 路线: 求解器耦合的设计与优化流水线
      解决的问题: 将学习到的代理模型转化为闭环设计工作流，通过约束、不确定性触发CFD反馈或Newton-Krylov校正实现可靠气动预测与形状优化。
      尚未覆盖: 在内部车辆数据集和较窄翼型/汽车气动范围之外的验证不足；跨硬件、求解器和用户约束的部署可靠性仍不明确。
    - 路线: 智能体分析与物理发现工具链
      解决的问题: 通过多智能体推理与知识库，自动完成流动分解、可视化、统计分析、一致性审查和湍流建模建议。
      尚未覆盖: 跨团队、跨流动案例的独立复现尚无证据；代码与工件信号不足，对模糊或域外物理问题的鲁棒性仍不清楚。
    - 路线: 高保真数据集与基准基础设施
      解决的问题: 提供标准化高保真CFD数据集和基准划分，用于评测代理模型，并引入几何、运行条件和表面离散化等受控分布偏移。
      尚未覆盖: 分布内精度高不等于泛化强；当前基准显示模型在速度、网格划分和跨车辆偏移下退化，尚无统一鲁棒的架构。
    - 路线: 快速神经代理架构
      解决的问题: 将几何和流动条件映射到连续压力/速度场或气动系数，在翼型与车辆构型上实现相对CFD的数量级加速。
      尚未覆盖: 精度往往伴随更高计算成本；泛化测试多集中在较窄几何族、稳态二维亚音速或特定三维构型。
    共识:
    - 学习型代理模型在气动场预测和设计循环中可比传统CFD带来数量级加速。
    - 将神经预测与物理求解器、约束或不确定性检查耦合，被视为提升可靠性和验证可信度的手段。
    - 高保真数据集与基准越来越多地用于比较架构；论文报告场误差、气动误差、趋势准确率或加速比等指标。
    - 分布偏移下的泛化能力是数据与基准工作中共同关注的问题。
    分歧:
    - 部署目标不同：完全代理预测用于快速推理，求解器闭环校正，或智能体引导的自动分析。
    - 表示方式不同：包括谱几何条件编码、点云流态注意力、图/算子网络和神经场表示。
    - 评测指标不同：各工作分别优化表面压力/速度场、气动系数误差、残差收敛、减阻效果或湍流模型质量。
    - 验证设置不同：从内部汽车数据集、公开翼型/皮卡基准、工业级三维飞机构型到跨音速优化轨迹。
    - 计算成本取舍不同：部分系统追求最高精度但计算成本更高，部分系统优先求解器加速或在线预测可靠性。
    开放问题:
    - 求解器耦合和不确定性感知流水线能否迁移到未见几何族、车辆类别或非汽车工业流动？
    - 智能体物理发现框架能否依托现有工件在不同团队和计算环境中被独立复现？
    - 哪种评测协议（包括数据划分和分布偏移维度）最能预测代理模型的部署可靠性？
    - 在交互式或闭环工业使用中，系统应如何权衡延迟、保真度、可控性和计算成本？
