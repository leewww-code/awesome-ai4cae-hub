  related_work_outline_zh:
  - 主流方向：以学习型CFD/PDE代理模型为主，尤其是几何与流动条件化的神经算子；同时出现面向物理分析与工具编排的LLM智能体框架。
  - 研究共性：多数方法把表示或分解选择与基准评测协议结合，试图分离模型贡献与系统组件，并报告相对CFD或基线的加速/精度提升。
  - 关键差异：表示方式（谱几何、流态注意力、物理信息残差、算子架构）、监督目标、交互模式（纯代理、智能体编排、实测校验数字孪生）和部署范围不同。
  - 趋势演进：在2017–2026前沿区间，工作集中在2026；可见从单一代理精度转向可靠性感知代理、自审计信任和智能体/本体约束分析流程。
  - 开放问题：跨几何与流态迁移、物理残差修正、本体/检索泛化以及代码/数据集/局限性等复现信号的证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Physics-constrained neural surrogate representation and objective design
      what_it_solves: Converts known flow physics or geometry priors into encodings,
        losses, and architectures for fast aerodynamic/PDE field prediction.
      what_remains_open: Transfer beyond steady, incompressible, 2D subsonic NACA
        4-digit flows and current benchmarks; computational cost and generalization
        to unseen non-NACA or 3D industrial geometry are unresolved.
    - line: Agentic and domain-grounded LLM orchestration for scientific analysis
      what_it_solves: Separates LLM intent interpretation from deterministic tools
        and uses ontologies to constrain planning, reducing API hallucinations and
        missing pipeline stages in CFD/topology workflows.
      what_remains_open: Demonstrated on two domains and limited benchmarks; strategic
        errors remain, and interpretation gains depend on scoped retrieval of relevant
        facts rather than bulk retrieval.
    - line: Self-auditing, calibration, and benchmark evidence protocols
      what_it_solves: Audits surrogate predictions with physics residuals or comparative
        benchmarks to flag unreliable cases, provide calibrated trust, and identify
        promising architectures.
      what_remains_open: Physics residual is a poor correction objective; learned
        correction gains are not attributable to residual conditioning in ablation,
        and some evaluations lack explicit limitations or full reproducibility artifacts.
    - line: Measurement-validated CFD design frameworks
      what_it_solves: Couples on-site anemometry with calibrated RANS digital twins
        and design graphs to place wind devices and estimate energy yield.
      what_remains_open: Validation evidence is site- and device-specific; spatial
        error details and performance in other urban morphologies are not reported.
    consensus:
    - Learned surrogates are evaluated against conventional CFD or baseline architectures
      and are expected to provide orders-of-magnitude speedup while retaining field-level
      accuracy.
    - Physics or domain knowledge is used as a structural constraint, ontology, residual
      trust signal, or decomposition prior rather than treated as a black-box input.
    - LLM-centered systems separate reasoning/intent from deterministic execution
      because this removes whole failure classes such as API hallucination and missing
      pipeline stages.
    - Ablation or comparative evaluation is used to isolate component contributions,
      though the strength of isolation varies across studies.
    disagreements:
    - 'Representation: spectral geometry encodings versus point-cloud flow-state attention
      versus operator architectures versus physics-residual trust layers.'
    - 'Supervision objective: direct field-error supervised prediction versus using
      discretized RANS residual as trust signal; residual is reliable for flagging
      but not for correction.'
    - 'Interaction mode: pure surrogate inference, LLM-agent orchestration, and measurement-calibrated
      CFD digital twin differ in where human/planner/controller decisions enter.'
    - 'Evaluation target/setting: 2D steady incompressible airfoils, industrial 3D
      aircraft, periodic hill turbulence, and dense urban wind are not interchangeable
      evidence bases.'
    open_questions:
    - Do geometry-conditioned surrogate representations transfer to unsteady, compressible,
      3D, or non-NACA configurations beyond the reported datasets?
    - Can the RANS physics residual be transformed into a correction objective that
      reduces field error, given current evidence shows it does not?
    - Does ontology-grounded LLM orchestration maintain interpretation gains beyond
      two domains and under bulk retrieval conditions?
    - Which benchmark advantages persist under data scarcity, industrial-scale 3D
      grids, and missing explicit limitation details?
    - Are reproducibility signals code/dataset/artifact sufficient for the 2026 cluster,
      or do low reproducibility scores indicate verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 物理约束神经代理表示与目标设计
      解决的问题: 将已知流动物理或几何先验转化为编码、损失和架构，用于快速气动/PDE场预测。
      尚未覆盖: 超出稳态、不可压缩、二维亚音速NACA 4-digit流动和现有基准的迁移；计算成本、非NACA或工业三维几何泛化未解决。
    - 路线: 面向科学分析的智能体与领域知识锚定LLM编排
      解决的问题: 把LLM意图解释与确定性工具分离，并用本体约束规划，减少CFD/拓扑分析中的API幻觉和流水线缺失。
      尚未覆盖: 仅在两个领域和有限基准上展示；战略错误仍存在，且增益依赖相关事实的限定范围检索而非批量检索。
    - 路线: 自审计、校准与基准证据协议
      解决的问题: 用物理残差或对比基准审计代理预测，标记不可靠案例、提供校准信任并识别有前景架构。
      尚未覆盖: 物理残差不是有效修正目标；学习校正增益在消融中无法归因于残差条件化；部分评估缺少明确局限或完整复现工件。
    - 路线: 实测校验的CFD设计框架
      解决的问题: 将现场风速测量与校准RANS数字孪生和设计图耦合，用于城市风能设备选址与年发电量估算。
      尚未覆盖: 验证证据具有场地与设备特异性；空间误差细节和其他城市形态下的性能未报告。
    共识:
    - 学习型代理以常规CFD或基线架构为参照，需在保持场级精度的同时提供数量级加速。
    - 物理或领域知识被用作结构约束、本体、残差信任信号或分解先验，而非黑箱输入。
    - LLM中心系统将推理/意图与确定性执行分离，以消除API幻觉和缺失流水线阶段等整类失败。
    - 使用消融或对比评测隔离组件贡献，但隔离强度在不同研究中不一致。
    分歧:
    - 表示方式：谱几何编码、点云流态注意力、算子架构与物理残差信任层并存。
    - 监督目标：直接以场误差监督的预测，与将离散RANS残差作为信任信号不同；残差适合标记误差，却不适合修正。
    - 交互模式：纯代理推理、LLM智能体编排与实测校准CFD数字孪生在决策介入点上有差异。
    - 评测场景：二维稳态不可压缩翼型、工业三维飞机、周期山流湍流和密集城市风环境的结论不可直接互换。
    开放问题:
    - 几何条件代理表示能否迁移到非定常、可压缩、三维或非NACA构型？
    - 在现有证据显示RANS物理残差不能降低场误差的情况下，能否将其转化为有效修正目标？
    - 本体锚定LLM编排在超出两个领域或批量检索条件下是否仍能保持解释增益？
    - 在数据稀缺、工业级三维网格和缺少明确局限性细节时，哪些基准优势仍成立？
    - 2026年聚类的代码/数据集/工件复现信号是否足以支持结论，还是仅构成验证缺口？
