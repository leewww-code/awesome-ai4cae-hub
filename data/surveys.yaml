  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogate modeling
      what_it_solves: Fast prediction of pressure and velocity fields from airfoil
        geometry, replacing repeated CFD in aerodynamic design.
      what_remains_open: Evidence is limited to steady, incompressible, 2D subsonic
        flow and downforce-generating NACA 4-digit airfoils; transfer to unsteady,
        compressible, and 3D configurations is not established.
    - line: Aerodynamic operator learning architecture benchmarking
      what_it_solves: Identifies which neural operator backbones capture shocks and
        discontinuities, scale to large mesh sizes, and perform under data scarcity
        for surface pressure prediction.
      what_remains_open: No explicit limitations are stated; scope is mainly surface
        pressure and selected architectures, so deployment beyond the benchmark is
        unverified.
    - line: Multi-fidelity dimension-bridging aerodynamic surrogates
      what_it_solves: Learns a correction from low-dimensional 2D RANS to high-dimensional
        3D RANS to reduce high-fidelity evaluations and improve adaptive sampling.
      what_remains_open: Effectiveness depends on choosing an appropriate low-dimensional
        model; neural-network-accelerated kernel agreement needs further validation.
    - line: Physics-informed data-free Navier-Stokes solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems without external
        flow data by using physics-informed residuals.
      what_remains_open: Abstract and analysis fields are empty; high-Reynolds accuracy,
        geometry scope, baselines, and limitations are verification gaps.
    - line: Fluid-structure interaction and fluid control
      what_it_solves: Uses CFD/FSI or offline reinforcement learning to mitigate wind
        turbine airfoil vortex-induced vibration or extract fluid control policies.
      what_remains_open: Realistic mass ratios yield small vibration reductions; offline
        reinforcement learning evidence lacks abstract and limitation details; physical
        deployment is unproven.
    - line: Non-aerodynamic engineering PDE surrogates
      what_it_solves: Extends learned PDE solver approaches to quasi-static Biot poroelasticity,
        broadening the engineering application scope.
      what_remains_open: No detailed analysis or limitations are provided; cross-PDE
        transferability and reproducibility are undetermined.
    consensus:
    - Physics-based simulation sources, especially RANS/CFD for aerodynamic geometries,
      serve as the dominant training or prior signal.
    - Core goal is to approximate expensive fluid simulations with learned surrogates
      while preserving aerodynamic quantities or flow features and achieving speedups.
    - Generalization is evaluated outside training conditions, such as unseen airfoils,
      angle-of-attack interpolation, or 3D aircraft configurations.
    - Data efficiency and uncertainty quantification are recurring concerns in surrogate
      and multi-fidelity work.
    disagreements:
    - 'Supervision signal differs: large labeled CFD datasets versus data-free physics-informed
      residuals.'
    - 'Geometry and field representations differ: spectral conditioning, graph/transformer
      operators, and Gaussian functional regression with custom kernels.'
    - 'Output targets differ: continuous pressure/velocity fields, scalar aerodynamic
      coefficients, or vortex-induced vibration mitigation.'
    - 'Physical scope differs: steady 2D subsonic flow, 3D RANS aircraft, low/high
      Reynolds Navier-Stokes, fluid-structure interaction, and poroelasticity.'
    - 'Reproducibility evidence differs: some works provide dataset or artifact signals
      while others lack code, dataset, baseline, or limitation details; this is a
      verification gap.'
    open_questions:
    - How well do current aerodynamic surrogates transfer to unsteady, compressible,
      three-dimensional engineering configurations beyond the evaluated benchmarks?
    - What is the minimal data or physics prior needed to preserve accuracy under
      shocks and unseen geometries?
    - Can multi-fidelity dimension-bridging remain reliable when the low-dimensional
      model is poorly matched?
    - Do simulation-level speedups and error metrics translate into physical engineering
      outcomes such as design quality or vibration reduction?
    - Why do several 2026 studies omit code, datasets, explicit baselines, or limitations,
      and how should verification be standardized?
