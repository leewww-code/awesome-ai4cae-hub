  related_work_outline:
  - 'Mainstream direction: Applied aerodynamic surrogate modeling dominates, using
    neural networks to accelerate CFD/RANS prediction of airfoil, wing, and aircraft
    flow fields, pressure, and aerodynamic coefficients, with some work extending
    to fluid-structure vibration mitigation and offline fluid control.'
  - 'Shared research pattern: Learn a mapping from geometry or flow conditions to
    aerodynamic quantities of interest; incorporate physical baselines or low-fidelity
    corrections; evaluate accuracy, speedup, and generalization on CFD benchmarks.'
  - 'Key differences: Models differ in representation such as spectral geometry, graph/transformer
    operators, LSTM residual learners, and Gaussian process/kernel models; supervision
    ranges from CFD data to physics residuals, low-fidelity corrections, and offline
    reinforcement learning; output and setting range from 2D steady flow to 3D, unsteady,
    and fluid-structure interaction.'
  - 'Trend evolution: Evidence moves from general operator learning in 2023 toward
    2026 domain-specific aerodynamic benchmarks, public datasets, industrial 3D configurations,
    real-time kernel acceleration, uncertainty quantification, and control or fluid-structure
    applications.'
  - 'Open questions: Generalization beyond NACA 4-digit, 2D, and steady regimes; industrial
    3D shock capture under data scarcity; experimental or real-world validation; reproducible
    code and dataset availability; and reliable closed-loop fluid control remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以翼型/机翼/整机气动代理建模为主，利用神经网络加速 CFD/RANS 的流场、压力和系数预测，并延伸到流固耦合减振与流体控制。
  - 研究共性：从几何或流动条件学习到气动量的映射；常借助物理基线或低保真修正；在 CFD 基准上评估精度、加速和泛化。
  - 关键差异：表示方式、监督信号、输出粒度和场景不同：谱几何/图/Transformer/LSTM/高斯过程；CFD数据、物理残差、低保真修正、离线RL；二维稳态到三维/非定常/FSI。
  - 趋势演进：从 2023 年通用算子学习，演进到 2026 年领域化气动基准、公开数据集、工业3D配置、实时核、不确定性量化和控制类应用。
  - 开放问题：NACA/二维/稳态之外的泛化、工业三维激波与数据稀缺、仿真到实验验证、代码数据复现、以及闭环流体控制可靠性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates
      what_it_solves: Map airfoil or aircraft geometry to continuous pressure/velocity
        fields and aerodynamic quantities with large speedups over CFD for rapid design
        evaluation.
      what_remains_open: Evidence is concentrated on steady, incompressible, 2D subsonic
        NACA 4-digit airfoils; transfer to non-NACA, transonic, unsteady, and 3D industrial
        configurations remains under-tested.
    - line: Operator learning benchmarks for aerodynamic prediction
      what_it_solves: Compare scalable operator architectures on surface pressure
        prediction for 2D airfoils and a 3D aircraft, emphasizing shock/discontinuity
        capture, large mesh scalability, and data scarcity.
      what_remains_open: Limited to reported benchmark settings; no explicit limitation
        analysis, and no clear evidence on which architecture best transfers across
        industrial geometries or flight conditions.
    - line: Physics-informed and data-free Navier-Stokes solvers
      what_it_solves: Solve steady Navier-Stokes benchmark problems from low to high
        Reynolds numbers without external flow data by embedding physical constraints.
      what_remains_open: Evidence does not yet show applicability to complex engineering
        geometries, turbulence, or unsteady aerodynamics with the same fidelity.
    - line: Low-fidelity baseline correction and dimension bridging
      what_it_solves: Learn corrections from cheap 2D RANS or analytical unsteady
        baselines to high-fidelity 3D or CFD loads, improving coefficient/load accuracy
        and enabling adaptive sampling and fast evaluation.
      what_remains_open: Success depends on the chosen low-dimensional baseline; evidence
        covers specific airfoil/benchmark motions, not broad flight envelopes.
    - line: Fluid control and fluid-structure interaction applications
      what_it_solves: Use CFD/FSI or offline reinforcement learning to reduce vortex-induced
        vibration or derive fluid control policies from logged data.
      what_remains_open: Realistic mass ratios produce small vibration reductions
        in the resonator study, and policy extraction lacks evidence of closed-loop
        real-world or cross-task generalization.
    consensus:
    - Neural surrogates are treated as fast complements to CFD/RANS for aerodynamic
      engineering, targeting repeated design or control evaluations rather than full
      replacement of physics solvers.
    - Incorporating physical structure such as geometry conditioning, baseline corrections,
      physics residuals, or dimension bridging improves data efficiency and accuracy
      relative to purely black-box mapping.
    - Accuracy, speedup, and generalization are evaluated on CFD benchmarks, with
      harder settings such as 3D aircraft, unsteady motion, shocks, and data scarcity
      used as stress tests.
    - Generalization is usually tested by interpolation or extrapolation to unseen
      geometries or conditions within a narrow family, but open-world transfer is
      not established.
    disagreements:
    - 'Representation: spectral geometry encoders, graph/transformer operators, neural
      fields or neural ODEs, LSTM residual learners, and Gaussian process/kernel models
      are used for similar aerodynamic prediction tasks.'
    - 'Supervision: some methods require large CFD/RANS datasets, others use physics
      residuals without external data, and others learn corrections from low-fidelity
      baselines or policies from offline data.'
    - 'Output granularity: targets range from continuous velocity/pressure fields
      to surface pressure, integrated aerodynamic coefficients, unsteady load time
      series, and fluid control actions.'
    - 'Deployment setting: evidence spans 2D steady incompressible airfoils, 3D industrial
      aircraft surface prediction, low/high Reynolds benchmarks, unsteady pitch/plunge
      motion, and wind turbine vortex-induced vibration.'
    - 'Evaluation priority: papers emphasize different outcomes such as accuracy,
      shock capture, real-time speed, uncertainty-driven adaptive sampling, vibration
      reduction, or policy extraction, making direct comparison difficult.'
    open_questions:
    - How well do current surrogate models trained on NACA 4-digit steady airfoils
      transfer to non-NACA, transonic, unsteady, or 3D industrial configurations?
    - Which representation and supervision strategy is most effective under scarce
      high-fidelity data and industrial-scale mesh sizes with shocks or discontinuities?
    - Can learned CFD surrogates be validated against experimental wind tunnel or
      field measurements rather than only against simulation data?
    - For fluid control and FSI applications, what evaluation should establish real-world
      closed-loop reliability beyond simulated amplitude reductions or offline policy
      extraction?
    - Several papers lack visible code, dataset, baseline, metric, or limitation details,
      leaving reproducibility and head-to-head comparison incomplete.
