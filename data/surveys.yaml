    研究路线矩阵:
    - 路线: 端到端代理-求解器设计流水线
      解决的问题: 通过变形约束、不确定性触发反馈或Newton-Krylov校正，将学习到的流场预测转化为可靠的CFD或设计工作流。
      尚未覆盖: 证据集中在内部车辆数据集或跨音速翼型案例；更广泛外部部署和失效边界尚未展示。
    - 路线: 几何与流动条件化的神经代理架构
      解决的问题: 从形状和运行条件预测压力、速度与气动量，并相较CFD提升速度与精度。
      尚未覆盖: 泛化仍受稳态二维亚音速等假设限制；交互式延迟未有直接评测，且高精度可能伴随较高计算成本。
    - 路线: 面向鲁棒性测试的基准与数据集基础设施
      解决的问题: 提供高保真CFD数据集和比较评测，揭示模型在形状、运行点、离散化与车型偏移下的退化。
      尚未覆盖: 分布内表现强仍会在分布偏移下失败；缺乏标准化的跨车型鲁棒性指标。
    - 路线: 面向流动分析的智能体AI工作流
      解决的问题: 用LLM驱动的智能体自动完成流动分解、可视化、物理推理和湍流模型建议。
      尚未覆盖: 局限性和独立跨团队复现证据缺失；工件可得性与超出报告基准的一致性仍是验证缺口。
    共识:
    - 学习型代理模型可提供相对CFD数量级加速，同时近似流场和气动量。
    - 仅凭代理精度不能保证可靠性；证据通过求解器耦合、不确定性反馈或分布偏移基准来应对。
    - 数据集和基准质量在揭示泛化失败方面与模型架构同等重要。
    - 几何与流动条件表示是提升形状和运行点预测精度的重要共性。
    分歧:
    - 独立代理预测与求解器耦合校正存在差异：部分工作报告直接场精度，另一些将代理输出仅作为初值或经CFD反馈筛选。
    - 表示选择不同：谱几何条件、点云流态注意力、DFFD变形算子与LLM智能体分解编码了不同的几何和流动假设。
    - 评测目标不同：速度与精度、分布偏移鲁棒性、端到端形状优化或自主物理发现导致成功定义不同。
    - 计算成本权衡不同：至少一个高精度模型计算成本高于基线，而其他系统强调generation-level加速。
    开放问题:
