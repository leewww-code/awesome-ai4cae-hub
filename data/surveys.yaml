    - line: Numerical PDE formulations on adapted coordinates and grids
      what_it_solves: Reformulates Navier-Stokes or Lattice Boltzmann solvers so nonuniform
        clustered grids retain metric-dependent equilibrium and forcing consistency,
        or uses any-dimensional machine learning to warm-start PDE solvers.
      what_remains_open: Stability, accuracy, and convergence guarantees beyond the
        demonstrated grid or solver conditions; missing code and benchmark details
        prevent independent verification.
    - line: Hierarchical and low-rank covariance or latent-structure estimation
      what_it_solves: Estimates high-dimensional covariance matrices or organizes
        aerodynamic latent spaces from limited samples by imposing hierarchical rank,
        low-rank, or physical structure.
      what_remains_open: Whether estimated uncertainty and learned latent organization
        transfer across geoscience, aerodynamic, or data-limited regimes; direct probabilistic
