  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns physical or aerodynamic prediction problems into concrete
        geometry/flow representations, losses, architectures, and training recipes.
      what_remains_open: Transfer beyond the reported task families, whether gains
        persist under different flow regimes, and computational cost; some proposals
        lack method details in the visible evidence.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics or domain tools to planning, execution,
        and decision-time interfaces for scientific workflows.
      what_remains_open: How much gain comes from the planner or orchestration protocol
        versus the underlying model; domain coverage is limited, and some strategic
        errors remain.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects through benchmarks and ablations.
      what_remains_open: Several works have missing code, dataset, baseline, limitation,
        or citation evidence, so reproducibility and generalization are not yet verifiable
        from the packet.
    consensus:
    - Neural surrogates and agentic/LLM orchestration are both treated as method contributions
      for aerodynamic, CFD, or physics-related workflows.
    - Domain-specific structure is often used to constrain learned components, including
      geometry encoders, flow-state attention, ontology constraints, and physical
      decomposition.
    - Evaluation typically uses benchmark comparisons, relative error metrics, or
      ablation-style evidence to support claimed improvements.
    - 'Reproducibility evidence is uneven: some papers report dataset or code signals,
      while others have missing abstracts, artifacts, or citation information.'
    disagreements:
    - Representation choices differ among spectral geometry encoding, flow-state attention,
      separable physics-informed neural formulations, and graph/operator learning
