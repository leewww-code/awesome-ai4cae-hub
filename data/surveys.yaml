  related_work_outline_zh:
  - 主流方向：以气动CFD等计算物理为核心的学习代理与智能体工作流；主要子方向包括几何/流动条件化气动代理、LLM-工具科学分析编排、自审计信任校准。
  - 研究共性：将几何谱、流态注意力、RANS残差、领域本体等物理或领域结构作为归纳偏置，并通过基准/场误差或解释准确率评估，常用消融分离方法贡献。
  - 关键差异：表示与条件化方式不同；交互模式从纯代理到LLM智能体编排再到自审计信任层不同；评测目标涵盖流场精度、科学分析正确性、校准可靠性与风能产能。
  - 趋势演进：高可读证据集中在2026年，前沿内从单一精度基准转向信任校准、自审计以及LLM-工具科学工作流的本体/协议接地。
  - 开放问题：超出已报告几何/流动状态的泛化、本体与残差接地的迁移、模型增益与规划器/本体效应的隔离，以及代码/数据/局限性缺失导致的可复现性仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts airfoil geometry, flow state, and physical constraints
        into neural representations, losses, and training objectives for aerodynamic
        surrogate prediction.
      what_remains_open: Whether spectral geometry or flow-state attention choices
        transfer beyond steady, incompressible, two-dimensional, NACA-like, or tested
        CFD regimes, and whether representation contribution is isolated from training
        recipe effects.
    - line: Planning and action-interface methods
      what_it_solves: Connects LLM reasoning or multi-agent analysis to deterministic
        tools, decomposition, and domain ontologies so scientific analysis workflows
        execute in constrained, correct chains.
      what_remains_open: How much gain comes from ontology or planner grounding rather
        than the underlying model, whether strategic errors are truly eliminated,
        and whether the orchestration scales beyond the reported two-domain instantiation.
    - line: Method evidence and ablation protocol
      what_it_solves: Uses benchmark comparisons, ablations, calibration layers, and
        physics-residual trust signals to separate method contribution from dataset,
        baseline, metric, and implementation effects.
      what_remains_open: Several high-ranking papers lack code, dataset, explicit
        limitation, or external citation evidence, so reported accuracy, speedup,
        and calibrated trust cannot yet be independently verified.
    consensus:
    - Learned surrogates and LLM-agent systems are positioned as ways to reduce costly
      CFD or scientific analysis steps rather than as unconditional replacements.
    - Methods rely on structured physical or domain constraints such as geometry conditioning,
      flow-state structure, RANS residuals, domain ontologies, or decomposition to
      ground learning and reasoning.
    - Evaluation typically combines benchmark comparisons with ablations that attempt
      to isolate contributions from conditioning, retrieval mode, residual trust,
      or architecture choice.
    - Evidence is concentrated in aerodynamic CFD and adjacent scientific analysis
      domains, with incomplete reproducibility signals across many top-ranked papers.
    disagreements:
    - 'Representation and conditioning differ: spectral geometry encoding, point-cloud
      flow-state attention, operator/graph baselines, and physics-residual conditioning
      each make different assumptions.'
    - 'The role of LLM or agent interaction differs: some methods use no LLM, some
      use ontology-constrained tool orchestration, and some use multi-agent reasoning
      for physics discovery.'
    - 'Evaluation targets differ: flow-field error, interpretation accuracy, turbulence
      model improvement, calibrated trust coverage, and urban wind energy yield are
      not interchangeable evidence.'
    - 'Trust and calibration strategy differs: physics residuals are treated as a
      reliable reliability signal but not a correction objective, while ontology grounding
      and measurement-validated CFD target different failure modes.'
    - 'Computational trade-off differs: one method achieves higher accuracy at higher
      computational cost, while surrogate papers emphasize orders-of-magnitude speedup.'
    open_questions:
    - How well do geometry-conditioned surrogates generalize to unsteady, compressible,
      three-dimensional, and non-NACA configurations when reported scope is limited?
    - Why does reducing a RANS residual fail as a correction objective even though
      it reliably flags field error, and what objective would isolate model correction
      from learned correction?
    - Does ontology-grounded LLM orchestration remain effective beyond the reported
      CFD post-processing and topology analysis domains, and why does scoped retrieval
      matter?
    - Can agentic turbulence analysis produce reliable subgrid-scale model improvements
      outside periodic hill flow without human review?
    - Which reported accuracy, speedup, and calibration claims are reproducible given
      missing code, dataset, and limitation evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将翼型几何、流动状态和物理约束转化为神经表示、损失与训练目标，用于气动代理预测。
      尚未覆盖: 谱几何或流态注意力等选择能否迁移到非定常、可压缩、三维和非NACA构型，以及表示贡献是否与训练配方效应隔离。
    - 路线: 规划与动作接口方法
      解决的问题: 将LLM推理或多智能体分析与确定性工具、分解和领域本体连接，使科学分析工作流在约束下正确执行。
      尚未覆盖: 收益有多少来自本体或规划器接地而非模型本身，战略错误是否真正消除，以及编排能否扩展到已报告的两个领域之外。
    - 路线: 方法证据与消融协议
      解决的问题: 通过基准比较、消融、校准层和物理残差信任信号，区分方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 多个高排序论文缺代码、数据集、明确局限性或外部引用，报告精度、加速与校准信任尚无法独立验证。
    共识:
    - 学习代理与LLM智能体系统被定位为降低CFD或科学分析成本的手段，而不是无条件替代。
    - 方法普遍依赖结构化物理或领域约束作为归纳偏置，如几何条件化、流态结构、RANS残差、领域本体或分解。
    - 评测通常结合基准对比与消融，尝试分离条件化、检索方式、残差信任或架构选择的贡献。
    - 证据集中在气动CFD及邻近科学分析领域，且多个高排序论文的可复现信号不完整。
    分歧:
    - 表示与条件化方式不同：谱几何编码、点云流态注意力、算子/图基线与物理残差条件化各有不同假设。
    - LLM或智能体角色不同：有的不使用LLM，有的采用本体约束工具编排，有的采用多智能体物理发现。
    - 评测目标不同：流场误差、解释准确率、湍流模型改进、校准信任覆盖和城市风能产能不可互换。
    - 信任与校准策略不同：物理残差被视为可靠的可靠性信号但非修正目标，而本体接地和实测验证CFD面向不同失效模式。
    - 计算代价取舍不同：一方法以更高计算成本换取精度，而代理类论文强调数量级加速。
    开放问题:
    - 在已报告范围受限的情况下，几何条件化代理在非定常、可压缩、三维和非NACA构型上的泛化性如何？
    - 为什么RANS残差能可靠指示场误差，却无法作为修正目标？什么目标能把模型修正与学习型校正分开？
    - 本体接地的LLM编排在CFD后处理与拓扑分析之外是否仍有效，为什么限定范围检索很重要？
    - 智能体湍流分析能否在周期性山流之外无需人工审查即可产生可靠的亚网格尺度模型改进？
    - 在缺少代码、数据集和局限性说明的情况下，哪些精度、加速与校准声明可复现？
