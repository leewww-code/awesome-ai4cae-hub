  related_work_outline:
  - 'Mainstream direction: High-fidelity aerodynamic and CFD surrogate benchmarks
    dominate, evaluating neural operators on pressure/velocity fields, forces, and
    solver-coupled correction across shared aerodynamic datasets and industrial-style
    geometries.'
  - 'Shared research pattern: Studies propose or reuse shared datasets and benchmarks,
    compare neural surrogates against strongest baselines, and report field error,
    force correlation, residual reduction, or physical diagnostics with ablations.'
  - 'Key differences: Evaluation targets differ: aggregate field accuracy vs force
    rank correlation vs solver-residual correction; generalization protocols differ:
    controlled distribution shifts, Reynolds extrapolation, grid/tessellation shifts,
    and physical input interventions; compute cost and solver coupling also differ.'
  - 'Trend evolution: The available years concentrate on 2026, so the trend is within
    the current frontier: from static benchmark accuracy toward stress-tested generalization,
    solver-coupled correction, and physics-grounded evaluation.'
  - 'Open questions: Whether better benchmark scores imply better physics and downstream
    decisions; whether conclusions remain stable across implementations, compute budgets,
    and dataset coverage; which stress tests and physical diagnostics should be standardized.'
  related_work_outline_zh:
  - 主流方向：高保真空气动力学与CFD代理基准占主导，围绕共享气动数据集和工业级几何，评估神经算子在压力/速度场、力以及求解器耦合校正上的表现。
  - 研究共性：研究提出或复用共享数据集与基准，将神经代理与最强基线比较，并报告场误差、力相关、残差降低或物理诊断，辅以消融实验。
  - 关键差异：评测目标不同，有的关注聚合场精度，有的关注力秩相关或求解器残差校正；泛化协议不同，包括受控分布偏移、雷诺数外推、网格/离散化变化和物理输入干预；计算成本与求解器耦合方式也不同。
  - 趋势演进：可用年份集中在2026年，因此趋势属于当前前沿：从静态基准精度走向压力测试泛化、求解器耦合校正和基于物理的评测。
  - 开放问题：更好的基准分数是否意味着更好的物理与下游决策；结论在不同实现、算力预算和数据集覆盖下是否稳定；哪些压力测试和物理诊断应被标准化。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared aerodynamic and CFD tasks/datasets that make
        neural-surrogate claims comparable across geometries, flow conditions, and
        surface/volume fields.
      what_remains_open: Coverage of operational shifts, experimental PIV settings,
        and long-tail geometries remains unclear; dataset size and shape-parameter
        diversity are limited in the evidence.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality beyond aggregate field error using
        force rank correlation, solver residuals, and physics-based input/output interventions.
      what_remains_open: Alignment between proxy metrics and downstream design decisions
        is not established; energy-matched intervention masks and physical correctness
        are not standardized.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines, ablations,
        benchmark splits, and reporting of compute/accuracy tradeoffs or solver acceleration.
      what_remains_open: Stability across implementations, compute budgets, and code/dataset
        availability remains a verification gap; several scoring signals show missing
        repository or citation evidence.
    consensus:
    - Neural surrogates for aerodynamic/CFD prediction are evaluated on shared benchmarks
      with field-error metrics and strongest-baseline comparisons.
    - Aggregate accuracy alone is insufficient; distribution shifts, force correlations,
      solver residuals, or physical diagnostics are needed to expose failure modes.
    - In-distribution success does not guarantee generalization across operating conditions,
      geometry/tessellation changes, or Reynolds extrapolation.
    - Ablations and baseline comparisons are common evidence practices, but compute
      cost can be a tradeoff.
    disagreements:
    - 'Evaluation target: some work optimizes full velocity/pressure field error,
      while others prioritize surface force rank correlation or residual reduction
      after Newton-Krylov correction.'
    - 'Generalization protocol: controlled dataset shifts, out-of-distribution Reynolds
      extrapolation, and physics-based input interventions are used without a common
      standard.'
    - 'Interaction mode: standalone surrogate prediction, solver-coupled correction,
      and LLM-agent turbulence analysis workflows coexist.'
    - 'Efficiency claim: one line reports higher accuracy at higher computational
      cost, while others emphasize speedup over CFD or solver reliability.'
    open_questions:
    - Do better benchmark scores translate into better physical flow statistics and
      downstream aerodynamic decisions?
    - Which stress tests and physical diagnostics should be standardized for sim-to-real
      neural operators?
    - Are benchmark conclusions stable across grid resolution, architecture reimplementation,
      and compute budgets?
    - How well do current datasets cover real operating conditions and experimental
      particle-image-velocimetry settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享气动/CFD任务和数据集，使神经代理在不同几何、流动条件和表面/体场上的声明可比较。
      尚未覆盖: 运行条件偏移、实验PIV设置和长尾几何的覆盖仍不明确；证据中数据集规模与形状参数多样性有限。
    - 路线: 指标与压力测试设计
      解决的问题: 通过力秩相关、求解器残差和基于物理的输入/输出干预，在聚合场误差之外检验预测质量。
      尚未覆盖: 代理指标与下游设计决策的一致性尚未建立；能量匹配干预掩码和物理正确性尚未标准化。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共同基线、消融、基准划分及计算/精度权衡或求解器加速报告，使结果可审计。
      尚未覆盖: 结论在不同实现、算力预算和代码/数据集可获取性上的稳定性仍是验证缺口；多项评分显示仓库或引用证据缺失。
    共识:
    - 气动/CFD神经代理在共享基准上以场误差和最强基线比较进行评估。
    - 仅凭聚合精度不足；需要分布偏移、力相关、求解器残差或物理诊断来揭示失效模式。
    - 分布内成功不能保证跨运行条件、几何/网格离散化变化或雷诺数外推下的泛化。
    - 消融和基线比较是常见证据实践，但计算成本常构成权衡。
    分歧:
    - 评测目标：有的优化完整速度/压力场误差，有的优先表面力秩相关或Newton-Krylov校正后的残差降低。
    - 泛化协议：受控数据集偏移、分布外雷诺数外推和基于物理的输入干预并存，但缺少共同标准。
    - 交互模式：独立代理预测、求解器耦合校正和LLM智能体湍流分析流程共存。
    - 效率主张：有路线以更高计算成本取得更高精度，另一些强调相对CFD加速或求解器可靠性。
    开放问题:
    - 更好的基准分数是否转化为更好的物理流动统计和下游气动设计决策？
    - 哪些压力测试和物理诊断应被标准化用于sim-to-real神经算子？
    - 基准结论在不同网格分辨率、架构重实现和算力预算下是否稳定？
    - 当前数据集在多大程度上覆盖真实运行条件和实验粒子图像测速设置？
