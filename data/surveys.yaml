  - 'Mainstream direction: Learning-based surrogates and benchmarks for aerodynamic
    CFD, especially neural operators and geometry-conditioned models that predict
    pressure/velocity fields or aerodynamic coefficients for airfoils, aircraft, and
    channel flows.'
  - 'Shared research pattern: Researchers encode physical geometry or flow configuration
    as conditioning, train on simulated RANS/LBM data or physics constraints, and
    compare surrogate accuracy, speed, scalability, or uncertainty.'
  - 'Key differences: Scope spans 2D steady airfoil flows, 3D aircraft/channel flows,
    and atmospheric boundary layer LES; supervision varies from fully data-driven
    to physics-informed; outputs include continuous fields, surface pressure, coefficients,
    and super-resolved LES.'
  - 'Trend evolution: Available top evidence clusters in 2026 even though the topic
    span begins in 2019; the visible trend is therefore within the current frontier,
    moving toward dataset-enabled CFD surrogates, architecture benchmarking, uncertainty,
    and multi-fidelity correction.'
  - 'Open questions: Need evidence on whether surrogate gains transfer across geometry
    regimes, industrial configurations, complexity, and downstream design or safety
    outcomes.'
  related_work_outline_zh:
  - 主流方向：面向翼型、飞机、通道流等工程场景，构建神经网络替代模型与基准，加速CFD预测并评估架构表现。
  - 研究共性：将几何或流动配置作为条件输入，利用RANS/LBM仿真数据或物理方程训练模型，比较精度、速度、扩展性或不确定性。
  - 关键差异：研究对象覆盖二维稳态翼型、三维飞机/通道流和大气边界层LES；监督信号从纯数据驱动到物理约束；输出包括连续流场、表面压力、气动系数和超分辨率场。
  - 趋势演进：可用强证据集中在2026年前沿，明显向数据集支撑的CFD神经代理、架构评测、多保真修正和不确定性量化发展。
