  literature_review:
    line_of_work_matrix:
    - line: Learned aerodynamic surrogate models for fast field prediction
      what_it_solves: replaces expensive CFD with neural surrogates that predict flow
        fields or surface quantities from geometry and operating conditions
      what_remains_open: generalization beyond narrow regimes such as specific airfoils,
        vehicles, or Reynolds numbers; accuracy versus computational cost boundaries
    - line: Solver-coupled correction and optimization systems
      what_it_solves: embeds surrogate predictions into CFD or optimization loops
        to improve reliability, consistency, and design speed
      what_remains_open: external validation outside in-house datasets, broader geometry
        and flow conditions, and coupling overhead
    - line: Benchmarks, datasets, and reproducibility artifacts
      what_it_solves: provides public high-fidelity simulation data and evaluation
        protocols for comparing surrogate architectures and exposing distribution
        shifts
      what_remains_open: independent cross-team reuse and coverage beyond steady,
        vehicle, or airfoil flow regimes
    - line: Agentic and automated analysis frameworks
      what_it_solves: automates flow decomposition, physics discovery, and knowledge
        accumulation around simulation data
      what_remains_open: reproducibility and breadth of validation across engineering
        tasks beyond selected flow benchmarks
    - line: Physics-grounded evaluation diagnostics
      what_it_solves: checks whether learned operator errors align with physically
        meaningful flow statistics
      what_remains_open: causal link between benchmark scores and physical correctness;
        evidence remains limited to a single benchmark
    consensus:
    - Neural surrogates can provide substantial speedups over CFD while approximating
      aerodynamic quantities.
    - Public datasets and benchmarks are necessary for training and for revealing
      generalization failures under distribution shifts.
    - Combining learned surrogates with physics or solver feedback improves reliability
      and design outcomes.
    - Evaluation should include more than aggregate prediction error; generalization
      and physical diagnostics matter.
    - Strong in-distribution performance is treated as insufficient for deployment.
    disagreements:
    - Some systems use pure learned prediction as the final output, while others use
      it only as an initial guess or trigger for CFD correction.
    - 'Representations differ: point-cloud attention, spectral geometry encoding,
      mixture-of-experts, neural fields/Neural ODEs, and graph models.'
    - 'Evaluation targets differ: field error reduction, drag reduction, distribution-shift
      robustness, or physics-diagnostic consistency.'
    - 'Interaction mode differs: closed-loop optimization with CFD feedback, LLM-agent
      analysis, or static benchmark comparison.'
    - 'Deployment setting differs: 2D/3D airfoils, vehicles, pickup trucks, in-house
      automotive data, and experimental PIV.'
    open_questions:
    - Do stronger in-distribution benchmark scores transfer to physically meaningful
      predictions under distribution shift?
    - Can surrogate-to-solver correction frameworks remain reliable across external
      geometries, meshes, and operating conditions?
    - At what computational cost boundary do state-specific attention or mixture-of-experts
      surrogates remain preferable to simpler predictors?
    - Can agentic analysis frameworks be independently reproduced and validated outside
      selected flow benchmarks?
    - What datasets and protocols are missing for unsteady, compressible, or turbulent
      regimes beyond reported steady/subsonic/vehicle cases?
