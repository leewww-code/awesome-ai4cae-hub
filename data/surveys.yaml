  related_work_outline:
  - 'Mainstream direction: Neural surrogate modeling for engineering fluid and aerodynamic
    prediction, centered on airfoil/aircraft pressure-velocity fields and aerodynamic
    coefficients, with growing attention to 3D and design-space settings.'
  - 'Shared research pattern: Replace or accelerate CFD/RANS evaluation with learned
    geometry-to-flow or coefficient mappings; evaluate through held-out geometries,
    aerodynamic quantities, speedup, and uncertainty, usually on RANS/CFD data.'
  - 'Key differences: Representation and supervision vary from spectral geometry encoders
    and graph/transformer operator layers to Gaussian kernels and data-free physics-informed
    losses; targets range from continuous flow fields to surface pressure, coefficients,
    and ship internal layouts.'
  - 'Trend evolution: Visible top evidence concentrates in 2023 and 2026, moving from
    general operator learning toward domain-specific aerodynamic benchmarks, shared
    datasets, 3D industrial configurations, and real-time or sampling-oriented surrogates.
    The 2020-2022 span is not represented in the top evidence.'
  - 'Open questions: Generalization beyond steady, incompressible, 2D NACA 4-digit
    airfoil flows; reliability of 2D-to-3D correction under different low-dimensional
    models; industrial-scale shock capture under data scarcity; and reproducibility
    from missing code/dataset signals. Impeller and whole-vehicle cases remain absent
    from the visible evidence.'
  related_work_outline_zh:
  - 主流方向：面向工程流体与空气动力学预测的神经代理模型，重点在翼型/飞机压力-速度场与气动系数预测，并逐步扩展到三维和设计空间场景。
  - 研究共性：用学习到的几何到流场或系数映射替代或加速CFD/RANS；通过未见几何、气动量、加速比和不确定性进行评估，多基于RANS/CFD数据。
  - 关键差异：表示与监督方式不同，包括谱几何编码、图/Transformer算子层、高斯核与数据无关物理信息损失；预测目标从连续流场到表面压力、系数和船舶内部布置。
  - 趋势演进：可见高相关证据集中在2023与2026年，显示从通用算子学习转向领域特定气动基准、共享数据集、三维工业配置和面向实时/采样的代理模型；2020-2022区间在顶部证据中缺失。
  - 开放问题：超出稳态不可压二维NACA 4-digit工况的泛化；不同低维模型下2D到3D修正的可靠性；数据稀缺下工业级激波捕捉；缺失代码/数据集带来的可复现缺口。叶轮与整车等场景在可见证据中仍未出现。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates
      what_it_solves: Predict pressure and velocity fields directly from airfoil geometry,
        replacing costly CFD evaluation for steady subsonic regimes.
      what_remains_open: Evidence is limited to steady, incompressible, 2D subsonic
        NACA 4-digit downforce airfoils; transfer to non-NACA, 3D, transient, or compressible
        flows is unproven.
    - line: Operator learning architecture benchmarking
      what_it_solves: Assesses deep operator architectures for surface pressure prediction,
        shock capture, scalability to large mesh sizes, and data scarcity on 2D airfoils
        and a 3D aircraft.
      what_remains_open: Promising architectures are identified, but code/dataset
        signals are weak and the abstract lacks explicit limitations; real deployment
        and off-design conditions remain open.
    - line: Multi-fidelity and dimension-bridging surrogates
      what_it_solves: Learns a correction from 2D RANS to 3D RANS for aerodynamic
        coefficient prediction, using uncertainty quantification to guide adaptive
        sampling and a neural accelerated kernel for real-time evaluation.
      what_remains_open: Performance depends on low-dimensional model choice; the
        accelerated kernel is approximate, and evidence is confined to aerodynamic
        coefficients rather than full fields.
    - line: Data-free physics-informed flow solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems across low and
        high Reynolds numbers without external flow data.
      what_remains_open: Analysis fields are empty in the evidence, so methodology,
        metrics, baselines, and applicability to complex engineering geometries are
        verification gaps.
    - line: Engineering design exploration, control, and fluid-structure interaction
      what_it_solves: Procedurally generates conceptual ship internal arrangements,
        studies wind turbine airfoil vibration mitigation, and extracts fluid-control
        policies from offline data.
      what_remains_open: Realistic mass ratios yield only small vibration reductions;
        evidence lacks uniform baselines, metrics, and cross-vessel or cross-embodiment
        generalization.
    consensus:
    - Neural surrogates are being tested as fast alternatives to CFD/RANS for engineering
      fluid predictions, with speedup and accuracy as primary evidence.
    - Geometry representation and architecture choice are central design factors,
      with evaluations commonly covering held-out geometry, aerodynamic quantities,
      or design feasibility.
    - Generalization and uncertainty are recognized concerns, shown by tests on unseen
      airfoils, adaptive sampling, and high-dimensional model correction.
    - Current evidence is concentrated on steady, lower-dimensional, or benchmark
      regimes; broad industrial and physical validation remains unresolved.
    disagreements:
    - Supervision differs between data-driven surrogates trained on CFD/RANS datasets
      and data-free physics-informed losses.
    - Representation differs among spectral geometry conditioning, graph/transformer
      operator layers, Gaussian functional kernels, and policy extraction from offline
      observations.
    - Prediction targets differ across continuous pressure/velocity fields, surface
      pressure distributions, aerodynamic coefficients, and conceptual ship internal
      arrangements.
    - Application settings differ across 2D airfoil aerodynamics, 3D aircraft configurations,
      wind turbine fluid-structure interaction, and ship design-space exploration,
      changing the relevant physical constraints and evaluation metrics.
    open_questions:
    - Do geometry-conditioned surrogates transfer to non-NACA airfoils, 3D flows,
      transient flows, and compressible flow regimes?
    - Which representation and supervision strategy best balances shock or discontinuity
      capture, scalability to industrial mesh sizes, and data scarcity?
    - How robust is 2D-to-3D RANS correction when the low-dimensional model or operating
      regime changes?
    - Can data-free physics-informed solvers match the accuracy and speed of data-driven
      surrogates on application-scale engineering geometries and high Reynolds conditions?
    - What code, datasets, and baseline details are available to reproduce and compare
      these methods beyond the limited reproducibility signals in the evidence?
    - Do the findings extend to impeller or whole-vehicle application targets, which
      appear in the topic description but are absent from the bounded evidence?
