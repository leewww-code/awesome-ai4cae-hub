    研究路线矩阵:
    - 路线: 几何条件化气动场代理建模
      解决的问题: 从翼型几何快速预测压力/速度场，替代重复CFD设计迭代。
      尚未覆盖: 证据限于稳态不可压缩二维亚音速和NACA 4-digit下压力翼型；向非稳态、可压缩、三维配置的迁移未建立。
    - 路线: 气动算子学习架构基准评测
      解决的问题: 识别哪些神经算子骨干能捕捉激波/间断、扩展到大网格并在数据稀缺下预测表面压力。
      尚未覆盖: 摘要未给出明确局限；范围主要是表面压力与所选架构，真实部署与更广几何覆盖尚未验证。
    - 路线: 多保真维度桥接气动代理
      解决的问题: 学习从2D RANS到3D RANS的修正，以减少高维CFD评估并改善自适应采样。
      尚未覆盖: 效果依赖低维模型选择；神经网络加速核的一致性需更多验证；可复现工件有限。
    - 路线: 物理信息无数据Navier-Stokes求解
      解决的问题: 无需外部流场数据，通过物理信息残差求解稳态Navier-Stokes基准问题。
      尚未覆盖: 摘要与分析字段为空；高雷诺数精度、几何范围、基线与局限性属于验证缺口。
    - 路线: 流固耦合与流体控制
      解决的问题: 用CFD/FSI或离线强化学习抑制风力机翼型涡激振动或提取流体控制策略。
      尚未覆盖: 现实质量比下减振幅度较小；离线强化学习证据缺少摘要与局限；物理部署未证明。
    - 路线: 非气动工程PDE代理
      解决的问题: 将学习型PDE求解器迁移到准静态Biot孔隙弹性，扩展应用范围。
      尚未覆盖: 未提供详细分析与局限性；跨PDE迁移能力和可复现性未知。
    共识:
    - 以RANS/CFD为主的气动物理仿真数据是学习型代理模型的主要训练或先验来源。
    - 核心目标是学习代理模型以降低传统CFD成本，同时保持气动量或流场特征精度并获得加速。
    - 评测通常强调训练条件之外的泛化，例如未见翼型、攻角插值或3D飞机配置。
    - 数据效率与不确定性量化在多篇代理与多保真工作中是共同关注点。
    分歧:
    - 监督信号不同：大规模CFD标注数据与无数据物理信息残差。
    - 几何与场表示不同：谱几何编码、图/Transformer算子、以及带定制核的高斯函数回归。
    - 输出目标不同：连续压力/速度场、气动系数或涡激振动抑制。
    - 物理范围不同：稳态二维亚音速、3D RANS飞机、低/高雷诺数Navier-Stokes、流固耦合、孔隙弹性。
    - 可复现性证据不同：部分工作给出数据集或工件信号，其他缺少代码、数据集、基线或局限；应视为验证缺口。
