  related_work_outline_zh:
  - 主流方向：基于学习的空气动力学代理模型和LLM/工具科学工作流方法占主导，多围绕几何/流动条件神经建模或用智能体编排替代或加速CFD与分析流程。
  - 研究共性：方法将表示、物理/领域约束和评估分离；采用神经代理、注意力/谱/图编码器或本体/工具分离的LLM框架，并在CFD或领域基准上验证。
  - 关键差异：表示从谱几何、图神经常微分方程到点云流态注意力和算子学习；交互模式从监督场预测到多智能体物理发现与工具编排。
  - 趋势演进：可用高排名证据集中于2026；前沿内由架构评测走向自审计信任、智能体自动化与决策导向CFD框架；缺少早年高排名证据，无法推断更长轨迹。
  - 开放问题：报告数据集与流态之外的迁移；物理残差信任能否转为修正目标；智能体收益归因；缺失工件与可复现性；成本-精度权衡。
  literature_review:
    line_of_work_matrix:
    - line: Geometry- and flow-conditioned neural surrogates
      what_it_solves: Learns mappings from geometry and flow conditions to aerodynamic
        fields or forces, replacing or accelerating expensive CFD simulation.
      what_remains_open: Transfer beyond steady, incompressible, 2D or specific NACA/aircraft
        datasets; accuracy-cost tradeoffs and behavior under shock, data-scarcity,
        and industrial 3D settings remain unclear.
    - line: Agentic and tool-orchestrated scientific analysis
      what_it_solves: Automates scientific workflow composition and physics discovery
        by separating intent, deterministic domain-tool execution, and explanation
        under ontology or multi-agent constraints.
      what_remains_open: Attribution between LLM reasoning, ontology/tool constraints,
        and domain-specific priors is not isolated; cross-domain and deployment transfer
        beyond reported cases is not established; strategic errors remain.
    - line: Method evidence, auditing, and ablation protocols
      what_it_solves: Benchmarks architectures, isolates contributions of representation,
        ontology, or residual signals, and audits surrogate trust via calibration
        and controlled ablations.
      what_remains_open: Code, dataset, and limitation details are often missing;
        physics residuals appear reliable as trust but not as correction; evaluation
        breadth is narrow and several limitations are unreported.
    consensus:
    - Recent methods favor learned surrogates for aerodynamic field prediction, replacing
      or accelerating CFD through geometry and flow conditioning.
    - There is shared reliance on domain constraints or physics-informed signals such
      as ontologies, triple decomposition, RANS residuals, and measurement-calibrated
      models.
    - Method claims are evaluated through controlled comparisons and metrics, including
      relative L2 error, workflow interpretation accuracy, and trust or coverage measures.
    disagreements:
    - 'Representation choices differ: spectral geometry encodings, point-cloud flow-state
      attention, graph neural ODEs, and operator learning backbones coexist.'
    - 'Supervision and trust signals differ: supervised field error against CFD truth,
      physics-residual self-auditing, and measurement-validated digital twins are
      used.'
    - 'Interaction modes differ: fully learned surrogate prediction, LLM-orchestrated
      tool execution, and multi-agent automated physics discovery are separate designs.'
    - 'Evaluation targets differ: field prediction accuracy, workflow interpretation
      accuracy, turbulence component analysis, and urban wind-energy siting are assessed.'
    - 'Deployment settings differ: steady 2D/3D RANS, unsteady transonic airfoil,
      dense urban building micro-wind, and periodic hill turbulence are reported.'
    open_questions:
    - Which representation and architecture choices transfer beyond the reported NACA
      4-digit, Emmi-Wing, DrivAerNet++, and aircraft cases?
    - Can physics-residual trust signals be turned into correction objectives despite
      evidence that reducing residuals does not reduce field error?
    - What portion of agentic workflow gain arises from LLM reasoning versus deterministic
      ontologies, tool wrappers, and task decomposition?
    - Do reported speedups and accuracy hold under broader flow regimes, shock-heavy
      cases, data scarcity, and industrial 3D settings?
    - How should missing code, datasets, and limitation details be treated when reproducing
      and verifying these methods?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何与流动条件化的神经代理模型
      解决的问题: 学习从几何与流动条件到气动场或力的映射，以替代或加速CFD仿真。
      尚未覆盖: 超出稳态、不可压缩、二维或特定NACA/飞机数据集的迁移；精度-成本权衡以及激波、数据稀缺和工业3D场景下的表现仍不明确。
    - 路线: 智能体与工具编排的科学分析
      解决的问题: 通过分离意图、确定性领域工具执行和解释，在本体或多智能体约束下自动组成科学工作流并发现物理。
      尚未覆盖: LLM推理、本体/工具约束和领域先验的收益归因未隔离；跨领域及报告案例之外的部署迁移未建立；策略性错误仍存在。
    - 路线: 方法证据、审计与消融协议
      解决的问题: 通过基准、消融和物理残差审计，隔离表示、本体或残差信号的贡献，并评估代理可信度。
      尚未覆盖: 代码、数据集和局限说明常缺失；物理残差作为信任信号可靠但不适合修正；评估广度有限且部分局限性未报告。
    共识:
    - 近期方法倾向使用学习式代理模型进行气动场预测，以几何与流动条件化方式替代或加速CFD。
    - 多篇工作共享对领域约束或物理信息信号的依赖，如本体、三重分解、RANS残差和实测校准模型。
    - 方法声明通过受控比较和指标验证，包括相对L2误差、工作流解释准确率以及信任或覆盖率。
    分歧:
    - 表示方式不同：谱几何编码、点云流态注意力、图神经常微分方程和算子学习骨干并存。
    - 监督与信任信号不同：基于CFD真值的监督场误差、物理残差自审计和实测验证数字孪生分别被采用。
    - 交互模式不同：全学习代理预测、LLM工具编排和多智能体自动化物理发现是不同设计。
    - 评测目标不同：场预测精度、工作流解释准确率、湍流组分分析和城市风能选址各有侧重。
    - 部署场景不同：稳态2D/3D RANS、非定常跨音速翼型、密集城市建筑风和周期山湍流均有报告。
    开放问题:
    - 哪些表示与架构选择能迁移到报告之外的几何、流态和工业场景？
    - 物理残差信任信号能否被转化为修正目标，即使有证据表明降低残差并不会降低场误差？
    - 智能体工作流增益中有多少来自LLM推理，多少来自确定性本体、工具封装和任务分解？
    - 报告的速度与精度优势在激波密集、数据稀缺和工业3D条件下是否仍然成立？
    - 在复现和验证这些方法时，应如何处理缺失代码、数据集和局限说明？
