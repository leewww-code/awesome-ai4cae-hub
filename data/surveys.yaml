      others initialize a numerical solver, and another uses an LLM-agent orchestration
      pipeline.'
    - 'Evaluation targets differ: drag-reduction optimization, surface/volume field
      prediction, turbulence component analysis, and distribution-shift robustness
      are not interchangeable.'
    - 'Flow-regime and vehicle scope differ: two-dimensional airfoils, industrial
      three-dimensional aircraft, passenger/pickup vehicles, and canonical/engineering
      turbulent flows create different boundary assumptions.'
    open_questions:
