  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design (e.g., SHIFT-Truck)
      what_it_solves: Creates shared high-fidelity aerodynamic datasets and benchmark
        tracks so neural surrogate claims can be compared under controlled training/testing
        splits.
      what_remains_open: Whether the task distribution covers the operating points,
        tessellations, and vehicle classes where aerodynamic surrogates are expected
        to generalize.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, robustness, and physical utility beyond aggregate
        scores, using distribution-shift tracks, input interventions, fluctuation-energy
        diagnostics, and learned force integration.
      what_remains_open: Whether proxy metrics align with downstream physical conclusions
        or engineering decisions users actually care about.
    - line: Comparable baselines and reporting
      what_it_solves: Provides architecture evaluations and baseline comparisons that
        make surrogate strengths and weaknesses auditable across 2D airfoil and 3D
        aircraft settings.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and missing artifact or limitation details.
    consensus:
    - Neural surrogates are evaluated through shared aerodynamic benchmarks and strong
      baselines rather than isolated case studies.
    - Aggregate error metrics are consistently reported, including relative L2 or
      MSE variants for velocity/pressure fields and force prediction or rank correlation
      where relevant.
    - In-distribution accuracy alone is treated as insufficient; several works add
      distribution-shift, physical, or solver-coupled checks to qualify generalization.
    disagreements:
    - 'Representations differ: point-cloud and flow-state attention, domain-decomposed
      routed decoders, spectral geometry encoders, and multi-scale graph networks
      emphasize different geometric and flow structure.'
    - 'Supervision and interaction differ: some methods train standalone surrogate
      predictors, others embed Newton-Krylov solver correction, and others use LLM-agent-driven
      physical discovery.'
    - 'Evaluation targets differ: velocity-field MSE, surface pressure error, aerodynamic
      force and rank correlation, residual ratios, or physical fluctuation-energy
      statistics are not interchangeable.'
    - 'Deployment settings differ: some focus on in-distribution benchmark tracks,
      while others stress-test operating-condition, tessellation, and cross-vehicle
      distribution shifts.'
    open_questions:
    - Do current benchmark distributions cover the operating points, geometries, and
      discretizations where world-model surrogates are expected to help?
    - Does a better aggregate error score imply better physical statistics or engineering
      decisions, given observed misalignment between velocity-field error and fluctuation-energy
      error?
    - Can conclusions remain stable across implementations and compute budgets when
      code, dataset, artifact, and limitation details are not all available?
    - What reporting conventions are needed to make distribution-shift and physical-diagnostic
      results comparable across aerodynamic surrogate studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计（如 SHIFT-Truck）
      解决的问题: 构建共享高保真空气动力学数据集和基准赛道，使神经代理主张在受控训练/测试划分下可比较。
      尚未覆盖: 任务分布是否覆盖气动代理预期泛化的运行点、网格离散化与车辆类别。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合分数之外检验预测、鲁棒性和物理效用，使用分布偏移赛道、输入干预、脉动能量诊断和可学习力积分。
      尚未覆盖: 代理指标是否与下游物理结论或用户真正关心的工程决策一致。
    - 路线: 可比基线与报告规范
      解决的问题: 通过架构评估和基线比较，使二维翼型与三维飞机设置中的代理优劣可审计。
      尚未覆盖: 基准结论在不同实现、算力预算以及缺失的工件或局限性细节下是否稳定。
    共识:
    - 神经代理通过共享气动基准和强基线进行评估，而不是孤立案例研究。
    - 聚合误差指标被一致报告，包括速度/压力场的相对 L2 或 MSE 变体，以及力预测或秩相关。
    - 分布内精度被认为不足；多项工作加入分布偏移、物理或求解器耦合检查来限定泛化能力。
    分歧:
    - 表示方式不同：点云与流态注意力、域分解路由解码器、谱几何编码器和多尺度图网络强调不同的几何与流动结构。
    - 监督与交互方式不同：一些方法训练独立代理预测器，一些嵌入 Newton-Krylov 求解器校正，另一些使用 LLM 智能体驱动的物理发现。
    - 评测目标不同：速度场 MSE、表面压力误差、气动力及秩相关、残差比或物理脉动能量统计不可互换。
    - 部署场景不同：一些关注分布内基准赛道，另一些压力测试运行条件、网格离散化和跨车型分布偏移。
