  - 主流方向：面向翼型、飞机等工程几何的流体与气动代理模型，主要用于加速CFD/RANS预测。
  - 研究共性：用几何或物理条件化的学习模型替代昂贵仿真，强调精度、加速与泛化。
  - 关键差异：预测目标涵盖压力/速度场、气动系数、设计布局、振动响应或控制动作；监督信号包括CFD数据、物理约束、多保真修正和离线控制数据。
