    - 路线: 智能体物理分析与发现流水线
      解决的问题: 自动化流场分解、特征提取、物理推理和湍流建模建议。
      尚未覆盖: LLM生成结论和迭代审查仍缺乏独立验证；在报告基准之外的鲁棒性未解决。
    - 路线: 面向气动代理的基准与数据集基础设施
      解决的问题: 提供高保真仿真数据、标准划分和受控分布偏移评估，以暴露模型退化。
      尚未覆盖: 车辆类别、运行工况和跨车型迁移覆盖不完整；独立复现尚未展示。
    - 路线: 知识约束外形优化工具链
      解决的问题: 将领域约束与用户意图编码到几何变形中，并以不确定性触发选择性CFD反馈。
      尚未覆盖: 评估限于内部车辆数据集；向更广设计空间和外部物理条件的泛化仍开放。
    共识:
    - 神经代理模型可相对传统CFD实现数量级加速或显著优化收益，同时近似气动场或设计目标。
    - 可靠性已不仅看测试精度，而是通过不确定性触发反馈、求解器收敛、分布偏移基准或物理一致性审查来体现。
