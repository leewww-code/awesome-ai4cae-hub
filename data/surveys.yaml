  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned neural surrogates for aerodynamic field prediction
      what_it_solves: Replaces expensive CFD field predictions for airfoil pressure
        and velocity using spectral geometry encoders and continuous neural representations.
      what_remains_open: Reported scope is steady, incompressible, 2D subsonic NACA
        4-digit airfoils; generalization to non-NACA, unsteady, compressible, or 3D
        flows remains open.
    - line: Operator learning architecture benchmarking for aerodynamic surface pressure
      what_it_solves: Evaluates multiple neural operator architectures on 2D airfoil
        and industrial 3D aircraft pressure prediction for shock capture, scalability,
        and data scarcity.
      what_remains_open: No explicit limitations are stated in the abstract, and code/artifact
        signals are weak; real-world deployment and reproducibility evidence are still
        missing.
    - line: Multi-fidelity and dimension-bridging Gaussian functional regression
      what_it_solves: Learns a correction from 2D to 3D RANS for aerodynamic coefficient
        prediction with uncertainty quantification and neural accelerated evaluation.
      what_remains_open: Effectiveness depends on selecting an appropriate low-dimensional
        model, and the neural-network-accelerated kernel is only approximately consistent
        with exact regression.
    - line: Data-free physics-informed Navier-Stokes solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems across low and
        high Reynolds numbers without external flow data.
      what_remains_open: Packet lacks method, result, and limitation details; evidence
        for complex engineering configurations and unsteady or separated flows is
        not provided.
    - line: Turbulent and wake flow dataset pipelines
      what_it_solves: Constructs validated LBM and high-Reynolds-number datasets for
        surrogate modeling of 3D obstructed channel turbulence and wake dynamics.
      what_remains_open: Visible packet omits full analysis; generalization of models
        trained on these datasets to new geometries or flow regimes is not evidenced.
    - line: Conditional diffusion super-resolution for atmospheric boundary layer
        LES
      what_it_solves: Uses a conditional denoising diffusion probabilistic model to
        super-resolve atmospheric boundary layer large eddy simulation.
      what_remains_open: Packet lacks innovation, methodology, results, and limitation
        sections; downstream impact and generalizability beyond studied atmospheric
        conditions are unverified.
    - line: Uncertainty quantification for sparse recurrent sensing
      what_it_solves: Applies engression-based uncertainty quantification to shallow
        recurrent decoder networks for sparse sensing.
      what_remains_open: Packet lacks method and result details; calibration and robustness
        across sparse sensor layouts or physical systems are not established.
    consensus:
    - Learning-based surrogate models are treated as a core means to accelerate engineering
      CFD prediction.
    - Geometry or flow configuration is commonly encoded as conditioning input for
      predicting pressure, velocity, or aerodynamic coefficient targets.
    - Controlled simulation data are used for training and benchmarking, with several
      works emphasizing dataset or pipeline availability.
    - Recent work increasingly compares multiple architectures and reports speed,
      scalability, or uncertainty rather than a single point estimate.
    disagreements:
    - 'Supervision differs: some approaches learn from precomputed RANS/LBM data,
      while others remove external flow data through physics-informed losses.'
    - 'Evaluation targets differ: some reconstruct continuous fields, others predict
      surface pressure or aerodynamic coefficients, and others perform LES super-resolution.'
    - Scope and physical assumptions differ between 2D steady subsonic airfoil flows
      and 3D industrial aircraft or turbulent channel flows.
    - 'Uncertainty treatment differs: Gaussian functional regression provides explicit
      uncertainty for adaptive sampling, while many surrogate benchmarks report only
      accuracy and scalability.'
    open_questions:
    - Can geometry-conditioned surrogates remain accurate outside NACA 4-digit, steady,
      incompressible, subsonic regimes, especially for unseen non-NACA geometries
      and transonic shock cases?
    - Do architectural advantages observed on 2D airfoil benchmarks transfer to industrial
      3D configurations under data scarcity?
    - Can neural-network-accelerated kernels replace exact Gaussian process regression
      for adaptive sampling and uncertainty calibration?
    - Can data-free physics-informed solvers achieve engineering-grade accuracy for
      complex turbulent or separated flows beyond standard steady Navier-Stokes benchmarks?
    - Can released LBM and wake datasets support downstream generalization to unseen
      geometries and turbulent wake regimes not represented in training?
