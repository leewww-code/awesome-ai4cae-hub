  - 趋势演进：在可见的2026年证据内，评测从分布内精度转向分布偏移鲁棒性、物理一致性、求解器耦合可靠性和智能体化基准流程。
  - 开放问题：更好的基准分数能否转化为更好的物理和下游决策；数据集是否覆盖真实几何和工况；缺少共享代码和报告规范时结论是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Aerodynamic benchmark task and dataset construction
      what_it_solves: Provides shared geometry-to-flow prediction tasks and datasets,
        such as pickup-truck, airfoil, aircraft, and periodic-hill benchmarks, so
        neural surrogates can be compared on identical inputs and metrics.
      what_remains_open: Whether the geometry families and operating conditions cover
        the real deployment settings where surrogates are expected to generalize;
        current shifts already expose failures in speed dependence and cross-vehicle
        transfer.
    - line: Metric and physical stress-test design
      what_it_solves: Moves beyond aggregate field error by probing distribution shift,
        force prediction quality, shock/scalability/data-scarcity behavior, and physics-grounded
        input interventions.
      what_remains_open: Whether proxy metrics align with downstream decisions and
        physical correctness; intervention masks and single-benchmark evidence limit
        causal claims about better scores meaning better physics.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Creates common strongest-baseline comparisons and architecture
        evaluations across shared CFD datasets, making model strengths and weaknesses
        auditable.
      what_remains_open: Stability across implementations and compute budgets is underexplored;
        several sources omit explicit limitations, and code, dataset, and artifact
        evidence remains incomplete.
    - line: Automated benchmark-case generation and physical discovery workflows
      what_it_solves: Uses LLM agents or retrieval pipelines to generate, diagnose,
        or analyze CFD cases and turbulence components, offering evaluation targets
        such as retrieval coverage, completion, and modeling recommendations.
      what_remains_open: Validation remains bounded to a small case set or synthetic
        corruptions, and the end-to-end physical validity of agent-generated recommendations
        or cases is not yet established.
    consensus:
    - Shared CFD-derived benchmark tasks and error metrics are the default basis for
      comparing aerodynamic surrogates; papers report strongest-baseline comparisons
      and multiple error views.
    - In-distribution accuracy is treated as insufficient; evaluation is expanding
      toward distribution shifts, force metrics, solver residuals, and physical diagnostics.
    - Solver coupling or residual correction is emerging as a way to make neural surrogate
      predictions reliable enough for CFD workflows.
    - 'Reproducibility varies: code, dataset, artifact, and limitation reporting are
      often missing, so some conclusions are verification gaps rather than established
      differences.'
    disagreements:
    - 'Evaluation target varies: velocity or pressure field error, drag force and
      rank correlation, solver residual reduction, flow-component statistics, retrieval
      coverage, and OpenFOAM completion.'
    - 'Reference data and supervision vary: CFD/RANS/DES simulations, experimental
      PIV, and solver logs change what errors are measurable.'
    - 'Interaction mode varies: standalone surrogate prediction, surrogate initial
      guesses corrected by Newton-Krylov, and LLM-agent or retrieval-automated workflows.'
    - 'Representation choices differ: attention over point-cloud flow states, domain
      routing and learned quadrature, spectral geometry encoding, and retrieval ranking
      over documents.'
    - 'Deployment setting varies: 2D airfoils, 3D aircraft, pickup trucks, periodic
      hill, transonic airfoil optimization, and OpenFOAM case configuration.'
    open_questions:
    - Do lower aggregate benchmark errors correspond to better physical predictions
      for the downstream decisions users care about?
    - Can benchmark datasets cover realistic geometric, operating-condition, tessellation,
      and cross-vehicle shifts without becoming prohibitively expensive?
    - Are benchmark conclusions stable across different implementations, compute budgets,
      and reference data sources?
    - What additional diagnostics are needed to make force prediction and physical
      consistency less sensitive to integration and intervention-mask choices?
    - How should LLM-agent-generated CFD cases or turbulence-model recommendations
      be validated beyond retrieval coverage and completion on small or synthetic
      benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 空气动力学基准任务与数据集构建
      解决的问题: 提供共享的几何到流场预测任务和数据集，如皮卡、翼型、飞机和周期山等基准，使模型可在相同输入和指标下比较。
      尚未覆盖: 几何族与工况是否覆盖真实部署环境仍不确定；当前位移已暴露速度依赖和跨车型迁移等泛化失败。
    - 路线: 指标与物理压力测试设计
      解决的问题: 在聚合误差之外，检验分布偏移、阻力预测质量、激波/规模/数据稀缺表现，以及基于物理的输入干预。
      尚未覆盖: 代理指标是否与下游决策和物理正确性一致；干预掩码和单一基准限制了“分数更好即物理更好”的因果结论。
    - 路线: 可比基线与报告规范
      解决的问题: 在共享CFD数据集上建立最强基线对比和架构评测，使模型优劣可审计。
      尚未覆盖: 不同实现和算力预算下的结论稳定性未充分研究；部分工作缺少明确局限性，代码、数据集和工件证据不完整。
    - 路线: 自动化基准算例生成与物理发现流程
      解决的问题: 使用LLM智能体或检索流水线生成、诊断或分析CFD算例和湍流分量，提供检索覆盖率、完成率和建模建议等评测目标。
      尚未覆盖: 验证仍局限于小规模或合成损坏，智能体生成的算例或湍流建模建议的端到端物理有效性尚未建立。
    共识:
    - 共享的CFD派生基准任务和误差指标是气动代理比较的默认基础；论文报告最强基线对比和多种误差视图。
    - 分布内精度被认为不足；评测正在扩展至分布偏移、力指标、求解器残差和物理诊断。
    - 求解器耦合或残差校正正在成为使神经代理预测可靠到可用于CFD工作流的方式。
