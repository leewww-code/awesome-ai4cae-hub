  related_work_outline_zh:
  - 主流方向：当前证据集中在高保真CFD数据集上评测深度学习气动代理，重点关注精度、效率与受控分布偏移鲁棒性。
  - 研究共性：论文引入或复用 AirfRANS、Emmi-Wing、DrivAerNet++、SHIFT-Truck 等共享任务，通过场误差、力误差和秩相关指标比较不同架构。
