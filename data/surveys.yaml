  related_work_outline:
  - 'Mainstream direction: High-fidelity aerodynamic/CFD benchmarking for neural surrogates,
    with datasets and metrics centered on surface pressure, velocity fields, and force
    prediction.'
  - 'Shared research pattern: Papers evaluate learned surrogates on recognized benchmarks
    and add stress tests such as operating-point, tessellation, Reynolds, or cross-vehicle
    distribution shifts.'
  - 'Key differences: Architecture choices and evaluation targets split the work into
    surrogate-only prediction, solver-coupled correction, dataset construction, and
    automated physical discovery; robustness and compute trade-offs are measured differently.'
  - 'Trend evolution: Available 2026 evidence shows a frontier shift from aggregate
    accuracy toward high-fidelity, distribution-shift-aware benchmarks and solver-in-the-loop
    reliability, while earlier years in the span are not represented in top evidence.'
  - 'Open questions: Whether proxy metrics align with downstream engineering decisions,
    how stable rankings are across implementations and compute budgets, and whether
    benchmark distributions cover real deployment settings.'
  related_work_outline_zh:
  - 主流方向：围绕气动与计算流体力学神经代理开展高保真基准测试，数据集和指标集中于表面压力、速度场与力预测。
  - 研究共性：论文在公认基准上评估学习代理，并加入运行点、网格划分、雷诺数或跨车辆分布偏移等压力测试。
  - 关键差异：架构与评测目标分化为纯代理预测、求解器耦合校正、数据集构建和自动化物理发现；对鲁棒性与计算代价的衡量方式不同。
  - 趋势演进：现有2026年证据显示前沿从聚合精度转向高保真、分布偏移感知的基准与求解器在环可靠性；更早年份在top证据中未被充分呈现。
  - 开放问题：代理指标是否与下游工程决策一致，排名在不同实现和算力预算下是否稳定，基准分布是否覆盖真实部署设置。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared high-fidelity aerodynamic tasks and datasets
        so neural-surrogate claims become comparable across geometries and operating
        conditions; short examples include SHIFT-Truck and multi-architecture aerodynamic
        benchmarks.
      what_remains_open: Whether the task distribution covers open cargo beds, industrial
        aircraft configurations, and broader vehicle classes; current evidence is
        concentrated in a few canonical and vehicle-specific settings.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality beyond aggregate scores through relative
        L2 error, velocity-field MSE, drag rank correlation, residual ratios, and
        distribution-shift protocols involving Reynolds, operating-point, tessellation,
        and cross-vehicle changes.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        such as design optimization convergence, solver reliability, or physical discovery
        utility remains underevidenced.
    - line: Comparable baselines and reporting
      what_it_solves: Makes surrogate results auditable by evaluating common baselines
        and reporting baseline-relative improvements, ablation effects, and, in some
        cases, solver speedups or architectural robustness.
      what_remains_open: Many top-packet papers lack explicit limitations, code, dataset,
        or artifact signals; benchmark conclusions may not be stable across implementations,
        compute budgets, or missing reproducibility details.
    consensus:
    - Aerodynamic/CFD surrogate papers in the packet converge on shared benchmark
      settings such as AirfRANS, Emmi-Wing, DrivAerNet++, and high-fidelity simulation
      datasets.
    - Field-error metrics such as relative L2 error and velocity/pressure MSE are
      widely reported, often supplemented by force-error or rank-correlation metrics
      to capture integrated aerodynamic quantities.
    - Distribution shift is treated as a first-class evaluation condition, especially
      Reynolds extrapolation, operating-condition changes, tessellation, and cross-vehicle
      shape transfer.
    - In-distribution accuracy alone is consistently not regarded as sufficient evidence
      for generalization or engineering utility.
    disagreements:
    - Representation choices differ among flow-state attention, domain-decomposed
      routing with learned quadrature, physics-informed stochastic separable representations,
      and LLM-agent reasoning.
    - 'Evaluation targets differ: some target surface pressure or velocity fields,
      others target force prediction, solver-residual correction, or automated turbulence
      component discovery.'
    - 'Robustness evaluation is not standardized: protocols include Reynolds extrapolation,
      operating-point shifts, input tessellation changes, and cross-vehicle transfer,
      with some papers reporting no explicit limitations.'
    - 'Compute trade-offs are judged differently: one method reports higher computational
      cost for accuracy, while another reports solver-level speedup; benchmarks vary
      in whether cost is part of the comparison.'
    open_questions:
    - How well do current benchmark task distributions cover real deployment settings
      beyond the available airfoil, wing, SUV, pickup-truck, and aircraft cases?
    - Are relative L2, field MSE, and drag rank correlation sufficient proxies for
      downstream engineering decisions such as optimization convergence and solver
      reliability?
    - How stable are reported rankings when implementations, training budgets, and
      inference compute differ, especially where code or dataset artifacts are not
      visible in the evidence packet?
    - Can surrogate-only evaluation protocols capture the reliability added by solver-coupled
      correction or agentic physical discovery without a shared numerical convergence
      criterion?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享高保真气动任务和数据集，使神经代理在不同几何与运行条件下可比；例如 SHIFT-Truck 和多架构气动基准。
      尚未覆盖: 任务分布是否覆盖开放式货厢、工业飞机配置和更广泛车辆类别；现有证据集中于少量典型和车辆特定设置。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量，包括相对 L2 误差、速度场 MSE、阻力秩相关、残差比，以及雷诺数、运行点、网格划分和跨车辆等分布偏移协议。
      尚未覆盖: 这些代理指标与下游决策（如设计优化收敛、求解器可靠性、物理发现效用）是否一致仍缺乏证据。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共同基线、基线相对改进、消融以及部分求解器加速或架构鲁棒性报告，让代理结果可审计。
      尚未覆盖: top 证据中多篇论文缺少明确局限性、代码、数据集或工件信息；结论在不同实现、算力预算和缺失复现信息下是否稳定未知。
    共识:
    - 气动/计算流体动力学的代理论文在 AirfRANS、Emmi-Wing、DrivAerNet++ 及高保真仿真数据集等共享设置上聚合。
    - 相对 L2 误差、速度/压力 MSE 等场误差指标被广泛报告，常辅以力误差或秩相关指标来刻画积分气动量。
    - 分布偏移被视为一等评估条件，尤其是雷诺数外推、运行条件变化、网格划分和跨车辆形状迁移。
    - 论文普遍认为仅凭分布内精度不足以证明泛化能力或工程实用性。
    分歧:
    - 表示选择不同：流态注意力、域分解路由与学习积分、物理信息随机可分离表示、LLM 智能体推理。
    - 评测目标不同：有的针对表面压力或速度场，有的针对力预测、求解器残差校正或自动化湍流组分发现。
    - 鲁棒性评估不统一：协议包括雷诺数外推、运行点偏移、输入网格划分变化和跨车辆迁移，部分论文未报告明确局限性。
    - 计算代价权衡判断不同：一种方法以更高算力换精度，另一种报告求解器级加速；基准对是否把代价纳入比较不一致。
    开放问题:
    - 当前基准任务分布是否覆盖真实部署设置，而不仅是现有翼型、机翼、SUV、皮卡和飞机案例？
    - 相对 L2、场 MSE 和阻力秩相关是否足以作为下游工程决策（如优化收敛和求解器可靠性）的代理指标？
    - 当代码或数据集工件在证据包中不可见时，不同实现、训练预算和推理算力下报告排名是否稳定？
    - 仅靠代理评测协议能否捕捉求解器耦合校正或智能体物理发现带来的可靠性，而无需共享数值收敛判据？
