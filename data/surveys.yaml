  literature_review:
    line_of_work_matrix:
    - line: Neural surrogate with physics-coupled correction
      what_it_solves: Accelerates steady CFD and shape optimization by using learned
        predictions as initial guesses or constrained components, then correcting
        through numerical solvers or uncertainty-triggered feedback.
      what_remains_open: Evidence is mostly in-house or limited to specific vehicle/airfoil
        classes; external validation across hardware, user-defined shapes, and broader
        flow regimes is not established.
    - line: Public aerodynamics datasets and model benchmarks
      what_it_solves: Provides reproducible evaluation artifacts for comparing neural
        architectures, including distribution shifts in operating conditions, surface
        discretization, and vehicle geometry.
      what_remains_open: Coverage remains bounded to steady/incompressible or specific
        vehicle categories; independent reuse and cross-team reproduction are not
        yet demonstrated.
    - line: Agentic and automated analysis frameworks
      what_it_solves: Automates flow decomposition, physical reasoning, and modeling
        recommendations through LLM-driven multi-agent workflows in a toolchain-like
        system.
      what_remains_open: Reliability beyond selected flow benchmarks, code/artifact
        availability, and validation of autonomous recommendations against human expert
        or broader CFD evidence are missing.
    consensus:
    - Several approaches treat learned surrogate models as part of a larger computational
      engineering system rather than as isolated regressors.
    - Evaluation increasingly includes baseline comparison and quantitative error
      metrics such as MAPE, REL-L2, residual ratio, or drag reduction, often against
      CFD or wind-tunnel checks.
    - There is shared attention to generalization beyond training geometries, expressed
      through OOD benchmarks, distribution-shift tests, or uncertainty estimation.
    disagreements:
    - Some systems use learned predictions as standalone aerodynamic predictors, while
      others couple them to Newton-Krylov solvers or physics feedback for final accuracy.
    - 'Benchmark scope differs: some use in-house MPV/SUV/Sedan or specific airfoil
      datasets, while others release public multi-case datasets with controlled distribution
      shifts.'
    - Automation focus differs between architecture-level benchmarking and autonomous
      agent reasoning, with one reporting higher computational cost and others emphasizing
      speedups.
    open_questions:
    - How well do these systems maintain accuracy under external deployment, new vehicle
      classes, unseen operating points, and different surface tessellations?
    - What is the independent reproducibility status when code, data, or solver configurations
      are not provided?
    - Can autonomous agent recommendations be validated outside the reported flow
      benchmarks and against conventional turbulence modeling or CFD evidence?
    - What are the practical trade-offs between surrogate speed, solver-coupled reliability,
      computational overhead, and automation complexity in field deployments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 神经代理与物理求解器耦合
      解决的问题: 通过将学习预测作为初值或受约束组件，并结合数值求解或不确定性触发反馈，加速稳态CFD与形状优化。
      尚未覆盖: 证据多集中在内部或特定翼型/车辆类别；跨硬件、用户定义形状和更广流态的外部验证不足。
    - 路线: 公开气动数据集与模型基准
      解决的问题: 提供可复现评测工件，比较神经架构，并覆盖运行工况、表面离散化和车辆几何等分布偏移。
      尚未覆盖: 数据覆盖面仍限于稳态/不可压缩或特定车型；跨团队独立复用与复现仍未验证。
    - 路线: 智能体与自动化分析框架
      解决的问题: 以类似工具链的多智能体流程自动完成流动分解、物理推理和建模建议。
      尚未覆盖: 所选流动基准之外可靠性、代码/工件可得性，以及自主建议相对人类专家或更广CFD证据的验证仍缺失。
    共识:
    - 多个研究将学习式代理模型放在更大的计算工程系统中，而非作为孤立回归器使用。
    - 评测普遍包含基线对比与量化误差，如MAPE、REL-L2、残差比值或减阻率，并常与CFD或风洞结果核对。
    - 研究共同关注训练几何之外的泛化，采用OOD基准、分布偏移测试或不确定性估计。
    分歧:
    - 部分系统把学习预测作为独立气动预测器，另一些则与Newton-Krylov求解器或物理反馈耦合以获得最终精度。
    - 基准范围不同：有的依赖内部MPV/SUV/Sedan或特定翼型数据，有的发布带受控分布偏移的公开多工况数据集。
    - 自动化的侧重点不同，有的做架构级基准评测，有的做自主智能体推理；计算成本与速度目标也存在差异。
    开放问题:
    - 系统在外部部署、新车型、未见过运行点和不同表面网格划分下是否能保持精度？
    - 当代码、数据或求解器配置缺失时，独立复现状态如何？
    - 自主智能体建议能否在报告流场之外，与常规湍流建模或CFD证据进行验证？
    - 在真实部署中，代理速度、求解器耦合可靠性、计算开销与自动化复杂度之间的实际权衡是什么？
