  literature_review:
    line_of_work_matrix:
    - line: Physics- and geometry-conditioned surrogate representation
      what_it_solves: Converts physical priors into concrete geometry/flow encoders,
        neural fields, attention, graph, or stochastic separable objectives for pressure/velocity/flow
        prediction.
      what_remains_open: Which representation choices transfer beyond narrow regimes
        such as steady 2D incompressible NACA airfoils; S$^{2}$-PINN has title-only
        evidence in the packet, so its assumptions cannot be assessed.
    - line: Agentic and tool-interface scientific workflows
      what_it_solves: Connects domain knowledge or flow decompositions to LLM planning,
        deterministic tool execution, multi-agent review, and ontology-constrained
        analysis chains.
      what_remains_open: 'Attribution is unresolved: gains may come from the ontology/tool
        wrappers, the planner, or the LLM; strategic errors remain, and the ontology
        example is demonstrated on two domains.'
    - line: Benchmark and ablation protocols for method evidence
      what_it_solves: Uses architecture benchmarks, ablation tests, generalization
        splits, and adaptation benchmarks to separate method contribution from dataset,
        baseline, metric, and implementation effects.
      what_remains_open: Several records have insufficient code, data, explicit limitation,
        or analysis text in the packet; PACE-Bench and one FSAN duplicate are insufficiently
        specified to verify isolation of method contribution.
    consensus:
    - 'Structured separation is common: geometry, flow state, physical constraints,
      or domain facts are encoded separately and then combined through learned or
      rule-based layers.'
    - Evaluation centers on scientific/engineering tasks such as aerodynamic field
      prediction, turbulence analysis, or tool-mediated analysis, using accuracy,
      relative error, benchmark performance, or workflow correctness.
    - Method contribution is treated as conditional on retrieval, conditioning, or
      benchmarking choices; ablations and comparative studies are used to isolate
      some design factors.
    disagreements:
    - 'Representation differs: continuous surrogate models use neural fields, neural
      ODEs, graph models, attention, or stochastic PINN-like objectives, while agentic
      workflows use LLM plus deterministic tools, ontologies, or multi-agent reviews.'
    - 'Supervision and evaluation targets differ: field error versus interpretation/tool-selection
      correctness versus architecture scalability, shock capture, and dynamic code
      adaptation.'
    - 'Interaction mode differs: single-step surrogate inference versus multi-step
      tool orchestration and iterative consistency review.'
    - 'Deployment assumptions differ: some methods are evaluated on steady 2D incompressible
      NACA or automotive flows, while others target industrial 3D aircraft or cross-domain
      tool extensibility, which constrains generalization claims.'
    open_questions:
    - How much of reported field-error reduction comes from representation or attention
      choices rather than benchmark-specific geometry-flow structure and training
      data?
    - Do ontology- and agent-based workflows remain correct when scoped retrieval
      is unavailable or when moving beyond CFD and topology tool wrappers?
    - Are low-evidence methods such as stochastic separable PINNs and physics adaptation
      benchmarks reproducible without code, dataset, baseline, or analysis details?
    - Can current aerodynamic surrogates extend beyond steady 2D incompressible NACA
      regimes to transient, compressible, and 3D industrial settings without relying
      on narrow dataset priors?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 物理与几何条件化代理表示
      解决的问题: 将物理先验转化为具体的几何/流动编码器、神经场、注意力、图或随机可分离目标，用于压力/速度/流场预测。
      尚未覆盖: 哪些表示选择能跨出稳态二维不可压缩NACA翼型等窄场景；S$^{2}$-PINN在证据包中只有标题，无法评估其假设。
    - 路线: 智能体与工具接口科学工作流
      解决的问题: 将领域知识或流场分解接入LLM规划、确定性工具执行、多智能体审查和本体约束的分析链。
      尚未覆盖: 收益归属未解决：可能来自本体/工具封装、规划器或LLM；战略错误仍存在，本体示例仅在两个域中验证。
    - 路线: 方法证据与消融基准协议
      解决的问题: 通过架构基准、消融、泛化切分和适应基准，分离方法贡献与数据集、基线、指标和实现影响。
      尚未覆盖: 证据包中若干记录缺少代码、数据、显式限制或分析文本；PACE-Bench与重复FSAN记录不足以验证方法贡献被隔离。
    共识:
    - 结构化分离常见：几何、流动状态、物理约束或领域事实被分别编码，再通过可学习或规则层组合。
    - 评估集中在气动场预测、湍流分析或工具中介分析等科学/工程任务，采用精度、相对误差、基准性能或工作流正确性。
    - 方法贡献被视为条件于检索、条件化或基准选择；消融和对比研究用于隔离部分设计因素。
    分歧:
    - 表示不同：连续代理模型使用神经场、神经ODE、图模型、注意力或随机PINN类目标，智能体工作流使用LLM加确定性工具、本体或多智能体审查。
    - 监督与评测目标不同：场误差、解释/工具选择正确性、架构扩展与激波捕捉、动态代码适应各有侧重。
    - 交互方式不同：单步代理推理与多步工具编排和迭代一致性审查。
    - 部署假设不同：部分方法在稳态二维不可压缩NACA或汽车流中评测，部分面向三维飞行器或跨域工具扩展，因此泛化结论受场景约束。
    开放问题:
    - 报告中的场误差降低有多少来自表示或注意力选择，而非基准特定的几何-流动结构与训练数据？
    - 基于本体和智能体的工作流在无法范围化检索或离开CFD与拓扑工具封装时，是否仍能保持正确？
    - 随机可分离PINN和物理适应基准等低证据方法在证据包中缺少代码、数据或分析细节，是否可复现？
    - 当前气动代理模型能否从稳态二维不可压缩NACA域扩展到瞬态、可压缩、三维工业场景，而不依赖窄域数据先验？
