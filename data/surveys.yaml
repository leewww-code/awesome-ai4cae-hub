  related_work_outline:
  - 'Mainstream direction: Neural aerodynamic surrogate benchmarking on shared fluid
    and geometry benchmarks such as AirfRANS, Emmi-Wing, DrivAerNet++, and SHIFT-Truck,
    with increasing emphasis on distribution-shift stress tests.'
  - 'Shared research pattern: Studies report field errors, force errors, rank correlation,
    residual reduction, and speedup; physics-structured representations improve in-distribution
    accuracy but often degrade under shifted operating points or geometries.'
  - 'Key differences: Some work evaluates standalone surrogate accuracy while another
    couples surrogates to Newton-Krylov correction; benchmarks range from fixed accuracy
    tracks to controlled operating-point, tessellation, and cross-vehicle shifts.'
  - 'Trend evolution: The available year span is 2022-2026, but the provided top evidence
    is concentrated in 2026 and moves from static benchmark scores toward out-of-distribution
    robustness, solver-coupled correction, and generalization-focused benchmark construction.'
  - 'Open questions: Do current benchmark distributions match deployed aerodynamic
    design settings, and are reported surrogate metrics aligned with downstream decision
    quality, reproducibility, and stability across implementations?'
  related_work_outline_zh:
  - 主流方向：在 AirfRANS、Emmi-Wing、DrivAerNet++、SHIFT-Truck 等共享流体与几何基准上评测神经气动代理，并加入分布偏移压力测试。
  - 研究共性：研究报告场误差、力误差、秩相关、残差下降和加速比；物理结构化表示可提升分布内精度，但在运行点或几何偏移下常退化。
  - 关键差异：部分研究仅评测代理精度，部分将代理与 Newton-Krylov 校正耦合；基准从固定精度轨道扩展到运行点、网格离散化和跨车型偏移。
  - 趋势演进：证据包年份跨度为 2022-2026，但主要证据集中在 2026 年前沿，从静态基准分数转向分布外鲁棒性、求解器耦合校正和泛化导向的基准构建。
  - 开放问题：当前基准分布是否匹配实际气动设计设置，报告指标是否对应下游决策质量、可复现性与跨实现稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Aerodynamic benchmark and dataset construction
      what_it_solves: Creates shared high-fidelity simulation and wind-tunnel-validated
        tasks, geometry morphing distributions, and split conventions for comparable
        neural surrogate evaluation.
      what_remains_open: Whether the task distributions cover operating-condition,
        tessellation, and cross-vehicle settings where surrogates are expected to
        help; dataset artifacts and reproducibility evidence remain partly unverified.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction and utility beyond aggregate scores through
        field errors, force rank correlation, residual reduction, speedup, ablations,
        and controlled distribution shifts.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        such as optimization reliability, solver acceleration, or physics discovery
        is not established.
    - line: Comparable baselines and reporting
      what_it_solves: Makes benchmark results auditable through common baselines,
        strongest-baseline comparisons, ablation, and grouped splits.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets; several top entries lack visible code or dataset links,
        creating verification gaps.
    consensus:
    - Strong in-distribution performance on aerodynamic benchmarks does not guarantee
      generalization under shifted operating conditions, input discretization, or
      vehicle geometry.
    - Physics-structured representations and domain-specific evaluation targets improve
      accuracy or decision-oriented metrics relative to strong baselines.
    - Studies jointly report metrics such as relative L2 error, velocity-field MSE,
      drag MSE or rank correlation, residual ratio, and speedup to capture accuracy
      and utility.
    disagreements:
    - 'Evaluation target differs: standalone surrogate error on fixed benchmarks versus
      solver-coupled CFD reliability and acceleration.'
    - 'Benchmark scope differs: fixed in-distribution accuracy tracks versus controlled
      distribution-shift tracks spanning operating point, surface discretization,
      and cross-vehicle transfer.'
    - 'Interaction mode differs: fixed forward neural surrogates versus agent-driven
      automated flow component analysis.'
    - 'Representation choices differ: flow-state attention over point clouds, domain-decomposed
      routed operators, and broader operator-architecture benchmarking.'
    open_questions:
    - Are current benchmark distributions broad enough to cover solver-coupled, out-of-distribution,
      and industrial design settings?
    - Which surrogate metrics best predict downstream decision utility, optimization
      reliability, and physical discovery success?
    - Do benchmark conclusions remain stable across implementations, model checkpoints,
      and compute budgets given limited reproducibility evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 气动基准与数据集构建
      解决的问题: 构建共享高保真仿真与风洞验证任务、几何变形分布和划分规范，使神经代理评估可比较。
      尚未覆盖: 任务分布是否覆盖运行条件、网格离散化和跨车型等代理预期有用的设置；数据集工件与可复现证据仍部分未验证。
    - 路线: 指标与压力测试设计
      解决的问题: 通过场误差、力秩相关、残差下降、加速比、消融和受控分布偏移，在总分之外检验预测与效用。
      尚未覆盖: 这些代理指标与优化可靠性、求解器加速、物理发现等下游决策之间的一致性尚未建立。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、最强基线比较、消融和分组划分让基准结果可审计。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；若干高排名条目缺少可见代码或数据集链接，构成验证缺口。
    共识:
    - 气动基准上的强分布内性能不能保证在运行条件、输入离散化或车型几何偏移下泛化。
    - 物理结构化表示和领域特定评测目标相比强基线能提升精度或决策相关指标。
    - 研究联合报告 Relative L2 误差、速度场 MSE、阻力 MSE 或秩相关、残差比和加速比等指标，以同时反映精度与效用。
    分歧:
    - 评测目标不同：固定基准上的独立代理误差与求解器耦合 CFD 的可靠性和加速。
    - 基准覆盖不同：固定分布内精度轨道与涵盖运行点、表面离散化和跨车型迁移的受控分布偏移轨道。
    - 交互模式不同：固定前向神经代理与智能体驱动的自动化流动分量分析。
    - 表示选择不同：基于点云的流动状态注意力、域分解路由算子以及更广泛的算子架构基准评测。
    开放问题:
    - 当前基准分布是否足够覆盖求解器耦合、分布外和工业设计设置？
    - 哪些代理指标最能预测下游决策效用、优化可靠性和物理发现成功？
    - 在可复现证据有限的情况下，基准结论在不同实现、模型检查点和算力预算下是否稳定？
