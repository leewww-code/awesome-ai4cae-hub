  - 研究共性：编码几何或流动条件，用CFD/RANS/LBM数据或物理残差训练，评估气动量和速度提升，并报告跨形状、雷诺数或网格的泛化。
  - 关键差异：预测目标有全场、表面压力、积分系数和PDE状态；训练信号包括大规模仿真数据、无数据物理约束、多保真修正和稀疏传感；表示有神经场/ODE、MLP/GNN、Transformer、高斯过程；评测从二维稳态翼型到三维飞机、湍流通道/尾流。
