  - 'Mainstream direction: The dominant direction is learned surrogates for physical
    field prediction, especially geometry- and flow-conditioned neural surrogates
    for aerodynamics, with a secondary direction using LLM agents to orchestrate deterministic
    domain tools and physics discovery.'
  - 'Shared research pattern: Most methods couple domain-specific representations
    with neural or LLM components and assess them via ablations or benchmark comparisons
    against strong baselines, emphasizing structured conditioning, decomposition,
    or constrained planning.'
  - 'Key differences: Methods differ in representation such as spectral geometry encoding,
    point-cloud flow-state attention, and velocity-gradient triple decomposition;
    interaction mode such as direct surrogate inference versus LLM tool orchestration;
    and evaluation target such as field accuracy versus end-to-end physics discovery.'
  - 'Trend evolution: Available top evidence is concentrated in 2026, so the visible
    trend is within the current frontier: from generic architectures toward structured
    conditioning and agentic separation of intent, execution, and explanation for
    scientific workflows.'
  - 'Open questions: Evidence gaps remain around transfer beyond reported airfoil
    and CFD regimes, whether ontology corrections generalize beyond two domains, cost-accuracy
    tradeoffs, and whether ablations isolate method contribution from dataset and
    baseline effects.'
  related_work_outline_zh:
  - 主流方向：以几何与流动条件化神经代理模型为主，面向气动和流体场预测；LLM智能体编排确定性领域工具与物理发现是次要方向。
  - 研究共性：将领域特定表示与神经或LLM组件结合，并通过消融或与强基线对比评估结构条件化、分解或受限规划的影响。
  - 关键差异：表示方式、交互模式与评测目标不同：谱几何编码、点云流态注意力、速度梯度三重分解并存；直接代理推理与LLM工具编排并存。
  - 趋势演进：可见证据集中在2026年，趋势限于当前前沿：从通用架构走向结构化条件化与科学工作流的意图、执行、解释分离。
  - 开放问题：报告气动/CFD范围外的迁移性、本体纠正在两域外泛化、成本精度取舍、方法贡献是否与数据基线隔离等仍存证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: 'Converts physical surrogate modeling into concrete representations,
        losses, and training choices: spectral geometry conditioning, point-cloud
        flow-state attention, and separable stochastic PINN formulations.'
      what_remains_open: Transfer beyond reported steady, incompressible, 2D NACA
        airfoil/CFD regimes and evidence on which representation components drive
        generalization rather than dataset-specific fit.
    - line: Planning and action-interface methods
      what_it_solves: Connects LLM reasoning to deterministic domain tools, domain
        ontologies, and physics decompositions, separating intent, execution, and
        consistency review for analysis workflows.
      what_remains_open: How much benefit comes from the learned reasoner versus deterministic
        tool or ontology constraints, and whether the effect transfers beyond one
        or two reported domains.
    - line: Method evidence and ablation protocol
      what_it_solves: Uses benchmarks, ablations, and cross-architecture comparisons
        to separate method contribution from dataset, baseline, metric, and implementation
        effects in aerodynamic surrogate evaluation.
      what_remains_open: Several records lack visible code, dataset, limitation, or
        a unified protocol for shock capture, data scarcity, scalability, and provenance;
        these remain verification gaps.
    consensus:
    - Structured geometry or flow conditioning is preferred over injecting a single
      global flow vector for aerodynamic surrogate accuracy.
    - Strong baseline comparisons and relative error metrics are the primary evidence
      mode for neural surrogate claims.
    - LLM-based scientific workflows benefit when planning and intent are separated
      from deterministic execution and constrained by domain knowledge.
    disagreements:
    - Representation choices differ among spectral geometry encodings, point-cloud
      flow-state attention, and velocity-gradient triple decomposition.
    - Evaluation targets differ between surface field prediction benchmarks and end-to-end
      physics discovery or model recommendation cases.
    - Interaction mode differs between direct neural surrogate inference and LLM orchestration
      of deterministic tools and physics libraries.
    - 'Cost-accuracy priorities differ: some approaches emphasize orders-of-magnitude
      CFD speedup, while others accept higher computational cost for accuracy.'
    open_questions:
    - How well do current geometry- and flow-conditioned surrogates transfer to unseen
      non-NACA geometries and compressible, unsteady, or three-dimensional regimes?
    - Does the ontology correction effect in LLM orchestration persist across more
      domains and retrieval conditions beyond the two reported?
    - What minimal ablations and provenance information are needed to isolate method
      contribution from dataset size, baseline strength, metric choice, and implementation
      details?
    - Which evaluation requirements—shock capture, data scarcity, scalability, or
      end-to-end physics consistency—should define method quality for aerodynamic
      surrogates?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将物理代理建模落实为具体表示、损失与训练配方，如谱几何条件化、点云流态注意力、随机可分离PINN等。
      尚未覆盖: 超出所报告的稳态不可压缩二维NACA翼型/CFD工况的可迁移性，以及哪些表示组件驱动泛化而非数据特定拟合。
    - 路线: 规划与动作接口方法
      解决的问题: 将LLM推理连接到确定性领域工具、本体和物理分解，分离意图、执行与一致性审查。
      尚未覆盖: 收益中有多少来自学习推理器与确定性工具/本体约束，以及该效果是否能迁移到超过一两个领域。
    - 路线: 方法证据与消融协议
      解决的问题: 通过基准、消融和跨架构对比，区分方法贡献与数据集、基线、指标及实现因素的影响。
      尚未覆盖: 若干记录缺少可见的代码、数据集、局限性或统一协议，激波捕捉、数据稀缺、可扩展性和来源追踪仍是验证缺口。
    共识:
    - 气动代理模型更倾向于结构化几何或流动条件化，而非向所有点注入单一全局流动向量。
    - 与强基线比较并报告相对误差是神经代理模型的主要证据方式。
    - LLM科学工作流在将规划/意图与确定性执行分离、并受领域知识约束时获益。
    分歧:
    - 表示路线不同：谱几何编码、点云流态注意力和速度梯度三重分解并存。
    - 评测目标不同：有的关注表面场预测基准，有的关注端到端物理发现或模型推荐。
    - 交互模式不同：直接神经代理推理与LLM编排确定性工具/物理库。
    - 成本精度优先级不同：一些方法强调数量级CFD加速，另一些以更高计算成本换取精度。
    开放问题:
    - 当前几何与流动条件化代理对未见非NACA几何、可压缩/非定常/三维工况的迁移性如何？
    - LLM编排中的本体纠正效果在超过两个领域和不同检索条件下是否持续？
    - 需要哪些最低限度消融与来源信息，才能隔离方法贡献与数据规模、基线强度、指标和实现细节？
    - 激波捕捉、数据稀缺、可扩展性或端到端物理一致性，哪一项应作为气动代理方法质量核心？
