  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for aerodynamic surrogates
      what_it_solves: Creates shared geometry-to-flow prediction tasks and datasets,
        making claims comparable across architectures; SHIFT-Truck adds open-cargo-bed
        pickup-truck simulations and controlled distribution shifts.
      what_remains_open: Coverage beyond current geometries and operating settings;
        strong in-distribution models can substantially degrade under operating-point,
        tessellation, and cross-vehicle shifts.
    - line: Metric and stress-test design
      what_it_solves: Goes beyond aggregate accuracy by probing shock/discontinuity
        capture, OOD Reynolds extrapolation, velocity-field accuracy, drag rank correlation,
        residual reduction, and robustness under distribution shift.
      what_remains_open: Alignment of proxy metrics with downstream aerodynamic design
        or optimization decisions, and stability of metric-based rankings across unseen
        settings.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Supports auditability through common baselines, benchmark splits,
        error metrics, and ablation comparisons; some work reports speedups relative
        to CFD solvers.
      what_remains_open: Uneven code/dataset/artifact release and missing or incomplete
        limitation statements make reproducibility and cross-implementation stability
        uncertain.
    - line: Solver-coupled and agentic validation workflows
      what_it_solves: Uses neural surrogates as initial guesses for Newton-Krylov
        CFD correction or uses LLM-agent reasoning for turbulence component analysis,
        shifting evaluation toward downstream reliability and physical discovery.
      what_remains_open: Whether these workflows generalize beyond the demonstrated
        transonic airfoil, flying-wing, or periodic-hill cases; explicit limitations
        are often absent.
    consensus:
    - Most work evaluates on shared aerodynamic benchmarks and reports field or force
      errors against strong baselines, including velocity-field MSE, REL-L2, drag
      MSE, and drag rank correlation.
    - There is growing agreement that in-distribution surrogate accuracy is not sufficient;
      distribution shifts, OOD Reynolds extrapolation, solver correction, and stress
      tests are needed to reveal generalization failures.
    - Reported gains are often framed as error reductions and speedups relative to
      CFD solvers or prior surrogate baselines, with ablations used to isolate modeling
      components.
    - Dataset and benchmark papers treat high-fidelity simulation, wind-tunnel verification,
      and grouped splits as important for trustworthy comparison.
    disagreements:
    - 'Evaluation objects differ: surface pressure prediction, full velocity fields,
      aerodynamic forces through learned quadrature, CFD residual correction, and
      turbulence component discovery are optimized separately, so errors are not directly
      comparable.'
    - 'Methodological emphasis differs: some approaches improve surrogate architectures
      through attention/routing and domain decomposition, while others couple surrogates
      to numerical solvers or use LLM-agent reasoning.'
    - 'Robustness evidence differs: benchmark-focused work exposes substantial degradation
      under operating-point, tessellation, and cross-vehicle shifts, while several
      method-focused papers report OOD improvements but omit explicit limitations
      or reproduction artifacts.'
    - 'Computational tradeoffs differ: one direction accepts higher inference cost
      for accuracy, while another reports large speedups relative to CFD and another
      reports solver-coupled overhead; no single cost/accuracy norm is established.'
    open_questions:
    - How do in-distribution benchmark gains translate across unseen operating conditions,
      mesh tessellations, and vehicle geometries, and which surrogate properties explain
      architecture-level robustness differences?
    - Do current aerodynamic error metrics align with downstream design, optimization,
      or control decisions, or do they reward numerically small field errors that
      may not matter for a chosen application?
    - Are benchmark rankings stable under different implementations, compute budgets,
      random seeds, and retraining, given the uneven availability of code, datasets,
      and detailed limitation statements?
    - Can solver-coupled Newton-Krylov correction and LLM-agent flow analysis be generalized
      beyond the demonstrated transonic airfoil, flying-wing, and periodic-hill cases
      without hidden task-specific assumptions?
    - Is there a shared reporting standard for computational cost, artifact release,
      and failure cases that would make surrogate performance across benchmarks more
      auditable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向气动代理的基准任务与数据集设计
      解决的问题: 构建共享的几何到流动预测任务与数据集，使不同架构的表现可比；例如 SHIFT-Truck 增加开放式货厢皮卡模拟和受控分布偏移。
      尚未覆盖: 当前几何与运行设置之外的覆盖不足；分布内强模型在运行点、网格离散和跨车辆偏移下可能显著退化。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合精度之外考察激波/间断捕捉、OOD Reynolds 外推、速度场误差、阻力秩相关、残差下降和分布偏移鲁棒性。
      尚未覆盖: 代理指标与下游气动设计或优化决策之间的对齐，以及基于指标的排序在未见设置下的稳定性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享基线、评测切分、误差指标和消融比较支持结果可审计；部分工作还报告相对 CFD 求解器的加速。
      尚未覆盖: 代码、数据集和工件发布不均衡，局限性说明常缺失，使可复现性和跨实现稳定性不确定。
    - 路线: 求解器耦合与智能体验证工作流
      解决的问题: 将神经代理作为 Newton-Krylov CFD 校正的初值，或用 LLM 智能体推理进行湍流分量分析，把评估转向下游可靠性和物理发现。
      尚未覆盖: 这些工作流能否在已演示的跨音速翼型、flying-wing 或 periodic hill 之外泛化；显式局限性常缺失。
    共识:
    - 多数工作使用共享空气动力学基准，并基于强基线报告速度场 MSE、REL-L2、阻力 MSE 和阻力秩相关等误差。
    - 越来越多工作认为分布内代理精度不够；分布偏移、OOD Reynolds 外推、求解器校正和压力测试能揭示泛化失败。
    - 结果通常以相对 CFD 或已有代理基线的误差降低和加速表示，并通过消融分离建模组件的作用。
    - 数据集与基准工作强调高保真仿真、风洞验证和按几何分组切分对于可信比较很重要。
    分歧:
    - 评测对象不同：表面压力、全速度场、经学习积分得到的气动力、CFD 残差校正和湍流分量发现被分别优化，误差不可直接比较。
    - 方法重点不同：一些通过注意力/路由/域分解改进代理架构，另一些将代理耦合到数值求解器，或用 LLM 智能体推理。
    - 鲁棒性证据不同：基准工作揭示模型在运行点、网格离散和跨车辆偏移下明显退化，而部分方法工作报告 OOD 改进却缺失显式局限性或复现工件。
    - 计算代价取舍不同：一个方向为精度接受更高推理成本，另一个相对 CFD 报告大幅加速，还有一个报告求解器耦合开销；尚无统一成本/精度规范。
    开放问题:
    - 分布内基准收益如何在未见运行条件、网格离散和车辆几何之间转移，哪些代理特性导致不同架构的鲁棒性差异？
    - 当前气动误差指标是否与下游设计、优化或控制决策一致，还是可能奖励对应用无意义的数值上偏小的场误差？
    - 在代码、数据集和详细局限性说明不均衡的情况下，基准排序是否能在不同实现、算力预算、随机种子和重训练下保持稳定？
    - 求解器耦合 Newton-Krylov 校正和 LLM 智能体流动分析能否超越已演示的跨音速翼型、flying-wing 和 periodic hill
      案例，而不依赖隐藏任务假设？
    - 是否存在对计算成本、工件发布和失败案例的统一报告标准，使不同基准上的代理性能更可审计？
