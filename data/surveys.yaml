      what_it_solves: Creates reusable CFD datasets and controlled splits to test
        surrogate accuracy, scalability, and robustness under operating-point, tessellation,
        and cross-vehicle shifts.
      what_remains_open: Tested models show no unified robustness across distribution
        shifts, and benchmark error can misalign with physically relevant flow statistics.
