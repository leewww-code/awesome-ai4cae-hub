  literature_review:
    line_of_work_matrix:
    - line: End-to-end aerodynamic shape-optimization systems with neural surrogate
        and selective solver feedback
      what_it_solves: Converts knowledge constraints and deformation parameters into
        CFD-validated design improvements while using uncertainty to decide when to
        call the physical solver.
      what_remains_open: External validation beyond in-house MPV/SUV/Sedan datasets
        and broader geometry classes is not yet demonstrated.
    - line: Geometry-conditioned neural surrogates for fast aerodynamic field and
        scalar prediction
      what_it_solves: Maps geometry and flow conditions to pressure/velocity fields
        or aerodynamic forces with large speedups over repeated CFD.
      what_remains_open: Generalization remains bounded by steady, incompressible,
        2D/limited 3D regimes and by added computational cost for some attention-based
        models.
    - line: Solver-coupled surrogate-Newton correction pipelines
      what_it_solves: Uses learned field predictions as initial guesses for Newton-Krylov
        CFD to improve terminal numerical convergence, reliability, and optimization
        speed.
      what_remains_open: Evidence covers transonic airfoil optimization and a 3D flying-wing
        case but leaves broader unsteady, high-speed, and industrial workflows unverified.
    - line: High-fidelity CFD dataset and benchmark suites with controlled distribution
        shifts
      what_it_solves: Provides standardized public data and evaluation for surrogate
        robustness across geometry, operating condition, surface tessellation, and
        vehicle class.
      what_remains_open: Independent cross-team reproduction and expansion to more
        regimes, vehicle classes, and transient flow physics remain open.
    - line: Agentic LLM-driven flow component analysis frameworks
      what_it_solves: Automates flow decomposition, visualization, consistency checking,
        and model recommendation for turbulence physics discovery.
      what_remains_open: Reproducibility of LLM reasoning and failure modes on unseen
        flow configurations are not fully established by the provided evidence.
    consensus:
    - Neural surrogates are treated as a core mechanism for accelerating aerodynamic
      analysis and design, either replacing repeated CFD or supplying better initial
      guesses.
    - Model evaluation typically combines prediction error such as MAPE or relative
      L2 error with CFD speedup, and increasingly adds uncertainty, solver coupling,
      or distribution-shift checks to address trust.
    - Public or structured datasets and benchmarks are becoming central for measuring
      generalization under stated conditions, though their scope is often limited
      to specific flow regimes and geometry families.
    - In-distribution surrogate accuracy is not considered sufficient for deployment;
      robustness under shifted operating points, surface discretizations, or vehicle
      classes is a recurring concern.
    disagreements:
    - 'Representation choices differ: point-cloud and flow-state attention versus
      spectral geometry conditioning versus graph/operator learning versus volume/grid
      field prediction.'
    - 'System role differs: standalone surrogate prediction versus solver-coupled
      Newton-Krylov correction versus shape-optimization loop with CFD feedback versus
      autonomous agentic analysis.'
    - 'Evaluation target differs: surface pressure fields versus full velocity/pressure
      fields versus drag and shape optimization; 2D airfoils versus 3D aircraft versus
      pickup-truck flow.'
    - 'Reliability strategy differs: uncertainty-triggered solver feedback versus
      terminal numerical correction versus controlled distribution-shift benchmarking
      versus LLM-driven consistency review.'
    - 'Computational and deployment setting differs: some systems accept higher inference
      cost for accuracy, while others emphasize generation-level speedup in optimization
      loops.'
    open_questions:
    - How well do neural surrogate systems maintain accuracy and calibration under
      operational distribution shifts such as speed changes, tessellation changes,
      and cross-vehicle transfer?
    - Can solver-coupled surrogate-Newton and agentic systems scale from steady 2D/limited
      3D cases to unsteady, compressible, high-Reynolds industrial workflows without
      prohibitive cost?
    - What benchmark designs and metrics best capture engineering value beyond in-distribution
      error, including robustness, computational cost, and integration constraints?
    - To what extent can LLM-driven physics discovery be trusted for turbulence model
      recommendations, and what independent verification or failure-mode reporting
      is needed?
    - Independent reproduction remains a verification gap because many entries in
      the packet lack visible code, dataset, artifact, or external evaluation evidence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端气动形状优化系统，结合神经代理与选择性求解器反馈
      解决的问题: 将知识约束和变形参数转化为经CFD验证的设计改进，并利用不确定性决定何时调用物理求解器。
      尚未覆盖: 尚未展示在内部MPV/SUV/Sedan数据集之外及更广泛几何类别上的外部验证。
    - 路线: 几何条件化神经代理，用于快速气动场与标量预测
      解决的问题: 将几何和流动条件映射到压力/速度场或气动力，相对重复CFD实现数量级加速。
      尚未覆盖: 泛化范围仍受限于稳态、不可压缩、二维或有限三维工况，部分注意力模型计算成本较高。
    - 路线: 求解器耦合的surrogate-Newton校正流程
      解决的问题: 将学习得到的流场预测作为Newton-Krylov迭代初值，提升终端数值收敛、可靠性与优化速度。
      尚未覆盖: 证据覆盖跨音速翼型优化和三维飞翼案例，但更广的非稳态、高速与工业工作流尚未验证。
    - 路线: 带受控分布偏移的高保真CFD数据集与基准套件
      解决的问题: 提供标准化公开数据和评估框架，衡量代理模型在几何、运行条件、表面离散化与车型变化下的鲁棒性。
      尚未覆盖: 跨团队独立复现以及向更多工况、车型和瞬态物理扩展仍不充分。
    - 路线: 智能体LLM驱动的流动分量分析框架
      解决的问题: 自动化流场分解、可视化、一致性检查与湍流模型推荐，用于物理发现。
      尚未覆盖: LLM推理在未知流动构型上的可复现性与失败模式尚未被充分证明。
    共识:
    - 神经代理被视为加速气动分析与设计的核心机制，要么替代重复CFD，要么提供更好的初值。
    - 评估通常同时报告预测误差和CFD加速比，并逐步增加不确定性反馈、求解器耦合或分布偏移检查来增强可信度。
    - 公开或结构化数据集与基准正在成为衡量泛化能力的关键手段，但其范围常局限于特定流动工况和几何族。
    - 仅看分布内精度不足以支持部署；运行点、表面离散化和车辆类别变化下的鲁棒性被反复关注。
    分歧:
    - 表示方式不同：包括点云与流态注意力、谱几何条件化、图/算子学习以及体/网格场预测。
    - 系统角色不同：纯代理预测、求解器耦合Newton-Krylov校正、带CFD反馈的形状优化、自主智能体分析。
    - 评测目标不同：表面压力场、完整速度/压力场、阻力与形状优化，以及二维翼型、三维飞行器、皮卡流动等。
    - 可靠性策略不同：不确定性触发求解器反馈、终端数值校正、受控分布偏移基准测试、LLM一致性审查。
    - 计算与部署取舍不同：部分系统接受更高推理成本换取精度，部分系统侧重优化循环中的加速比。
    开放问题:
    - 神经代理系统在速度变化、离散化变化和跨车型迁移等运行分布偏移下能否保持精度与校准能力？
    - 求解器耦合surrogate-Newton和智能体系统能否从稳态二维/有限三维拓展到非稳态、可压缩、高雷诺工业流程，同时避免过高成本？
    - 哪些基准设计和指标能更好衡量在分布内误差之外的工程价值，包括鲁棒性、计算成本和集成约束？
    - LLM驱动的物理发现能否被信任用于湍流模型推荐，需要哪些独立验证或失败模式报告？
    - 由于大量条目缺少可见代码、数据集、工件或外部评估证据，独立复现仍是验证缺口。
