  literature_review:
    line_of_work_matrix:
    - line: Solver-coupled and feedback-driven aerodynamic surrogates
      what_it_solves: Converts neural flow or drag predictors into reliable design-loop
        components by coupling them with Newton-Krylov CFD correction or uncertainty-triggered
        physical feedback.
      what_remains_open: External validation beyond in-house vehicle and airfoil cases,
        and robustness across broader industrial geometries, solvers, and deployment
        environments.
    - line: Public aerodynamic datasets and neural-surrogate benchmarks
      what_it_solves: Provides comparable high-fidelity RANS or DDES evaluation artifacts
        and controlled distribution-shift tests for geometry-to-flow, pressure, and
        velocity prediction.
      what_remains_open: Cross-dataset and cross-vehicle robustness, stability of
        metric meanings, and independent reproduction across teams and infrastructure.
    - line: Fast geometry-conditioned surrogate serving for design exploration
      what_it_solves: Reduces prediction latency and compute burden through continuous
        field predictors, spectral geometry conditioning, or flow-state attention
        models for rapid aerodynamic screening.
      what_remains_open: Trade-offs among inference speed, field fidelity, shape coverage,
        and computation cost remain unresolved for deployment.
    - line: Agentic and physics-grounded analysis frameworks
      what_it_solves: Automates flow-component decomposition, physical discovery,
        or sensitivity diagnosis around neural operators and turbulence data using
        LLM agents or input interventions.
      what_remains_open: Physical-diagnostic standardization, multi-benchmark consistency,
        auditability, and independent reproducibility of agent conclusions.
    consensus:
    - Work centers on learned surrogate models embedded in aerodynamic workflows rather
      than isolated predictors; optimization, solver correction, or automated reasoning
      surrounds the learned component.
    - High-fidelity CFD simulations or paired experimental measurements provide the
      main training and validation signal, with emphasis on aerodynamic quantities
      such as pressure, velocity, drag, and Reynolds stress.
    - 'Across the evidence, there is a shared concern for distribution shift: unseen
      geometries, operating conditions, surface discretization, and simulation-to-real
      transfer are actively tested.'
    - Benchmark artifacts and datasets are treated as core research outputs, though
      code and independent-replication evidence vary.
    disagreements:
    - 'Role of surrogate output differs: some treat neural predictions as final approximations,
      while others use them only as initial guesses for Newton-Krylov iterations or
      triggers for additional CFD feedback.'
    - Representation choices differ across spectral geometry conditioning, point-cloud
      flow-state attention, graph and operator architectures, and LLM-based multi-agent
      reasoning.
    - 'Evaluation targets differ: aggregate L2 or percentage error is central in some
      studies, while others emphasize physical diagnostics such as fluctuation energy,
      Reynolds stress, shock capture, or trend consistency.'
    - Deployment settings differ from in-house vehicle shape optimization to public
      two-dimensional airfoil, three-dimensional aircraft, and pickup-truck benchmarks,
      covering different shape families and flow regimes.
    - 'Learning and feedback signals differ: direct supervised regression, uncertainty-selected
      CFD samples, solver-based correction, and physics-decomposition-guided reasoning
      coexist without a shared protocol.'
    open_questions:
    - Do lower aggregate benchmark errors translate to better physical predictions
      for wind-tunnel or particle-image-velocimetry flow statistics, given observed
      misalignment between scores and fluctuation-energy errors?
    - Can solver-coupled and uncertainty-triggered correction frameworks scale beyond
      the reported airfoil and in-house vehicle cases to diverse industrial geometries
      and operating envelopes?
    - Which benchmark, artifact, and code standards are necessary to detect model
      failures under operating-point, tessellation, and cross-vehicle distribution
      shifts without overfitting to specific architectures?
    - How can agentic flow-analysis and physics-discovery workflows be independently
      reproduced, audited, and validated across datasets, infrastructure, and teams?
    - What latency-fidelity-cost trade-offs are acceptable for deployable design loops
      when higher-accuracy surrogates may incur substantially higher computational
      cost?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 神经代理与CFD反馈的求解器耦合工具链
      解决的问题: 将神经流场或阻力预测转化为可靠设计循环组件，通过Newton-Krylov校正或不确定性触发CFD反馈提升精度与可靠性。
      尚未覆盖: 内部车型或翼型以外的工业几何、外部部署、以及不同求解器与硬件环境下的稳健性。
    - 路线: 公开气动数据集与神经代理评测基准
      解决的问题: 提供高保真RANS或DDES数据与受控分布偏移测试，比较不同架构在几何到流场、压力和速度预测上的能力。
      尚未覆盖: 跨数据集和跨车型鲁棒性、指标含义稳定性、以及跨团队与基础设施的独立复现。
    - 路线: 面向设计探索的快速几何条件代理服务
      解决的问题: 通过连续场预测、谱几何编码或流态注意力降低CFD计算成本，支持快速气动筛选与设计反馈。
      尚未覆盖: 推理速度、流场保真度、形状覆盖范围与计算成本之间的部署权衡。
    - 路线: 自动化与物理可解释的分析框架
      解决的问题: 使用LLM多智能体或输入干预自动完成流动分量分解、物理发现与神经算子敏感性诊断。
      尚未覆盖: 物理诊断标准化、多基准一致性、结论可审计性与智能体流程的独立复现。
    共识:
    - 证据集中在将学习代理嵌入气动工作流，而非孤立预测器；优化、求解器校正或自动分析系统围绕代理构建。
    - 高保真CFD模拟或配对实验结果作为训练与验证基础，重点关注压力、速度、阻力和Reynolds应力等物理量。
    - 研究普遍关注训练分布之外的泛化，包括未见几何、运行点、表面离散化和模拟到真实差异。
    - 数据与基准逐步成为核心研究产出，但代码公开与独立复现证据仍不均衡。
    分歧:
    - 代理预测的角色不同：有些把神经网络输出作为最终近似，有些仅作为Newton-Krylov初值或触发额外CFD反馈。
    - 表示方式不同：谱几何编码、点云流态注意力、图和算子架构、以及LLM多智能体推理分别被采用。
    - 评测目标不同：聚合L2或百分比误差在部分研究中优先，另一些强调脉动能量、Reynolds应力、激波或趋势一致性等物理诊断。
    - 部署场景不同：内部车型优化、公开二维翼型、三维飞机和皮卡基准覆盖不同几何族与流态。
    - 学习与反馈信号不同：直接回归、不确定性选样CFD、求解器校正和物理分解引导推理共存，缺乏统一协议。
    开放问题:
    - 聚合基准分数更低是否意味着风洞或PIV流场统计的物理预测更优，尤其当基准误差与脉动能量误差出现背离时？
    - 求解器耦合与不确定性触发反馈能否从已报告的翼型和内部车型案例扩展到更广泛工业几何与运行边界？
    - 需要怎样的基准、工件和代码标准，才能稳定暴露模型在运行点、离散化和跨车型分布偏移下的失效？
    - 智能体流动分析与物理发现流程如何在跨团队、数据集和基础设施条件下独立复现、审计与验证？
    - 可部署设计回路中，更高精度代理带来的延迟和计算成本与保真度之间应建立何种权衡？
