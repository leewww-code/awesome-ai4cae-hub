    benchmarks dominate, especially fast pressure/velocity prediction for airfoils
    and aircraft, with secondary lines in physics-informed solving, multi-fidelity
    regression, design-space exploration, and fluid control.'
  - 'Shared research pattern: Most works replace or accelerate expensive CFD/RANS
    evaluations by learning geometry-to-flow or boundary-to-quantity mappings, then
    evaluate accuracy, speed, and some form of generalization or uncertainty on engineering
    geometries.'
  - 'Key differences: The sample splits into supervised CFD/RANS surrogates, data-free
    physics-informed PDE solving, probabilistic multi-fidelity regression, procedural
    design generation, vibration mitigation, and offline control; evaluation targets
    range from 2D airfoils to 3D aircraft and ship layouts.'
  - 'Trend evolution: Available top evidence is concentrated in 2023 and 2026. The
    observable shift is from a general operator-learning architecture in 2023 toward
    domain-specific aerodynamic datasets, benchmarks, dimension bridging, physics-informed
    solving, and engineering design/control in 2026.'
  - 'Open questions: Whether surrogate accuracy and CFD speedups transfer to unseen
    non-NACA geometries, unsteady/compressible regimes, full 3D fields, and closed-loop
    industrial constraints; whether data-free and multi-fidelity methods scale beyond
    current benchmarks.'
  related_work_outline_zh:
