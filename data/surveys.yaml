    - 评测目标不同：有的重建连续流场，有的预测表面压力或气动系数，有的做LES超分辨率。
    - 研究范围不同：二维稳态亚音速翼型与三维工业飞机/湍流通道流假设差异明显。
    - 不确定性处理不同：高斯泛函回归显式给出用于自适应采样的UQ，许多基准仅报告精度和扩展性。
