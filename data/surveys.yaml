    low-to-high dimensional correction kernels.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2026, so the
    visible trend is within the current frontier: public datasets, benchmarked operator
    architectures, adaptive mesh forecasting, and uncertainty-aware 3D scaling.'
  - 'Open questions: Generalization beyond 2D NACA/steady subsonic regimes, reproducibility
    of public pipelines, robustness to shocks/turbulence/data scarcity, and consistency
    of benchmark comparisons remain unresolved.'
  related_work_outline_zh:
  - 主流方向：面向工程 CFD 的数据驱动气动代理建模，尤其集中在翼型/飞机气动场景，用神经模型预测压力、速度或气动系数以加速仿真。
  - 研究共性：构建或利用 CFD/RANS/LBM 数据集，学习快速代理、算子模型、物理信息网络或修正模型，并以几何、网格和物理约束为核心归纳偏置。
  - 关键差异：表示和监督信号不同，包括谱几何编码器、四叉树网格分词、无数据物理残差以及低维到高维修正核等路线。
  - 趋势演进：现有 top 论文证据集中在 2026 年，可见趋势处于当前前沿内部：公开数据集、算子架构基准、自适应网格预测和不确定性感知的三维扩展。
  - 开放问题：二维 NACA/稳态亚音速之外的泛化、公开流水线复现性、对激波/湍流/数据稀缺的鲁棒性，以及基准比较的一致性问题仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates and public RANS datasets
        (e.g., Airfoil2Vec)
      what_it_solves: Fast pressure and velocity field prediction for airfoil and
        automotive-type geometries, replacing expensive CFD evaluation with learned
        surrogates.
      what_remains_open: Evidence is limited to steady, incompressible, 2D subsonic
        NACA 4-digit/automotive regimes; transfer to unsteady, 3D, compressible, and
        non-NACA engineering shapes is not verified.
    - line: Operator-learning architecture benchmarking for aerodynamic surface prediction
        (e.g., Bi-Stride Multi-Scale Graph Neural Network, Transolver(++))
      what_it_solves: Evaluates deep operator architectures for aerodynamic surface
        pressure prediction under shock capture, mesh scalability, and data scarcity
        requirements.
      what_remains_open: Abstract reports no explicit limitations; only four architectures
        are covered, and reproducibility signals for code/dataset are weak.
    - line: Validated simulation datasets and adaptive-mesh PDE forecasting pipelines
        (e.g., WAKESET, WAMRViT, LBM dataset)
      what_it_solves: Provides public turbulent/obstructed-flow data and long-horizon
        PDE forecasting on adaptive mesh refinement data using quadtree tokenization
        and transformers.
      what_remains_open: Several analysis fields are missing in the packet; validation
        beyond specific 3D channel/wake/turbulence and AMR settings remains open.
    - line: Physics-informed and uncertainty-aware surrogate corrections (e.g., NeuralFlowNet,
        Gaussian Functional Regression, UQ-SHRED)
      what_it_solves: Reduces dependence on high-dimensional CFD data through data-free
        PINN solving, 2D-to-3D RANS correction, and uncertainty quantification for
        sparse sensing.
      what_remains_open: Performance depends on selecting a suitable low-dimensional
        model; comparative benchmark coverage and detailed limitation evidence are
        incomplete.
    consensus:
    - Neural surrogates are positioned as CFD accelerators for pressure, velocity,
      or aerodynamic coefficients rather than complete replacements for physical simulation.
    - Public datasets and benchmark protocols are treated as first-class contributions,
      not just auxiliary model results.
    - Geometry, discretization, and physical constraints are central inductive biases
      for improving generalization beyond training cases.
    - Uncertainty quantification and scaling to industrial 3D or data-scarce settings
      are recognized as important evaluation concerns, but consistent evaluation standards
      are not yet established.
    disagreements:
    - 'Representation choices differ: spectral geometry encoders, graph/operator architectures,
      quadtree tokenization, and functional regression kernels coexist.'
    - 'Training signal differs: high-fidelity CFD/RANS/LBM datasets versus data-free
      physics-informed residuals and low-to-high dimensional correction pathways.'
    - 'Evaluation targets differ: 2D NACA airfoils, 3D aircraft, obstructed channel
      flows, turbulent wakes, and sparse sensing settings vary in emphasis on shocks,
      turbulence, or real-time speed.'
    - 'Deployment assumptions differ: real-time aerodynamic coefficient surrogates,
      long-horizon adaptive-mesh PDE forecasting, and uncertainty-aware sparse sensing
      are not interchangeable problem settings.'
    open_questions:
    - Do geometry-conditioned surrogates trained on 2D NACA 4-digit/steady subsonic
      data transfer to non-NACA, unsteady, compressible, or 3D engineering components?
    - Which operator-learning inductive biases remain reliable under simultaneous
      industrial-scale meshes, shocks, turbulence, and data scarcity when several
      benchmark papers do not state limitations?
    - How do data-free physics-informed solvers compare with dataset-driven surrogates
      on identical aerodynamic benchmarks and metrics?
    - What validation and reproducibility floor is needed for public LBM/CFD dataset
      and pipeline contributions when code, dataset links, and limitation evidence
      are incomplete?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件化气动场代理与公开 RANS 数据集（如 Airfoil2Vec）
      解决的问题: 对翼型与汽车类几何快速预测压力场和速度场，以学习代理替代昂贵的 CFD 评估。
      尚未覆盖: 证据限于稳态、不可压缩、二维亚音速 NACA 4-digit/汽车气动区域；向非稳态、三维、可压缩及非 NACA 工程形状的迁移未经验证。
    - 路线: 面向气动表面预测的算子学习架构基准（如 Bi-Stride Multi-Scale Graph Neural Network、Transolver(++)）
      解决的问题: 在激波捕捉、网格可扩展性和数据稀缺条件下，评测深度算子架构的气动表面压力预测能力。
      尚未覆盖: 摘要未给出明确局限性；仅覆盖四种架构，代码和数据集的复现信号较弱。
    - 路线: 经校验的仿真数据集与自适应网格 PDE 预测流水线（如 WAKESET、WAMRViT、LBM 数据集）
      解决的问题: 提供公开湍流/含障碍流动数据，并利用四叉树分词和 Transformer 在自适应网格细化数据上进行长时程 PDE 预测。
      尚未覆盖: 数据包中若干分析字段缺失；在特定三维通道/尾流/湍流和 AMR 设置之外的验证仍不足。
    - 路线: 物理信息与不确定性感知代理修正（如 NeuralFlowNet、Gaussian Functional Regression、UQ-SHRED）
      解决的问题: 通过无数据物理信息求解、2D 到 3D RANS 修正以及稀疏传感不确定性量化，降低对高维 CFD 数据的依赖。
      尚未覆盖: 性能依赖低维模型选择；比较基准覆盖和详细的局限性证据仍不完整。
    共识:
    - 神经代理被定位为 CFD 加速器，用于压力、速度或气动系数预测，而非完全替代物理仿真。
    - 公开数据集与基准协议被作为一级贡献，而不是仅作为模型结果的附属。
    - 几何、离散化和物理约束是提升训练外泛化能力的核心归纳偏置。
    - 不确定性量化与向工业三维或数据稀缺场景扩展被视为重要评测关切，但尚未形成一致评测标准。
    分歧:
    - 表示选择不同：谱几何编码器、图/算子架构、四叉树分词和函数回归核并存。
    - 监督信号不同：高保真 CFD/RANS/LBM 数据集、无数据物理信息残差以及低维到高维修正路径各有侧重。
    - 评测目标不同：二维 NACA 翼型、三维飞机、含障碍通道流、湍流尾流和稀疏传感等设置并存，对激波、湍流或实时性的强调不一。
    - 部署假设不同：实时气动系数代理、长时程自适应网格 PDE 预测和不确定性感知稀疏传感并非同一问题设置。
    开放问题:
    - 基于二维 NACA 4-digit/稳态亚音速数据训练的几何条件化代理，能否迁移到非 NACA、非稳态、可压缩或三维工程部件？
    - 当工业级网格、激波、湍流与数据稀缺同时存在时，哪些算子学习归纳偏置仍然可靠，而若干基准论文未明确指出局限性？
    - 无数据物理信息求解器与数据驱动代理在相同气动基准和指标下如何比较？
    - 当代码、数据集链接和局限性证据不完整时，公开 LBM/CFD 数据集与流水线需要何种最低验证与复现标准？
