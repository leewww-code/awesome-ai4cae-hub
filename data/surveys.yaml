    - line: Physical consistency in reduced-order unsteady or agent models
      what_it_solves: Derives recurrences or kinetic theories that enforce consistency
        conditions such as vortex-sheet continuity, trailing-edge zero loading, or
        gated self-evolution behavior in agent dynamics.
      what_remains_open: Comparison with high-fidelity simulations or experiments
