  literature_review:
    line_of_work_matrix:
    - line: Surrogate-driven optimization and solver-coupled correction
      what_it_solves: Turns learned flow surrogates into end-to-end aerodynamic design
        or CFD-acceleration workflows, improving drag or convergence speed while preserving
        some physical consistency.
      what_remains_open: Visible evaluation uses in-house vehicle datasets or specific
        airfoil benchmarks; external deployment and reliability outside those settings
        are not established.
    - line: Geometry- and flow-conditioned neural surrogates for fast field prediction
      what_it_solves: Predicts pressure, velocity, or aerodynamic coefficients from
        geometry and operating conditions, offering orders-of-magnitude speedup over
        CFD.
      what_remains_open: Generalization under speed, tessellation, and cross-vehicle
        shifts remains weak for some models, and high-accuracy architectures can carry
        higher computational cost.
    - line: Benchmarks, datasets, and agentic analysis infrastructure
      what_it_solves: Provides reusable high-fidelity simulation data, standardized
        model comparisons, and automated flow-component analysis for reproducibility
