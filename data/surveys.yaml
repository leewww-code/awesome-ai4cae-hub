  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design for fluid and aerodynamic learning
      what_it_solves: 'Converts physical simulation tasks into concrete representations,
        losses, and architectures: spectral geometry encoding in Airfoil2Vec, flow-state
        attention in FSAN, augmented graph neural ODEs in GNODE, and SA-AI''s closure-variable
        transition indicator.'
      what_remains_open: Unclear which choices transfer beyond reported flow regimes
        or benchmark geometries; FSAN's accuracy costs more compute; SA-AI lacks quantitative
        error metrics in the abstract.
    - line: Planning, tool orchestration, and design-interface methods
      what_it_solves: Connects learned or CFD-based analysis to decisions and actions
        through LLM agents, deterministic tools, ontologies, or design frameworks;
        examples include ontology-grounded MCP orchestration, PhysMiner's multi-agent
        decomposition, and an urban wind turbine dendrogram framework.
      what_remains_open: Strategic errors persist; ontology benefit depends on scoped
        retrieval; generalization beyond two domains or five benchmarks and site-specific
        Parisian validation is unverified.
    - line: Method evidence and ablation protocol for aerodynamic learning methods
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects via architecture benchmarks on shock capture, scalability,
        and data scarcity, or ablations of ontology and retrieval choices.
      what_remains_open: Benchmark rankings may still be confounded by training recipes
        or hyperparameter tuning; reproducibility signals such as code, dataset, and
        artifact availability are incomplete; several limitations are not quantified.
    consensus:
    - Methods generally embed physical or geometric structure as a representational
      prior or workflow constraint rather than treating simulation as purely generic
      regression.
    - Evaluation is dominated by CFD-derived benchmarks, simulation datasets, and
      baseline or physical-criteria comparisons such as relative L2 error, MAPE, and
      FAC2.
    - A recurring goal is replacing or accelerating conventional CFD/RANS analysis
      while maintaining physical fidelity for aerodynamic or energy yield decisions.
    - Recent agentic methods share a pattern of constraining LLM reasoning with deterministic
      tools, domain ontologies, or review loops.
    - 'Reproducibility evidence is uneven: several papers report methodology and ablation
      detail, but code, dataset, and artifact availability remain unverified.'
    disagreements:
    - 'Representation choices differ: spectral geometry encoders, point-cloud flow-state
      attention, augmented graph neural ODEs, and a RANS closure variable used as
      a transition indicator.'
    - 'Interaction modes differ: direct learned surrogate prediction, LLM-guided tool
      execution, and measurement-calibrated CFD digital twin design.'
    - 'Evaluation targets differ: continuous velocity/pressure fields, surface pressure/forces,
      turbulence transition, tool selection and interpretation accuracy, and urban
      wind energy yield.'
    - 'Flow regimes and controls differ: steady incompressible 2D subsonic flow, transient
      pitching with exogenous controls, industrial 3D aircraft configurations, and
      urban atmospheric flow.'
    - 'Evidence isolation differs: some studies use ablations to isolate ontology
      or retrieval effects, while others rely on benchmark comparisons or physical
      validation without quantitative error metrics.'
    open_questions:
    - How well do learned surrogates generalize to unseen non-NACA airfoils, unsteady
      or compressible regimes, and industrial 3D cases beyond reported tests?
    - Does the flow-state attention surrogate retain its accuracy advantage under
      matched computational budget, given that it is reported to cost more than baselines?
    - Can ontology- and tool-orchestrated LLM workflows maintain correctness beyond
      the two domains or five benchmarks in the evidence?
    - What quantitative transition-prediction improvement does SA-AI provide relative
      to existing transition models?
    - Are reported architecture rankings confounded by dataset composition, training
      recipe, or baseline hyperparameter choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 流体与气动学习中的方法表示与目标设计
      解决的问题: 将物理仿真任务转化为具体表示、损失和架构，例如Airfoil2Vec的谱几何编码、FSAN的流态注意力、GNODE的图神经常微分方程，以及SA-AI的闭合变量转捩指示量。
      尚未覆盖: 尚不清楚哪些选择能迁移到报告之外流动状态或基准几何；FSAN的精度伴随更高计算成本；SA-AI在摘要中缺少定量误差。
    - 路线: 规划、工具编排与设计接口方法
      解决的问题: 通过LLM智能体、确定性工具、本体或设计框架，将学习或CFD分析连接到决策与行动；例如本体约束的MCP编排、PhysMiner多智能体分解和城市风电树状图框架。
      尚未覆盖: 策略性错误仍存在；本体收益依赖限定范围检索；两个领域或五个基准之外及巴黎场址特异的泛化性尚未验证。
    - 路线: 气动学习中的方法证据与消融协议
      解决的问题: 通过在激波捕捉、可扩展性和数据稀缺下的架构基准，或本体与检索选择的消融，将方法贡献与数据集、基线、指标和实现因素分离。
      尚未覆盖: 基准排名仍可能受训练配方或超参数调优混淆；代码、数据集和工件等可复现信号不完整；若干局限性未量化。
    共识:
    - 方法普遍将物理或几何结构作为表示先验或工作流约束，而不是把仿真视为纯通用回归。
    - 评估主要依赖CFD派生的基准、仿真数据集以及与基线或物理准则的比较，如相对L2误差、MAPE和FAC2。
    - 常见目标是替代或加速传统CFD/RANS分析，同时保持气动或风能产量决策所需的物理保真度。
    - 近期智能体方法形成共识模式：用确定性工具、领域本体或审查回路约束LLM推理。
    - 复现证据不均衡：多篇报告了方法和消融细节，但代码、数据集和工件可得性尚未验证。
    分歧:
    - 表示方式不同：谱几何编码、点云流态注意力、增广图神经常微分方程，以及作为转捩指示量的RANS闭合变量。
    - 交互模式不同：直接学习代理预测、LLM引导工具执行、实测校准CFD数字孪生设计。
    - 评测目标不同：连续速度/压力场、表面压力/力、湍流转捩、工具选择与解释准确率、城市风能产量。
    - 流动状态与控制不同：稳态不可压缩二维亚音速、带外源控制的瞬态俯仰、工业三维飞机配置、城市大气流动。
    - 证据隔离不同：部分研究通过消融分离本体或检索效应，另一些依赖基准比较或物理验证但缺少定量误差指标。
    开放问题:
    - 学习代理在未见非NACA翼型、非定常或可压缩流动以及工业三维场景上如何泛化？
    - 流态注意力代理被报告计算成本高于基线时，在匹配计算预算下是否仍保持精度优势？
    - 本体与工具编排的LLM工作流能否在两个领域或五个基准之外保持正确性？
    - SA-AI相较现有转捩模型的定量预测改进是多少？
    - 报告中的架构排名是否被数据集构成、训练配方或基线超参数选择所混淆？
