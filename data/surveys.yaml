  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned neural surrogate methods for aerodynamic fields
      what_it_solves: Learns geometry-to-flow-field mappings to predict continuous
        pressure/velocity and accelerate CFD, as illustrated by Airfoil2Vec.
      what_remains_open: Current evidence is limited to steady, incompressible, 2D
        subsonic NACA 4-digit airfoils; broader aerodynamic regimes remain unproven.
    - line: Flow-state attention and operator architectures for aerodynamic prediction
      what_it_solves: Models local geometry-flow interaction through learnable soft
        flow-state assignments instead of a single global flow vector, as in FSAN.
      what_remains_open: Reports higher accuracy at higher computational cost; evidence
        is concentrated on Emmi-Wing and DrivAerNet++ surface-pressure benchmarks.
    - line: Stochastic separable physics-informed neural methods
      what_it_solves: Introduces stochastic and separable representations for physics-informed
        neural PDE solving, as represented by S²-PINN.
      what_remains_open: The packet provides only title-level evidence; methodology,
        results, baselines, and limitations are empty, leaving contribution and transfer
        unverified.
    - line: LLM/agentic orchestration for scientific and flow analysis
      what_it_solves: Separates LLM intent interpretation, deterministic tool execution,
        and explanation; automates flow decomposition and physics reasoning with ontology
        or multi-agent constraints.
      what_remains_open: Reported domain coverage is small; strategic errors remain;
        ontology benefits depend on scoped retrieval; artifact and reproducibility
        signals are weak.
    - line: Self-auditing and calibrated trust for neural CFD surrogates
      what_it_solves: Uses RANS physics residuals and split-conformal calibration
        to flag unreliable predictions and provide coverage, as in NeuroForge.
      what_remains_open: Residuals are a reliable trust signal but a poor correction
        objective; learned corrector gains are not attributable to residual conditioning.
    - line: Benchmarking and evaluation protocols for deep operator architectures
      what_it_solves: Compares architectures on shock capture, scalability, and data
        scarcity for aerodynamic surface pressure prediction.
      what_remains_open: The abstract lacks explicit limitations; results focus on
        surface pressure, so other quantities and complex flow interactions remain
        open.
    - line: Measurement-calibrated CFD design frameworks for urban wind energy
      what_it_solves: Couples site anemometry with calibrated RANS digital twins to
        identify micro-wind turbine locations and evaluate aerodynamic interventions.
      what_remains_open: 'Findings are site- and device-specific: validated on Parisian
        Haussmannian blocks with Savonius rotor assumptions; abstract gives limited
        validation-metric detail.'
    consensus:
    - Methods are validated on structured simulation or measurement data rather than
      only qualitative arguments, using field-error, coverage, workflow-accuracy,
      or wind-yield metrics.
    - Explicit structure—geometry conditioning, flow-state assignment, physics residuals,
      ontology constraints, or calibrated digital twins—is used to constrain learned
      or LLM-driven behavior.
    - Targeted ablations are common for separating contributions such as retrieval
      scope, architecture choice, or residual conditioning, though artifact evidence
      is often missing.
    disagreements:
    - 'Representation choices differ: spectral geometry encodings, point-cloud attention
      with soft flow states, stochastic separable physics-informed networks, and deterministic
      RANS digital twins.'
    - 'Grounding and supervision differ: direct simulation-field supervision, physics-residual
      auditing, ontology-constrained tool execution, and measurement-calibrated validation
      target different failure modes.'
    - 'Primary objectives differ: prediction accuracy versus calibrated trust/error
      detection versus LLM workflow correctness versus site-specific energy yield.'
    - 'Compute trade-offs differ: some methods pursue accuracy at higher computational
      cost, while others emphasize orders-of-magnitude CFD speedup or workflow-level
      correctness.'
    open_questions:
    - Can geometry- and flow-state-conditioned surrogates generalize beyond steady,
      incompressible, 2D subsonic NACA-derived airfoils and reported benchmark geometries?
    - Why does reducing the RANS physics residual not reduce field error, and what
      alternative objectives would make residuals useful for correction?
    - How much of the LLM-agent benefit comes from scoped retrieval, ontology constraints,
      or deterministic tools rather than the base model, and does it transfer outside
      CFD/topology?
    - What are the missing code, dataset, baseline, and limitation details for several
      packet entries, and do they affect reproducibility and comparability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向气动场的几何条件神经代理方法
      解决的问题: 学习从几何到流场的映射，预测连续压力/速度并加速CFD，例如 Airfoil2Vec。
      尚未覆盖: 现有证据限于稳态、不可压缩、二维亚音速NACA 4-digit翼型；更宽气动域泛化未证实。
    - 路线: 用于气动预测的流态注意力与算子架构
      解决的问题: 通过可学习软流态分配建模局部几何-流动交互，而非单一全局流动向量，例如 FSAN。
      尚未覆盖: 以更高计算成本换精度；证据集中在 Emmi-Wing 和 DrivAerNet++ 表面压力基准。
    - 路线: 随机可分离物理信息神经方法
      解决的问题: 为物理信息神经PDE求解引入随机和可分离表示，例如 S²-PINN。
      尚未覆盖: 证据包仅有标题级信息；方法、结果、基线和局限为空，贡献与迁移未验证。
    - 路线: 面向科学与流动分析的LLM/智能体编排
      解决的问题: 分离LLM意图解释、确定性工具执行和解释，通过本体或多智能体约束自动化流动分解与物理推理。
      尚未覆盖: 已报告领域覆盖较小；策略性错误仍存在；本体收益依赖限定范围检索；工件与可复现信号弱。
    - 路线: 神经CFD代理的自审计与校准信任
      解决的问题: 利用RANS物理残差和split-conformal校准标记不可靠预测并提供覆盖率，例如 NeuroForge。
      尚未覆盖: 残差是可靠信任信号，但是较差修正目标；学习校正器增益不能归因于残差条件化。
    - 路线: 深度算子架构的基准与评测协议
      解决的问题: 在气动表面压力预测中比较架构在激波捕捉、可扩展性和数据稀缺下的表现。
      尚未覆盖: 摘要缺少明确局限；结果聚焦表面压力，其他物理量与复杂流动交互仍开放。
    - 路线: 城市风能实测校准CFD设计框架
      解决的问题: 将场地风速测量与校准RANS数字孪生耦合，以识别微型风电点位并评估气动干预。
      尚未覆盖: 结论具有场地与设备特异性：仅在巴黎Haussmannian街区用Savonius转子假设验证；验证指标细节有限。
    共识:
    - 多数方法在结构化仿真或实测数据上验证，并用场误差、覆盖率、工作流准确率或风能产量等指标支撑结论。
    - 通过几何条件、流态分配、物理残差、本体约束或校准数字孪生等显式结构约束学习或LLM驱动行为。
    - 常用定向消融分离贡献，例如检索范围、架构选择或残差条件化，但不少工作的工件证据缺失。
    分歧:
    - 表示方式不同：谱几何编码、点云注意力软流态分配、随机可分离物理信息网络与确定性RANS数字孪生并存。
    - 监督与grounding不同：直接仿真场监督、物理残差审计、本体约束工具执行和实测校准验证分别针对不同失效模式。
    - 主要目标不同：预测精度、校准信任/误差检测、LLM工作流正确性、场址级能量产出各有侧重。
    - 计算代价取舍不同：部分方法以更高计算成本换精度，其他方法强调相对CFD的数量级加速或工作流级正确性。
    开放问题:
    - 几何与流态条件代理能否泛化到稳态、不可压缩、二维亚音速NACA派生翼型和已报告基准之外？
    - 为何降低RANS物理残差未能降低场误差，什么替代目标能让残差用于修正？
    - LLM智能体收益有多少来自限定范围检索、本体约束或确定性工具，而非基础模型，能否迁移到CFD/拓扑之外？
    - 若干证据条目的代码、数据集、基线和局限细节缺失，会否影响可复现性与可比性？
