  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design for aerodynamic/CFD surrogates
      what_it_solves: Turns geometry and flow-condition prediction into concrete architectures
        and learning objectives, such as spectral geometry encoders, flow-state attention
        partitioning, separable stochastic physics-informed formulations, and operator-learning
        backbones for pressure or velocity fields.
      what_remains_open: Whether these representations transfer beyond steady, incompressible,
        2D airfoil and limited NACA/automotive regimes, and whether improved accuracy
        remains practical under constrained computational cost and data scarcity.
    - line: Planning and action-interface methods for scientific analysis workflows
      what_it_solves: Connects learned or retrieved models to intervention and execution
        by separating LLM-based intent interpretation from deterministic domain-tool
        calls, or by decomposing flow fields into physical components and using agent
        review for consistency and discovery.
      what_remains_open: How much of the observed benefit comes from the execution
        scaffold, ontology, retrieval scope, or decomposition module rather than the
        learned core, and whether the design remains effective beyond the reported
        two-domain or benchmark settings.
    - line: Method evidence and ablation protocol for surrogate evaluation
      what_it_solves: Separates model contribution from dataset, baseline, metric,
        and implementation effects through architecture benchmarks, ablations, and
        generalization tests across 2D and 3D aerodynamic configurations or agentic-analysis
        workflows.
      what_remains_open: Whether the evidence isolates the proposed method rather
        than surrounding system choices; several records omit explicit limitations,
        analysis fields, code, or dataset details, leaving shock capture, data scarcity,
        and reproducibility boundaries under-evidenced.
    consensus:
    - There is convergence on replacing or accelerating CFD simulation with learned
      surrogates, using domain-specific geometry or flow representations and reporting
      accuracy plus speedup relative to conventional solvers.
    - 'Evaluation is expected to go beyond interpolation: unseen geometries, conditions,
      or configurations, and ablation or retrieval-scope conditions are treated as
      necessary evidence.'
    - Recent work tends to separate deterministic execution, physics-based decomposition,
      or tool orchestration from learned or LLM reasoning to reduce failure modes
      such as hallucinated calls, missing pipeline stages, or shear contamination.
    disagreements:
    - 'Representation choices differ: point-cloud geometry with flow-state soft assignment
      versus spectral geometry encoding versus separable stochastic physics-informed
      formulations versus graph/operator backbones.'
    - 'Supervision and objectives differ: purely data-driven field prediction, physics-constrained
      training, and LLM-guided ontology/tool planning optimize different targets and
      therefore favor different failure modes.'
    - 'Evaluation contexts differ: 2D airfoil benchmarks, industrial 3D aircraft surface
      pressure, turbulence component analysis, and CFD post-processing are not directly
      interchangeable.'
    - 'Interaction and deployment settings differ: offline field prediction, agentic
      tool orchestration, and code-evolution adaptation make different integration
      and computation-cost assumptions.'
    open_questions:
    - Do reported geometry-conditioned surrogates remain accurate outside steady,
      incompressible, 2D NACA/automotive regimes and the limited aircraft or turbulence
      configurations evaluated?
    - When computational cost is constrained, are flow-state attention gains robust
      across multiple benchmarks or merely highest-accuracy under unconstrained compute?
    - Does ontology or domain grounding improve LLM-guided analysis only when relevant
      facts are retrieved in scoped form, and does this persist across more than two
      domains?
    - Which component of agentic frameworks contributes most when the planner, decomposition
      module, tool set, or retrieval strategy is replaced?
    - To what extent do missing code, datasets, metrics, and limitation statements
      create verification gaps around negative results or non-reproducible implementation
      choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向气动/CFD代理的方法表示与目标设计
      解决的问题: 将几何和流动条件预测转化为具体架构与学习目标，例如谱几何编码、流态注意力划分、可分离随机物理信息形式和算子学习骨干。
      尚未覆盖: 这些表示能否迁移到稳态、不可压缩、二维翼型及有限NACA/汽车工况之外，以及精度提升在计算成本和数据稀缺约束下是否仍实用。
    - 路线: 科学分析流程中的规划与动作接口方法
      解决的问题: 通过将LLM意图解释与确定性领域工具调用分离，或将流场分解为物理分量并用智能体审查来连接模型与干预、执行和发现流程。
      尚未覆盖: 观察到的好处有多少来自执行框架、本体、检索范围或分解模块，而非学习核心本身，以及设计能否在报告的两个领域或基准之外保持有效。
    - 路线: 代理评估中的方法证据与消融协议
      解决的问题: 通过架构基准、消融和二维/三维气动配置或智能体分析流程中的泛化测试，区分方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 证据是否真正隔离了所提方法而非周边系统选择；若干记录缺少明确局限性、分析字段、代码或数据集细节，使激波捕捉、数据稀缺和可复现边界仍证据不足。
    共识:
    - 多项工作汇聚于用学习型代理替代或加速CFD仿真，采用领域特定的几何或流动表示，并同时报告相对传统求解器的精度与加速。
    - 评测被认为不能只做内插，需要在不可见几何、工况或配置上的泛化，以及消融或限定范围检索等证据。
    - 近期工作倾向于将确定性执行、物理分解或工具编排与学习/LLM推理分离，以减少虚假调用、缺失流水线阶段或剪切污染等失败模式。
    分歧:
    - 表示选择不同：点云几何的流态软分配、谱几何编码、可分离随机物理信息形式、图/算子骨干各有取舍。
    - 监督与目标不同：纯数据驱动场预测、物理约束训练、LLM引导的本体/工具规划优化不同目标，因此偏向不同的失败模式。
    - 评测场景不同：二维翼型、工业三维整机表面压力、湍流组分分析、CFD后处理不能直接互换。
    - 交互与部署设置不同：离线场预测、智能体工具编排和代码演化适应在集成与计算成本上假设不同。
    开放问题:
    - 所报告的几何条件化代理能否在稳态、不可压缩、二维NACA/汽车工况及有限的整机或湍流配置之外保持精度？
    - 在计算成本受限时，流态注意力带来的精度提升是否能在多个基准上保持稳健，而非仅在无约束计算下领先？
    - 本体或领域grounding是否只在限定范围检索相关事实时才提升LLM分析，并且能否跨两个以上领域持续有效？
    - 当规划器、分解模块、工具集或检索策略被替换时，智能体框架中哪个组件贡献最大？
    - 缺失代码、数据集、指标和局限性声明在多大程度上构成负结果或不可复现实现选择的验证缺口？
