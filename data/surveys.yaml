  related_work_outline_zh:
  - 主流方向：2026年前沿集中在空气动力学神经代理的共享基准上，使用CFD衍生数据集和误差指标，并加入分布偏移、求解器校正和物理诊断。
  - 研究共性：论文引入或使用共享任务，与最强基线比较，报告流场和力误差，并强调超越单一分数之外的速度、鲁棒性或可解释性。
