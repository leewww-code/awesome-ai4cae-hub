    - 'Supervision and evaluation targets differ: field prediction accuracy, workflow
      correctness, interpretation accuracy, and turbulence model recommendation.'
    - 'Interaction mode differs: direct surrogate prediction versus LLM agent with
      deterministic tools versus benchmarking or evaluation protocol.'
    - 'Deployment settings differ: 2D/3D aerodynamic surrogate modeling, CFD post-processing/topology
