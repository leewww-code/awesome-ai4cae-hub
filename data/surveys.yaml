  related_work_outline:
  - 'Mainstream direction: Deep surrogate models for aerodynamic field prediction
    and LLM/tool-orchestrated scientific analysis dominate the visible 2026 evidence;
    both aim to replace expensive or brittle manual scientific computation with learned
    systems while constraining outputs through structured representations or domain
    ontologies.'
  - 'Shared research pattern: Methods tend to decompose the problem into structured
    components before learning or execution, such as geometry versus flow conditions
    or intent versus deterministic execution versus explanation, and evaluate them
    with benchmark error metrics or ablation accuracy.'
  - 'Key differences: Representations range from spectral geometry encoders and flow-state
    attention over point clouds to stochastic separable physics-informed networks
    and graph/operator architectures; evaluation targets include pressure/velocity
    fields, interpretation accuracy, turbulence components, and physics adaptation
    in evolving code environments.'
  - 'Trend evolution: Visible top evidence is concentrated in 2026, so the trend is
    within the current frontier; it shows movement toward state-disentangled, attention-based
    or agentic architectures and more explicit benchmark protocols, while generalization
    remains tied to narrow aerodynamic or workflow domains.'
  - 'Open questions: Transfer to unsteady, compressible, turbulent, or non-airfoil
    geometries; separation of planner, ontology, retrieval, and model contributions;
    missing code, dataset, and limitation evidence; and accuracy-versus-cost trade-offs
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：可见的2026年证据集中在面向气动流场预测的深度代理模型，以及面向科学分析的LLM/工具编排工作流；二者都试图替代昂贵或脆弱的人工科学计算，并通过结构化表示或领域本体约束输出。
  - 研究共性：方法倾向于在学习或执行前将问题拆分为结构化组件，例如几何与流动条件、意图与确定性执行和解释，并以基准误差或消融准确率作为主要证据。
  - 关键差异：表示方式涵盖谱几何编码、点云上的流状态注意力、随机可分离物理信息网络和图/算子架构；评测目标涉及压力/速度场、解释准确率、湍流分项和动态代码环境中的物理适应。
  - 趋势演进：可见top证据集中于2026年，趋势属于当前前沿内部；表现为向状态解耦、注意力或智能体架构及更显式基准协议演进，但泛化仍局限于窄空气动力学或工作流领域。
  - 开放问题：向非定常、可压缩、湍流或非翼型几何的迁移；规划器、本体、检索与模型贡献的分离；代码、数据集和局限性证据的缺失；以及精度与计算成本的权衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Structured representation and objective design for physical surrogate
        learning
      what_it_solves: Converts raw geometry and flow conditions into learned encodings
        and training objectives for fast aerodynamic field prediction.
      what_remains_open: Whether spectral, attention, stochastic physics-informed,
        graph, or operator representations transfer beyond the reported steady, subsonic,
        2D-3D aerodynamic settings.
    - line: Agentic and tool-orchestrated scientific reasoning
      what_it_solves: Connects LLM reasoning to deterministic domain tools, decompositions,
        and planning constraints to reduce hallucinated or incomplete analysis workflows.
      what_remains_open: How much correctness comes from domain ontologies, scoped
        retrieval, tool separation, or the LLM itself, and whether the approach generalizes
        beyond a small number of domains.
    - line: Benchmarking and ablation protocols for method evidence
      what_it_solves: Separates method contributions from dataset, baseline, metric,
        and implementation choices through controlled comparisons and ablation studies.
      what_remains_open: Several top papers have missing or empty analysis fields,
        no stated limitations, or limited artifact signals, so reproducibility and
        generalization evidence remain incomplete.
    consensus:
    - Recent methods share a move toward decomposing the problem into structured components
      before learning or execution, rather than treating raw input-to-output mapping
      as a single model.
    - Learned surrogates are evaluated mainly on benchmark error metrics and compare
      multiple architecture choices, with a shared aim of reducing expensive CFD or
      manual analysis effort.
    - Evidence quality is treated as important through ablations and controlled comparisons,
      but the packet shows uneven reproducibility and missing limitation details.
    - Several reported methods achieve better accuracy or interpretation quality at
      the cost of higher computational expense or narrow domain instantiation.
    disagreements:
    - 'Representations differ substantially: spectral geometry encodings, separate
      point-cloud geometry and flow-state attention, stochastic separable physics-informed
      terms, and graph or operator architectures impose different inductive biases.'
    - Evaluation targets differ across surface pressure or velocity field error, LLM
      interpretation accuracy, turbulence component and Reynolds-stress quality, and
      physics adaptation under evolving code.
    - 'Interaction modes differ: some systems output continuous fields for surrogate
      prediction, while others orchestrate tool calls and generate analysis or modeling
      recommendations.'
    - Deployment settings differ from automotive or motorsport airfoils and industrial
      aircraft to CFD post-processing and topology analysis, which affects relevant
      failure modes and data regimes.
    open_questions:
    - Can the reported surrogate representations generalize to unsteady, compressible,
      turbulent, or non-NACA airfoil geometries beyond the current benchmarks?
    - Does ontology-grounded orchestration reduce strategic errors beyond the two
      reported domains, and how much accuracy gain is attributable to scoped retrieval
      versus the planning decomposition?
    - What would reproducibility evidence show for papers with empty analysis fields
      or missing code, dataset, and limitation details?
    - Is the accuracy gain of flow-state attention worth its higher computational
      cost on industrial-scale problems?
    - One benchmark on physics adaptation via code evolution appears with empty analysis,
      leaving its contribution as a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 物理代理学习中的结构化表示与目标设计
      解决的问题: 将原始几何与流动条件转化为学习编码和训练目标，实现气动流场快速预测。
      尚未覆盖: 谱、注意力、随机可分离物理信息、图或算子表示能否迁移到稳态、亚音速、2D-3D气动以外的场景仍未知。
    - 路线: 智能体与工具编排式科学推理
      解决的问题: 将LLM推理连接到确定性领域工具、分解和规划约束，减少幻觉或不完整分析流程。
      尚未覆盖: 正确性有多少来自领域本体、限定范围检索、工具分离或LLM本身，以及能否泛化到少量领域之外。
    - 路线: 方法证据与消融基准协议
      解决的问题: 通过受控比较和消融实验，区分方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 若干高排名论文缺少分析字段、未说明局限性或工件信号有限，复现性与泛化证据仍不完整。
    共识:
    - 近期方法倾向于在学习或执行前把问题拆分为结构化组件，而不是把原始输入到输出映射作为单一模型处理。
    - 学习型代理主要在基准误差上评估并比较多架构选择，共同目标是减少昂贵的CFD或人工分析工作量。
    - 证据质量通过消融和受控比较受到重视，但当前包中复现性证据和局限性披露不平衡。
    - 部分方法在报告指标上更优，但往往伴随更高计算成本或更窄的领域实例化。
    分歧:
    - 表示差异明显：谱几何编码、点云几何与流状态分离注意力、随机可分离物理信息项、图或算子架构施加了不同归纳偏置。
    - 评测目标不同：侧重表面压力或速度场误差、LLM解释准确率、湍流分项与Reynolds应力质量，或代码演化中的物理适应。
    - 交互模式不同：部分系统输出连续场做代理预测，部分系统编排工具调用并生成分析或建模建议。
    - 部署场景从汽车或赛车翼型和工业飞机延伸到CFD后处理与拓扑分析，导致相关失效模式与数据条件不同。
    开放问题:
    - 报告中的代理表示能否泛化到非定常、可压缩、湍流或非NACA翼型几何之外？
    - 本体约束的编排能否在报告的两个领域之外减少战略性错误，其准确率收益有多少来自限定范围检索而非分解架构？
    - 对于分析字段为空或代码、数据集和局限性信息缺失的论文，复现证据会给出什么结论？
    - 流状态注意力的精度提升在工业规模问题上是否值得其更高计算成本？
    - 一个关于代码演化的物理适应基准条目缺少分析内容，其贡献仍属于验证缺口。
