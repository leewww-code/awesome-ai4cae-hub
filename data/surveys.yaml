  - 'Mainstream direction: engineering-flow surrogate modeling, especially aerodynamic
    field and coefficient prediction from simulation data, is the dominant application
    route; many works target faster alternatives to CFD/RANS/LES for airfoils, wings,
    aircraft, channels, wakes, and atmospheric boundary layers.'
  - 'Shared research pattern: papers learn a mapping from geometry, flow conditions,
    or sparse observations to flow fields, surface quantities, or aerodynamic coefficients,
    and evaluate using simulation-derived or physics-based losses, often reporting
    speedup over numerical solvers.'
  - 'Key differences: supervision varies from high-fidelity simulation labels to physics
    residuals and multi-fidelity corrections; targets range from 2D steady airfoils
    to 3D aircraft and turbulent channel or wake flows; some emphasize datasets and
    architecture benchmarks, others uncertainty quantification or data-free solving.'
  - 'Trend evolution: the visible evidence is concentrated in the current 2026 frontier,
    with a shift toward public datasets, standardized architecture comparison, and
    hybrid uncertainty-aware or data-free surrogates; older years in the topic span
    are not represented in the sample, so longer trend claims remain unverified.'
  - 'Open questions: generalization beyond narrow geometry and flow regimes, practical
    engineering impact of surrogate accuracy, reliability of data-free solvers for
    complex turbulence, and whether 2D-to-3D or sparse-sensing corrections remain
    calibrated out of distribution are unresolved.'
  related_work_outline_zh:
  - 主流方向：面向工程流动的代理建模是主导路线，尤其是从仿真数据预测空气动力学流场、表面压力和气动系数，目标是在翼型、机翼、飞机、通道、尾流和大气边界层等场景中替代或加速
    CFD/RANS/LES。
  - 研究共性：论文学习从几何、流动条件或稀疏观测到流场、表面量或气动系数的映射，并以仿真数据、物理残差或低保真修正作为监督信号，通常报告相较数值求解器的加速。
  - 关键差异：监督信号在高保真仿真标签、物理残差与多保真修正之间不同；对象从二维稳态翼型到三维飞机、湍流通道与尾流；一些工作侧重数据集和架构基准，另一些侧重不确定性量化或无数据求解。
  - 趋势演进：可见证据集中在 2026 年前沿，呈现公开数据集、标准化架构比较、不确定感知与无数据代理的趋势；样本未覆盖更早年份，因此更长周期趋势无法确认。
  - 开放问题：窄几何和流动工况之外的泛化、代理精度对工程设计结果的实际影响、无数据求解器在复杂湍流中的可靠性，以及 2D 到 3D 或稀疏传感修正能否在分布外保持校准。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates
      what_it_solves: Learning fast pressure and velocity predictors conditioned on
        airfoil or aircraft geometry to replace expensive CFD evaluation.
      what_remains_open: Evidence is limited to steady incompressible 2D subsonic
        or specific NACA-like geometries, so transient, compressible, and non-canonical
        engineering generalization is not established.
    - line: Operator architecture benchmarking for aerodynamic prediction
      what_it_solves: Comparing modern deep operator architectures for surface pressure
        prediction, shock capture, scalability to large meshes, and data-scarce settings.
      what_remains_open: No explicit limitation evidence is provided, and evaluated
        settings focus on surface pressure, leaving broader field prediction and real-world
        design impact open.
    - line: Physics-informed and data-free flow solving
      what_it_solves: Solving steady Navier-Stokes benchmark problems across low and
        high Reynolds numbers without external flow data.
      what_remains_open: The packet lacks detailed results or limitation evidence,
        so performance on complex geometry, turbulence, and unsteady flows remains
        a verification gap.
    - line: Multi-fidelity and dimension-bridging correction surrogates
      what_it_solves: Learning corrections from lower-dimensional 2D RANS models to
        predict 3D aerodynamic coefficients with uncertainty and adaptive sampling.
      what_remains_open: Accuracy depends strongly on choosing a suitable low-dimensional
        model, and the neural-network-accelerated kernel introduces approximation
        tradeoffs whose boundaries are not fully specified.
    - line: Sparse sensing and uncertainty quantification
      what_it_solves: Quantifying uncertainty in shallow recurrent decoder networks
        for sparse sensing, aiming to make limited observations actionable.
      what_remains_open: The available evidence does not show how the approach transfers
        to full engineering flow fields, 3D geometries, or physical sensor noise.
    - line: Turbulent flow dataset and super-resolution pipelines
      what_it_solves: Building validated simulation datasets and generative super-resolution
        for turbulent channels, wakes, and atmospheric boundary layer flows.
      what_remains_open: Most of these entries lack detailed analysis in the packet,
        so dataset validation, baseline comparisons, and physical consistency of super-resolved
        fields are only partially verified.
    consensus:
    - High-fidelity simulation data serve as the dominant source of supervision or
      conditioning for engineering flow predictors.
    - The shared objective is to reduce computational cost relative to conventional
      CFD/RANS/LES while preserving useful physical quantities.
    - Engineering geometry, flow conditions, and domain-specific simulation regimes
      are central inputs or constraints in these surrogates.
    - Recent work increasingly uses public datasets and standardized benchmark evaluations
      to study generalization and architecture tradeoffs.
    disagreements:
    - 'Supervision differs: some models learn from simulation labels, others from
      physics residuals, and others from corrective multi-fidelity mappings.'
    - 'Prediction targets differ: surface pressure, full velocity and pressure fields,
      aerodynamic coefficients, turbulent wakes, or atmospheric boundary layer fields.'
    - 'Dimensionality and flow regime differ: steady 2D subsonic airfoils, industrial
      3D aircraft, obstructed channels, and high-Reynolds-number wakes create different
      evaluation boundaries.'
    - 'Priorities differ: some works emphasize dataset release or architecture comparison,
      while others emphasize data-free solving, uncertainty calibration, or adaptive
      sampling efficiency.'
    - Low-dimensional correction approaches assume a proper low-fidelity model exists,
      whereas direct surrogates and physics-informed solvers avoid that assumption
      but face other generalization limits.
    open_questions:
    - Can surrogate gains on airfoil and canonical turbulence cases transfer to complex
      3D engineering components such as full vehicles or impellers?
    - Which architecture and supervision strategy remain reliable for shock capture,
      high-Reynolds turbulence, and data-scarce industrial geometries simultaneously?
    - How do reported speedups and simulation accuracy translate into measurable engineering
      design, optimization, and safety outcomes?
    - Are data-free physics-informed solvers robust enough for unsteady, compressible,
      and high-Reynolds-number engineering flows without external data?
    - Do 2D-to-3D corrections and sparse-sensing uncertainty estimates remain calibrated
      under realistic noise and out-of-distribution operating conditions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件化的空气动力学流场代理模型
      解决的问题: 学习以翼型或飞机几何为条件的快速压力与速度预测，以替代昂贵的 CFD 评估。
      尚未覆盖: 证据限于稳态不可压缩二维亚音速或类 NACA 几何，瞬态、可压缩和非典型工程几何的泛化尚未建立。
    - 路线: 面向气动预测的算子架构基准评测
      解决的问题: 比较现代深度算子架构在表面压力预测、激波捕捉、大规模网格扩展性和数据稀缺场景下的表现。
      尚未覆盖: 摘要未提供明确局限性证据，评测集中在表面压力，更广泛流场预测和真实设计影响仍开放。
    - 路线: 物理信息与无数据流动求解
      解决的问题: 在没有外部流场数据的情况下求解低雷诺数与高雷诺数稳态 Navier-Stokes 基准问题。
      尚未覆盖: 数据包缺少详细结果或局限性证据，复杂几何、湍流和非稳态流动上的性能仍属验证缺口。
    - 路线: 多保真与维度桥接修正代理
      解决的问题: 学习从低维 2D RANS 模型到 3D 气动系数的修正，并提供不确定性与自适应采样。
      尚未覆盖: 精度高度依赖低维模型选择，神经网络加速核引入近似折衷，其边界未完全说明。
    - 路线: 稀疏传感与不确定性量化
      解决的问题: 对用于稀疏传感的浅层循环解码器网络进行不确定性量化，使有限观测更具可操作性。
      尚未覆盖: 可用证据未显示该方法如何迁移到完整工程流场、三维几何或真实传感器噪声。
    - 路线: 湍流数据集与超分辨率流水线
      解决的问题: 构建经校验的仿真数据集，并对湍流通道、尾流和大气边界层流动进行生成式超分辨率。
      尚未覆盖: 数据包中多数条目缺少详细分析，因此数据集校验、基线比较和超分辨场的物理一致性仅部分可验证。
    共识:
    - 高保真仿真数据是工程流动预测器的主要监督或条件来源。
    - 共同目标是在保留可用物理量的同时降低相对传统 CFD/RANS/LES 的计算成本。
    - 工程几何、流动条件和领域特定仿真工况是这些代理模型的核心输入或约束。
    - 近期工作越来越多地通过公开数据集和标准化基准评测来研究泛化与架构权衡。
    分歧:
    - 监督信号不同：一些来自仿真标签，一些来自物理残差，另一些来自多保真修正映射。
    - 预测目标不同：表面压力、完整速度与压力场、气动系数、湍流尾流或大气边界层流场。
    - 维度与流动工况不同：稳态二维亚音速翼型、工业三维飞机、含障碍通道和高雷诺数尾流带来不同评测边界。
    - 工作侧重不同：数据集发布、架构比较、无数据求解、不确定性校准或自适应采样效率各有优先。
    - 低维修正方法假设存在合适的低保真模型，而直接代理和物理知情求解器回避该假设，但面临其他泛化限制。
    开放问题:
    - 翼型与典型湍流案例上的代理收益能否迁移到整车或叶轮等复杂三维工程部件？
    - 哪种架构和监督策略能在激波捕捉、高雷诺数湍流和数据稀缺工业几何上同时保持可靠？
    - 报告的速度提升和仿真精度如何转化为可量化的工程设计、优化与安全结果？
    - 无数据物理信息求解器能否在无外部数据时对非稳态、可压缩和高雷诺数工程流动保持鲁棒？
    - 2D 到 3D 修正与稀疏传感不确定性估计在真实噪声和分布外工况下是否仍保持校准？
