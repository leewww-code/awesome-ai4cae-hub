  related_work_outline:
  - 'Mainstream direction: Most top evidence centers on learned surrogates for CFD
    and aerodynamic field prediction, using geometry- and flow-conditioned neural
    mappings to accelerate pressure/velocity estimation.'
  - 'Shared research pattern: Papers encode geometry and flow conditions, learn continuous
    field or operator mappings, and validate against CFD-derived benchmarks; several
    add physics residuals, domain constraints, or agentic orchestration for trust
    and automation.'
  - 'Key differences: Representation choices include spectral geometry conditioning,
    point-cloud flow-state attention, graph/operator architectures, and physics-informed
    separable forms; tasks range from direct prediction to self-auditing and LLM-guided
    analysis.'
  - 'Trend evolution: Available top evidence is concentrated in 2026, so the observed
    trend is within the current frontier: from dedicated surrogate architectures and
    datasets toward self-auditing trust layers, benchmark protocols, and agentic physics
    discovery.'
  - 'Open questions: Generalization beyond steady 2D incompressible subsonic NACA
    regimes, attribution of accuracy gains, residual-based correction, scaling cost,
    and cross-domain LLM workflow reliability remain unresolved.'
  related_work_outline_zh:
  - 主流方向：顶部证据主要集中在面向CFD与气动预测的学习型代理模型，以几何和流动条件化神经映射加速压力/速度场估计。
  - 研究共性：多数工作编码几何与流动条件，学习连续场或算子映射，并用CFD相关基准验证；部分工作加入物理残差、领域约束或智能体编排以提升可信度与自动化。
  - 关键差异：表示方式包括谱几何条件化、点云流态注意力、图/算子架构和物理信息可分离形式；任务接口覆盖直接预测、自审计和LLM引导分析。
  - 趋势演进：可用顶部证据集中在2026年，趋势处于当前前沿内部：从专用代理架构与数据集，向自审计信任层、基准协议和智能体物理发现延伸。
  - 开放问题：超出稳态二维不可压缩亚音速NACA工况的泛化、精度收益归因、基于残差的修正、计算成本与跨领域LLM工作流可靠性仍缺乏系统证据。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic surrogate models
      what_it_solves: Fast prediction of continuous pressure and velocity fields from
        airfoil geometry and flow conditions, reducing CFD runtime for aerodynamic
        design loops.
      what_remains_open: Reported evidence is limited mainly to steady, incompressible,
        two-dimensional subsonic NACA 4-digit airfoils and automotive/motorsport regimes;
        generalization to industrial 3D, separated, compressible, or unsteady flows
        remains open.
    - line: Physics-structured and self-auditing neural surrogates
      what_it_solves: Embeds physics-derived residuals, separable representations,
        or uncertainty calibration to flag errors and provide calibrated trust for
        neural CFD surrogates.
      what_remains_open: The RANS residual is shown to be a poor correction objective,
        and learned corrector gains are not attributable to residual conditioning;
        stochastic separable physics-informed forms appear only as titles with no
        visible method or result evidence.
    - line: Agentic and ontology-grounded scientific flow analysis
      what_it_solves: Separates LLM intent interpretation from deterministic domain
        tools, using domain ontologies and multi-agent review to automate flow component
        analysis and physics discovery.
      what_remains_open: Strategic errors remain, ontology correction depends on scoped
        retrieval of relevant facts, and reported instantiation covers two domains;
        reproducibility artifacts for agentic pipelines are limited.
    - line: Aerodynamic operator learning benchmarking and ablation protocols
      what_it_solves: Compares deep operator architectures on shock capture, scaling
        to many grid points, and data scarcity, and isolates method contributions
        through controlled ablations.
      what_remains_open: Some benchmark evidence lacks explicit limitations, and duplicate
        or empty analysis fields for certain entries make it hard to verify whether
        gains come from the proposed architecture or surrounding system choices.
    consensus:
    - Learned geometry-conditioned predictors can capture qualitative aerodynamic
      flow features and improve relative L2 error over compared baselines.
    - Physics-derived residuals or domain constraints are treated as useful trust
      and grounding signals, even when they are not directly usable as correction
      objectives.
    - Datasets and benchmarks are becoming part of method contributions, serving to
      compare generalization and architecture choices across shared aerodynamic tasks.
    - LLM-based scientific methods tend to separate interpreted intent from deterministic
      domain-tool execution to reduce uncontrolled tool-calling errors.
    disagreements:
    - 'Representation differs: spectral geometry conditioning, point-cloud flow-state
      attention, graph/operator models, and physics-informed separable forms are used
      as alternative inductive biases.'
    - 'The role of the physics residual differs: self-auditing work treats it as a
      reliable trust and calibration signal, while evidence shows reducing it does
      not reduce field error.'
    - 'Interaction mode differs: direct neural surrogate prediction has field-error
      failure modes, while agentic LLM-tool orchestration introduces strategic planning
      and tool-selection failure modes.'
    - 'Evaluation target differs: some work emphasizes relative L2 accuracy, others
      trust calibration and coverage, and others autonomous turbulence modeling recommendations.'
    open_questions:
    - Can geometry-conditioned surrogates generalize beyond steady, incompressible,
      two-dimensional subsonic NACA airfoil regimes to industrial 3D, separated, compressible,
      or unsteady flows?
    - How much aerodynamic surrogate accuracy gain comes from the representation,
      dataset scale, train/test geometry distribution, or baseline tuning rather than
      the named method?
    - Why is the RANS residual a reliable error flag but a poor correction objective,
      and what auxiliary objective would reduce field error?
    - How well do ontology-grounded LLM analysis chains transfer beyond two domains
      without scoped retrieval and hand-built domain tool wrappers?
    - Can agentic flow component analysis produce trustworthy turbulence modeling
      improvements without human review given limited reproducibility artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件化的气动代理模型
      解决的问题: 从翼型几何与流动条件快速预测压力/速度场，降低气动设计循环中的CFD运行时间。
      尚未覆盖: 报告证据主要限于稳态、不可压缩、二维亚音速NACA 4-digit翼型和汽车/赛车工况；工业三维、分离、可压缩或非定常流动仍需验证。
    - 路线: 物理结构化与自审计神经代理
      解决的问题: 引入物理残差、可分离表示或不确定性校准，为神经CFD代理提供误差标记和校准信任。
      尚未覆盖: RANS残差被证明不适合作为修正目标，学习校正器收益不能归因于残差条件化；随机可分离物理信息形式仅有标题，缺少可见方法与结果证据。
    - 路线: 智能体与本体锚定的科学流动分析
      解决的问题: 分离LLM意图解释与确定性领域工具，使用领域本体和多智能体审查自动化流动分量分析和物理发现。
      尚未覆盖: 战略错误仍然存在，本体纠正依赖scoped retrieval，报告实例仅覆盖两个领域；智能体流水线的复现工件有限。
    - 路线: 气动算子学习基准与消融协议
      解决的问题: 比较深度算子架构在激波捕捉、大规模网格扩展性和数据稀缺下的表现，并通过受控消融隔离方法贡献。
      尚未覆盖: 部分基准证据未说明局限性；重复或空分析字段使所提架构收益是否来自方法本身而非系统选择难以核实。
    共识:
    - 学习型几何条件化预测器能够捕捉定性气动流动特征，并在相对L2指标上优于对比基线。
    - 物理残差或领域约束被视为可用的信任与锚定信号，即使物理残差不能被直接用作修正目标。
    - 数据集和基准正在成为方法贡献的一部分，用于在共享气动任务上比较泛化性和架构选择。
    - 基于LLM的科学方法倾向于将意图解释与确定性领域工具执行分离，以减少无约束工具调用错误。
    分歧:
    - 表示方式不同：谱几何条件化、点云流态注意力、图/算子模型和物理信息可分离形式作为不同的归纳偏置。
    - 物理残差的角色不同：自审计工作将其视为可靠的信任与校准信号，但证据表明降低残差并不降低场误差。
    - 交互模式不同：直接神经代理预测的失败模式是场误差，而LLM智能体工具编排引入策略规划和工具选择错误。
    - 评测目标不同：有的强调相对L2精度，有的强调信任校准与覆盖率，有的强调自主湍流建模建议。
    开放问题:
    - 几何条件化代理能否从稳态、不可压缩、二维亚音速NACA翼型工况泛化到工业三维、分离、可压缩或非定常流动？
    - 气动代理精度提升中有多少来自表示、数据集规模、训练/测试几何分布或基线调优，而非所提方法本身？
    - 为何RANS残差能可靠标记误差却不适合作为修正目标，何种辅助目标能降低场误差？
    - 本体锚定的LLM分析链在没有scoped retrieval和手工领域工具封装时，能否迁移到两个领域之外？
    - 在复现工件有限的情况下，智能体流动分量分析能否无需人工审查即可生成可信的湍流建模改进？
