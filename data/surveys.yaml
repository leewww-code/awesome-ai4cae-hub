  related_work_outline:
  - 'Mainstream direction: The visible application work clusters around learned aerodynamic
    and flow surrogates for engineering CFD, especially airfoil/aircraft/wake/duct
    cases, rather than autonomous driving or interactive agents. Recent papers emphasize
    datasets, geometry conditioning, operator benchmarks, multi-fidelity correction,
    physics-informed methods, and adaptive-mesh prediction.'
  - 'Shared research pattern: Papers replace or accelerate numerical simulation with
    learned models trained on simulation-generated flow data or physics residuals;
    they evaluate field quantities, aerodynamic coefficients, or uncertainty/speed
    tradeoffs on engineering-relevant cases.'
  - 'Key differences: They differ in representation—spectral geometry encoders, operator/graph
    architectures, transformers with quadtree tokenization, Gaussian functional regression,
    shallow recurrent decoders—and in supervision—labeled CFD data, physics residuals,
    low-fidelity corrections, sparse sensors.'
  - 'Trend evolution: The visible top-paper evidence is concentrated in 2026, so the
    trend is within the current frontier: from point or coefficient fits toward public
    datasets, benchmark comparability, industrial-scale 3D cases, uncertainty quantification,
    and real-time surrogate evaluation.'
  - 'Open questions: Evidence lacks generalization beyond steady/incompressible two-dimensional
    airfoil or selected three-dimensional cases; explicit limitations are often absent;
    low-dimensional model choice is conditionally effective; data-free and sparse-sensing
    methods need validated deployment on realistic geometries.'
  related_work_outline_zh:
  - 主流方向：可见的应用研究集中在面向工程计算流体力学的气动/流动代理模型，例如翼型、飞机、尾流和通道流动，而不是自动驾驶或交互智能体。2026年工作突出数据集、几何条件化、算子基准、多保真修正、物理信息与自适应网格预测。
  - 研究共性：论文用仿真流场数据或物理残差训练学习模型，以替代或加速数值模拟，并在压力、速度、气动系数、不确定性或速度等工程相关目标上评测。
  - 关键差异：表示方式不同，如谱几何编码、算子/图架构、四叉树分词Transformer、高斯泛函回归、浅层循环解码器；监督信号包括有标注CFD数据、物理残差、低维修正和稀疏传感器。
  - 趋势演进：可见顶层证据集中在2026年，趋势属于当前前沿：从单点或系数拟合走向公开数据集、基准可比性、工业级三维案例、不确定性量化和实时代理评测。
  - 开放问题：证据仍缺少对稳态/不可压缩二维翼型或选定三维案例之外的泛化；很多方法未给出明确局限；低维模型选择有条件；无数据PINN与稀疏传感方法需在真实几何上验证部署。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogates
      what_it_solves: Fast prediction of pressure and velocity fields around airfoils
        from shape encodings, reducing CFD runtime while retaining aerodynamic features.
      what_remains_open: Evidence is limited to steady, incompressible, 2D subsonic
        flow and downforce-focused NACA 4-digit airfoils; 3D, compressible, separated-flow
        generalization is not shown.
    - line: Operator learning evaluation for aerodynamic prediction
      what_it_solves: Systematic benchmarking of deep operator architectures for surface
        pressure on 2D airfoils and industrial 3D aircraft, covering shock capture,
        scalability, and data scarcity.
      what_remains_open: The packet lacks explicit limitations and real-world validation;
        conclusions may be bounded to the evaluated architectures and aerodynamic
        cases.
    - line: Multi-fidelity and dimension-bridging RANS regression
      what_it_solves: Learns corrections from low-dimensional RANS models to high-dimensional
        aerodynamic coefficient surrogates with uncertainty quantification and neural
        kernel acceleration for real-time evaluation.
      what_remains_open: Performance is conditional on a proper low-dimensional model;
        the neural accelerated kernel is approximate, and broader fidelity gaps are
        untested.
    - line: Physics-informed and data-free Navier-Stokes surrogates
      what_it_solves: Solves steady Navier-Stokes benchmark flows across low and high
        Reynolds numbers without external flow data using physics residuals.
      what_remains_open: Available evidence is mostly framed on steady benchmarks;
        no detailed limit analysis is provided for unsteady or engineering-scale turbulent
        cases.
    - line: Adaptive discretization and large-scale flow dataset pipelines
      what_it_solves: Creates validated simulation datasets and adaptive PDE forecasting,
        including turbulent 3D obstructed channel flows, turbulent wake dynamics,
        and adaptive quadtree tokenization for AMR data.
      what_remains_open: Dataset-to-model generalization, coverage of engineering
        geometries, and benchmark comparability remain open; several entries lack
        methodology and result detail in this packet.
    - line: Sparse sensing and uncertainty-aware flow reconstruction
      what_it_solves: Reconstructs flow from sparse sensors with uncertainty quantification
        via shallow recurrent decoders and engression, potentially supporting sensor-limited
        engineering diagnostics.
      what_remains_open: Transfer to deployed wing/vehicle/turbomachinery layouts,
        noise regimes, and rich turbulent fields is not evidenced.
    consensus:
    - Learned surrogates are positioned as computationally cheaper alternatives or
      accelerators to CFD for engineering aerodynamic and flow prediction.
    - The visible papers share a common evaluation focus on engineering-relevant outputs
      such as pressure, velocity, aerodynamic coefficients, shocks, turbulent wakes,
      or UQ rather than only generic image reconstruction.
    - Public datasets, baseline comparisons, and reproducibility artifacts are emerging
      as important contributions, especially in dataset and benchmark-oriented work.
    - Generalization is assessed via geometry interpolation/extrapolation, data scarcity,
      scaling, or adaptive sampling, though not uniformly.
    disagreements:
    - 'Supervision differs: some use high-fidelity simulation labels, others use physics
      residuals, and still others learn low-to-high-fidelity corrections.'
    - 'Representation differs: spectral geometry encoders, operator/graph networks,
      transformers with quadtree tokenization, Gaussian functional regression, and
      shallow recurrent decoders are used.'
    - 'Evaluation target differs: some target surface field prediction, some target
      integral aerodynamic coefficients, some target turbulent channel/wake dynamics,
      and some target sparse sensor reconstruction.'
    - 'Deployment setting differs: offline surrogate speedup, real-time neural kernel
      evaluation, data-free PDE solving, and sparse sensing diagnostic reconstruction.'
    open_questions:
    - Do the geometry-conditioned aerodynamic surrogates extend to steady/unsteady
      3D, compressible, and high-Reynolds separated flows beyond the reported NACA
      4-digit downforce cases?
    - What are the explicit failure boundaries of the benchmarked operator architectures
      in industrial aircraft settings, especially under shocks and scarce data?
    - How should low-dimensional model choice and neural kernel approximation be validated
      for decision-grade uncertainty quantification?
    - Can physics-informed data-free and adaptive PDE forecasting approaches scale
      to engineering-relevant turbulent configurations?
    - Are sparse sensing reconstructions robust enough for real deployed aerodynamic
      or turbomachinery monitoring?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何条件化气动代理模型
      解决的问题: 从几何编码快速预测翼型周围压力和速度场，减少CFD计算时间并保留气动特征。
      尚未覆盖: 证据限于稳态不可压缩二维亚音速流动和下压力型NACA 4-digit翼型；三维、可压缩、分离流泛化未显示。
    - 路线: 气动算子学习评测
      解决的问题: 在二维翼型和工业级三维飞机表面压力上系统评测深度算子架构，覆盖激波捕捉、可扩展性和数据稀缺。
      尚未覆盖: 证据包缺少明确局限和真实飞行验证，结论可能限于被评测的架构与气动案例。
    - 路线: 多精度与维度桥接RANS回归
      解决的问题: 从低维RANS模型向高维气动系数代理学习修正，结合不确定性量化和神经网络加速核实现实时估计。
      尚未覆盖: 性能依赖低维模型选择；神经网络加速核是近似，更广精度跨度未测试。
    - 路线: 物理信息与无数据Navier-Stokes代理
      解决的问题: 无需外部流场数据，通过物理残差求解低雷诺数到高雷诺数的稳态Navier-Stokes基准问题。
      尚未覆盖: 证据多集中在稳态基准；未给出非定常或工程尺度湍流的详细限制分析。
    - 路线: 自适应离散与大规模流场数据流水线
      解决的问题: 建立经过校验的仿真数据集和自适应PDE预测，包括三维含障碍通道湍流、尾流动力学和AMR数据四叉树分词。
      尚未覆盖: 数据集到模型泛化、工程几何覆盖和基准可比性仍开放；若干条目在证据包中缺少方法/结果细节。
    - 路线: 稀疏传感与不确定性感知流场重建
      解决的问题: 通过浅层循环解码器和engression从稀疏传感器重建流场并量化不确定性，可服务传感器受限的工程诊断。
      尚未覆盖: 尚无证据表明可迁移到真实翼型/整车/叶轮布局、噪声工况和丰富湍流场。
    共识:
    - 学习型代理被视为CFD的更便宜替代或加速器，用于工程气动和流动预测。
    - 论文共同关注工程相关输出，如压力、速度、气动系数、激波、湍流尾流或不确定性，而不是通用图像重建。
    - 公开数据集、基线比较和可复现工件正在成为重要贡献。
    - 泛化通过几何插值/外推、数据稀缺、规模扩展或自适应采样来检验，但不统一。
    分歧:
    - 监督信号不同：有的用高精度仿真标签，有的用物理残差，有的学习低到高精度修正。
    - 表示方式不同：谱几何编码、算子/图网络、四叉树分词Transformer、高斯泛函回归和浅层循环解码器各自用于不同工作。
    - 评测目标不同：有的预测表面场，有的预测积分气动系数，有的预测湍流通道/尾流，有的做稀疏传感重建。
    - 部署场景不同：离线代理加速、实时神经网络核评估、无数据PDE求解和稀疏传感诊断重建并存。
    开放问题:
    - 几何条件化气动代理能否扩展到三维、可压缩、高雷诺分离流，而不只是报告的NACA 4-digit下压力案例？
    - 被评测算子架构在工业飞机场景中的明确失效边界是什么，尤其在激波和少量数据下？
    - 如何为决策级不确定性量化验证低维模型选择和神经网络核近似？
    - 物理信息无数据和自适应PDE预测方法能否扩展到工程相关湍流配置？
    - 稀疏传感重建在真实气动或叶轮机械监测中的鲁棒性是否足够？
