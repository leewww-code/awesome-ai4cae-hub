  - 开放问题：能否从二维稳态NACA外推到非NACA、三维、瞬态和高雷诺数；二维评测能否迁移到工业三维和工程设计；无数据物理模型能否处理复杂几何；不确定性如何支持工程决策；部分工作缺少代码、数据与局限性说明。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-conditioned aerodynamic field surrogate modeling
      what_it_solves: Predicts pressure and velocity fields around airfoils from geometry,
        achieving large CFD speedups.
      what_remains_open: Evidence is limited to steady, incompressible, 2D subsonic
        flow and downforce-generating NACA 4-digit airfoils; non-NACA, 3D, and transient
        generalization remains unverified.
    - line: Operator learning architecture benchmarking for industrial pressure prediction
      what_it_solves: Compares neural operator architectures on 2D airfoils and a
        3D aircraft for surface pressure with shocks, scalability, and data scarcity.
      what_remains_open: Abstract states no explicit limitations; reproducibility
        signals are weak and broader engineering validation is missing.
    - line: Multi-fidelity dimension-bridging RANS regression
      what_it_solves: Learns a correction from 2D to 3D RANS for aerodynamic coefficients,
        with uncertainty-driven sampling and fast kernel evaluation.
      what_remains_open: Performance depends on the low-dimensional model choice;
        neural kernel acceleration may trade exact accuracy for speed.
    - line: Physics-informed data-free Navier-Stokes solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems across low-to-high
        Reynolds numbers without external flow data.
      what_remains_open: Analysis evidence is empty; complex geometry, transient,
        and engineering-relevant validation are not documented.
    - line: Turbulent and wake flow dataset/pipeline construction
      what_it_solves: Provides validated LBM or high-Reynolds wake datasets for surrogate
        modeling of obstructed channel and wake dynamics.
      what_remains_open: Abstract and analysis details are sparse; baseline comparisons,
        generalization, and downstream surrogate performance are not documented.
    - line: Adaptive mesh PDE forecasting and sparse sensing uncertainty
      what_it_solves: Uses quadtree tokenization/transformer for adaptive-mesh forecasting
        and engression-based uncertainty for sparse sensing.
      what_remains_open: Methodology evidence is incomplete; integration with engineering
        CFD and long-horizon reliability remain open.
    consensus:
    - Learned surrogates are positioned as faster alternatives to CFD/RANS while maintaining
      acceptable aerodynamic accuracy.
    - Geometry or flow-conditioning is treated as necessary for aerodynamic prediction.
    - Datasets and benchmarks are used to compare architectures, not only to report
      single-model performance.
    - Speed, accuracy, and generalization trade-offs are evaluated, though validation
      protocols differ.
    disagreements:
    - 'Representation choices differ: neural fields/ODEs, MLPs/GNNs, transformers,
      and Gaussian functional regression.'
    - 'Training signals differ: supervised simulation data from RANS/LBM, data-free
      physics residuals, and multi-fidelity corrections.'
    - 'Prediction targets differ: full pressure/velocity fields, surface pressure
      only, integrated aerodynamic coefficients, and PDE states.'
    - 'Evaluation settings differ: 2D steady airfoils, industrial 3D aircraft, turbulent
      3D channel flows, and adaptive-mesh PDEs.'
    - 'Uncertainty treatment differs: used for adaptive sampling in Gaussian regression,
      but absent or not stated in several surrogate benchmarks.'
    open_questions:
    - Can current 2D steady NACA-focused surrogates generalize to non-NACA geometries,
      3D configurations, and transient separated flows?
    - Which operator learning or representation choices transfer from 2D airfoil benchmarks
      to industrial 3D aircraft under data scarcity?
    - Do data-free physics-informed solvers match simulation-trained surrogates on
      complex engineering geometries and high-Reynolds turbulent flows?
    - How should surrogate error and uncertainty be calibrated against downstream
      engineering safety or design requirements?
    - How reproducible are the reported gains when code, datasets, baselines, and
      limitations are not available for several papers?
