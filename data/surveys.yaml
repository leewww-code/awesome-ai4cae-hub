  literature_review:
    line_of_work_matrix:
    - line: Automated agentic analysis toolchains
      what_it_solves: Turns flow-field decomposition and physical discovery into multi-agent
        reasoning workflows, with consistency review and knowledge accumulation.
      what_remains_open: Evidence is limited to five benchmarks and periodic hill
        flow; no code or artifact signals are present for independent reproduction.
    - line: Solver-coupled and optimization deployment pipelines
      what_it_solves: Connects neural surrogates to constrained shape optimization
        or Newton-Krylov CFD correction, using uncertainty or solver feedback to improve
        reliability and speed.
      what_remains_open: Validation remains mostly in-house or specific transonic/wing
        scenarios; external deployment, hardware changes, and user-specific settings
        are not shown.
    - line: Fast geometry-conditioned surrogate serving
      what_it_solves: Provides low-latency aerodynamic field predictions through spectral
        encoders or flow-state attention, aiming for orders-of-magnitude CFD speedup.
      what_remains_open: Regimes are often steady, incompressible, 2D, or narrow vehicle
        classes; speed-fidelity-computational cost trade-offs are not standardized.
    - line: Benchmarks and reproducible engineering artifacts for distribution shift
      what_it_solves: Creates datasets and benchmark protocols to test surrogate generalization,
        robustness, and physical consistency beyond in-distribution error.
      what_remains_open: Independently reusable code and artifacts are often absent;
        single-benchmark conclusions and metric-physics misalignment remain unresolved.
    consensus:
    - Neural surrogates are evaluated as potential accelerators or partial replacements
      for aerodynamic CFD workflows rather than only as standalone predictors.
    - Reported evidence pairs model performance with error metrics and speedups, while
      increasingly adding datasets, benchmarks, or distribution-shift tests.
    - High in-distribution accuracy is recognized as insufficient without generalization,
      physical consistency, or solver/validation checks.
    - Datasets and benchmarks are emerging as shared infrastructure for comparing
      architectures across shapes, operating conditions, and discretizations.
    disagreements:
    - Systems differ in whether surrogate predictions are accepted directly or corrected
      by numerical solvers; evidence ranges from standalone fast inference to Newton-Krylov
      terminal convergence.
    - Representation choices differ across spectral geometry encoders, flow-state
      attention, graph/operator surrogates, and mixture-of-experts neural operators.
    - 'Evaluation targets differ: surface pressure/velocity fields, drag coefficient,
      flow statistics, turbulence component analysis, and optimization outcomes.'
    - Validation philosophy differs; some works use benchmark error alone, while others
      introduce controlled distribution shifts or physics-grounded diagnostics to
      challenge score improvements.
    - Computational cost is treated inconsistently; one result reports higher accuracy
      at higher cost, while others emphasize speedups, with no shared efficiency-fidelity
      metric.
    open_questions:
    - How do these surrogates and agentic workflows generalize beyond the narrow datasets
      shown, such as in-house vehicle sets, NACA 4-digit airfoils, pickup trucks,
      or periodic hill flow?
    - What validation and reporting standards would connect benchmark error reductions
      to trusted physical utility, given evidence that lower field error can coincide
      with worse flow-statistics error?
    - Can the automated analysis toolchain and solver-coupled pipelines be independently
      reproduced when code, data, and artifact signals are missing or only partially
      reported?
    - What are acceptable trade-offs between surrogate speed, computational cost,
      fidelity, and reliability under operating-point, tessellation, and cross-vehicle
      shifts?
    - Do reported speedups and drag reductions persist in external deployment environments
      with changed hardware, mesh generation, or user-specific design constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化智能体分析工具链
      解决的问题: 将流场分解和物理发现转化为多智能体推理工作流，包含一致性审查和知识积累。
      尚未覆盖: 证据仅限五个基准与周期山流动；缺乏代码或工件信号，难以独立复现。
    - 路线: 求解器耦合与优化部署流水线
      解决的问题: 将神经代理连接到约束形状优化或 Newton-Krylov CFD 校正，通过不确定性或求解器反馈提升可靠性与速度。
      尚未覆盖: 验证主要限于内部或特定跨音速/翼型场景；外部部署、硬件变化和用户特定设置未被展示。
    - 路线: 快速几何条件化代理服务
      解决的问题: 通过谱几何编码或流态注意力提供低延迟气动场预测，力求相对 CFD 实现数量级加速。
      尚未覆盖: 场景常为稳态、不可压缩、二维或窄车辆类别；速度-保真度-计算成本权衡缺乏统一标准。
    - 路线: 面向分布偏移的基准与可复现工程工件
      解决的问题: 建立数据集和基准协议，测试代理在分布外条件下泛化、鲁棒性与物理一致性。
      尚未覆盖: 独立可复用代码与工件常缺失；单一基准结论和指标-物理失配仍未解决。
    共识:
    - 神经代理被评估为气动 CFD 工作流的潜在加速器或部分替代品，而非仅作为独立预测器。
    - 报告的证据将模型性能与误差指标和加速比配对，并越来越多地加入数据集、基准或分布偏移测试。
    - 高分布内精度被认为不足以证明泛化、物理一致性或求解器/验证检查。
    - 数据集和基准正在成为比较不同架构在形状、运行条件和离散化下性能的共享基础设施。
    分歧:
    - 系统在是否直接接受代理预测或经数值求解器校正上存在差异；证据从独立快速推理到 Newton-Krylov 终端收敛不等。
    - 表示选择不同：谱几何编码器、流态注意力、图/算子代理与混合专家神经算子各有路线。
    - 评测目标不同：表面压力/速度场、阻力系数、流动统计、湍流组分分析和优化结果并存。
    - 验证哲学不同；部分工作仅报告基准误差，另一些引入受控分布偏移或基于物理的诊断来挑战分数提升。
    - 计算成本处理不一致；有结果以更高成本换取更高精度，也有结果强调加速，且缺乏共享的效率-保真度指标。
    开放问题:
    - 这些代理和智能体工作流在狭窄数据集之外的泛化如何，例如内部车辆集、NACA 4-digit 翼型、皮卡或周期山流动？
    - 需要什么样的验证和报告标准，才能把基准误差降低与可信的物理效用联系起来，因为较低场误差可能伴随更差的流统计误差？
    - 在代码、数据和工件信号缺失或仅部分报告的情况下，自动化分析工具链和求解器耦合流水线能否被独立复现？
    - 在运行点、网格离散化和跨车辆偏移下，代理速度、计算成本、保真度与可靠性之间可接受的权衡是什么？
    - 所报告的加速比和减阻效果在外部部署环境中，面对硬件、网格生成或用户特定设计约束变化时是否仍然成立？
