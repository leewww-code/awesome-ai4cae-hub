    consensus:
    - High-fidelity CFD or wind-tunnel data serve as the reference signal, and learned
      surrogates are judged by error, speedup, design benefit, or benchmark rank.
    - Geometry and operating conditions are treated as the main conditioning inputs
      for aerodynamic surrogate systems.
    - Evaluation increasingly includes multiple architectures, datasets, or distribution-shift
      tests rather than single-dataset claims.
    - Reliability mechanisms such as uncertainty-triggered CFD feedback or Newton-Krylov
      correction are used to avoid trusting raw surrogate predictions.
