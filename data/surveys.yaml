  literature_review:
    line_of_work_matrix:
    - line: Geometry- and flow-state-conditioned surrogate representation
      what_it_solves: encodes airfoil or point-cloud geometry and operating flow conditions
        into neural fields or attention states for fast aerodynamic field prediction
      what_remains_open: transfer beyond steady, incompressible, 2D subsonic, NACA
        4-digit, and two benchmark datasets; higher accuracy may increase computational
        cost
    - line: Physics-structured learning objectives and trust audits
      what_it_solves: uses physics residuals or physics-informed network constraints
        to regularize, audit, or calibrate neural predictions
      what_remains_open: residuals appear reliable as trust signals but poor as correction
        objectives; one physics-informed method has no visible abstract or analysis,
        so its objective design is a verification gap
    - line: Operator-learning architecture benchmarking
      what_it_solves: compares deep operator architectures on aerodynamic surface
        pressure, including shock capture, scalability, and data scarcity
      what_remains_open: no explicit limitations are reported, and performance is
        assessed on a narrow industrial aircraft configuration and 2D airfoils
    - line: LLM/agent tool orchestration and automated physics discovery
      what_it_solves: separates LLM intent, deterministic tool execution, and explanation;
        automates flow decomposition and model improvement workflows
      what_remains_open: strategic errors persist and gains may depend on ontology/tool
        wrappers; evidence covers two domains and five flow benchmarks
    - line: Measurement-validated CFD design frameworks
      what_it_solves: couples on-site measurement and calibrated RANS digital twins
        with design decision maps for urban wind-energy siting
      what_remains_open: validation is site-specific and dendrogram generalization
        to other urban forms is not reported
    - line: Method evidence and ablation protocol
      what_it_solves: isolates ontology, residual-conditioning, and architecture effects
        through ablations, benchmark errors, and uncertainty/coverage metrics
      what_remains_open: several top papers lack code, data, or limitation evidence;
        some ablations show gains are not attributable to the proposed conditioning
        mechanism
    consensus:
    - Learned surrogates can provide substantial speedup over conventional CFD while
      capturing qualitative flow features and aerodynamic quantities.
    - Domain grounding—through residuals, ontologies, or triple decomposition—tends
      to improve reliability, interpretation, or constraint satisfaction rather than
      solely raw accuracy.
    - Ablations are treated as necessary to separate proposed method contribution
      from surrounding tools, retrieval settings, or learned correctors.
    - 'Evaluation relies on multiple signals: relative field error, validation hit-rate
      metrics, rank correlation, worst-decile detection, coverage, and energy-yield
      estimates.'
    disagreements:
    - 'Representation assumptions differ: spectral geometry conditioning, flow-state
      attention over point clouds, operator/graph architectures, and physics-informed
      or residual-based objectives each encode geometry-flow interaction differently.'
    - 'The role of physics residuals differs: one line treats RANS residual as a calibrated
      trust signal but poor correction objective, while physics-informed objectives
      imply physical regularization; direct comparison is limited by sparse evidence.'
    - 'Interaction mode differs: some methods target direct surrogate inference, others
      LLM-agent orchestration, and others decision/design frameworks around a measurement-validated
      digital twin.'
    - 'Evaluation targets differ: error reduction on benchmark datasets, trust calibration
      under distribution-free coverage, physics discovery, or annual wind-energy yield.'
    - 'Cost-accuracy position differs: one attention method improves accuracy at higher
      computational cost, while other surrogate work emphasizes orders-of-magnitude
      speedup.'
    open_questions:
    - Do geometry- and flow-state-conditioned surrogates transfer to unsteady, compressible,
      3D, non-NACA, or non-urban regimes not covered by the evidence?
    - Can physics residuals be converted into correction objectives while preserving
      their reliability as error detectors?
    - How much of agentic orchestration or discovery gain comes from LLM reasoning
      versus ontologies, deterministic tools, and scoped retrieval?
    - Which release and reporting gaps—code, data, metric, limitation—remain for the
      visible top-paper subset?
    - Can accuracy gains from flow-state attention be achieved without increasing
      computational cost?
    - Does the proposed representation or objective cause reported improvements when
      some ablations show similar gains after removing the proposed conditioning input?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何与流态条件化代理表示
      解决的问题: 将翼型或点云几何及工作流态编码为神经场或注意力状态，用于快速气动场预测
      尚未覆盖: 在稳态、不可压缩、二维亚音速、NACA 4位和两个基准数据之外的迁移；精度提升可能增加计算成本
    - 路线: 物理结构化学习目标与可信审计
      解决的问题: 使用物理残差或物理信息网络约束对神经预测进行正则、审计或校准
      尚未覆盖: 残差作为可信信号可靠但作为修正目标较差；一项物理信息方法摘要和分析为空，目标设计属验证缺口
    - 路线: 算子学习架构基准评测
      解决的问题: 在气动表面压力预测中比较深度算子架构，包括激波捕捉、可扩展性和数据稀缺
      尚未覆盖: 未报告明确局限；仅在二维翼型和工业级三维飞机构型上评测
    - 路线: LLM/智能体工具编排与自动化物理发现
      解决的问题: 分离LLM意图、确定性工具执行与解释；自动化流动分解和模型改进流程
      尚未覆盖: 战略性错误仍存在，收益可能依赖本体/工具封装；证据覆盖两个领域和五个流动基准
    - 路线: 实测验证的CFD设计框架
      解决的问题: 将现场测量和校准RANS数字孪生与设计决策图结合，用于城市风能选址
      尚未覆盖: 验证具有场地特异性，树状图在其他城市形态上的泛化未见报告
    - 路线: 方法证据与消融协议
      解决的问题: 通过消融、基准误差和不确定性/覆盖率指标隔离本体、残差条件化和架构效应
      尚未覆盖: 若干top论文缺少代码、数据或局限说明；一些消融显示增益不能归因于所提条件化机制
    共识:
    - 学习型代理相比传统CFD可提供数量级加速，同时捕捉定性流动特征和气动量。
    - 通过残差、本体或三重分解进行的领域接地，更倾向于提升可靠性、可解释性或约束满足，而非仅提升原始精度。
    - 消融被视为区分所提方法贡献与周边工具、检索设置或学习校正器贡献的必要手段。
    - 评估依赖多种信号：相对场误差、验证命中率指标、秩相关、最差十分位检测、覆盖率和年发电量估计。
    分歧:
    - 表示假设不同：谱几何条件化、点云流态注意力、算子/图架构以及物理信息或残差目标，对几何-流动交互的编码方式不同。
    - 物理残差角色不同：一条路线将RANS残差视为校准可信信号但较差的修正目标，物理信息目标则暗示物理正则；受限证据难以直接比较。
    - 交互模式不同：一些方法面向直接代理推理，另一些面向LLM智能体编排，还有面向实测验证数字孪生的设计框架。
    - 评测目标不同：基准误差降低、分布无关覆盖率下的可信校准、物理发现或年风能发电量估计。
    - 成本-精度取向不同：一种注意力方法以更高计算成本换精度，而其他代理工作强调数量级加速。
    开放问题:
    - 几何与流态条件化代理能否迁移到证据未覆盖的非稳态、可压缩、三维、非NACA或非城市状态？
    - 物理残差能否转化为修正目标，同时保持其作为误差检测器的可靠性？
    - 智能体编排或发现收益中有多少来自LLM推理，而非本体、确定性工具和限定范围检索？
    - 可见top论文子集在代码、数据、指标和局限性方面还有哪些发布与报告缺口？
    - 流态注意力带来的精度提升能否在不增加计算成本的情况下实现？
    - 当一些消融显示移除所提条件输入后仍有类似收益时，所提表示或目标是否确实导致改进？
