  related_work_outline:
  - 'Mainstream direction: Current method work centers on learned neural surrogates
    and LLM/agentic orchestration for physics and aerodynamic analysis. Representative
    examples are Airfoil2Vec, FSAN, S$^{2}$-PINN, and PhysMiner, which replace or
    guide CFD/RANS workflows while emphasizing task-specific representations and benchmark-driven
    evaluation.'
  - 'Shared research pattern: Most methods embed domain knowledge, such as geometry
    spectra, flow states, physics constraints, ontologies, or deterministic tool boundaries,
    into architectures or planners; they validate via ablation or benchmark comparison
    and report accuracy gains or speedups over baselines.'
  - 'Key differences: Papers differ in representation: spectral geometry conditioning
    versus flow-state attention versus stochastic separable PINNs versus LLM-tool
    orchestration; they differ in evaluation targets: field error, tool-selection
    accuracy, or turbulence model improvement; and differ in deployment as direct
    inference versus agent-tool interaction.'
  - 'Trend evolution: The available top evidence is concentrated around 2026 despite
    a broader 2004-2026 span, suggesting a current frontier shift toward hybrid LLM-tool/agentic
    workflows, dataset-specific surrogate engineering, and evidence protocols rather
    than older standalone numerical methods.'
  - 'Open questions: Cross-domain transfer beyond reported 2D airfoil, 3D aircraft,
    periodic hill, and five-benchmark settings; attribution of gains to representation,
    planner, ontology, or dataset; reproducibility and limitation gaps for stochastic
    separable PINNs, dynamic adaptation benchmarks, and some benchmark studies.'
  related_work_outline_zh:
  - 主流方向：当前方法工作集中在面向物理与气动分析的学习式神经代理和LLM/智能体编排。代表如 Airfoil2Vec、FSAN、S$^{2}$-PINN、PhysMiner，用以替代或引导
    CFD/RANS 流程，并强调任务特定表示和基于基准的评估。
  - 研究共性：多数方法将几何谱、流动状态、物理约束、本体或确定性工具边界等先验嵌入架构或规划器；通过消融或基准比较验证，并报告相对基线的精度提升或加速。
  - 关键差异：表示方式不同，包括谱几何条件、流动状态注意力、随机可分离PINN、LLM-工具编排；评测目标不同，包括场误差、工具选择准确率或湍流模型改进；部署方式不同，包括直接推理与智能体-工具交互。
  - 趋势演进：尽管年份跨度为2004-2026，主要高证据集中在2026，显示当前前沿偏向混合LLM-工具/智能体工作流、面向数据集的代理工程与证据协议，而不是较早期的独立数值方法。
  - 开放问题：在已报告的二维翼型、三维飞机、周期山流和五项基准之外是否可迁移；收益应归因于表示、规划器、本体还是数据集；随机可分离PINN、动态物理适应基准及部分基准研究存在复现与局限性说明缺口。
  literature_review:
    line_of_work_matrix:
    - line: Learned geometry- and flow-conditioned surrogates
      what_it_solves: Constructs neural surrogates that encode geometric or flow-state
        structure to predict aerodynamic fields with large speedups over RANS/CFD.
      what_remains_open: Evidence is limited to steady incompressible 2D subsonic
        NACA 4-digit airfoils and a narrow set of 3D aircraft/automotive benchmarks;
        cost-accuracy transfer beyond these regimes remains unresolved.
    - line: Physics-informed and stochastic neural formulations
      what_it_solves: Introduces stochastic separable structure into physics-informed
        neural networks for PDE-constrained learning.
      what_remains_open: The bounded packet provides only title and score signals
        without visible methodology, results, or limitations, so validation scope
        is a verification gap.
    - line: Ontology/tool-grounded LLM orchestration and agentic reasoning
      what_it_solves: Separates LLM intent interpretation from deterministic domain
        tool execution, and automates flow decomposition or model recommendation via
        multi-agent reasoning.
      what_remains_open: Reported instantiations cover two domains or five benchmarks;
        strategic errors remain; ontology correction depends on scoped retrieval;
        code and artifact signals are weak.
    - line: Benchmark and evidence protocols for method comparison
      what_it_solves: Compares deep operator architectures or dynamic physics adaptation
        methods on surface pressure, shock capture, scalability, data scarcity, or
        code evolution.
      what_remains_open: Some studies do not state limitations; dynamic physics adaptation
        and stochastic PINN evidence have sparse visible analysis; baseline/metric
        details and artifact availability are incomplete.
    consensus:
    - Current methods embed domain priors into learned models or tool constraints
      rather than relying on generic black-box architectures.
    - There is broad use of task-specific datasets and benchmark comparisons to establish
      accuracy or speedup claims.
    - Most papers treat expensive CFD/RANS or manual flow analysis as the baseline
      to be replaced or guided.
    disagreements:
    - 'Representation differs: spectral geometry conditioning constructs geometry
      features, while flow-state attention partitions geometry into learned states,
      and LLM-tool orchestration separates planning from execution.'
    - 'Evaluation targets differ: some compare continuous pressure/velocity field
      error on Emmi-Wing or DrivAerNet++, while others evaluate tool-selection accuracy,
      interpretation accuracy, or subgrid-scale model quality.'
    - 'Deployment and interaction differ: direct neural surrogate inference versus
      LLM-agent orchestration around deterministic domain tools versus dynamic code-evolution
      benchmarking.'
    - 'Tradeoff emphasis differs: one flow-state attention method accepts higher computational
      cost for accuracy, while surrogate studies emphasize orders-of-magnitude simulation
      speedups.'
    open_questions:
    - Do reported surrogate gains transfer beyond steady, incompressible, two-dimensional
      subsonic airfoil flows and the narrow automotive/aircraft/periodic hill settings?
    - How much of the gain in tool-orchestration and agent-based discovery comes from
      the domain ontology, retrieval style, or multi-agent structure rather than the
      underlying LLM?
    - Which evidence protocols isolate method contribution from dataset, baseline,
      metric, and implementation choices when limitation statements are missing?
    - What are the missing reproducibility details and validation boundaries for stochastic
      separable physics-informed networks and dynamic physics adaptation benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何与流动条件化的学习代理
      解决的问题: 编码几何或流动状态结构，以预测气动场并相对RANS/CFD实现显著加速。
      尚未覆盖: 证据限于稳态不可压缩二维亚音速NACA 4-digit翼型及少量三维飞机/汽车基准，跨工况迁移和成本-精度边界仍不明确。
    - 路线: 物理信息与随机神经形式化
      解决的问题: 将随机可分离结构引入物理信息神经网络，用于PDE约束学习。
      尚未覆盖: 证据包仅有标题和分数信号，缺少方法、结果和局限性，验证范围是证据缺口。
    - 路线: 本体/工具约束的LLM编排与智能体推理
      解决的问题: 将LLM意图解释与确定性领域工具执行分离，并通过多智能体推理自动化流动分解或模型推荐。
      尚未覆盖: 已报告实例仅覆盖两个领域或五个基准；战略错误仍存在；本体纠正依赖限定范围检索；代码与工件信号弱。
    - 路线: 方法比较的基准与证据协议
      解决的问题: 在表面压力、激波捕捉、可扩展性、数据稀缺或代码演化上比较深度学习算子架构和物理自适应方法。
      尚未覆盖: 部分研究未说明局限性；动态物理适应和随机PINN证据缺少可见分析；基线/指标细节与工件可获得性不完整。
    共识:
    - 当前方法倾向将领域先验嵌入学习模型或工具约束，而非依赖通用黑箱架构。
    - 论文普遍使用任务特定数据集和基准比较来支持精度或加速声明。
    - 多数研究将昂贵的CFD/RANS或手动流动分析视为要被替代或引导的基线。
    分歧:
    - 表示方式不同：谱几何条件化构建几何特征，流动状态注意力将几何划分为可学习状态，LLM-工具编排则把规划与执行解耦。
    - 评测目标不同：有的比较Emmi-Wing、DrivAerNet++上的连续压力/速度场误差，有的评测工具选择准确率、解释准确率或亚格子模型质量。
    - 部署与交互方式不同：直接神经代理推理、围绕确定性领域工具的LLM智能体编排，以及动态代码演化基准评测。
    - 权衡重点不同：一个基于流动状态注意力的方法以提高计算成本换取准确率，而代理建模研究强调相对传统仿真的数量级加速。
    开放问题:
    - 报告中的代理收益能否迁移到稳态、不可压缩、二维亚音速翼型以及当前汽车/飞机/周期山流场景之外？
    - 工具编排和智能体发现带来的收益中，有多少来自领域本体、检索方式或多智能体结构，而非底层LLM？
    - 在缺少局限性说明时，哪些证据协议能隔离方法贡献与数据集、基线、指标和实现选择的影响？
    - 随机可分离物理信息网络和动态物理适应基准还缺少哪些复现细节与验证边界？
