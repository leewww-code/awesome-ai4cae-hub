    line_of_work_matrix:
    - line: End-to-end surrogate-to-optimization and solver-coupled workflows
      what_it_solves: Turning learned aerodynamic predictions into design loops or
        CFD initialization so downstream tasks use fast surrogates without sacrificing
        numerical reliability.
      what_remains_open: External deployment evidence is narrow; shape optimization
