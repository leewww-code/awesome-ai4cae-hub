  related_work_outline:
  - 'Mainstream direction: The evidence centers on high-fidelity aerodynamic surrogate
    benchmarking, comparing geometry-to-flow and force prediction on shared CFD or
    experimental datasets, with recent entries also coupling neural surrogates to
    numerical solvers and agentic CFD workflows.'
  - 'Shared research pattern: Works evaluate models with normalized error metrics
    such as relative L2 or MSE, then add ablations, out-of-distribution extrapolation,
    distribution-shift tests, or solver-coupled correction to probe robustness beyond
    single aggregate scores.'
  - 'Key differences: Some works treat surrogates as final predictors while others
    use them as initial guesses for Newton-Krylov correction; evaluation targets differ
    among field error, aerodynamic-force error, physical flow-statistics, and retrieval-driven
    automation success.'
  - 'Trend evolution: The detailed top-paper evidence is concentrated in 2026 and
    moves from single-benchmark accuracy toward shifted operating conditions, tessellation
    and cross-vehicle stress tests, physical diagnostics, solver coupling, and LLM-agent
    automation.'
  - 'Open questions: Whether benchmark error reductions translate into better physical
    forecasts and downstream aerodynamic decisions, and whether current metrics or
    datasets sufficiently cover deployment shifts, physical diagnostics, and reproducibility
    gaps.'
  related_work_outline_zh:
  - 主流方向：证据集中于高保真空气动力学代理基准，在共享CFD或实验数据上比较几何到流场和力的预测，近期工作还引入数值求解器耦合与智能体CFD流程。
  - 研究共性：使用相对L2或MSE等归一化误差指标，并加入消融、分布外外推、分布偏移测试或求解器耦合校正，以检验聚合分数之外的鲁棒性。
  - 关键差异：代理模型在部分工作中是最终预测器，在另一类工作中作为Newton-Krylov校正初值；评测目标涵盖流场误差、气动力误差、物理统计一致性和检索自动化成功度。
  - 趋势演进：详细证据集中在2026年，从单一基准精度转向运行条件、网格划分与跨车辆压力测试、物理诊断、求解器耦合和LLM智能体自动化。
  - 开放问题：基准误差下降能否转化为更好的物理预测和下游气动决策；现有指标与数据集是否充分覆盖部署偏移、物理诊断和复现缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Makes geometry-to-flow and force prediction comparable through
        shared high-fidelity CFD or experimental datasets, benchmark splits, and normalized
        error metrics.
      what_remains_open: Whether task distributions cover deployment shifts such as
        operating-condition changes, tessellation differences, cross-vehicle prototypes,
        and physically relevant flow-statistics targets.
    - line: Metric and stress-test design
      what_it_solves: Probes robustness beyond aggregate scores through ablations,
        out-of-distribution Reynolds extrapolation, solver-coupled residual correction,
        flow-statistics diagnostics, and controlled distribution-shift evaluations.
      what_remains_open: Alignment between proxy metrics and downstream decisions,
        and whether intervention-based physical explanations are controlled for removed
        fluctuation energy or tested across more than one benchmark.
    - line: Comparable baselines and reporting
      what_it_solves: Supports auditability by benchmarking multiple architectures
        against shared baselines and by reporting relative error reductions, rank
        correlation, retrieval coverage, or completion success.
      what_remains_open: Many entries lack explicit code, dataset, artifact, or limitation
        evidence, so conclusion stability across implementations, compute budgets,
        and missing artifacts remains unverified.
    consensus:
    - Aerodynamic surrogate benchmarking is grounded in shared datasets and normalized
      error metrics such as relative L2 or MSE.
    - In-distribution accuracy alone is treated as insufficient; works add ablations,
      distribution shifts, solver coupling, or physical diagnostics to stress-test
      generalization.
    - Differentiable or specialized geometry-flow interaction representations are
      repeatedly used to improve field or force prediction.
    - Code, dataset artifacts, and explicit limitation statements are often absent,
      leaving reproducibility as a verification gap.
    disagreements:
    - Surrogates are framed as final predictors in some work and as initial guesses
      for Newton-Krylov numerical correction in another.
    - Evaluation targets differ across velocity or pressure field error, aerodynamic
      force coefficients, residual reduction, physical flow-statistics alignment,
      and automated case-generation success.
    - Some evidence treats aggregate benchmark error as a valid primary target, while
      other evidence shows benchmark error can misalign with fluctuation-energy error
      and argues for complementary diagnostics.
    - Modeling choices differ over geometry-flow interaction, including point-cloud
      flow-state attention, domain-decomposed routed decoders, graph or transformer
      operator backbones, and learned quadrature.
    - Interaction modes differ between supervised surrogate regression and LLM-driven
      agentic retrieval and case generation.
    open_questions:
    - Do benchmark error reductions translate into better downstream aerodynamic design
      or optimization under operating-point, tessellation, and cross-vehicle distribution
      shifts?
    - Which physically grounded diagnostics should be reported alongside aggregate
      error, and how can intervention masks be matched by removed fluctuation energy?
    - Are benchmark conclusions stable across implementations, compute budgets, and
      unavailable code or dataset artifacts?
    - Do current benchmarks cover enough real vehicle, turbulence, and solver settings
      to support claims about generalization beyond the available cases?
    - Can agentic CFD automation be evaluated for physical correctness and failure
      recovery, rather than only retrieval coverage and case completion?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 通过共享高保真CFD或实验数据集、基准划分和归一化误差指标，使几何到流场、气动力的预测具有可比性。
      尚未覆盖: 任务分布是否覆盖运行条件变化、表面离散化差异、跨车辆原型以及物理相关的流场统计目标等部署偏移。
    - 路线: 指标与压力测试设计
      解决的问题: 通过消融、分布外Reynolds外推、求解器耦合残差校正、流场统计诊断和受控分布偏移评测，超越聚合分数检验鲁棒性。
      尚未覆盖: 代理指标与下游决策的一致性，以及基于干预的物理解释是否控制了移除脉动能量或跨多个基准复现。
    - 路线: 可比基线与报告规范
      解决的问题: 通过多架构共享基线对比，报告相对误差降低、秩相关、检索覆盖率或算例完成度，提高结果可审计性。
      尚未覆盖: 多数证据缺乏显式代码、数据集、工件或局限性说明；结论在不同实现、算力预算和缺失工件下的稳定性尚未验证。
    共识:
    - 气动代理基准依赖共享数据集和相对L2或MSE等归一化误差指标。
    - 仅看分布内精度不够，多项工作加入消融、分布偏移、求解器耦合或物理诊断来压力测试泛化能力。
    - 围绕几何-流动交互引入可微或专门化表示，是改善流场或力预测的共同思路。
    - 代码、数据集工件和显式局限性说明常常缺失，复现性存在核查缺口。
    分歧:
    - 代理模型在部分工作中作为最终预测器，在另一类工作中作为Newton-Krylov数值校正的初值。
    - 评测目标不同：速度或压力场误差、气动力系数、残差降低、物理统计一致性以及自动化算例生成成功度。
    - 部分证据将聚合基准误差视为有效主要目标，另有证据显示其可能与脉动能量误差不一致，并主张补充物理诊断。
    - 几何-流动交互建模选择不同，包括点云流态注意力、域分解路由解码器、图或Transformer算子和学习求积。
    - 交互模式不同：有监督代理回归与LLM驱动的智能体检索和算例生成。
    开放问题:
    - 基准误差下降能否转化为下游气动设计或优化在运行条件、网格划分和跨车辆分布偏移下的收益？
    - 哪些物理诊断应与聚合误差并列报告，干预掩码如何按移除的脉动能量进行匹配？
    - 在代码和数据集工件不可用的情况下，基准结论在不同实现和算力预算下是否稳定？
    - 现有基准是否覆盖足够的真实车辆、湍流和求解器设置，以支持超出可用案例的泛化主张？
    - 智能体CFD自动化能否以物理正确性和故障恢复为评测重点，而不只是检索覆盖率和算例完成度？
