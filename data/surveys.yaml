    - 评测重点不同：分布内误差降低、分布外敏感性、跨架构的分布偏移鲁棒性，或物理统计一致性。
    - 成本与可复现姿态不同：一些方法以更高计算成本换取精度；可见工件和代码释放证据不均衡。
    开放问题:
    - 应采用哪些评测协议来替代或补充聚合代理误差，以确保更好分数对应真实部署物理结果？
    - 输入干预诊断如何控制被移除的脉动能量，避免把敏感性证据误当作物理重要性证明？
    - 求解器耦合、不确定性触发和智能体系统能否在内部车辆数据集、翼型工况和 periodic hill flow 之外被独立复现？
    - 用于分布偏移和跨车型评测的最低数据集与工件发布标准是什么？
