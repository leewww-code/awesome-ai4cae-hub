      reported datasets and benchmark geometries?
    - How can systems maintain accuracy when strong in-distribution surrogates degrade
      under operating-condition, tessellation, or cross-vehicle shifts?
    - Can solver-coupled and agentic pipelines scale to three-dimensional separated
