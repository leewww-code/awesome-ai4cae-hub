  literature_review:
    line_of_work_matrix:
    - line: Solver-coupled surrogate correction and constrained optimization pipelines
        (e.g., Newton-Krylov correction, uncertainty-triggered CFD feedback)
      what_it_solves: Turns neural surrogate predictions into reliable steady CFD
        or shape-optimization workflows by coupling surrogate inference with numerical
        solvers or selective physics feedback.
      what_remains_open: Evidence is centered on in-house vehicle datasets and transonic
