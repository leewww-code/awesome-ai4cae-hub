  related_work_outline:
  - 'Mainstream direction: High-fidelity aerodynamics and CFD surrogate benchmarking
    dominates this evidence, with neural operator/surrogate models evaluated on shared
    datasets such as AirfRANS, DrivAerNet++, Emmi-Wing, and SHIFT-Truck.'
  - 'Shared research pattern: Papers report error reductions on benchmark tasks, often
    against strong learned baselines, and add stress conditions such as OOD Reynolds
    extrapolation, operating-point shifts, or solver-coupled correction to go beyond
    single aggregate scores.'
  - 'Key differences: Some contributions introduce architecture changes such as flow-state
    attention or domain-decomposed routing, some create benchmarks with distribution-shift
    stress tests, and some insert surrogates into numerical solvers or LLM-agent physics
    discovery.'
  - 'Trend evolution: The available years are narrow and mostly 2026, so the trend
    is within the current frontier: evaluation is moving toward robustness, solver
    coupling, and distribution-shift diagnosis rather than only accuracy on fixed
    geometry splits.'
  - 'Open questions: Which benchmark distributions guarantee useful generalization?
    Are field/force error metrics aligned with downstream engineering decisions? Can
    results be independently verified without code or dataset access? How do accuracy-cost
    tradeoffs affect deployment?'
  related_work_outline_zh:
  - 主流方向：高保真空气动力学与CFD代理模型基准评测占据主导，神经算子/代理模型在AirfRANS、DrivAerNet++、Emmi-Wing、SHIFT-Truck等共享数据上评估。
  - 研究共性：论文报告在基准任务上的误差降低，通常与强学习基线比较，并加入OOD Reynolds外推、工况偏移或求解器耦合校正等压力条件。
  - 关键差异：有的提出流态注意力或域分解路由等架构改进，有的构建分布偏移压力测试基准，有的将代理模型嵌入数值求解器或LLM智能体物理发现。
  - 趋势演进：可用年份较窄且集中在2026年，趋势仍处于当前前沿：评估正在从固定几何切分上的精度转向鲁棒性、求解器耦合和分布偏移诊断。
  - 开放问题：哪些基准分布能保证有用泛化？场/力误差指标是否与下游工程决策一致？缺少代码或数据集时结果能否被独立验证？精度-成本权衡如何影响部署？
  literature_review:
    line_of_work_matrix:
    - line: High-fidelity aerodynamic benchmark and dataset construction
      what_it_solves: Creates shared CFD simulation datasets and evaluation splits,
        making surrogate accuracy comparable across geometries and operating conditions.
      what_remains_open: Whether curated shape distributions cover real vehicle classes,
        off-design conditions, and failure modes where surrogates are expected to
        help.
    - line: Surrogate architecture evaluation and stress testing
      what_it_solves: Probes prediction quality beyond aggregate error, including
        shock capture, velocity/pressure field error, force rank correlation, scalability,
        data scarcity, and distribution shifts.
      what_remains_open: Whether proxy metrics such as Relative L2, MSE, and rank
        correlation align with the engineering decisions and reliability requirements
        users care about.
    - line: Solver-coupled and agent-assisted benchmark workflows
      what_it_solves: Uses surrogate predictions as initial guesses for Newton-Krylov
        correction or automates flow-component analysis to evaluate reliability, speedups,
        and physics insight.
      what_remains_open: Evidence is early and benchmark coverage is limited; reproducibility
        and explicit limitations are often missing, leaving stability across implementations
        and compute budgets unresolved.
    consensus:
    - High-fidelity CFD simulation provides the dominant ground truth for evaluating
      aerodynamic surrogates, with field and force errors serving as primary evidence.
    - Benchmark comparisons are made against strong learned baselines rather than
      only classical solvers, indicating shared acceptance of neural operator/surrogate
      baselines.
    - Aggregate accuracy alone is treated as insufficient; papers add OOD Reynolds
      extrapolation, distribution-shift cases, solver coupling, or component-level
      stress tests.
    - Architecture and representation choices clearly affect aerodynamic prediction
      accuracy, with attention, routing, graph, and solver-coupled approaches all
      reporting improvements.
    disagreements:
    - 'Representation differs: one line uses flow-state attention to couple geometry
      and flow, another decomposes the domain into physical regimes before decoding,
      and another avoids direct final prediction by using surrogate outputs only as
      Newton-Krylov initial guesses.'
    - 'Evaluation targets differ: some studies score surface pressure, others velocity
      fields and forces, some turbulence flow components, and some whole-vehicle aerodynamic
      fields.'
    - 'Stress-test settings differ: distribution shifts include operating-point changes,
      input tessellation, and cross-vehicle transfer in one case, while others emphasize
      airfoil OOD Reynolds numbers or industrial aircraft scale.'
    - 'Deployment assumptions differ: some methods optimize direct surrogate accuracy,
      while a solver-coupled method prioritizes online reliability and generation-level
      speedup over standalone prediction error.'
    open_questions:
    - Which benchmark distribution and vehicle/geometry classes must be included to
      make surrogate generalization claims credible?
    - Are Relative L2, velocity MSE, drag MSE, and drag rank correlation sufficient
      proxies for downstream aerodynamic design success?
    - How stable are the reported benchmark rankings across different implementations,
      compute budgets, and code/dataset availability?
    - Do accuracy improvements with higher computational cost remain useful under
      deployment constraints where wall-clock time matters?
    - What unreported baselines, limitation statements, and artifact details are needed
      to verify the benchmark comparisons independently?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 高保真气动基准与数据集构建
      解决的问题: 构建共享的CFD仿真数据集与评测划分，使代理模型在不同几何和工况下的精度可比较。
      尚未覆盖: 已有形状分布是否覆盖真实车型、非设计工况及代理模型预期需要处理的失效模式。
    - 路线: 代理架构评测与压力测试
      解决的问题: 超越总分反映预测质量，包括激波捕捉、速度/压力场误差、力秩相关、可扩展性、数据稀缺和分布偏移。
      尚未覆盖: Relative L2、MSE、秩相关等代理指标是否与用户关心的工程决策和可靠性需求一致。
    - 路线: 求解器耦合与智能体辅助的基准工作流
      解决的问题: 将代理预测作为 Newton-Krylov 初值，或自动化流动分量分析，以评测可靠性、加速比和物理洞察。
      尚未覆盖: 证据尚早、基准覆盖有限；复现信号和明确局限性常缺失，跨实现与算力预算的稳定性未解决。
    共识:
    - 高保真CFD仿真是评估气动代理模型的主要真值来源，场误差和力误差是主要证据。
    - 基准比较通常针对强学习基线而非仅传统求解器，说明神经算子/代理基线已被共同接受。
    - 单一总分被认为不够，论文会加入OOD Reynolds外推、分布偏移、求解器耦合或分量级压力测试。
    - 架构与表示选择明显影响气动预测精度，注意力、路由、图和求解器耦合路线均报告提升。
    分歧:
    - 表示方式不同：一条路线用流态注意力耦合几何与流动，另一条先将物理区域分解再解码，还有一条将代理输出仅作为 Newton-Krylov 初值而非最终预测。
    - 评测目标不同：有的研究关注表面压力，有的关注速度场与力，有的关注湍流分量，有的关注整车气动场。
    - 压力测试设置不同：分布偏移包括工况变化、输入网格化和跨车型迁移，而另一些强调翼型OOD Reynolds数或工业飞机尺度。
    - 部署假设不同：有的方法优化直接代理精度，而求解器耦合方法更重视在线可靠性和代际加速比。
    开放问题:
    - 需要纳入哪些基准分布和车型/几何类别，才能使代理泛化声明可信？
    - Relative L2、速度MSE、阻力MSE和阻力秩相关是否足以代表下游气动设计成功？
    - 在不同实现、算力预算及代码/数据集可用性下，报告中的基准排名是否稳定？
    - 高精度但计算成本更高的改进在部署中是否仍然有用？
    - 还缺少哪些未报告基线、局限性说明和工件细节，才能独立验证基准比较？
