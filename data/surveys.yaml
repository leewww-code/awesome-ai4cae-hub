      尚未覆盖: 证据包缺少方法和结果细节；不同稀疏传感布局或物理系统中的校准与稳健性未建立。
    共识:
    - 大量研究把学习型代理模型作为加速工程CFD预测的核心手段。
    - 几何或流动配置通常作为条件输入，用于预测压力/速度场或气动系数。
    - 受控仿真数据被同时用于训练和基准评测，部分工作强调数据集与流水线公开。
    - 近期工作不只报告精度，也开始比较架构、速度、扩展性和不确定性。
