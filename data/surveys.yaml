    - 'Evidence strength differs: some contributions include ablations and limitations,
      while others provide only title-level information or no explicit limitation.'
    open_questions:
    - Can the proposed surrogates transfer beyond steady, incompressible, two-dimensional
      or reported industrial configurations?
    - Can domain-grounded orchestration expand beyond the reported two domains and
      remove remaining strategic errors?
    - Can high-accuracy state-attention or spectral surrogate methods reduce their
      higher computational cost?
    - How much of the reported improvement is attributable to the learned representation
      versus the planner, tool protocol, dataset, or evaluation setup?
    - What is the reproducible evidence for methods with missing abstract, code, dataset,
      or limitation details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将物理或气动预测问题具体化为几何/流场表示、损失、架构和训练配方。
      尚未覆盖: 向已报告任务族以外的迁移、不同流动区域下的稳定性、计算成本，以及部分方法可见证据不足。
    - 路线: 规划与动作接口方法
      解决的问题: 把学习到的动力学或领域工具连接到规划、执行和决策时接口，用于科学工作流。
      尚未覆盖: 收益有多少来自规划器或编排协议而非底层模型；领域覆盖有限，部分战略错误仍存在。
    - 路线: 方法证据与消融协议
      解决的问题: 通过基准和消融区分方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 若干工作缺少代码、数据集、基线、限制或引用证据，复现性和泛化性尚无法从证据包验证。
    共识:
    - 神经代理模型与智能体/LLM 编排都被视为气动、CFD 或物理相关工作流的方法贡献。
    - 常用领域结构约束学习组件，如几何编码、流态注意力、本体约束和物理分解。
    - 评测普遍采用基准对比、相对误差指标或消融式证据来支撑改进声明。
    - 可复现证据不均衡：部分工作报告数据集或代码信号，其他工作缺摘要、工件或引用信息。
    分歧:
    - 表示方式不同：谱几何编码、流态注意力、可分离物理信息神经形式、图/算子架构各有选择。
    - 监督与评测目标不同：场预测精度、工作流正确性、解释准确率、湍流模型推荐。
    - 交互模式不同：直接代理预测、LLM 智能体配合确定性工具、纯基准或评测协议。
    - 部署设置不同：2D/3D 气动代理、CFD 后处理/拓扑工作流、动态环境中的物理适应。
    - 证据强度不同：部分工作包含消融与限制，部分仅有标题级信息或未说明限制。
    开放问题:
    - 所提代理能否迁移到稳态、不可压缩、二维或已报告工业配置之外？
    - 领域 grounding 编排能否扩展到两个领域之外并减少剩余战略错误？
    - 高精度流态注意力或谱方法代理能否降低较高计算成本？
    - 所报提升有多少来自学习表示，多少来自规划器、工具协议、数据集或评测设置？
    - 对缺少摘要、代码、数据集或限制说明的方法，可复现证据是什么？
