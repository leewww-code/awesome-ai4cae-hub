  related_work_outline:
  - 'Mainstream direction: The visible evidence centers on benchmarking deep-learning
    aerodynamic surrogates on high-fidelity CFD datasets, with attention to accuracy,
    efficiency, and controlled distribution-shift robustness.'
  - 'Shared research pattern: Papers introduce or reuse shared datasets such as AirfRANS,
    Emmi-Wing, DrivAerNet++, and SHIFT-Truck, then compare architectures through field
    error, force error, and rank-correlation metrics.'
  - 'Key differences: Some contributions build benchmark datasets or stress tests,
    while others propose pure surrogate architectures, solver-coupled correction,
    or agentic flow analysis; evaluation targets range from 2D airfoils and 3D aircraft
    to pickup trucks and periodic hill flows.'
  - 'Trend evolution: Although the packet span is 2022-2026, the available top papers
    are concentrated in 2026, suggesting a current-frontier shift from static in-distribution
    leaderboards toward high-fidelity, distribution-shift-aware, and solver/agent-assisted
    benchmarking.'
  - 'Open questions: Whether benchmark distributions cover operational shifts, whether
    proxy metrics align with downstream decisions, and whether conclusions remain
    stable when public artifacts and standardized cost-robustness protocols are missing.'
  related_work_outline_zh:
  - 主流方向：当前证据集中在高保真CFD数据集上评测深度学习气动代理，重点关注精度、效率与受控分布偏移鲁棒性。
  - 研究共性：论文引入或复用 AirfRANS、Emmi-Wing、DrivAerNet++、SHIFT-Truck 等共享任务，通过场误差、力误差和秩相关指标比较不同架构。
  - 关键差异：有的构建数据集或压力测试，有的提出纯代理架构、求解器耦合校正或智能体流动分析；评测对象从二维翼型、三维飞机到皮卡和周期山流。
  - 趋势演进：尽管时间跨度为2022-2026，可见高排名论文集中在2026年，显示当前前沿正从静态分布内榜单转向高保真、分布偏移敏感和求解器/智能体辅助评测。
  - 开放问题：基准分布是否覆盖运行点偏移，代理指标是否对齐下游决策，以及在缺少公开工件和标准化成本-鲁棒性协议时结论是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: High-fidelity aerodynamics dataset and benchmark construction
      what_it_solves: Creates shared reference tasks and controlled distribution shifts
        for comparing neural aerodynamic surrogates on surface and volume predictions,
        as illustrated by SHIFT-Truck.
      what_remains_open: Whether the geometry, operating-condition, and vehicle-type
        coverage generalizes beyond the reference pickup, airfoil, and aircraft cases
        to unseen real-world design spaces.
    - line: Metric and stress-test design
      what_it_solves: Probes robustness beyond aggregate in-distribution error, including
        shock capture, data scarcity, tessellation shifts, operating-point shifts,
        and cross-vehicle shifts.
      what_remains_open: Whether these stress-test proxies align with downstream engineering
        objectives such as optimization reliability and force prediction is still
        unresolved.
    - line: Comparable surrogate baselines and reporting
      what_it_solves: Benchmarks multiple operator-learning architectures under common
        datasets and metrics, making relative strengths in scalability, data efficiency,
        and discontinuity capture auditable.
      what_remains_open: Benchmark conclusions may not be stable across implementations
        and compute budgets, especially when code, dataset, artifact, or limitation
        details are not visible.
    - line: Solver-coupled and agent-assisted evaluation workflows
      what_it_solves: Uses neural surrogates as initial guesses or uses agentic reasoning
        for numerical correction and turbulence component analysis on benchmark flows.
      what_remains_open: Standardized evaluation protocols for reliability, computational
        overhead, and reproducibility across flow regimes and downstream tasks remain
        lacking.
    consensus:
    - High-fidelity CFD datasets are treated as shared ground truth for comparing
      neural aerodynamic surrogates rather than relying on isolated case studies.
    - Field-level errors such as MSE or Relative L2 are commonly combined with force
      or rank-correlation metrics to capture physical prediction quality.
    - Strong in-distribution accuracy is insufficient; controlled distribution-shift
      testing is needed to reveal generalization failures.
    - Neural surrogates can be made more reliable when coupled with numerical correction
      instead of being used as standalone predictors.
    - Accuracy gains often come with additional computational cost, so efficiency
      is reported alongside predictive error.
    disagreements:
    - 'Representation choice differs: separate geometry-flow state attention, domain-decomposed
      routed operators, and stochastic separable physics-informed networks encode
      the same aerodynamic prediction problem differently.'
    - 'Evaluation target differs: some studies emphasize surface pressure, others
      velocity field, drag force, Reynolds stress, or residual convergence.'
    - 'Evaluation setting differs: fixed in-distribution benchmarks coexist with deliberately
      constructed operating-point, tessellation, and cross-vehicle distribution shifts.'
    - 'Deployment mode differs: pure surrogate prediction, solver-coupled correction,
      and agentic automated flow analysis are emphasized to different degrees.'
    open_questions:
    - What benchmark distribution coverage is necessary to prevent strong in-distribution
      surrogates from failing on unseen operating points or vehicle classes?
    - Do current error and rank-correlation metrics align with downstream aerodynamic
      design and optimization decisions?
    - Can benchmark conclusions be reproduced when many records lack visible code,
      dataset, artifact, or limitation details?
    - How should accuracy and computational cost be jointly standardized across different
      flow regimes and model scales?
    - What stress tests are needed for turbulent, industrial-scale, and data-scarce
      cases where shock or discontinuity capture dominates?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 高保真气动数据集与基准构建
      解决的问题: 为神经气动代理提供共享参考任务和受控分布偏移，便于比较表面与体流场预测，例如 SHIFT-Truck。
      尚未覆盖: 参考皮卡、翼型和飞机案例之外，几何、运行条件和车型多样性是否覆盖真实设计空间尚未建立。
    - 路线: 指标与压力测试设计
      解决的问题: 检验模型在激波捕捉、数据稀缺、网格划分偏移、运行点偏移和跨车型偏移下的鲁棒性。
      尚未覆盖: 这些压力测试代理指标是否与下游优化可靠性和力预测决策一致仍未解决。
    - 路线: 可比代理基线与报告规范
      解决的问题: 在相同数据集和指标下基准不同算子学习架构，揭示可扩展性、数据效率和间断捕捉方面的差异。
      尚未覆盖: 当代码、数据集或工件细节不可见时，基准结论跨实现和算力预算的稳定性无法确认。
    - 路线: 求解器耦合与智能体辅助评测工作流
      解决的问题: 将代理预测作为数值迭代初值，或通过智能体推理进行数值校正和湍流分量分析。
      尚未覆盖: 不同流态和下游任务中可靠性、计算开销和可重复性的标准化评测协议仍然缺乏。
    共识:
    - 高保真CFD数据集被当作比较神经气动代理的共享真值，而非依赖孤立案例。
    - 场级误差如 MSE 或 Relative L2 通常与力或秩相关指标结合，以反映物理预测质量。
    - 分布内精度高并不足以说明泛化，需要通过受控分布偏移测试揭示退化。
    - 神经代理若与数值校正耦合，比单独作为预测器更可靠。
    - 精度提升常伴随计算成本上升，因此效率被作为并列评测维度。
    分歧:
    - 表示方式不同：几何-流态注意力、域分解路由算子和随机可分离物理信息网络对同一气动预测问题编码方式不同。
    - 评测目标不同：有的关注表面压力，有的关注速度场、阻力、Reynolds应力或残差收敛。
    - 评测设置不同：固定分布内基准与专门构造的运行点、网格划分和跨车型分布偏移并存。
    - 部署模式不同：纯代理预测、求解器耦合校正和智能体自动化流动分析被不同程度强调。
    开放问题:
    - 基准需要覆盖哪些分布偏移，才能避免强分布内代理在未见运行点或车型上失效？
    - 当前误差和秩相关指标是否与下游气动设计和优化决策对齐？
    - 当许多记录缺少可见代码、数据集、工件或局限性细节时，基准结论能否复现？
    - 如何在不同流态和模型规模下统一标准化精度与计算成本的权衡？
    - 对湍流、工业尺度和数据稀缺且激波或间断主导的案例，需要哪些压力测试？
