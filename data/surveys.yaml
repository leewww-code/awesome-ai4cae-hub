  related_work_outline:
  - 'Mainstream direction: The available evidence centers on engineering CFD/aerodynamic
    surrogate modeling, especially airfoil, 3D aircraft, channel, and wake flows;
    papers emphasize dataset construction, neural operator benchmarking, geometry
    conditioning, and CFD speedup.'
  - 'Shared research pattern: A typical contribution pairs a simulated flow dataset
    or benchmark with a learned geometry/flow surrogate, evaluates interpolation and
    speedup, and treats broader physical regime or geometry coverage as a remaining
    boundary.'
  - 'Key differences: The work splits between data-driven and physics-informed training,
    predicts coefficients versus full fields versus time-evolved states, and uses
    representations from spectral encoders and GNNs to transformers and Gaussian process-style
    regression.'
  - 'Trend evolution: High-ranked evidence is concentrated in 2026, so the visible
    trend is within the current frontier: moving from single airfoil surrogates toward
    larger datasets, 3D/industrial configurations, multi-fidelity correction, and
    uncertainty-aware or adaptive-mesh forecasting.'
  - 'Open questions: Transfer beyond NACA/2D/steady regimes, data-free versus data-driven
    tradeoffs, validation standards, and integration of adaptive and uncertainty-aware
    methods into engineering workflows remain unresolved.'
  related_work_outline_zh:
  - 主流方向：现有证据集中在工程CFD/气动代理建模，尤其覆盖翼型、三维飞机、通道与尾流流动；论文强调数据集构建、神经算子基准评测、几何条件化与CFD加速。
  - 研究共性：典型工作将仿真流动数据集或基准与几何/流动代理模型配对，评估插值能力与加速效果，并将更广泛物理工况或几何覆盖作为尚未解决的问题。
  - 关键差异：方法分为数据驱动与物理信息/无数据训练；预测目标从系数、场到时间序列状态不等；表示包括谱几何编码、GNN、Transformer、高斯过程式回归等。
  - 趋势演进：高排名证据集中在2026年，可见趋势位于当前前沿，从单一翼型代理走向更大数据集、三维/工业构型、多保真修正以及不确定性与自适应网格预测。
  - 开放问题：向非NACA、非稳态、可压缩工况迁移，无数据与数据驱动方法权衡，验证标准，以及自适应与不确定性方法在工程流程中的集成仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Engineering CFD dataset and benchmark construction
      what_it_solves: Provides validated RANS, LBM, or high-Reynolds wake data and
        evaluation cases for learning aerodynamic or flow surrogates.
      what_remains_open: Coverage remains concentrated in specific geometries and
        flow regimes; dataset access and documentation are often not verifiable from
        abstracts.
    - line: Geometry-conditioned aerodynamic field surrogate modeling
      what_it_solves: Maps airfoil or geometry inputs to pressure and velocity fields
        with orders-of-magnitude speedup over conventional CFD.
      what_remains_open: Steady, incompressible, 2D subsonic assumptions and NACA-style
        training distributions limit generalization to unsteady, compressible, and
        non-NACA/industrial shapes.
    - line: Deep operator architecture benchmarking for industrial aerodynamics
      what_it_solves: Compares operator learning architectures on surface pressure
        prediction, shock capture, scalability, and data scarcity.
      what_remains_open: Explicit limitations and broader industrial configurations
        beyond tested 2D airfoils and a single 3D aircraft are not evidenced.
    - line: Multi-fidelity and dimension-bridging surrogate correction
      what_it_solves: Uses a lower-dimensional surrogate to approximate higher-dimensional
        RANS predictions with uncertainty and fast kernel evaluation.
      what_remains_open: Performance depends on a suitable low-dimensional model,
        and evaluation focuses more on aerodynamic coefficients than full flow fields.
    - line: Physics-informed and data-free PDE solving
      what_it_solves: Solves steady Navier-Stokes benchmark problems without external
        flow data across low and high Reynolds numbers.
      what_remains_open: Evidence is mostly benchmark-level; behavior on complex engineering
        geometries and transient flows remains missing.
    - line: Adaptive mesh, sparse sensing, and uncertainty-aware forecasting
      what_it_solves: Handles AMR PDE data, sparse sensing, and uncertainty quantification
        for fluid states via transformer or recurrent approaches.
      what_remains_open: Application-specific results and limitations are sparse in
        the packet, so engineering relevance remains a verification gap.
    consensus:
    - The cluster centers on learned surrogates that replace or accelerate CFD and
      RANS predictions for engineering flow and aerodynamic quantities.
    - Public datasets and benchmarks are treated as central contributions, usually
      paired with neural architecture choices and speedup metrics.
    - Work agrees that geometry conditioning and physical regime coverage are key
      factors for aerodynamic surrogate generalization.
    - Interpolation within the supplied geometry or flow distribution is the primary
      evidence; out-of-distribution and industrial transfer remain less demonstrated.
    disagreements:
    - Data-driven surrogates use simulated RANS/LBM datasets, while physics-informed
      methods train without external flow data.
    - 'Prediction targets vary: full pressure/velocity fields, surface pressure distributions,
      scalar aerodynamic coefficients, and time-evolving PDE states.'
    - 'Representations vary: spectral geometry encoders, MLPs/neural fields, graph
      neural networks, transformer quadtree tokens, recurrent decoders, and Gaussian
      process-style regression.'
    - Evaluation regimes differ from steady 2D subsonic airfoils to 3D aircraft, 3D
      obstructed channel turbulence, and high-Reynolds wake dynamics.
    - Some work emphasizes data scarcity and uncertainty quantification, while others
      emphasize real-time speed or long-horizon forecasting.
    open_questions:
    - Can geometry-conditioned surrogates trained on NACA-style airfoils transfer
      to impeller, wing, and vehicle configurations with unsteady, compressible, or
      separated flow?
    - How do data-free physics-informed solvers compare with data-driven surrogates
      on industrial high-Reynolds flows where benchmark equations alone may not close
      turbulence?
    - Does dimension bridging from 2D to 3D RANS preserve enough flow-field fidelity,
      or does it mainly improve coefficient-level estimates?
    - What validation, dataset access, and limitation reporting standards are needed
      to compare these methods beyond abstract-level speedup claims?
    - Can adaptive mesh and uncertainty-aware methods be integrated into aerodynamic
      surrogate pipelines without destabilizing long-horizon or data-scarce settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 工程CFD数据集与基准构建
      解决的问题: 提供经校验的RANS、LBM或高雷诺尾流数据与评测案例，用于学习气动或流动代理模型。
      尚未覆盖: 覆盖仍集中于特定几何和流动工况；数据集访问与文档常无法从摘要验证。
    - 路线: 几何条件化气动场代理建模
      解决的问题: 将翼型或几何输入映射到压力和速度场，并以比传统CFD快数个数量级的速度推断。
      尚未覆盖: 稳态、不可压缩、二维亚音速假设和NACA类训练分布限制了对非稳态、可压缩及工业外形的泛化。
    - 路线: 面向工业气动的深度算子架构评测
      解决的问题: 比较算子学习架构在表面压力预测、激波捕捉、可扩展性与数据稀缺下的表现。
      尚未覆盖: 超出测试的二维翼型和单一三维飞机之外的显式局限性与更广泛工业构型证据不足。
    - 路线: 多保真与维度桥接代理修正
      解决的问题: 用低维代理逼近高维RANS预测，并提供不确定性与快速核评估。
      尚未覆盖: 性能依赖合适的低维模型，且评测更偏气动系数而非完整流场。
    - 路线: 物理信息与无数据PDE求解
      解决的问题: 在无需外部流动数据的情况下求解低至高雷诺数稳态Navier-Stokes基准问题。
      尚未覆盖: 证据多为基准级；在复杂工程几何和瞬态流动上的表现仍缺失。
    - 路线: 自适应网格、稀疏传感与不确定性预测
      解决的问题: 通过Transformer或循环方法处理AMR PDE数据、稀疏传感和流体状态不确定性量化。
      尚未覆盖: 应用级结果和局限性在证据包中稀疏，工程相关性仍是验证缺口。
    共识:
    - 该簇围绕学习型代理模型展开，用于替代或加速工程流动与气动量的CFD/RANS预测。
    - 公开数据集和基准被视为核心贡献，常与神经架构选择和加速指标绑定。
    - 研究普遍认为几何条件化和物理工况覆盖是气动代理泛化的关键。
    - 主要证据集中在给定几何或流动分布内的插值；分布外和工业迁移展示较少。
    分歧:
    - 数据驱动代理使用仿真RANS/LBM数据集，而物理信息方法不依赖外部流动数据训练。
    - 预测目标不同：完整压力/速度场、表面压力分布、标量气动系数和随时间演化的PDE状态。
    - 表示方式不同：谱几何编码、MLP/神经场、图神经网络、Transformer四叉树分词、循环解码器和高斯过程式回归。
    - 评测工况从稳态二维亚音速翼型扩展到三维飞机、三维含障碍通道湍流和高雷诺尾流动力学。
    - 有的工作偏数据稀缺与不确定性量化，有的偏实时速度或长时程预测。
    开放问题:
    - 在NACA类翼型上训练的几何条件代理能否迁移到叶轮、机翼与整车构型中的非稳态、可压缩或分离流动？
    - 无数据物理信息求解器与数据驱动代理在工业高雷诺流动中的优劣如何，尤其当基准方程无法闭合湍流时？
    - 二维到三维RANS的维度桥接是否保留足够流场保真度，还是主要提升系数级估计？
    - 需要哪些验证、数据集访问和局限性报告标准，才能超越摘要级加速声明进行比较？
    - 自适应网格和不确定性方法能否集成到气动代理流程中，而不破坏长时程或数据稀缺场景的稳定性？
