  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for high-fidelity aerodynamic surrogates
      what_it_solves: Creates shared CFD and wind-tunnel-validated datasets and splits
        so neural surrogate claims can be compared across geometries, operating conditions,
        and vehicle classes.
      what_remains_open: Whether controlled shape, operating-point, tessellation,
        and cross-vehicle shifts cover real deployment regimes; dataset-specific biases
        may remain hidden.
    - line: Architecture benchmarking on common aerodynamic prediction tasks
      what_it_solves: Uses shared baselines to evaluate operator and graph architectures
        on surface pressure, volume velocity, force coefficients, shock capture, scalability,
        and data scarcity.
      what_remains_open: No unified conclusion across architectures under distribution
        shift; compute cost, implementation details, and missing limitation statements
        limit comparability.
    - line: Metric and physics-grounded stress-test design
      what_it_solves: Probes whether aggregate prediction errors align with flow statistics,
        physical sensitivity, and robustness beyond standard dataset scores.
      what_remains_open: Proxy metrics are not causally linked to physical correctness
        or downstream utility; existing intervention evidence is limited and masks
        are not energy-matched.
    - line: Solver-coupled correctness and reporting conventions
      what_it_solves: Uses terminal numerical convergence, residual reduction, rank
        correlation, and generation-level speedup to audit surrogate predictions beyond
        standalone error metrics.
      what_remains_open: Stability across solvers, implementations, and compute budgets
        is not established; many papers lack visible limitations and artifact/code
        signals.
    - line: Automated flow component analysis on benchmark cases
      what_it_solves: Automates triple decomposition, vortex/component analysis, and
        turbulence modeling recommendations across selected benchmark flows.
      what_remains_open: Evidence is restricted to a few benchmark flow cases with
        incomplete reproducibility signals; generality to broader physics domains
        is not demonstrated.
    consensus:
    - Standardized aerodynamic datasets and common neural-operator baselines are becoming
      the basis for comparable surrogate evaluation.
    - Aggregate field or force errors such as relative L2, velocity MSE, and drag
      MSE/rank correlation are recurrently reported.
    - Strong in-distribution accuracy is not treated as sufficient; robustness shifts,
      computational cost, solver correction, or physical diagnostics are increasingly
      considered.
    - Multiple architectures are compared on identical tasks, with no single architecture
      shown to dominate all evaluated requirements.
    disagreements:
    - 'Evaluation target: surface pressure versus volume velocity versus aerodynamic
      force versus physical flow statistics can change model rankings.'
    - Some evidence emphasizes dataset breadth and controlled distribution shifts,
      while other work emphasizes terminal solver convergence or physical sensitivity
      diagnostics.
    - A model can have lower velocity-field error but worse fluctuation-energy error,
      indicating conflict between aggregate benchmark score and physical-statistic
      agreement.
    - 'Robustness conclusions differ: strong in-distribution models may degrade substantially
      under operating/tessellation/cross-vehicle shifts, while architecture-focused
      evaluations highlight selected models as promising.'
    - 'Interaction mode and reporting differ: agentic automated analysis versus supervised
      surrogate baselines result in different evaluation protocols and verification
      expectations.'
    open_questions:
    - Which proxy metrics best align with downstream aerodynamic decisions such as
      design optimization, control, and turbulence model selection?
    - Are benchmark conclusions stable across tessellation, Reynolds extrapolation,
      vehicle geometry, solver implementation, and compute budget?
    - Does lower aggregate field error imply improved physical forecasts in fluctuation
      energy, shock capture, forces, and residual convergence?
    - How can benchmarks include solver correction and physical diagnostics while
      still reporting standalone surrogate limitations?
    - Many top papers lack visible code, dataset, artifact, or limitation evidence;
      which results can be independently audited remains a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 高保真气动代理的基准任务与数据集设计
      解决的问题: 构建共享的CFD和风洞验证数据集及划分，使神经代理在几何、运行条件和车型间可比较。
      尚未覆盖: 受控的形状、运行点、网格离散化和跨车型偏移是否覆盖真实部署；数据集偏差可能仍隐藏。
    - 路线: 共享气动预测任务上的架构基准评测
      解决的问题: 用共享基线评测算子/图架构在表面压力、体速度、力系数、激波捕捉、扩展性和数据稀缺上的表现。
      尚未覆盖: 分布偏移下无统一鲁棒性结论；计算成本、实现细节和陈述缺失限制可比性。
    - 路线: 指标与基于物理的压力测试设计
      解决的问题: 检验聚合预测误差是否与流场统计、物理敏感性和分布偏移鲁棒性一致。
      尚未覆盖: 代理指标与物理正确性或下游效用的因果联系未建立；干预证据有限且掩码能量未匹配。
    - 路线: 求解器耦合校正与报告规范
      解决的问题: 使用终端数值收敛、残差下降、秩相关和generation-level加速来审计代理预测。
      尚未覆盖: 跨求解器、实现和算力预算的稳定性未验证；多篇文章缺少可见局限性与代码/数据信号。
    - 路线: 基准案例上的自动化流场分量分析
      解决的问题: 在选定基准流上自动进行三重分解、涡/分量分析和湍流建模建议。
      尚未覆盖: 证据限于少数基准流，可复现信号不完整，对更广物理域的通用性未证明。
    共识:
    - 标准化气动数据集与共享神经算子基线正成为可比较代理评测的基础。
    - Relative L2、速度场MSE、阻力MSE/秩相关等聚合误差被反复报告。
    - 仅有强分布内精度不够；分布偏移鲁棒性、计算成本、求解器校正或物理诊断日益受到关注。
    - 多个架构在同一任务上比较，没有单一架构在所有评测需求上占优。
    分歧:
    - 评测目标不同：表面压力、体速度、气动力或物理流统计会使模型排序变化。
    - 部分工作重视数据集广度和受控分布偏移，另一些重视求解器终端收敛或物理敏感性诊断。
    - 某些模型速度场误差较低但脉动能量误差较高，聚合分数与物理统计一致性可能冲突。
    - 鲁棒性结论不一致：强分布内模型在运行点/网格/跨车型偏移下可能显著退化，而架构评测强调特定模型有前景。
