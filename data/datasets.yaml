  description_zh: 尽管基于卷积的神经网络架构在传统机器学习中得到了非常成功的应用，但由于被认为在函数空间中不一致，它们在学习PDE解算子的背景下一直很大程度上被忽视。在此，我们为卷积神经网络提出新颖的适配方法，以证明它们确实能够将函数作为输入和输出进行处理。由此得到的架构被称为卷积神经算子（CNOs），其被专门设计用于保持其内在的连续性质，即使在计算机上以离散形式实现时也是如此。我们证明了一个普适性定理，表明CNOs能够以期望的精度逼近PDE中出现的算子。CNOs在一套新颖的基准测试集上进行了测试，该测试集涵盖一组具有可能多尺度解的多样化PDE，并被观察到显著优于基线，为稳健且准确的算子学习铺平了通往替代框架的道路。我们的代码公开于
