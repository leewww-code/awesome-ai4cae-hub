  description_zh: 限制性的唯象假设是开发准确的流体湍流亚网格尺度模型的主要障碍。具体而言，这些假设限制了模型在存在多种相干结构时描述关键关注量的能力，例如能量和拟涡能的局地通量。本文提出了一种符号化数据驱动的亚网格尺度模型，该模型不需要唯象假设，也没有可调参数，却优于领先的LES模型。结合先验和后验基准测试表明，该模型能在广泛的二维湍流流动中准确预测包括局地通量在内的多种量。尽管该模型是通过LES风格的空间粗粒化推断得到的，但其结构更类似于RANS模型，因为它采用一个额外场来描述亚网格尺度。我们发现，该场必须具有二阶张量结构，才能正确表示亚网格尺度应力张量的各分量以及各种通量。
