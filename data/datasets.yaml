- id: paper-rsi-forge-from-research-papers-to-environments-for-recursiv-2026
  name: RSI-Forge
  description: 'Environments are the foundation of recursive self-improvement: they
    provide the problems agents work on and the feedback used to evaluate progress.
    Yet constructing challenging research environments with reliable evaluation still
    depends on...'
  tags: []
  links:
    paper: https://arxiv.org/abs/2610.09426v1
  sources:
  - repo: papers
    category: dataset
  notes: 'Derived from paper: RSI-Forge: From Research Papers to Environments for
    Recursive Self-Improvement'
  related_papers:
  - id: rsi-forge-from-research-papers-to-environments-for-recursiv-2026
    title: 'RSI-Forge: From Research Papers to Environments for Recursive Self-Improvement'
    url: https://arxiv.org/abs/2610.09426v1
    title_zh: RSI-Forge：从研究论文到面向递归自我改进的环境
  name_zh: RSI-Forge
  description_zh: 环境是递归自我改进的基础：它们提供智能体所处理的问题，以及用于评估进展的反馈。然而，构建具有可靠评估的挑战性研究环境仍依赖领域专家，这限制了其规模和学科覆盖范围。我们提出
    RSI-Forge，一种多智能体流水线，可将已发表论文转化为用于自我改进的可执行环境。三个智能体协同完成构建、复现和评审，以生成带有自动评估器的任务；每篇论文的方法都会被独立重新实现，以建立基线分数。我们呈现了跨越18个领域的210个环境，其中90个由独立的人类领域专家评审。专家和智能体评审员均对改进所提供初始解决方案的潜力以及评估器区分解决方案质量的能力给予高度评价，而专家对捷径抗性、对源论文的忠实度，以及单个想法是否能穷尽一个任务更为挑剔。为验证这些环境用于重复改进的有效性，我们在120个环境上对四个模型进行了连续3次尝试的评估，每次尝试继承先前的代码和笔记，同时模型权重保持固定。在84%的环境中，至少有一个模型在第一次尝试后有所改进。在120个环境中的68个里，模型也优于复现的论文方法，表明在这些基线之外仍有提升空间。记录分析识别出，在这些成功尝试中，有95%包含超出参数调优的工作。对所得轨迹的分析表明，在这些任务上得分较低的模型探索更少，更常接受小于所报告标准误的增益，并且更重地依赖对开发集的调优。RSI-Forge
    提供了一种可扩展的方法，用于构建研究环境，以训练和评估自我改进的智能体。
  notes_zh: 派生自论文：RSI-Forge：从研究论文到面向递归自我改进的环境
  year: 2026
  preview: https://arxiv.org/html/2610.09426v1/fig_teaser.png
