    title_zh: 稳态神经CFD代理模型的跨域预训练
  name_zh: 稳态神经CFD代理模型的跨域预训练
  description_zh: 用于计算流体力学（CFD）的神经代理模型有潜力通过加速仿真来极大地增强工程创新。然而，神经代理模型的主要局限在于缺乏对训练集之外几何构型与应用场景的泛化能力，而考虑到工程场景的多样性，这一点尤为重要。目前，解决该问题的方法是为特定应用生成新数据集；但这需要运行成本高昂的数值求解器。在本工作中，我们朝着解决这一问题迈出一步，研究了跨不同几何构型、边界条件和保真度训练的神经代理模型。我们发现，与从零开始训练以及从领域特定专家模型迁移相比，跨域预训练能够提升在留出数据集上的零样本和少样本性能。特别是，在相同样本量下，微调一个预训练的跨域模型可以使误差降至原来的1/2至1/3；并且相比从零开始训练，达到相同误差所需样本量仅为原来的1/8。这一增益与架构无关，并随模型规模和预训练数据集多样性的增加而提升。此外，我们研究了跨域预训练在CFD代理模型中如何以及为何有效，并发现简单地汇集稳态数据集既充分又有效。鉴于生成CFD数据的高昂成本，随着未来代理模型扩展以应对新问题和用例，通过跨域预训练利用现有数据集很可能将是一种有价值的策略。
  notes_zh: 派生自论文：稳态神经CFD代理模型的跨域预训练
