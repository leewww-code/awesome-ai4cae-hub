  name_zh: WAKESET
  description_zh: 机器学习（ML）为计算流体力学（CFD）带来了变革性潜力，有望加速模拟、改进湍流建模，并实现实时流动预测与控制能力，从而可能从根本上改变工程师处理流体力学问题的方式。然而，流体力学中
    ML 的探索受到严重制约，原因是缺乏适合训练鲁棒模型的大规模、多样化且高保真数据集。这一局限对高度湍流流动尤为突出：此类流动在实际工程应用中占主导地位，但在大规模模拟时仍计算成本高昂、难以承受。高雷诺数湍流数据集对于
    ML 模型学习真实流动所具有的复杂多尺度物理特征至关重要，并使其能够泛化到现有数据集通常所代表的简化低雷诺数范围之外。本文介绍 WAKESET，一个新颖的大规模高度湍流流动
    CFD 数据集，旨在填补这一关键空白。该数据集捕捉了自主水下航行器由更大的超大型无人水下航行器进行水下回收过程中的复杂水动力相互作用。它包含 1,091 个高保真
    Reynolds-Averaged Navier-Stokes 模拟，并扩充至 4,364 个实例，覆盖广泛的速度（雷诺数高达 1.09 x 10^8）和转向角操作包线。本文通过回顾现有资源详细阐述了构建该新数据集的动机，概述了支撑其创建的水动力建模与验证，并描述了其结构。该数据集聚焦于实际工程问题、规模庞大且具有高度湍流特征，这使其成为开发与基准测试用于复杂水下环境中流场预测、代理建模和自主导航的
    ML 模型的宝贵资源。
