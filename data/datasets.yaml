  name_zh: 基于多步长混合专家神经算子的稳定细时间步长长时程湍流预测
  description_zh: 神经算子已越来越多地被用作湍流时间推进预测的数据驱动替代模型。然而，长时程自回归预测对误差累积和预测间隔的选择较为敏感。过小的时间增量可能增加时间冗余并延长推演长度，从而可能降低神经算子在湍流预测中的稳定性。本工作追求一个统一目标：面向三维湍流，在细时间分辨率下实现稳定的长时程自回归预测。我们提出了一种多步长混合专家（Ms-MoE）神经算子，其构建在隐式因式分解
    Transformer（IFactFormer）主干之上。该模型以所请求的相对步长作为条件，并使用时间步路由器来激活特定尺度的路由专家以及一个共享专家，从而形成一种单一架构，表示一族以步长为参数的时间推进算子。我们在强迫均匀各向同性湍流（HIT）和湍流槽道流上，使用滤波直接数值模拟数据集评估了该方法。相对于以往研究使用的采样间隔，我们构建了时间分辨率最高精细
    20 倍的训练数据集，并通过定性时间切片比较和长时间平均统计量报告长时程自回归推演结果。Ms-MoE-IFactFormer 在 HIT 和湍流槽道流上均产生了更稳定的长时程推演，并改善了与长时间平均统计量的一致性，表明其有潜力在更复杂的湍流中实现细时间分辨率下的稳定时间推进。
