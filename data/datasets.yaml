    title_zh: 基于流式主动学习与协作神经网络的数据高效部分逆向设计：汽车玻璃导槽案例研究
  name_zh: 基于流式主动学习与协作神经网络的数据高效部分逆向设计
  description_zh: 工程中的逆向设计常常遇到一个简单问题。每个带标签的训练样本都必须通过昂贵的仿真生成，因此构建大型数据集既缓慢又昂贵。本研究针对部分逆向设计中的这一问题展开研究，其中只有部分设计变量被指定，其余变量必须被推断以达到目标性能值。我们提出
    CoNN-AL，一种用于数据高效部分逆向设计的框架，它将基于流的主动学习添加到带去噪自编码器的协作神经网络（CoNN-DAE）中。该模型通过 Monte Carlo
    dropout 估计预测不确定性，并利用它实时决定哪些传入候选样本值得标注，从而将有限的标注预算用于信息量最大的设计。我们在一个真实的汽车玻璃导槽数据集上验证了该框架，该数据集包含超过
    900,000 个独特仿真设计。仅使用 20,000 个主动选择的标签，约占训练池的 2.3%，CoNN-AL 在所有缺失变量水平上达到 0.967 至 0.982
    的 R-squared 值，接近用远更多数据训练的上界模型。在更困难的缺失变量水平上，它以比随机采样少 30% 至 40% 的标签达到至少 0.95 的 R-squared；而在最具挑战性的水平上，它是本研究中唯一达到
    0.98 R-squared 的策略。与本工作一起，我们公开发布该数据集，以支持未来数据驱动设计的研究。
  notes_zh: 派生自论文：基于流式主动学习与协作神经网络的数据高效部分逆向设计：汽车玻璃导槽案例研究
