    title_zh: 塑造风场：面向运动学可容许城市风预测的嵌套势
  name_zh: 塑造风场
  description_zh: 预测瞬态城市风是理解城市微气候和设计气候韧性城市的基础。可解析建筑物的大涡模拟能够针对每种布局以高昂计算成本生成详细的城市不可压缩风场。神经代理模型通过学习预测速度场的演化，提供了一种更快的替代方案。然而，最小化速度预测误差并不能保证局部质量守恒与壁面不可穿透性，而这两者共同定义了运动学可容许性。这一局限源于无约束的输出表示：几何条件化引导预测，但不会将其限制为可容许的速度场。修正这些输出中的边界违背会改变相邻流体单元中的通量平衡，并可能因此损害局部质量守恒。为解决这一挑战，我们提出
    Sculpt，一种嵌套势框架，将耦合的、依赖几何的约束直接构建到其参数化中。这种嵌套参数化通过在原生三维交错网格上对体积矢量势取离散旋度，生成无散度的速度更新。一个共享标量势约束矢量势的边界值，使同一算子无需每步压力投影也能施加不可穿透性。由于通过该旋度的反向传播会衰减大尺度梯度信号，我们在多个分辨率下参数化体积势，以更好地捕捉大尺度流动结构。我们引入
    UrbanWindFlow，一个涵盖城市形态与入流条件的 LES 数据集，以联合评估精度与运动学可容许性。
  notes_zh: 派生自论文：塑造风场：面向运动学可容许城市风预测的嵌套势
