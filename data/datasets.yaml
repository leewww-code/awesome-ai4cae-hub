  name_zh: AirfoilGen
  description_zh: 翼型形状设计是航空航天工程中的一项基础任务，直接影响飞行稳定性和燃油消耗。深度学习近来已成为该任务的一种有前景的工具，但现有的深度生成方法在几何有效性和物理可控性方面仍存在局限。它们对生成形状的控制很少，会产生无效几何形状，并且通常无法有效地以气动性能为条件。为解决这些问题，本文提出
    AirfoilGen，一种构造即有效且性能感知的翼型潜在扩散模型。它首先引入一种新颖的翼型表示方案——圆扫掠表示（circle sweeping representation），以约束生成过程，使输出形状符合翼型的基本特征。随后，它通过在习得的潜在空间中进行操作，实现对气动性能（例如升力系数和阻力系数）的显式控制：一个
    transformer 模型将翼型形状编码为向量嵌入，而一个条件扩散模型在融入目标气动性能的同时，将高斯噪声去噪为这些潜在嵌入。此外，本文提出了一个包含超过
    200,000 个翼型的新数据集，其规模远大于广泛使用的 UIUC 翼型数据集（1,650 个翼型），更适合训练现代深度生成模型。实验表明，AirfoilGen
    能够实现翼型生成，其几何有效性和气动性能可控性远超此前可达到的水平，平均性能条件化准确率为 98.41%。
