project:
  name: Awesome AI4CAE Hub
  slug: awesome-ai4cae-hub
  description: 'A curated hub for AI-driven CAE: airfoil aerodynamic design agents,
    tool-using LLM agents, aerodynamic parameter optimization, self-evolving agents,
    and CFD data-driven solvers.'
  description_zh: 面向 AI 驱动 CAE 的精选 hub：翼型气动设计智能体、LLM 工具调用、气动参数优化、智能体自进化与 CFD 数据驱动求解。
  github_url: https://github.com/leewww-code/awesome-ai4cae-hub
  site_url: https://leewww-code.github.io/awesome-ai4cae-hub
  generator_repo: jin-s13/awesome-hub-generator
research:
  keywords:
  - airfoil
  - airfoil design
  - airfoil optimization
  - aerodynamic shape optimization
  - aerodynamic design
  - wing design
  - computational fluid dynamics
  - CFD surrogate
  - turbulence modeling
  - Reynolds-averaged Navier-Stokes
  - LLM agent
  - tool use
  - tool calling
  - engineering design agent
  - scientific agent
  - agentic workflow
  - multi-agent system
  - self-evolving agent
  - self-improving agent
  - self-refine
  - automated algorithm discovery
  - automated machine learning
  - LLM-driven optimization
  - Bayesian optimization
  - surrogate model
  - design space exploration
  - constrained optimization
  - evolutionary optimization
  - gradient-based shape optimization
  - adjoint method
  - neural operator
  - physics-informed neural network
  - PINN
  - graph neural network simulation
  - operator learning
  - reduced order model
  - deep learning solver
  - differentiable simulation
  - mesh generation
  taxonomy:
    paper_types:
    - label: method
      description: 新模型、算法、训练或推理方法
    - label: benchmark
      description: 数据集、评测任务、指标和基准测试
    - label: system
      description: 系统、框架、平台和工具（含 agent framework、toolchain、工业软件集成）
    - label: theory
      description: 理论推导、证明、误差或收敛性分析
    - label: survey
      description: 综述、分类体系和观点总结
    - label: application
      description: 面向具体工程场景的应用研究（翼型/机翼/叶轮/整车等）
    dimensions:
    - name: agent_role
      description: 'agent capability focus: tool-invocation, planning, memory, self-evolution,
        multi-agent collaboration'
    - name: cae_task
      description: 'CAE task: shape design, mesh generation, CFD solving, surrogate
        modeling, optimization, uncertainty quantification'
    - name: optimization_method
      description: 'optimization or search method: Bayesian optimization, evolutionary
        algorithm, gradient/adjoint, reinforcement learning, LLM-driven search'
    - name: solver_technique
      description: 'physical/ML solver technique: PINN, neural operator, GNN, transformer,
        ROM/POD, differentiable solver, fine-tuning'
    - name: geometry_representation
      description: 'geometry parameterization: CST, B-spline/NURBS, Bezier, free-form
        deformation, point cloud, mesh, CAD/CSG'
    - name: tooling
      description: external tools, solvers or simulators invoked (OpenFOAM, SU2, ANSYS
        Fluent, XFOIL, Abaqus, custom CFD)
  taxonomy_discovery:
    enabled: true
    update_mode: propose
    max_depth: 3
    max_children_per_node: 8
    nodes: []
    source_headings: []
  relevance_criteria:
    include:
    - LLM/agent systems that design, optimize, or analyze aerodynamic or fluid-dynamic
      geometries (airfoil, wing, blade, duct, vehicle)
    - Agent frameworks with tool invocation, code execution, solver calling, or simulation-in-the-loop
      for engineering/CAE tasks
    - Self-evolving / self-improving agents, automated algorithm or workflow discovery,
      LLM-driven optimization loops
    - Aerodynamic shape optimization, airfoil/wing design optimization, adjoint or
      gradient-based shape design, multi-objective aerodynamic trade studies
    - Surrogate models and reduced-order models for aerodynamics or fluid flows (Kriging,
      Gaussian process, deep surrogate, POD/ROM)
    - 'Data-driven CFD: neural operators, PINNs, GNN-based flow solvers, differentiable
      CFD, ML turbulence/closure models, learned mesh generation'
    - Design-space exploration, Bayesian optimization, evolutionary or RL-based optimization
      applied to fluid/thermal/structural CAE problems
    - CAE datasets, benchmarks, and open-source toolchains supporting AI-for-simulation
      workflows
    exclude:
    - General LLM/NLP research without engineering design, simulation, or CAE grounding
      (prompting, RAG, chat, code assistant benchmarks)
    - 'General computer vision: detection, segmentation, image generation, video understanding'
    - Medical imaging, bioinformatics, drug discovery, protein folding, clinical applications
    - Finance, trading, time-series forecasting, recommendation systems
    - Robotics manipulation, locomotion, embodied navigation, autonomous driving perception
      (unless a CAE design loop is central)
    - Pure mathematical or numerical analysis with no fluid/CAE or learning-for-simulation
      contribution
    - Structural topology optimization or materials discovery with no aerodynamic/fluid
      or agentic angle
    - Climate, weather forecasting, ocean or geophysical modeling at global scale
    - Power systems, wireless networks, chip design, electronic design automation
