project:
  name: Awesome AI4CAE Hub
  slug: awesome-ai4cae-hub
  description: 'A curated hub for AI-driven CAE: airfoil aerodynamic inverse design,
    generative aerodynamic design, LLM agents, self-evolving agents, aerodynamic
    foundation models, and CFD data-driven solvers.'
  description_zh: 面向 AI 驱动 CAE 的精选 hub：翼型气动逆生成、生成式气动设计、LLM 智能体、智能体自进化、气动基础模型与 CFD 数据驱动求解。
  github_url: https://github.com/leewww-code/awesome-ai4cae-hub
  site_url: https://leewww-code.github.io/awesome-ai4cae-hub
  generator_repo: jin-s13/awesome-hub-generator
research:
  keywords:
  # --- 翼型逆生成（主线） ---
  - inverse design
  - inverse airfoil design
  - aerodynamic inverse design
  - performance-to-geometry generation
  - airfoil generation
  - generative airfoil design
  # --- 生成式气动设计 ---
  - generative aerodynamic design
  - diffusion model
  - flow matching
  - conditional generative model
  - diffusion-based shape generation
  - compositional generative inverse design
  - physics-aware generative model
  - coupled physics generation
  - 3D aerodynamic inverse design
  # --- 气动基础模型 / 大模型 ---
  - aerodynamic foundation model
  - aerodynamic large model
  - aerodynamic neural surrogate
  - foundation model for aerodynamics
  - aero transformer
  - aerodynamic pretraining
  # --- 智能体自进化 / 多智能体 ---
  - airfoil agent
  - aerodynamic design agent
  - LLM multi-agent
  - multi-agent CFD
  - self-evolving agent
  - skill self-evolution
  - agentic aerodynamic optimization
  - scientific discovery agent
  - open-ended CFD
  - reinforcement learning flow control
  - fluid control
  # --- 生成式湍流 / 流场重构 ---
  - generative turbulence model
  - flow super-resolution
  - sparse flow reconstruction
  - turbulence flow
  # --- 数据集 / 基准 ---
  - airfoil dataset
  - transonic wing dataset
  - aerodynamic benchmark
  - RANS airfoil dataset
  # --- 保留的强相关词 ---
  - airfoil
  - airfoil optimization
  - aerodynamic shape optimization
  - wing design
  - aerodynamic design
  - computational fluid dynamics
  - CFD surrogate
  - neural surrogate
  - data-driven aerodynamic design
  - LLM agent
  - tool use
  - tool calling
  taxonomy:
    paper_types:
    - label: method
      description: 新模型、算法、训练或推理方法
    - label: benchmark
      description: 数据集、评测任务、指标和基准测试
    - label: system
      description: 系统、框架、平台和工具（含 agent framework、toolchain、工业软件集成）
    - label: theory
      description: 理论推导、证明、误差或收敛性分析
    - label: survey
      description: 综述、分类体系和观点总结
    - label: application
      description: 面向具体工程场景的应用研究（翼型/机翼/叶轮/整车等）
    dimensions:
    - name: agent_role
      description: 'agent capability focus: tool-invocation, planning, memory, self-evolution,
        multi-agent collaboration'
    - name: cae_task
      description: 'CAE task: inverse design, shape generation, surrogate prediction,
        CFD solving, optimization, uncertainty quantification'
    - name: generative_method
      description: 'generative method: diffusion, flow matching, conditional generation,
        autoregressive, GAN, energy-based optimization'
    - name: geometry_representation
      description: 'geometry parameterization: CST, B-spline/NURBS, ARSEC, Bezier,
        tri-plane, neural field, SDF, point cloud, mesh'
    - name: design_target
      description: 'design target: lift, drag, pressure distribution, flow field,
        shape parameter'
    - name: tooling
      description: external tools, solvers or simulators invoked (OpenFOAM, SU2, ANSYS
        Fluent, XFOIL, Abaqus, custom CFD)
  taxonomy_discovery:
    enabled: true
    update_mode: propose
    max_depth: 3
    max_children_per_node: 8
    nodes: []
    source_headings: []
  relevance_criteria:
    include:
    - 'Inverse aerodynamic design: generating airfoil/wing geometry from target
      aerodynamic performance (lift, drag, pressure distribution)'
    - 'Generative aerodynamic design: diffusion, flow matching, or conditional
      generative models for shape synthesis'
    - 'Aerodynamic foundation models / large models / neural surrogates for prediction
      across geometries'
    - 'Agentic aerodynamic design: LLM agents, multi-agent systems, self-evolving
      or skill-learning agents for CFD and shape optimization'
    - 'Generative turbulence modeling, flow super-resolution, and sparse flow reconstruction'
    - 'Aerodynamic datasets and benchmarks (airfoil, wing, RANS) supporting data-driven
      design'
    - 'Reinforcement learning for flow control and fluid dynamics'
    exclude:
    - General LLM/NLP research without engineering design, simulation, or CAE grounding
      (prompting, RAG, chat, code assistant benchmarks)
    - 'Medical imaging, bioinformatics, drug discovery, protein folding, clinical
      applications'
    - 'Finance, trading, time-series forecasting, recommendation systems'
    - 'General 2D computer vision: detection, segmentation, classification'
    - 'Pure mathematical or numerical analysis with no fluid/CAE or learning-for-simulation
      contribution'
    - 'Structural topology optimization or materials discovery with no aerodynamic/fluid
      or agentic angle'
    - 'Climate, weather forecasting, ocean or geophysical modeling at global scale'
    - 'Chip design, electronic design automation'
    - 'Robotics manipulation, locomotion, embodied navigation, autonomous driving
      perception'
